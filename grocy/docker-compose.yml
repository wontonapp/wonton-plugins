services:
  grocy:
    # 上游官方打包（LinuxServer.io），按清单列表摘要固定；标签写具体版本，仅给人看。
    image: lscr.io/linuxserver/grocy:4.7.1@sha256:e4e34a0a84f407b1bcd2c3b6cd1999bf99bcad1defa8847adea7dc82a9cd6b8c
    # 镜像以 root 起 s6 再降权到 PUID/PGID，数据目录属主规则按"没写 user"处理，不写 user。
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
      # grocy 的设置可用 GROCY_<设置名> 环境变量覆盖 config.php（优先级在 settingoverrides 之下），
      # 见上游 config-dist.php 头注释和 helpers/extensions.php 的 Setting()。
      # 代登录：网关认出用户后在请求上带 Remote-User，grocy 按它认人、没有的用户自动建号；
      # 类名是 Grocy\Middleware\Auth\ReverseProxyAuthMiddleware（上游 config-dist.php）。
      GROCY_AUTH_CLASS: Grocy\Middleware\Auth\ReverseProxyAuthMiddleware
      GROCY_REVERSE_PROXY_AUTH_HEADER: Remote-User
      GROCY_DEFAULT_LOCALE: zh_CN
      GROCY_CURRENCY: CNY
      # 联网条码查询默认指向 Open Food Facts，由容器服务端出网请求；本插件不出网（见 README），
      # 置空关掉，避免用户扫到未知条码时看到难懂的连接错误。应用内扫码和已录商品不受影响。
      GROCY_STOCK_BARCODE_LOOKUP_PLUGIN: ""
    volumes:
      # grocy 全部数据（SQLite、配置、上传文件）在 /config 下。
      - ${WONTON_APP_DATA}/config:/config
    healthcheck:
      # /login 是公开路由（BaseAuthMiddleware 对 root/login 豁免），走完 nginx→php-fpm→数据库，
      # 不需要也不注入用户身份（健康检查带身份头反而会在数据库里建号）。
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1/login"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      start_interval: 2s

x-wonton:
  spec: "0.17"
  id: info.grocy.grocy
  version: 0.1.2
  kind: app
  title: { en: "Grocy" }
  subtitle: { zh: "厨房库存", en: "Pantry & Chores", zh-Hant: "廚房庫存", ja: "台所の在庫管理" }
  description:
    zh: 管家里的东西还剩多少、什么时候过期：食品保质期、购物清单和家务提醒，像给厨房配了本账。
    en: "Keep track of what's in your home: food expiry dates, shopping lists and chores, like a ledger for your kitchen."
    zh-Hant: 管家裡的東西還剩多少、什麼時候過期：食品保存期限、購物清單和家事提醒，像給廚房配了本帳。
    ja: 家にある物の残りと期限を管理します。食品の賞味期限、買い物リスト、家事のリマインダーまで、台所の台帳のようなものです。
  icon: icon.png
  notices: [NOTICE]
  screenshots: [screenshots/home.png, screenshots/shopping-list.png]
  author: { name: geraldpeng6 }
  homepage: https://grocy.info
  # 应用（grocy）的许可证；插件包自己的许可证写在 LICENSE 里。
  license: MIT
  tags:
    zh: [工具, 效率]
    en: [Tools, Productivity]
  setup:
    zh: 打开就用云吞账号登录，不用注册也不用输密码；家人共用同一份库存，各人用自己的名字进来。
    en: Opening the page signs you in with your Wonton account — no registration or password. The household shares one inventory and everyone comes in under their own name.
    zh-Hant: 開啟就用雲吞帳號登入，不用註冊也不用輸密碼；家人共用同一份庫存，各人用自己的名字進來。
    ja: 開けば Wonton アカウントでサインインでき、登録もパスワードも要りません。世帯で 1 つの在庫を共有し、各自の名前で入ります。
  about:
    zh: |
      家里的东西买了几包、放到哪、哪天到期，记在这里就不会忘：库存快见底或快过期时，首页一眼看到；购物清单和家务安排也在同一个页面里。

      扫条码建商品能用，但没法联网查商品信息，扫完自己填名字就行。

      装好后应用里会看到一个叫 admin 的内置账号，那是 grocy 出厂自带的；这种登录方式下它进不来，也不用管它。
    en: |
      Track what you have at home, where it is and when it expires: the front page shows what's running low or past its date, and shopping lists and chores live in the same place.

      Scanning a barcode to create a product works, but product details cannot be looked up online — fill in the name yourself.

      The app ships a built-in account named admin; under this sign-in method it cannot be used, and it needs no attention.
    zh-Hant: |
      家裡的東西買了幾包、放到哪、哪天過期，記在這裡就不會忘：庫存快見底或快過期時，首頁一眼看到；購物清單和家事安排也在同一個頁面裡。

      掃條碼建商品能用，但沒法連網查商品資訊，掃完自己填名字就行。

      裝好後應用裡會看到一個叫 admin 的內建帳號，那是 grocy 出廠自帶的；這種登入方式下它進不來，也不用管它。
    ja: |
      家の物を何個買ったか、どこに置いたか、いつ期限が切れるかを記録すれば忘れません。在庫が少なくなったり期限が近づいたりすると、トップページですぐわかります。買い物リストと家事の予定も同じ画面にあります。

      バーコードを読んで商品を作ることはできますが、オンラインで商品情報は引けないので、読み取ったあと名前は自分で入れてください。

      導入すると admin という内蔵アカウントが見えますが、これは grocy が元から持っているもので、このサインイン方式では使えません。放っておいて構いません。
  release_notes:
    zh: |
      插件包迁入官方插件合仓，内容与上一版相同。

      商店介绍重写：登录说明移到「安装后要做的事」，外网、内置账号的说明改成日常用语；补繁体中文和日文。
    en: |
      Package moved into the official Wonton plugin monorepo; same content as the previous release.

      Store copy rewritten: the sign-in note moved to the pre-install notice, and the internet/built-in account notes use everyday words; Traditional Chinese and Japanese added.
    zh-Hant: "外掛包遷入官方外掛合倉，內容與上一版相同。\n\n商店介紹重寫：登入說明移到「安裝後要做的事」，外網、內建帳號的說明改成日常用語；補繁體中文和日文。"
    ja: "プラグインを公式プラグインリポジトリへ移動しました。内容は前版と同じです。\n\nストア紹介を書き直し、サインインの説明を「インストール後の手順」に移し、インターネットや内蔵アカウントの説明を日常的な言葉にしました。繁体字中国語と日本語を追加。"
  webui:
    service: grocy
    port: 80
    # 网关代登录：见 https://github.com/wontonapp/wonton-docs/blob/main/plugin-spec.md#网关代登录sso-proxy。
    # 插件不出网、不开局域网端口，能到达 grocy 的只有核心网关和本插件容器，Remote-User 头只可能来自网关。
    sso: proxy
    proxy:
      headers:
        Remote-User: "{user}"
  # 放进侧边栏"我的应用"的常用页；grocy 是响应式页面，未做 App 适配，用默认 inset。
  tabs:
    - id: stock
      title: { zh: 库存, en: Stock }
      icon: tabs/stock.svg
      icon_selected: tabs/stock-fill.svg
      path: /stock
    - id: shoppinglist
      title: { zh: 购物清单, en: Shopping }
      icon: tabs/shoppinglist.svg
      icon_selected: tabs/shoppinglist-fill.svg
      path: /shoppinglist
  permissions: []
  # 上游没写最低内存；装起来后按空闲实测取整。
  requirements:
    arch: [amd64, arm64]
    memory: 128M
