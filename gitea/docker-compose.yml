# Gitea：自托管 Git 服务。网页经云吞账号单点登录（sso: oidc），git 推拉走局域网 SSH。
services:
  gitea:
    # 上游官方镜像（gitea/gitea），按清单列表摘要固定，amd64 和 arm64 都有。
    # 镜像以 root 启动、按 USER_UID/USER_GID 降权跑 gitea（数据目录归 PUID:PGID）；
    # s6 同时托管 gitea web 和内建 sshd（sshd 监听 SSH_PORT，端口由它重写 sshd_config 实现）。
    image: gitea/gitea:28.3.0@sha256:8967bf9deaf3c5c4adae13519436dc1b20c646ac83fe37ae810c933a1045227d
    environment:
      USER_UID: ${PUID}
      USER_GID: ${PGID}
      TZ: ${TZ}
      # 跳过安装向导；SECRET_KEY 由核心生成并随数据目录长期保留，会话和 2FA 密文依赖它。
      INSTALL_LOCK: "true"
      SECRET_KEY: ${WONTON_SECRET_SECRET_KEY}
      # 网页地址用网关地址，回调、克隆链接才指回自己；SSH 展示域名取局域网地址（多个地址时按列表展示）。
      GITEA__server__ROOT_URL: ${WONTON_APP_URL}/
      GITEA__server__SSH_DOMAIN: ${WONTON_LAN_ADDRESSES}
      # 裸 SSH_PORT 是镜像内建 sshd 的监听端口（s6 setup 用它重写 sshd_config），
      # GITEA__server__SSH_PORT 让 app.ini 里的展示端口跟随 compose。
      SSH_PORT: "2222"
      GITEA__server__SSH_PORT: "2222"
      # 关掉本地注册：账号只能来自云吞单点登录（OIDC 自动注册），局域网设备也注册不了。
      GITEA__service__DISABLE_REGISTRATION: "true"
      # 首次 OIDC 登录自动建号，用户名取 preferred_username（就是云吞用户名）；邮箱相同的老账号自动关联。
      GITEA__oauth2_client__ENABLE_AUTO_REGISTRATION: "true"
      GITEA__oauth2_client__USERNAME: preferred_username
      GITEA__oauth2_client__ACCOUNT_LINKING: auto
      # 发信（notify）走云吞的内部邮箱：找回密码、issue 和 PR 通知转进收件人的 Wonton 私聊。
      # PROTOCOL=smtp 明文直连、不做 STARTTLS；不填 USER/PASSWD——Go 的 smtp.PlainAuth 在明文连接上会拒绝认证。
      GITEA__mailer__ENABLED: "true"
      GITEA__mailer__PROTOCOL: "smtp"
      GITEA__mailer__SMTP_ADDR: ${WONTON_SMTP_HOST}
      GITEA__mailer__SMTP_PORT: ${WONTON_SMTP_PORT}
      GITEA__mailer__FROM: ${WONTON_MAIL_FROM}
      # issue/PR 的邮件通知走 notifier：Gitea 默认不注册邮件通知器，不开这个通知邮件一封都不发。
      GITEA__service__ENABLE_NOTIFY_MAIL: "true"
    volumes:
      - ${WONTON_APP_DATA}:/data
    # /api/healthz 会真的探数据库，迁移或数据库坏了时返回 5xx，不是进程活着就算健康。
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 300s
      start_interval: 5s
    depends_on:
      init-db:
        condition: service_completed_successfully

  # 一次性服务：gitea 启动前把云吞的 OIDC 认证源写进数据库（见 config/init-db.sh）。
  # CLI 是独立进程，对运行中的 gitea 改认证源不生效（go-gitea/gitea#35611），所以必须在
  # gitea 启动前写库，gitea 启动时才按 DB 注册 OAuth2 provider。
  init-db:
    image: gitea/gitea:28.3.0@sha256:8967bf9deaf3c5c4adae13519436dc1b20c646ac83fe37ae810c933a1045227d
    entrypoint: ["/bin/sh", "/init/init-db.sh"]
    user: "${PUID}:${PGID}"
    environment:
      WONTON_OIDC_ISSUER: ${WONTON_OIDC_ISSUER}
      WONTON_OIDC_CLIENT_ID: ${WONTON_OIDC_CLIENT_ID}
      WONTON_OIDC_CLIENT_SECRET: ${WONTON_OIDC_CLIENT_SECRET}
    volumes:
      - ${WONTON_APP_DATA}:/data
    configs:
      - source: init_db
        target: /init/init-db.sh
    restart: "no"

  # 一次性服务：把主人账号的邮箱对齐成云吞注入的内部邮箱（见 config/init.sh）。走管理接口，
  # 等 gitea 健康后再跑。
  init:
    image: gitea/gitea:28.3.0@sha256:8967bf9deaf3c5c4adae13519436dc1b20c646ac83fe37ae810c933a1045227d
    entrypoint: ["/bin/sh", "/init/init.sh"]
    user: "${PUID}:${PGID}"
    environment:
      WONTON_OWNER_NAME: ${WONTON_OWNER_NAME}
      WONTON_OWNER_EMAIL: ${WONTON_OWNER_EMAIL}
    volumes:
      - ${WONTON_APP_DATA}:/data
    configs:
      - source: init
        target: /init/init.sh
    depends_on:
      gitea:
        condition: service_healthy
    restart: "no"

configs:
  init:
    file: config/init.sh
  init_db:
    file: config/init-db.sh

x-wonton:
  spec: "0.17"
  id: io.gitea.gitea
  version: 0.2.2
  kind: app
  title: { en: "Gitea" }
  subtitle: { zh: "自家代码仓库", en: "Home Code Hosting", zh-Hant: "自家程式碼倉庫", ja: "自宅コード保管庫" }
  description:
    zh: 自己家的代码仓库：写代码的家人把项目存在家里，网页上一起看代码、提修改，电脑上的开发工具也能连进来用
    en: "Your own code host at home: keep projects at home, read and review code together on the web, and connect your desktop tools"
    zh-Hant: 自己家的程式碼倉庫：寫程式的家人把專案存在家裡，網頁上一起看程式碼、提修改，電腦上的開發工具也能連進來用
    ja: 自宅のコード保管庫です。コードを書く家族がプロジェクトを家に置き、Web で一緒にコードを見て修正を出せます。パソコンの開発ツールからもつなげます。
  icon: icon.svg
  notices: [NOTICE]
  screenshots: [screenshots/dashboard.png, screenshots/repo.png, screenshots/file.png]
  author: { name: geraldpeng6, url: https://github.com/geraldpeng6 }
  homepage: https://gitea.io
  # Gitea 的许可证；插件包自己的许可证写在 LICENSE 里。
  license: MIT
  tags:
    zh: [开发, Git]
    en: [Developer, Git]
  setup:
    zh: 打开网页就用云吞账号登录，第一次登录会自动建号；家人换各自的云吞账号登录一次就行。要用电脑上的开发工具连进来，先在网页设置里加上自己的公钥，再用网页上显示的地址。局域网地址有多条时，用设置里显示的那一条。
    en: Open the page and sign in with your Wonton account; the account is created on first sign-in, and family members just sign in once with their own. To connect desktop tools, add your public key in the web settings first and use the address the web page shows; with several LAN addresses, take the one in the settings.
    zh-Hant: 開啟網頁就用雲吞帳號登入，第一次登入會自動建號；家人換各自的雲吞帳號登入一次就行。要用電腦上的開發工具連進來，先在網頁設定裡加上自己的公鑰，再用網頁上顯示的位址。區域網路位址有多條時，用設定裡顯示的那一條。
    ja: Web ページを開き、Wonton アカウントでサインインします。初回サインインでアカウントが作られ、家族は各自のアカウントで一度サインインするだけです。パソコンの開発ツールからつなぐには、先に Web の設定で公開鍵を登録し、Web ページに表示されるアドレスを使います。LAN アドレスが複数ある場合は設定に表示されるものを使ってください。
  about:
    zh: |
      自己家里的代码仓库：代码放在家里，网页上看代码、提修改、审改动，手机和电脑都能用。

      你（云吞的主人）在这里是管理员；本地注册是关掉的，账号只能从云吞这边进。

      应用发的信（找回密码、修改和合并的通知）走云吞的内部信箱，会出现在收件人的 Wonton 私聊里。
    en: |
      A code host in your own home: code lives at home, and you read, propose and review changes on the web from any phone or computer.

      You (the Wonton owner) are the admin here; local sign-up is off, so accounts only come in through Wonton.

      Emails the app sends (password resets, change and merge notifications) go through Wonton's internal mailbox and land in the recipient's Wonton chat.
    zh-Hant: |
      自己家裡的程式碼倉庫：程式碼放在家裡，網頁上看程式碼、提修改、審改動，手機和電腦都能用。

      你（雲吞的主人）在這裡是管理員；本機註冊是關掉的，帳號只能從雲吞這邊進。

      應用寄的信（找回密碼、修改和合併的通知）走雲吞的內部信箱，會出現在收件人的 Wonton 私聊裡。
    ja: |
      自宅のコード保管庫です。コードは家に置かれ、スマホからもパソコンからも Web で読み、修正を出し、レビューできます。

      あなた（Wonton のオーナー）がここの管理者です。ローカル登録は切ってあるので、アカウントは Wonton からしか作られません。

      アプリが送るメール（パスワード再設定、変更やマージの通知）は Wonton の内部メールボックスを通り、受け取った人の Wonton チャットに届きます。
  release_notes:
    zh: |
      介绍重写：一句话介绍改成日常说法，登录方式不再写进介绍。

      商店介绍重写：补通俗中文标题，首次登录和公钥步骤移到「安装后要做的事」，实例、issue、clone 等说法换成日常用语；补繁体中文和日文。
    en: |
      Rewritten store copy: the one-line description uses everyday words and no longer duplicates the sign-in details.

      Store copy rewritten: added a plain Chinese title, moved sign-in and public-key steps to the pre-install notice, and replaced instance/issue/clone wording; Traditional Chinese and Japanese added.
    zh-Hant: "介紹重寫：一句話介紹改成日常說法，登入方式不再寫進介紹。\n\n商店介紹重寫：補通俗中文標題，首次登入和公鑰步驟移到「安裝後要做的事」，實例、issue、clone 等說法換成日常用語；補繁體中文和日文。"
    ja: "紹介を書き直し、一言紹介を日常的な言い方に変え、ログイン方法は紹介から外しました。\n\nストア紹介を書き直し、わかりやすい中国語タイトルを付け、初回サインインと公開鍵の手順を「インストール後の手順」に移し、インスタンス・issue・clone などの言い方を日常的な言葉にしました。繁体字中国語と日本語を追加。"
  webui:
    service: gitea
    port: 3000
    sso: oidc
    # 直接进 Gitea 的 OIDC 起点，App 打开就是单点登录，不用先点登录按钮。
    path: /user/oauth2/wonton
    oidc:
      redirect_paths: [/user/oauth2/wonton/callback]
      # Gitea 的令牌兑换固定用 POST 体带密钥（client_secret_post）；核心默认按 client_secret_basic
      # 登记 Hydra 客户端，不声明这条兑换时会 invalid_client。
      token_endpoint_auth_method: client_secret_post
  secrets:
    secret_key:
      generate: { bytes: 32 }
  lan:
    ports:
      # git over SSH：网页端口经网关，浏览器会话带不进 git 客户端，推拉走局域网直连。
      - { service: gitea, port: 2222 }
  permissions:
    # 在局域网上开放 SSH 端口，让电脑上的 git 客户端直连推拉。
    - network.lan
    # notify：应用发的信（找回密码、issue 和 PR 通知）经核心的内部 SMTP 转进收件人的 Wonton 私聊。
    # owner.identity：一次性初始化要用 WONTON_OWNER_NAME/EMAIL 把主人账号的邮箱对齐成内部地址（见 init）。
    - notify
    - owner.identity
  requirements:
    arch: [amd64, arm64]
    memory: 512M
