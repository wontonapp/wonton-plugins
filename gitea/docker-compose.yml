# Gitea：自托管 Git 服务。网页经云吞账号单点登录（sso: oidc），git 推拉走局域网 SSH。
services:
  gitea:
    # 上游官方镜像（gitea/gitea），按清单列表摘要固定，amd64 和 arm64 都有。
    # 镜像以 root 启动、按 USER_UID/USER_GID 降权跑 gitea（数据目录归 PUID:PGID）；
    # s6 同时托管 gitea web 和内建 sshd（sshd 监听 SSH_PORT，端口由它重写 sshd_config 实现）。
    image: gitea/gitea:28.3.0@sha256:8967bf9deaf3c5c4adae13519436dc1b20c646ac83fe37ae810c933a1045227d
    environment:
      USER_UID: ${PUID}
      USER_GID: ${PGID}
      TZ: ${TZ}
      # 跳过安装向导；SECRET_KEY 由核心生成并随数据目录长期保留，会话和 2FA 密文依赖它。
      INSTALL_LOCK: "true"
      SECRET_KEY: ${WONTON_SECRET_SECRET_KEY}
      # 网页地址用网关地址，回调、克隆链接才指回自己；SSH 展示域名取局域网地址（多个地址时按列表展示）。
      GITEA__server__ROOT_URL: ${WONTON_APP_URL}/
      GITEA__server__SSH_DOMAIN: ${WONTON_LAN_ADDRESSES}
      # 裸 SSH_PORT 是镜像内建 sshd 的监听端口（s6 setup 用它重写 sshd_config），
      # GITEA__server__SSH_PORT 让 app.ini 里的展示端口跟随 compose。
      SSH_PORT: "2222"
      GITEA__server__SSH_PORT: "2222"
      # 关掉本地注册：账号只能来自云吞单点登录（OIDC 自动注册），局域网设备也注册不了。
      GITEA__service__DISABLE_REGISTRATION: "true"
      # 首次 OIDC 登录自动建号，用户名取 preferred_username（就是云吞用户名）；邮箱相同的老账号自动关联。
      GITEA__oauth2_client__ENABLE_AUTO_REGISTRATION: "true"
      GITEA__oauth2_client__USERNAME: preferred_username
      GITEA__oauth2_client__ACCOUNT_LINKING: auto
      # 发信（notify）走云吞的内部邮箱：找回密码、issue 和 PR 通知转进收件人的 Wonton 私聊。
      # PROTOCOL=smtp 明文直连、不做 STARTTLS；不填 USER/PASSWD——Go 的 smtp.PlainAuth 在明文连接上会拒绝认证。
      GITEA__mailer__ENABLED: "true"
      GITEA__mailer__PROTOCOL: "smtp"
      GITEA__mailer__SMTP_ADDR: ${WONTON_SMTP_HOST}
      GITEA__mailer__SMTP_PORT: ${WONTON_SMTP_PORT}
      GITEA__mailer__FROM: ${WONTON_MAIL_FROM}
      # issue/PR 的邮件通知走 notifier：Gitea 默认不注册邮件通知器，不开这个通知邮件一封都不发。
      GITEA__service__ENABLE_NOTIFY_MAIL: "true"
    volumes:
      - ${WONTON_APP_DATA}:/data
    # /api/healthz 会真的探数据库，迁移或数据库坏了时返回 5xx，不是进程活着就算健康。
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 300s
      start_interval: 5s
    depends_on:
      init-db:
        condition: service_completed_successfully

  # 一次性服务：gitea 启动前把云吞的 OIDC 认证源写进数据库（见 config/init-db.sh）。
  # CLI 是独立进程，对运行中的 gitea 改认证源不生效（go-gitea/gitea#35611），所以必须在
  # gitea 启动前写库，gitea 启动时才按 DB 注册 OAuth2 provider。
  init-db:
    image: gitea/gitea:28.3.0@sha256:8967bf9deaf3c5c4adae13519436dc1b20c646ac83fe37ae810c933a1045227d
    entrypoint: ["/bin/sh", "/init/init-db.sh"]
    user: "${PUID}:${PGID}"
    environment:
      WONTON_OIDC_ISSUER: ${WONTON_OIDC_ISSUER}
      WONTON_OIDC_CLIENT_ID: ${WONTON_OIDC_CLIENT_ID}
      WONTON_OIDC_CLIENT_SECRET: ${WONTON_OIDC_CLIENT_SECRET}
    volumes:
      - ${WONTON_APP_DATA}:/data
    configs:
      - source: init_db
        target: /init/init-db.sh
    restart: "no"

  # 一次性服务：把主人账号的邮箱对齐成云吞注入的内部邮箱（见 config/init.sh）。走管理接口，
  # 等 gitea 健康后再跑。
  init:
    image: gitea/gitea:28.3.0@sha256:8967bf9deaf3c5c4adae13519436dc1b20c646ac83fe37ae810c933a1045227d
    entrypoint: ["/bin/sh", "/init/init.sh"]
    user: "${PUID}:${PGID}"
    environment:
      WONTON_OWNER_NAME: ${WONTON_OWNER_NAME}
      WONTON_OWNER_EMAIL: ${WONTON_OWNER_EMAIL}
    volumes:
      - ${WONTON_APP_DATA}:/data
    configs:
      - source: init
        target: /init/init.sh
    depends_on:
      gitea:
        condition: service_healthy
    restart: "no"

configs:
  init:
    file: config/init.sh
  init_db:
    file: config/init-db.sh

x-wonton:
  spec: "0.11"
  id: io.gitea.gitea
  version: 0.2.0
  kind: app
  title: { en: Gitea }
  description:
    zh: 私有 Git 代码托管：网页经云吞账号登录，局域网 SSH 推拉代码
    en: "Private Git hosting: sign in with your Wonton account, push and pull over LAN SSH"
  icon: icon.svg
  notices: [NOTICE]
  screenshots: [screenshots/dashboard.png, screenshots/repo.png, screenshots/file.png]
  author: { name: geraldpeng6, url: https://github.com/geraldpeng6 }
  homepage: https://gitea.io
  # Gitea 的许可证；插件包自己的许可证写在 LICENSE 里。
  license: MIT
  tags:
    zh: [开发, Git]
    en: [Developer, Git]
  about:
    zh: |
      自己家里的 Git 服务：建仓库、提 issue、审 PR、看代码，手机网页都能用。

      网页用云吞账号打开，第一次登录自动建号；你（云吞的主人）在这个实例里是管理员。
      本地注册是关掉的，家人要用就在云吞里换账号登录一次。

      应用发的信（找回密码、issue 和 PR 通知这些）走云吞的内部邮箱，会出现在收件人的 Wonton 私聊里。

      git 推拉不走网页，走局域网 SSH：在 Gitea 网页设置里加上你的 SSH 公钥，然后
      git clone ssh://git@<这台主机的局域网地址>:2222/<用户>/<仓库>.git。
      多个局域网地址时克隆地址按设置里显示的改一台。
    en: |
      Your own Git service at home: create repos, file issues, review PRs and read code from the phone.

      The web opens with your Wonton account and the account is created on first sign-in; you (the Wonton owner) are the admin of this instance. Local sign-up is disabled — family members sign in once with their Wonton account.

      Emails the app sends (password resets, issue and PR notifications) go through the Wonton internal mailbox and land in the recipient's Wonton chat.

      Git push and pull go over LAN SSH, not the web: add your SSH public key in the Gitea web settings, then git clone ssh://git@<server LAN address>:2222/<user>/<repo>.git. With several LAN addresses, use the one shown in the settings.
  release_notes: { zh: "插件包迁入官方插件合仓，保留当前分支的内部邮箱通知和主人账号邮箱对齐支持。", en: "Moved the plugin package into the official Wonton plugin monorepo; retains internal-mail notifications and owner-account email alignment from the current branch." }
  webui:
    service: gitea
    port: 3000
    sso: oidc
    # 直接进 Gitea 的 OIDC 起点，App 打开就是单点登录，不用先点登录按钮。
    path: /user/oauth2/wonton
    oidc:
      redirect_paths: [/user/oauth2/wonton/callback]
      # Gitea 的令牌兑换固定用 POST 体带密钥（client_secret_post）；核心默认按 client_secret_basic
      # 登记 Hydra 客户端，不声明这条兑换时会 invalid_client。
      token_endpoint_auth_method: client_secret_post
  secrets:
    secret_key:
      generate: { bytes: 32 }
  lan:
    ports:
      # git over SSH：网页端口经网关，浏览器会话带不进 git 客户端，推拉走局域网直连。
      - { service: gitea, port: 2222 }
  permissions:
    # 在局域网上开放 SSH 端口，让电脑上的 git 客户端直连推拉。
    - network.lan
    # notify：应用发的信（找回密码、issue 和 PR 通知）经核心的内部 SMTP 转进收件人的 Wonton 私聊。
    # owner.identity：一次性初始化要用 WONTON_OWNER_NAME/EMAIL 把主人账号的邮箱对齐成内部地址（见 init）。
    - notify
    - owner.identity
  requirements:
    arch: [amd64, arm64]
    memory: 512M
