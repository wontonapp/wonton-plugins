# nginx 在 kiwix-serve 前面：库为空时首页换成「还没有内容」说明页（rescan 放进 state/ 的
# empty.html 就是标记，文件在就显示它），否则原样转发给 kiwix-serve。
# kiwix-serve 停了（升级中、崩溃）时给一页如实的服务不可用，不用英文默认 502。
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    location = / {
        try_files /state/empty.html @kiwix;
    }

    location @kiwix {
        proxy_pass http://server:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    location / {
        proxy_pass http://server:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    location = /healthz {
        access_log off;
        return 200;
    }

    # kiwix-serve 自己回的 5xx 原样转发（proxy_intercept_errors 默认关）；
    # 这里只接 nginx 连不上上游时的 502/503/504。
    error_page 502 503 504 /down.html;

    location = /down.html {
        internal;
    }
}
