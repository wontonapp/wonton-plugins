# Cloudreve：自托管网盘。上游官方镜像（GPL-3.0），默认 SQLite，无需额外数据库服务。
services:
  cloudreve:
    # 多架构清单摘要（amd64/arm64），标签只给人看。
    image: cloudreve/cloudreve:4.19.1@sha256:5c6c5baf7fa5bc6e1bb9a7509c09dde00e80b618d180244eb1d5f7e36b358ea2
    # 上游镜像默认以 root 运行：入口脚本用 supervisord 拉 aria2（离线下载），supervisord 要写
    # /cloudreve 下的日志和 pid（实测以 PUID:PGID 运行时 PermissionError，aria2 起不来）。
    # 数据目录由核心按 root 服务交给 PUID:PGID，root 可写；里面的文件属主是 root。
    environment:
      TZ: ${TZ}
      # 站点地址用于分享外链和邮件里的链接。CR_SETTING_DEFAULT_* 只在首次建库补缺时落库
      # （inventory/migration.go），之后管理员在后台改，升级和重建容器都不覆盖。
      CR_SETTING_DEFAULT_siteURL: ${WONTON_APP_URL}
    volumes:
      # SQLite 数据库、conf.ini（首次启动生成的会话密钥，重建容器后沿用）、上传的文件、
      # 头像和临时目录都在这里（上游镜像的 VOLUME）。
      - ${WONTON_APP_DATA}:/cloudreve/data
    # 镜像里是 Alpine 的 busybox wget：-Y off 不走代理（出网插件的代理变量不该影响健康检查）。
    # site/config/login 是登录页要拉的公开配置，走了设置读取的完整链路，比只回版本号的 site/ping 更能代表可用。
    healthcheck:
      test: ["CMD", "wget", "-q", "-Y", "off", "-O", "/dev/null", "http://127.0.0.1:5212/api/v4/site/config/login"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      start_interval: 1s

x-wonton:
  spec: "0.6"
  id: org.cloudreve.cloudreve
  version: 0.1.1
  kind: app
  title: { zh: 私人网盘（Cloudreve）, en: Personal Cloud Drive (Cloudreve) }
  description:
    zh: 像把百度网盘整个搬回家：文件在线预览、一键生成分享链接，还能把下载链接交给它，它下好直接放进网盘。用 Cloudreve 自己的账号登录，适合常分享、常离线下载的人。
    en: "Like moving a whole cloud drive service home: preview files online, share with one tap, and hand it a download link to fetch straight into your drive. It has its own Cloudreve sign-in; good if you share a lot or queue up downloads."
  icon: icon.png
  notices: [NOTICE]
  screenshots: [screenshots/explorer.png, screenshots/media.png, screenshots/upload.png, screenshots/share.png, screenshots/login.png]
  author: { name: geraldpeng6, url: "https://github.com/geraldpeng6" }
  homepage: https://cloudreve.org
  # 上游 Cloudreve 的许可证；插件包自己的许可证在仓库 LICENSE 里。
  license: GPL-3.0-only
  tags:
    zh: [文件, 下载]
    en: [Files, Downloads]
  about:
    zh: |
      住在自己服务器上的网盘：手机里的照片视频随手备份，文档、压缩包在线预览，文件夹一键生成分享外链。

      把链接或种子交给离线下载，Cloudreve 用自带的 aria2 拉回来，回来就在你的网盘里。

      打开网页要用 Cloudreve 自己的账号登录；第一次打开时注册的账号就是管理员，注册入口只有登录过云吞的你能看到。
    en: |
      A cloud drive that lives on your own server: back up photos and videos from your phone, preview documents and archives, and turn any folder into a share link.

      Hand a link or a torrent to the offline downloader and Cloudreve fetches it with the bundled aria2; it lands straight in your drive.

      The web UI signs in with its own Cloudreve account. The account you register on first open is the admin, and the sign-up page is only reachable through the Wonton gateway.
  release_notes: { zh: 插件包迁入官方插件合仓，内容与上一版相同。, en: "Moved into the official Wonton plugin monorepo; same content as the previous release." }
  webui:
    service: cloudreve
    port: 5212
    # 免费版（社区版）没有 OIDC（付费 Pro 功能），也不支持信任反代头登录：
    # 源码里 System.ProxyHeader 只是 gin TrustedPlatform 的客户端 IP 解析，认证只有
    # 邮箱密码/JWT 和 WebDAV Basic（docs.cloudreve.org/en/usage/oidc 标注 Pro edition）。
    sso: none
  # 离线下载（HTTP/_BT）、远端存储策略、邮件发送要出网。核心会带上平台出口代理。
  permissions:
    - network.egress
  # 上游没写最低内存；本机空闲实测约 130 MiB（含 aria2 和缩略图工具），取 256M。
  requirements:
    arch: [amd64, arm64]
    memory: 256M
