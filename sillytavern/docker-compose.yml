# SillyTavern：角色扮演 AI 聊天前端。上游官方镜像，一次写入模型网关的连接，别的不改上游。
services:
  seed-model:
    # 一次性服务：把模型网关的连接写进默认用户的设置（只写在用户还没配置过的时候，见 seed-model.js）。
    image: ghcr.io/sillytavern/sillytavern:1.19.0@sha256:eef27ff0c7961f1a2f488400f581f48ff38f8b910c5d3b8d389138d71791bb14
    entrypoint: ["node", "/seed/seed-model.js"]
    environment:
      WONTON_MODEL_BASE_URL: ${WONTON_MODEL_BASE_URL}
      WONTON_MODEL_API_KEY: ${WONTON_MODEL_API_KEY}
      WONTON_MODEL_DEFAULT: ${WONTON_MODEL_DEFAULT}
    volumes:
      - ${WONTON_APP_DATA}/data:/home/node/app/data
    configs:
      - source: seed-model
        target: /seed/seed-model.js
    network_mode: none
    restart: "no"

  sillytavern:
    image: ghcr.io/sillytavern/sillytavern:1.19.0@sha256:eef27ff0c7961f1a2f488400f581f48ff38f8b910c5d3b8d389138d71791bb14
    depends_on:
      seed-model:
        condition: service_completed_successfully
    environment:
      TZ: ${TZ}
      # 多用户由应用自己管：没有用户时应用自动建 default-user（管理员、无密码，唯一用户且无密码时打开
      # 即自动登录），家人们的账号由管理员在应用的用户设置里建。白名单关掉是因为请求都来自核心网关，
      # 只认网关地址在这里又拿不到（WONTON_CORE_ADDRESS 只注入给 sso: proxy 的插件）；
      # securityOverride 是上游给“反向代理挡在前面”的部署留的开关，不加它启动安全检查会退出。
      SILLYTAVERN_ENABLEUSERACCOUNTS: "true"
      SILLYTAVERN_WHITELISTMODE: "false"
      SILLYTAVERN_SECURITYOVERRIDE: "true"
      # 心跳文件给健康检查用：src/healthcheck.js 读同一个变量，检查的是服务真的在响应，不只是进程活着。
      SILLYTAVERN_HEARTBEATINTERVAL: "30"
    volumes:
      # config.yaml 和多用户的数据都在这两个目录；backups 是应用的全量备份；第三方扩展装在这里，
      # 升级重建容器后不丢。四个目录和上游 docker-compose.yml 的挂载一致（backups 是补上的）。
      - ${WONTON_APP_DATA}/config:/home/node/app/config
      - ${WONTON_APP_DATA}/data:/home/node/app/data
      - ${WONTON_APP_DATA}/backups:/home/node/app/backups
      - ${WONTON_APP_DATA}/extensions:/home/node/app/public/scripts/extensions/third-party
    healthcheck:
      test: ["CMD", "node", "src/healthcheck.js"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
      start_interval: 2s

configs:
  seed-model:
    file: seed-model.js

x-wonton:
  spec: "0.17"
  id: com.sillytavern.sillytavern
  version: 0.1.3
  kind: app
  title: { en: "SillyTavern" }
  subtitle: { zh: "AI 角色聊天", en: "AI Character Chat", zh-Hant: "AI 角色聊天", ja: "AI キャラチャット" }
  description:
    zh: 和 AI 扮演的角色聊天、玩文字冒险：自带角色可以直接聊，也能自己写角色、编世界观。想认真玩角色卡、跑长篇故事的用它。
    en: "Chat with characters played by AI or run text adventures: pick a ready-made character or write your own. For character cards and long-running stories."
    zh-Hant: 和 AI 扮演的角色聊天、玩文字冒險：自帶角色可以直接聊，也能自己寫角色、編世界觀。想認真玩角色卡、跑長篇故事的用它。
    ja: AI が演じるキャラクターとチャットしたり、テキストアドベンチャーを遊んだりできます。既製のキャラですぐ話せ、自分でキャラや世界観も作れます。キャラクターカードや長編を本格的に遊ぶ人向けです。
  icon: icon.png
  notices: [NOTICE]
  screenshots: [screenshots/characters.png]
  author: { name: geraldpeng6 }
  homepage: https://github.com/SillyTavern/SillyTavern
  # 上游应用的许可证；插件包自己的许可证写在仓库的 LICENSE 里。
  license: AGPL-3.0-only
  tags:
    zh: [AI, 角色扮演]
    en: [AI, Roleplay]
  setup:
    zh: 第一次打开时第一个账号已经建好并自动登录，先在用户设置里给它设一个密码，再在同一个地方给家人建各自的账号，各人的聊天和角色分开。模型默认走云吞的模型服务，装好就能用，不用填密钥。
    en: "On first open the first account is already created and signed in: set a password for it in the user settings, then create accounts for your family in the same place so everyone keeps their own chats and characters. The model goes through Wonton's model service by default, ready to use with no key."
    zh-Hant: 第一次開啟時第一個帳號已經建好並自動登入，先在使用者設定裡給它設一個密碼，再在同一個地方給家人建各自的帳號，各人的聊天和角色分開。模型預設走雲吞的模型服務，裝好就能用，不用填密鑰。
    ja: 初回は最初のアカウントが作成済みで自動サインインされます。まずユーザー設定でパスワードを決め、同じ場所で家族のアカウントを作ると、チャットとキャラは各自に分かれます。モデルは既定で Wonton のモデルサービスを通り、キーなしですぐ使えます。
  about:
    zh: |
      和 AI 扮演的角色聊天、玩文字冒险：自带角色可以直接聊，也能自己写角色、编世界观。想认真玩角色卡、跑长篇故事的用它。

      换别的模型接口或服务商时，在应用的“API 连接”里自己配。

      注意：角色卡是别人写的内容，可能包含成人情节，装哪个、给谁玩由你自己决定；聊天内容都留在这台服务器上。
    en: |
      Chat with characters played by AI or run text adventures: pick a ready-made character or write your own. For character cards and long-running stories.

      To use another model endpoint or provider, set it up under "API Connections" in the app.

      Note: character cards are content written by others and may include adult themes; what you install and who plays it is up to you. Chats stay on this server.
    zh-Hant: |
      和 AI 扮演的角色聊天、玩文字冒險：自帶角色可以直接聊，也能自己寫角色、編世界觀。想認真玩角色卡、跑長篇故事的用它。

      換別的模型介面或服務商時，在應用的「API 連接」裡自己設定。

      注意：角色卡是別人寫的內容，可能包含成人情節，裝哪個、給誰玩由你自己決定；聊天內容都留在這台伺服器上。
    ja: |
      AI が演じるキャラクターとチャットしたり、テキストアドベンチャーを遊んだりできます。既製のキャラですぐ話せ、自分でキャラや世界観も作れます。キャラクターカードや長編を本格的に遊ぶ人向けです。

      他のモデルの接続先やサービスを使うときは、アプリの「API 接続」で設定します。

      注意：キャラクターカードは他人が書いた内容で、大人向けの描写を含むことがあります。何を入れ、誰に遊ばせるかは自分で決めてください。チャット内容はこのサーバーに残ります。
  release_notes:
    zh: |
      介绍重写：账号与密码的建议单独成段放在最前。

      商店介绍重写：首次设密码、建家人账号和默认模型移到「安装后要做的事」，模型网关、密钥等说法换成日常用语；补繁体中文和日文。
    en: |
      Rewritten store copy: the account-and-password advice stands alone up front.

      Store copy rewritten: first password, family accounts and the default model moved to the pre-install notice, with model-gateway/key wording in everyday words; Traditional Chinese and Japanese added.
    zh-Hant: "介紹重寫：賬號與密碼的建議單獨成段放在最前。\n\n商店介紹重寫：首次設密碼、建家人帳號和預設模型移到「安裝後要做的事」，模型閘道、密鑰等說法換成日常用語；補繁體中文和日文。"
    ja: "紹介を書き直し、アカウントとパスワードのすすめを最初の段落に分けました。\n\nストア紹介を書き直し、初回のパスワード設定・家族アカウント・既定モデルを「インストール後の手順」に移し、モデルゲートウェイやキーなどの言い方を日常的な言葉にしました。繁体字中国語と日本語を追加。"
  webui:
    service: sillytavern
    port: 8000
    # 应用有自己的多用户登录（default-user 自动登录，家人各自登录），网关照常校验会话。
    sso: none
  # 模型只走可选能力模型网关。
  # Models go through the optional model gateway only.
  wants: [models]
  permissions:
    # 角色卡、扩展、分词器和语音模型从网上下载；接别的模型服务商也要出网。
    # Character cards, extensions, tokenizers and speech models are downloaded from the internet;
    # other model providers need outbound access too.
    - network.egress
  # 上游没写最低内存；本机空闲实测约 142M，取 512M。镜像支持 amd64 和 arm64（docker buildx imagetools inspect）。
  requirements:
    arch: [amd64, arm64]
    memory: 512M
