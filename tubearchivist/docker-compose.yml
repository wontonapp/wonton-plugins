# TubeArchivist：YouTube 频道订阅、自动下载和本地存档，元数据可喂给 Jellyfin。
# 上游单容器应用，外加它要求的 Elasticsearch（索引和全文搜索）和 Redis（任务队列），都在本插件里。
#
# 登录走网关代登录（sso: proxy）：TubeArchivist 认 Remote-User 请求头（TA_ENABLE_AUTH_PROXY，
# Django 的 RemoteUserBackend 按头里的名字找账号），但应用没有"可信代理地址"配置，而出网插件
# 必须只信核心。所以网关代带的不是用户名，而是核心生成的密钥（secrets.ta_user）：
# 应用启动时以它为用户名建管理员，网关对登录用户的每个请求都带上同名头，打开网页就是管理员，
# 没有第二个登录页。拿到这个值才能进应用，它只存在核心密钥库和容器环境里。
#
# 任务结束的通知邮件走应用的 Apprise 通知（存 ES 的 ta_config），没有环境变量可注入，由
# notify-init 服务在应用健康后经应用自己的 API 配好，发进收件人的 Wonton 私聊（notify 权限，
# WONTON_SMTP_*）。
services:
  app:
    # 上游官方镜像，标签对上游 v0.6.0（license: GPL-3.0-only）。
    image: bbilly1/tubearchivist:v0.6.0@sha256:0cbc18aa953c72ec7dfdd6f8fa7c2fe89b5d04489857d7baa354fecbd6181e69
    # 上游支持以任意 uid 运行：下载的视频和缓存归用户，数据目录也按 PUID:PGID 交给它。
    user: "${PUID}:${PGID}"
    environment:
      # 上游拿它生成 ALLOWED_HOSTS 和 CSRF_TRUSTED_ORIGINS，要按浏览器看到的地址写；
      # 再加上 127.0.0.1：核心安装时的网页探测和下面的健康检查都用它连；加上 http://app:8000：
      # notify-init 从插件网络里直接调应用 API，Host 是 app:8000，不给的话 Django 按
      # DisallowedHost 回 400（上游 ta_host_parser 按空格拆多个地址）。
      TA_HOST: "${WONTON_APP_URL} http://app:8000 http://127.0.0.1:8000"
      # 应用强制要求 TA_USERNAME/TA_PASSWORD 并在启动时用它建管理员账号；两个值都是核心
      # 生成的密钥，不写死（见文件头：网页身份由代登录头决定，这对凭据不落人手）。
      TA_USERNAME: ${WONTON_SECRET_TA_USER}
      TA_PASSWORD: ${WONTON_SECRET_TA_PASSWORD}
      TA_ENABLE_AUTH_PROXY: "true"
      # TA_AUTH_PROXY_USERNAME_HEADER 是 Django 6 里的一个坑：TA 跑在 uvicorn/ASGI 上，
      # 认头走 RemoteUserMiddleware.aprocess_request，它读 META["HTTP_" + 自身值]（同步
      # 路径读 META[自身值]，两条路径约定不同，见 django/contrib/auth/middleware.py 6.0.9）。
      # 网关注入的 Remote-User 头在 META 里是 HTTP_REMOTE_USER，所以这里必须写 REMOTE_USER；
      # 写上游默认的 HTTP_REMOTE_USER 会变成找 HTTP_HTTP_REMOTE_USER，静默不认证。
      TA_AUTH_PROXY_USERNAME_HEADER: REMOTE_USER
      ELASTIC_PASSWORD: ${WONTON_SECRET_ELASTIC_PASSWORD}
      ES_URL: http://es:9200
      REDIS_CON: redis://:${WONTON_SECRET_REDIS_PASSWORD}@redis:6379
      TZ: ${TZ}
    volumes:
      # 下载的视频（/youtube）和缩略图、下载队列缓存（/cache）放插件数据目录。
      - ${WONTON_APP_DATA}/media:/youtube
      - ${WONTON_APP_DATA}/cache:/cache
    depends_on:
      es:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # 应用进程应答之外，同一网络里还要连得上 ES（yellow）和 Redis：三个都通才算健康。
      # curl 都加 --noproxy：健康检查不走代理（规范），出网代理的变量不影响内部探测。
      test:
        - CMD-SHELL
        - >-
          curl --noproxy '*' -fsS http://127.0.0.1:8000/api/health/ >/dev/null
          && curl --noproxy '*' -fsS -u "elastic:$$ELASTIC_PASSWORD" 'http://es:9200/_cluster/health?wait_for_status=yellow&timeout=10s' >/dev/null
          && python3 -c "import redis, os; redis.from_url(os.environ['REDIS_CON']).ping()"
      interval: 60s
      timeout: 15s
      retries: 5
      # 首次启动要建索引、迁移数据，等上游自己的启动检查跑完。
      start_period: 5m
      start_interval: 15s

  # 应用健康后跑一次：经应用自己的 API 给四个任务配上发到主人 Wonton 私聊的邮件通知
  # （见 config/notify-init.py 的文件头）。通知配置存在 ES 的 ta_config 里，应用没有对应
  # 的环境变量，只能走 API；只在配置整体为空时写入，用户在应用里改过的不动。
  notify-init:
    image: bbilly1/tubearchivist:v0.6.0@sha256:0cbc18aa953c72ec7dfdd6f8fa7c2fe89b5d04489857d7baa354fecbd6181e69
    command: ["python3", "/seed/notify-init.py"]
    environment:
      # Remote-User 的值是核心生成保管的密钥，只走插件网络内部。
      WONTON_SECRET_TA_USER: ${WONTON_SECRET_TA_USER}
      WONTON_SMTP_HOST: ${WONTON_SMTP_HOST}
      WONTON_SMTP_PORT: ${WONTON_SMTP_PORT}
      WONTON_MAIL_FROM: ${WONTON_MAIL_FROM}
      WONTON_OWNER_EMAIL: ${WONTON_OWNER_EMAIL}
    configs:
      - source: notify_init
        target: /seed/notify-init.py
    depends_on:
      app:
        condition: service_healthy
    restart: "no"

  es:
    # Elasticsearch 官方镜像（Elastic License 2.0）。上游自己的 bbilly1/tubearchivist-es 只有
    # amd64，上游 docker-compose 注明 arm64 用官方 ES 9.5.5，这里两边都能跑。
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.6@sha256:79b4f1de4c15e6eca824723086a51e5934406d614d410cc11be77748cafac537
    environment:
      # TubeArchivist 以 elastic 账号连进来，密码由核心生成保管，两边一致。
      ELASTIC_PASSWORD: ${WONTON_SECRET_ELASTIC_PASSWORD}
      discovery.type: single-node
      xpack.security.enabled: "true"
      ES_JAVA_OPTS: "-Xms1g -Xmx1g"
      # TubeArchivist 启动时检查这个值，快照功能也要它（照上游 docker-compose）。
      path.repo: /usr/share/elasticsearch/data/snapshot
    volumes:
      # 索引数据是派生数据；命名卷首次创建时沿用镜像里数据目录的属主，不依赖 PUID。
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      # 健康检查不走代理，加 --noproxy。
      test:
        - CMD-SHELL
        - >-
          curl --noproxy '*' -fsS -u "elastic:$$ELASTIC_PASSWORD"
          'http://127.0.0.1:9200/_cluster/health?wait_for_status=yellow&timeout=10s' >/dev/null
      interval: 30s
      timeout: 15s
      retries: 10
      start_period: 2m
      start_interval: 5s

  redis:
    # 上游 docker-compose 用官方 Redis 镜像（AGPLv3、RSALv2 或 SSPLv1，见 NOTICE）。
    image: redis:8.10.3@sha256:1f88291b4c57bdf249f02eb085a8669889b2d2954e91d4de5118a5da6b78dd53
    # 任务队列带密码：出网插件的网络上宿主进程连得到，不设防的 Redis 能被写入任务。
    command: ["redis-server", "--requirepass", "${WONTON_SECRET_REDIS_PASSWORD}"]
    environment:
      REDIS_PASSWORD: ${WONTON_SECRET_REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 15s
      start_interval: 2s

volumes:
  es-data:
  redis-data:

configs:
  notify_init:
    file: config/notify-init.py

x-wonton:
  spec: "0.11"
  id: com.tubearchivist.app
  version: 0.2.0
  kind: app
  title: { zh: YouTube 频道存档（TubeArchivist）, en: YouTube Channel Archive (TubeArchivist) }
  description:
    zh: 订阅 YouTube 频道后，新视频自动下载到家里，随时离线看，原视频下架也不怕；家庭影院（Jellyfin）也能读到这些视频。适合追频道、想长期留档的人。
    en: "Subscribe to YouTube channels and new videos download to your home server automatically, ready to watch offline even if the originals disappear; Jellyfin can pick them up too. For following channels and keeping an archive."
  icon: icon.svg
  notices: [NOTICE]
  screenshots: [screenshots/home.png, screenshots/channels.png, screenshots/downloads.png]
  author: { name: geraldpeng6, url: https://github.com/geraldpeng6 }
  homepage: https://www.tubearchivist.com
  # 应用（TubeArchivist）的许可证；Elasticsearch 和 Redis 作为独立容器分发，许可见 NOTICE。
  license: GPL-3.0-only
  tags:
    zh: [视频, 下载]
    en: [Video, Downloads]
  about:
    zh: |
      订阅 YouTube 频道，新视频自动下载到家里的主机，网页里浏览、搜索、离线观看。

      下载的视频和元数据存成本地文件，Jellyfin 等媒体库能直接读；下载质量和格式在设置里调。

      下载、订阅更新和重建索引完成时的邮件通知进你的 Wonton 私聊，应用设置里可调整；发到外部邮箱的通知会被拒收。

      首次启动要下载和索引，慢一些；下载视频需要能访问 YouTube 的网络。

      设置页里显示的账号名是系统生成的内部凭据，只有能打开这个网页的人看得到。
    en: |
      Subscribe to YouTube channels; new videos are downloaded to your server automatically, ready to browse, search and watch offline in the web page.

      Videos and metadata are stored as local files that media servers like Jellyfin can pick up; download quality and format are set in the app's settings.

      Email notifications when downloads, subscription updates and reindexing finish land in your Wonton chat and can be adjusted in the app's settings; notifications to external addresses are rejected.

      The first start downloads and indexes, which takes a while; downloading videos needs a network that can reach YouTube.

      The account name shown in the app's settings is a system-generated internal credential, visible only to people who can open this page.
  release_notes:
    zh: 任务结束的邮件通知接上云吞的内部邮箱：下载、订阅更新和重建索引完成后通知到你的 Wonton 私聊，应用设置里可调整。插件包迁入官方插件合仓。
    en: "Task-end email notifications now use Wonton's internal mailbox: downloads, subscription updates and reindexing report to your Wonton chat, adjustable in the app's settings. Package moved into the official Wonton plugin monorepo."
  webui:
    service: app
    port: 8000
    # 网关对登录用户代带 Remote-User 头，值是 secrets.ta_user（见文件头），打开就是管理员。
    sso: proxy
    proxy:
      headers:
        Remote-User: "{secret:ta_user}"
  permissions:
    # 下载视频、检查新版本都要出网。
    - network.egress
    # 任务结束的邮件通知发到主人的 Wonton 私聊（notify-init 配进应用）：收件人是主人的
    # 内部邮箱，要 owner.identity 拿 WONTON_OWNER_EMAIL，notify 拿 SMTP 三件套。
    - owner.identity
    - notify
  secrets:
    # 作为应用账号名的密钥：网关代登录头和 TA_USERNAME 用同一个值（见文件头）。
    ta_user:
      generate: { bytes: 24 }
    ta_password:
      generate: { bytes: 32 }
    elastic_password:
      generate: { bytes: 32 }
    redis_password:
      generate: { bytes: 32 }
  # 镜像都支持 amd64 和 arm64。上游没写最低内存；ES 堆按上游 compose 配 1G，三容器空闲实测合计
  # 约 250M（docker stats，建索引和下载时更高），含负载余量取 2G。
  requirements:
    arch: [amd64, arm64]
    memory: 2G
