[package]
name = "wonton-immich-media"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
publish = false

[lib]
name = "wonton_immich_media"
path = "src/lib.rs"

[[bin]]
name = "wonton-immich-media"
path = "src/main.rs"

[dependencies]
axum = "0.8"
base64 = "0.22"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
getrandom = "0.3"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
tokio = { version = "1", features = ["fs", "io-util", "macros", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["io"] }

[dependencies.reqwest]
version = "0.12"
default-features = false
features = ["json", "multipart", "stream"]

[dev-dependencies]
axum = { version = "0.8", features = ["multipart"] }
tempfile = "3"

[profile.release]
strip = true
panic = "abort"
