# ESPHome Device Builder：用网页给 ESP32/ESP8266 写固件、无线刷机。
# mDNS 发现设备和 OTA 都要宿主网络（上游官方部署就是 network_mode: host）；
# 网页只听回环，由核心中继接入网关，局域网绕不过网关。
services:
  # 一次性：给 MCP 请求头算 Basic 凭据 base64("wonton:<网页密码>")。
  # 头模板里算不了 base64，按规范的一次性服务 + collect 写法交给核心收存。
  init:
    image: ghcr.io/esphome/esphome:2026.10.2@sha256:4a918585150e95e7675be84a347384ff308fde1bd32d0e4472666e1252cc0e8f
    entrypoint: ["/bin/sh", "-c"]
    command:
      - printf 'wonton:%s' "$${ESPHOME_PASSWORD}" | base64 | tr -d '\n' > /run/mcp-basic
    environment:
      ESPHOME_PASSWORD: ${WONTON_SECRET_DASHBOARD_PASSWORD}
    network_mode: none
    restart: "no"

  esphome:
    image: ghcr.io/esphome/esphome:2026.10.2@sha256:4a918585150e95e7675be84a347384ff308fde1bd32d0e4472666e1252cc0e8f
    depends_on:
      init:
        condition: service_completed_successfully
    environment:
      TZ: ${TZ}
      # 上游 dashboard 的登录凭据。用新版变量名：裸 USERNAME/PASSWORD 会撞 shell 的 $USERNAME，上游已弃用。
      ESPHOME_USERNAME: wonton
      ESPHOME_PASSWORD: ${WONTON_SECRET_DASHBOARD_PASSWORD}
    volumes:
      # 设备 YAML、secrets.yaml 和 .esphome/ 编译缓存都在这里，重装不丢。
      - ${WONTON_APP_DATA}/config:/config
    network_mode: host
    # 上游默认绑定所有网卡；--host 127.0.0.1 后局域网直连不进来，网页经核心中继走网关。
    # mDNS 由 dashboard 里独立的 zeroconf 套接字处理，不受 HTTP 绑定地址影响。
    command: ["dashboard", "/config", "--host", "127.0.0.1", "--port", "6052"]
    # /version 公开（设了密码也回 200），和上游镜像自带的 HEALTHCHECK 同一条。
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:6052/version"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      start_interval: 2s

x-wonton:
  # stable 核心支持到 0.11；用到的字段最高只到 0.8（mcp.headers、optional_permissions、show_owner）。
  spec: "0.17"
  # 反向域名：上游官网 esphome.io。
  id: io.esphome.esphome
  version: 0.1.2
  kind: app
  title: { en: "ESPHome" }
  subtitle: { zh: "自制智能设备", en: "DIY Smart Devices", zh-Hant: "自製智慧裝置", ja: "自作スマート家電" }
  description:
    zh: 给自制的智能设备写程序、无线更新，接入智能家居
    en: Write the software for your DIY smart devices, update them over the air and hook them into your smart home
    zh-Hant: 給自製的智慧裝置寫程式、無線更新，接入智慧家庭
    ja: 自作のスマート家電のプログラムを書き、無線で更新してスマートホームにつなぎます。
  icon: icon.svg
  notices: [NOTICE]
  screenshots: [screenshots/home.png, screenshots/editor.png]
  author: { name: geraldpeng6, url: https://github.com/geraldpeng6 }
  homepage: https://esphome.io
  # 上游 ESPHome：C++ 部分 GPLv3，Python 及其余 MIT（"ESPHome License"）；
  # 镜像里还装了上游的网页面板 esphome-device-builder（Apache-2.0）。
  # 插件包自己的许可证写在仓库的 LICENSE 里。
  license: MIT AND GPL-3.0-only AND Apache-2.0
  tags:
    zh: [智能家居, 开发]
    en: [Home, Developer]
  about:
    zh: |
      给动手做的智能设备装上大脑：一块 ESP32 开发板接上传感器或开关，在网页里说明它是什么、接了什么，ESPHome 就生成程序写进设备，让它能接入 Home Assistant 这类智能家居。

      新建设备像填表：选板子、加组件，向导帮你写好设置。第一次写程序要在电脑的浏览器里接线刷入，之后改设置就能无线更新，不用再碰线。

      设备设置也可以让家里的助手代写：它能读改设置、查组件说明、检查并生成程序。
    en: |
      Give your DIY devices a brain: wire a sensor or switch to an ESP32 board, describe what it is and what is wired to it in the web page, and ESPHome builds the software to flash so the device works with Home Assistant and similar smart homes.

      Creating a device is like filling in a form: pick a board, add components, and a wizard writes the settings for you. The first flash needs a cable from a computer's browser; after that, settings changes update over Wi-Fi with no cable.

      Your assistant can write device settings too: it can read and change them, look up component documentation, check them and build the software.
    zh-Hant: |
      給動手做的智慧裝置裝上大腦：一塊 ESP32 開發板接上感測器或開關，在網頁裡說明它是什麼、接了什麼，ESPHome 就產生程式寫進裝置，讓它能接入 Home Assistant 這類智慧家庭。

      新增裝置像填表：選板子、加元件，精靈幫你寫好設定。第一次寫程式要在電腦的瀏覽器裡接線刷入，之後改設定就能無線更新，不用再碰線。

      裝置設定也可以讓家裡的助手代寫：它能讀改設定、查元件說明、檢查並產生程式。
    ja: |
      自作のスマート家電に頭脳を与えます。ESP32 ボードにセンサーやスイッチを配線し、何で何をつないだかを Web ページで書くと、ESPHome が書き込むプログラムを作り、Home Assistant などのスマートホームで動くようになります。

      デバイスの作成はフォーム記入のようなものです。ボードを選び、部品を足すと、ウィザードが設定を書いてくれます。最初の書き込みだけはパソコンのブラウザからケーブルで行い、以後は設定を変えれば Wi-Fi 越しに更新でき、ケーブルは不要です。

      家のアシスタントに設定を書かせることもできます。設定の読み書き、部品の説明の検索、検査とプログラム作成ができます。
  release_notes:
    zh: |
      插件包迁入官方插件合仓，内容与上一版相同。

      商店介绍重写：去掉重复的首次刷机描述，固件、编译等说法改成程序、生成；补繁体中文和日文。
    en: |
      Package moved into the official Wonton plugin monorepo; same content as the previous release.

      Store copy rewritten: the duplicated first-flash text is gone, and firmware/compile wording became software and build; Traditional Chinese and Japanese added.
    zh-Hant: "外掛包遷入官方外掛合倉，內容與上一版相同。\n\n商店介紹重寫：去掉重複的首次刷機描述，韌體、編譯等說法改成程式、產生；補繁體中文和日文。"
    ja: "プラグインを公式プラグインリポジトリへ移動しました。内容は前版と同じです。\n\nストア紹介を書き直し、重複していた初回書き込みの説明を削り、ファームウェアやコンパイルをプログラム・作成という言い方にしました。繁体字中国語と日本語を追加。"
  setup:
    zh: 打开插件网页，用户名 wonton，密码在插件详情页里查看复制。
    en: Open the plugin's web page; sign in as user "wonton" with the password shown in the plugin details.
    zh-Hant: 開啟外掛網頁，使用者名稱 wonton，密碼在外掛詳情頁裡查看複製。
    ja: プラグインの Web ページを開き、ユーザー名 wonton と、プラグイン詳細に表示されるパスワードでサインインします。
  webui:
    service: esphome
    port: 6052
    sso: none
  # 上游 dashboard 自带 MCP 服务器（POST /api/mcp，无状态 JSON-RPC）：
  # 助手经它读改设备配置、查组件文档、验证、编译和装机。
  # /api/mcp 要凭据（Basic 或 Bearer），用一次性服务算好的 Basic 头。
  mcp:
    service: esphome
    port: 6052
    path: /api/mcp
    transport: streamable-http
    headers:
      Authorization: Basic {secret:mcp_basic}
  permissions:
    # mDNS 发现设备、OTA 无线刷机要宿主网络（上游官方部署同款）。
    # 网页只听回环，局域网绕不过网关；编译出网也走宿主网络，不经平台出网代理。
    - network.host
  # 首次 USB 刷机（把固件从电脑经 USB 线装进设备）：上游推荐走电脑浏览器里的网页安装器，
  # 浏览器经 USB 直接连设备，不用这台主机的 USB；之后的改固件走 OTA 无线刷机，不需要 USB。
  # 规范的 devices.usb / devices.serial（可选、默认关）映射到 compose devices 后可再声明。
  secrets:
    dashboard_password:
      # 网页登录密码，主人在插件详情页查看。
      generate: { bytes: 24 }
      show_owner:
        label: { zh: 网页密码, en: Web PASSWORD, zh-Hant: 網頁密碼, ja: ウェブのPASSWORD }
    mcp_basic:
      # init 服务算好的 MCP Basic 凭据，见上面 init 的注释。
      collect: { service: init, path: /run/mcp-basic }
  requirements:
    arch: [amd64, arm64]
    # 上游没写最低内存；装好后实测取整。
    memory: 1G
