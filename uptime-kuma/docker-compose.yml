# Uptime Kuma：对网站和服务做拨测监控，掉线时经自带的通知渠道告警。
services:
  kuma:
    # 上游官方 rootless 镜像（MIT），按 amd64/arm64/arm 清单列表摘要固定。
    image: louislam/uptime-kuma:2.5.9-rootless@sha256:ea1b2ceb6ef710a3d0d994debcc8cded062e534fb901f6e895f59caad68e0a9e
    # 内嵌 MariaDB 仅接受 node/root；固定 node 的 UID/GID，由核心准备同属主的数据目录。
    user: "1000:1000"
    # 仅数据目录与临时目录可写；Chromium 的缓存和 crashpad 使用临时 HOME。
    read_only: true
    tmpfs:
      - /tmp:rw,size=256m
    environment:
      TZ: ${TZ}
      HOME: /tmp
      # 跳过首次打开的数据库设置页：上游 setup-database.js 见到这个变量就不再进设置流程，
      # 直接按 SQLite 写 db-config.json 并继续启动。
      UPTIME_KUMA_DB_TYPE: sqlite
    volumes:
      # 数据库、监控历史、状态页与截图一起持久化，卸载保留数据时不删除。
      - ${WONTON_APP_DATA}:/app/data
    healthcheck:
      # 上游 extra/healthcheck 连 5xx 也返回成功；直接检查 HTTP API 并拒绝错误状态。
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--max-time", "5", "http://127.0.0.1:3001/api/entry-page"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      start_interval: 2s

  # 一次性服务：调上游自己的事件预建主人的管理员账号并关掉应用自己的登录（disableAuth），
  # 装完第一次打开直接可用，不需要记应用密码。用同一个官方镜像，脚本只用镜像自带的
  # socket.io-client（生产依赖）。成功后写标记文件，升级、重建时看到标记直接退出；已有账号
  # 且密码对不上（主人接管过）也不动它的设置。kuma 没监听时靠脚本里的自动重连等待，
  # 所以 depends_on 用 started 就够。
  setup-admin:
    image: louislam/uptime-kuma:2.5.9-rootless@sha256:ea1b2ceb6ef710a3d0d994debcc8cded062e534fb901f6e895f59caad68e0a9e
    user: "1000:1000"
    entrypoint: ["node", "/app/setup-admin.mjs"]
    environment:
      WONTON_OWNER_NAME: ${WONTON_OWNER_NAME:?核心没有注入用户名}
      WONTON_SECRET_ADMIN_PASSWORD: ${WONTON_SECRET_ADMIN_PASSWORD}
    volumes:
      # 标记文件写在数据目录里；kuma 也挂这里，两边属主一致（1000:1000）。
      - ${WONTON_APP_DATA}:/app/data
    configs:
      - source: setup-admin
        target: /app/setup-admin.mjs
    depends_on:
      kuma:
        condition: service_started
    restart: "no"

configs:
  setup-admin:
    file: setup-admin.mjs

x-wonton:
  spec: "0.11"
  id: fyi.kuma.uptime-kuma
  version: 0.2.2
  kind: app
  title: { zh: "网站监控（Uptime Kuma）", en: "Site Monitoring (Uptime Kuma)", zh-Hant: "網站監控（Uptime Kuma）", ja: "サイト監視（Uptime Kuma）" }
  description:
    zh: 盯着你的网站和服务，掉线时提醒你。
    en: Watch your sites and services and get alerted when they go down.
    zh-Hant: 盯著你的網站和服務，掉線時提醒你。
    ja: 自分のサイトやサービスを見張り、落ちたら知らせます。
  icon: icon.png
  notices: [NOTICE]
  screenshots: [screenshots/monitors.png, screenshots/add-monitor.png, screenshots/monitor-detail.png, screenshots/notifications.png]
  author: { name: geraldpeng6, url: https://github.com/geraldpeng6 }
  homepage: https://uptime.kuma.pet
  license: MIT
  tags:
    zh: [监控]
    en: [Monitoring]
  setup:
    zh: 打开就能用，不用登录：云吞已经替你认了身份，应用自己的登录是关的。添加要盯的网址或服务，再配一个提醒渠道（私聊、Telegram 等）。
    en: "Open and use it — no login: Wonton already authenticates you and the app's own login is off. Add the site or service to watch, then set up an alert channel (chat, Telegram and more)."
    zh-Hant: 開啟就能用，不用登入：雲吞已經替你認了身分，應用自己的登入是關的。新增要盯的網址或服務，再配一個提醒頻道（私聊、Telegram 等）。
    ja: 開けば使え、ログインは不要です。Wonton がすでに本人確認をしており、アプリ側のログインは切ってあります。監視するサイトやサービスを追加し、通知先（チャット、Telegram など）を設定します。
  about:
    zh: |
      盯着你的网站和服务，支持网址、端口、ping 和 DNS，掉线时提醒你。

      状态页只给登录了云吞的你看；外面的服务主动来报平安（心跳）会被拦下。

      要盯家里的服务时，地址照常填；远程监控要云吞这台机器能上网。
    en: |
      Watch your sites and services over HTTP(s), ports, ping and DNS, and get alerted when they go down.

      Status pages are visible only to you while signed in; outside push heartbeats are blocked.

      For services at home, enter their address as usual; monitoring from outside needs the Wonton machine to reach the internet.
    zh-Hant: |
      盯著你的網站和服務，支援網址、埠、ping 和 DNS，掉線時提醒你。

      狀態頁只給登入了雲吞的你看；外面的服務主動來報平安（心跳）會被攔下。

      要盯家裡的服務時，位址照常填；遠端監控要雲吞這台機器能上網。
    ja: |
      自分のサイトやサービスを HTTP(s)・ポート・ping・DNS で監視し、落ちたら知らせます。

      ステータスページはサインインした本人だけが見られます。外部サービスからのプッシュ（ハートビート）は遮断されます。

      家のサービスを見る時もアドレスはそのまま入力します。外部の監視には Wonton のマシンがインターネットに届く必要があります。
  release_notes:
    zh: |
      插件包迁入官方插件合仓，内容与上一版相同。

      商店介绍重写：免登录和配提醒移到「安装后要做的事」，网关、心跳、状态页等说法换成日常用语，并加了中文标题；补繁体中文和日文。
    en: |
      Package moved into the official Wonton plugin monorepo; same content as the previous release.

      Store copy rewritten: the no-login and alert-setup notes moved to the pre-install notice, with gateway/heartbeat/status-page wording in everyday words and a Chinese title added; Traditional Chinese and Japanese added.
    zh-Hant: "外掛包遷入官方外掛合倉，內容與上一版相同。\n\n商店介紹重寫：免登入和配提醒移到「安裝後要做的事」，閘道、心跳、狀態頁等說法換成日常用語，並加了中文標題；補繁體中文和日文。"
    ja: "プラグインを公式プラグインリポジトリへ移動しました。内容は前版と同じです。\n\nストア紹介を書き直し、ログイン不要と通知設定を「インストール後の手順」に移し、ゲートウェイやハートビート、ステータスページなどの言い方を日常的な言葉にして中国語タイトルも付けました。繁体字中国語と日本語を追加。"
  webui:
    service: kuma
    port: 3001
    # Uptime Kuma 不支持 OIDC，也不认反向代理传来的用户名。setup-admin 会关掉它自己的登录（disableAuth）：
    # 打开网页只此一条路，网关先校验用户的会话才转发，所以应用可以免登。
    sso: none
  permissions:
    # 拨测要访问外网和局域网里的设备；通知渠道（Telegram、SMTP、Webhook）也得出网。
    # Checks reach the internet and LAN devices, and notification channels (Telegram, SMTP, webhook) need egress too.
    - network.egress
    # 知道用户名：预建的管理员账号按注入的用户名建，登录时输入的就是它。
    - owner.identity
  secrets:
    # 预建管理员的登录密码：核心生成，升级和保留数据的重装都不变。
    admin_password:
      generate: { bytes: 32 }
  # 上游没写最低内存；本机空闲实测约 92M，取 256M。镜像支持 amd64 和 arm64（docker manifest inspect）。
  requirements:
    arch: [amd64, arm64]
    memory: 256M
