# Excalidraw：手绘风白板。画布完全在浏览器里运行，服务端只发静态页面。
services:
  excalidraw:
    # 上游官方镜像。上游只发 latest 一个标签（另有按提交构建的 sha-* 标签，正式版本没有独立标签），
    # 按清单列表摘要固定到 2026-05-06 的构建；多架构，amd64 和 arm64 都有。
    image: excalidraw/excalidraw:latest@sha256:f7ee194addd607bf831d2af0f0a34463dd4225e426cf35199ef0b12a803398e9
    # 上游基于 nginx:stable-alpine-slim 直接发静态文件，没有要写的数据；根文件系统只读，
    # nginx 启动时要写的三处（缓存、pid、日志）用 tmpfs 兜住。
    read_only: true
    tmpfs:
      - /var/cache/nginx:rw,size=32m
      - /var/run:rw,size=8m
      - /var/log/nginx:rw,size=8m
    healthcheck:
      # 上游镜像自带的 HEALTHCHECK 是同一探测，这里按官方索引要求显式写出。
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      start_interval: 1s

x-wonton:
  spec: "0.11"
  id: com.excalidraw.excalidraw
  version: 0.1.2
  kind: app
  title: { zh: "手绘画板（Excalidraw）", en: "Sketch Board (Excalidraw)", zh-Hant: "手繪畫板（Excalidraw）", ja: "手描きホワイトボード（Excalidraw）" }
  description:
    zh: 像在白纸上随手画：流程图、示意图、草图都是手绘风格，画完能导出成图片。
    en: "Like sketching on paper: flowcharts, diagrams and doodles in a hand-drawn style, ready to export as images."
    zh-Hant: 像在白紙上隨手畫：流程圖、示意圖、草圖都是手繪風格，畫完能匯出成圖片。
    ja: 紙に落書きするような感覚で、手描き風のフローチャートや図、スケッチを描けます。描いたあとは画像に書き出せます。
  icon: icon.svg
  notices: [NOTICE]
  screenshots: [screenshots/canvas.jpg, screenshots/welcome.jpg]
  author: { name: geraldpeng6, url: https://github.com/geraldpeng6 }
  homepage: https://excalidraw.com
  # 应用（Excalidraw）的许可证；插件包自己的许可证写在仓库的 LICENSE 里。
  license: MIT
  tags:
    zh: [白板, 效率]
    en: [Whiteboard, Productivity]
  setup:
    zh: 打开就画，不用注册；画好的图请随手导出成文件，换设备或清浏览器数据都要靠它找回。
    en: Open it and draw — no account. Export your drawing to a file as you go; that file is how you get it back on another device or after clearing browser data.
    zh-Hant: 開啟就畫，不用註冊；畫好的圖請隨手匯出成檔案，換裝置或清瀏覽器資料都要靠它找回。
    ja: 開けばすぐ描け、アカウントは要りません。描いた図はこまめにファイルへ書き出してください。別の端末やブラウザデータを消した後は、そのファイルでしか戻せません。
  about:
    zh: |
      打开就是一块手绘风画布：方框、箭头、文字、便签随手画，拼流程图、示意图和草图；能导入导出 PNG、SVG 和 .excalidraw 文件。

      画的内容只存在你打开网页的那台设备的浏览器里，不经过也不留在服务器上；换浏览器或清了浏览器数据，就要用导出的文件恢复。

      多人一起画要额外装 Excalidraw 官方的协作服务，官方镜像不带，这个插件不提供。
    en: |
      Open it and you get a hand-drawn style canvas: boxes, arrows, text and sticky notes for flowcharts, diagrams and brainstorms; import and export PNG, SVG and .excalidraw files.

      Your drawing stays only in the browser of the device you opened the page on — it never reaches the server. Switching browsers or clearing browser data means restoring from an exported file.

      Drawing together needs Excalidraw's separate collaboration service, which the official image does not ship and this plugin does not provide.
    zh-Hant: |
      開啟就是一塊手繪風畫布：方框、箭頭、文字、便籤隨手畫，拼流程圖、示意圖和草圖；能匯入匯出 PNG、SVG 和 .excalidraw 檔案。

      畫的內容只存在你開啟網頁的那台裝置的瀏覽器裡，不經過也不留在伺服器上；換瀏覽器或清了瀏覽器資料，就要用匯出的檔案恢復。

      多人一起畫要額外裝 Excalidraw 官方的協作服務，官方鏡像不帶，這個外掛不提供。
    ja: |
      開くと手描き風のキャンバスが現れます。四角・矢印・文字・付箋でフローチャートや図、スケッチを描け、PNG・SVG・.excalidraw ファイルを読み書きできます。

      描いた内容は、ページを開いた端末のブラウザにだけ残り、サーバーを経由も保存もしません。ブラウザを変えたりデータを消したりした場合は、書き出したファイルから復元してください。

      複数人での同時編集には Excalidraw 公式の別サービスが必要で、公式イメージには含まれておらず、このプラグインでも提供しません。
  release_notes:
    zh: |
      插件包迁入官方插件合仓，内容与上一版相同。

      商店介绍重写：浏览器存储、上游协作服务这类说法换成日常用语，导出提醒移到「安装后要做的事」；补繁体中文和日文。
    en: |
      Package moved into the official Wonton plugin monorepo; same content as the previous release.

      Store copy rewritten: browser-storage and upstream-service wording in everyday words, and the export reminder moved to the pre-install notice; Traditional Chinese and Japanese added.
    zh-Hant: "外掛包遷入官方外掛合倉，內容與上一版相同。\n\n商店介紹重寫：瀏覽器儲存、上游協作服務這類說法換成日常用語，匯出提醒移到「安裝後要做的事」；補繁體中文和日文。"
    ja: "プラグインを公式プラグインリポジトリへ移動しました。内容は前版と同じです。\n\nストア紹介を書き直し、ブラウザ保存や上流サービスなどの言い方を日常的な言葉にし、書き出しの注意を「インストール後の手順」に移しました。繁体字中国語と日本語を追加。"
  webui:
    service: excalidraw
    port: 80
    # 应用没有任何登录（纯静态画布，数据只存在浏览器本地）。网页仍然只在网关登录后面可达：
    # 未登录的请求到不了插件。
    sso: none
  permissions: []
  # 上游没写最低内存；本机空闲实测约 23–27M，取 64M。镜像支持 amd64 和 arm64（docker manifest）。
  requirements:
    arch: [amd64, arm64]
    memory: 64M
