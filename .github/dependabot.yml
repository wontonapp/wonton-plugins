# 上游镜像发新版时开 PR，标签和摘要一起改；每个插件目录一份检查。
# directories 的 /* 只匹配第一层目录，正好是各插件的子目录；scripts/、.github/ 没有 compose 清单，自动跳过。
# group-by: dependency-name 把同一个上游镜像在多个插件里的升级合成一个 PR，避免几十个插件同时发版时刷屏。
version: 2
updates:
  - package-ecosystem: docker-compose
    directories:
      - "/*"
    schedule:
      interval: daily
    groups:
      image-updates:
        group-by: dependency-name
    # 数据库跨大版本要迁移数据（旧数据目录新版起不来），自动 PR 不做：nextcloud、romm 留 MariaDB 11.8 LTS（升 12 冒烟挂），
    # PostgreSQL、PostGIS 换大版本要 pg_upgrade 或导出导入。
    # ignore 只能按整个 update 写，按目录拆会和 /* 重叠，所以对所有插件都只放行这些数据库的小版本和补丁；要跨大版本手动开 PR。
    ignore:
      - dependency-name: mariadb
        update-types: ["version-update:semver-major"]
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]
      - dependency-name: imresamu/postgis
        update-types: ["version-update:semver-major"]
