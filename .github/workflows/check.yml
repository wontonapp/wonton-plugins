name: 检查

# 按改动的路径分作业：只改一个插件的 PR 只检查那一个；改 scripts/ 或工作流本身是全部。
# 仓库级检查（行数、泄漏、ADR）对整个仓库生效，每个 PR 都跑，和改动路径无关。
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      core-image:
        description: 核心镜像（如 ghcr.io/wontonapp/wonton-core:sha-<完整 40 位提交号>，钉在某次合并上复测；留空用 :main）
        required: false
        type: string
        default: ''
      upgrade-from:
        description: 冒烟“升级保数据”的起点（提交或 tag，只在本次运行里打本地 tag，不推）；留空取每个插件自己的最近 tag
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  changed:
    runs-on: ubuntu-24.04
    outputs:
      plugins: ${{ steps.plan.outputs.plugins }}
      shared: ${{ steps.plan.outputs.shared }}
    steps:
      # 要完整历史：基线提交和 head 都要能拿来 diff，冒烟的升级起点也要能 git archive 到旧 tag。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: python3 .github/changed.py

  repo:
    name: 仓库级检查
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # 只数代码行：空行和只有注释的行不算（去掉首尾空白后以注释符开头的行，以及 /* */ 块里的行），不做完整的语法分析。
      # 超过 800 行警告，是该按职责拆的信号；超过 2000 行失败。不许为了缩短行数写难懂的代码：删注释、把多行挤成一行、
      # 把穷举的 match 改成 _、缩短有意义的名字都不行。
      - name: 源文件代码行数（超过 800 警告，超过 2000 失败）
        shell: python
        run: |
          import os
          import subprocess
          import sys

          WARN_LINES, FAIL_LINES = 800, 2000

          def code_lines(path):
              hash_comments = path.endswith(('.py', '.sh'))
              count, in_block = 0, False
              with open(path, encoding='utf-8', errors='replace') as source:
                  for raw_line in source:
                      line = raw_line.strip()
                      if in_block:
                          in_block = '*/' not in line
                      elif not line:
                          pass
                      elif hash_comments:
                          count += not line.startswith('#')
                      elif line.startswith('/*'):
                          in_block = '*/' not in line[2:]
                      else:
                          count += not line.startswith('//')
              return count

          paths = subprocess.check_output([
              'git', 'ls-files', '-z', '--',
              '*.rs', '*.py', '*.sh', '*.js', '*.ts', '*.go', '*.kt', '*.swift',
          ]).split(b'\0')
          failed = False
          for raw_path in filter(None, paths):
              path = os.fsdecode(raw_path)
              lines = code_lines(path)
              if lines > FAIL_LINES:
                  print(f'{path!r}: {lines} 行代码（不算空行和注释，上限 {FAIL_LINES}），按职责拆开')
                  failed = True
              elif lines > WARN_LINES:
                  print(f'::warning file={path}::{path} 有 {lines} 行代码（不算空行和注释），超过 {WARN_LINES}，按职责拆')
          sys.exit(1 if failed else 0)
      - name: ShellCheck
        run: shellcheck scripts/*.sh
      - name: 公开仓库泄漏检查
        shell: python
        run: |
          import fnmatch
          import hashlib
          import os
          import re
          import subprocess
          import sys

          # 机器名和内部脚本名按加盐哈希比对：名单本身写进公开仓库就是泄漏。哈希只防被搜索到，挡不住穷举短名字。
          # 第一组只要单独出现就算；第二组是常见词或数字（版本号、端口、行号里到处都是），只在指机器的写法里算。
          ALWAYS = {'5c166a6466e0133c', '1e73ad4544a12aaf', 'f40bafa815094acd', '220782975ac7828e',
                    '5cb02949aa739e24', '87d0117601845764', '2e79e948c27bfe9d', '421c198ae436309f'}
          IN_HOST_CONTEXT = ALWAYS | {'cd4ae7a244ba48a6', '1d057cd132164e22', '02862ab1a24b080f', '0f70910a30edd8cb'}
          NAME = r'(?P<h>[A-Za-z0-9_-]+)'
          HOST_CONTEXTS = [re.compile(p) for p in (
              rf'\bssh\s+(?:-\S+\s+)*(?:[A-Za-z0-9_.-]+@)?{NAME}(?![A-Za-z0-9_.-])',  # ssh -4 <机器>、ssh user@<机器>
              rf'(?<![A-Za-z0-9_./:-]){NAME}:[~/]',  # <机器>:~/路径（scp、rsync）
              rf'@{NAME}(?![A-Za-z0-9_.@-])',  # user@<机器>
              rf'(?i)\bhost(?:name)?(?:\s*[:=]\s*|\s+){NAME}(?![A-Za-z0-9_.-])',  # --host <机器>、host: <机器>
              rf'[在到去]\s*{NAME}\s*[上里]',  # 在 <机器> 上
          )]
          TOKEN = re.compile(r'[A-Za-z0-9_][A-Za-z0-9_-]*')
          NETWORKS = re.compile(
              r'(?<![\w.])(?:192\.168\.\d{1,3}\.\d{1,3}|10\.\d{1,3}\.\d{1,3}\.\d{1,3}'
              r'|100\.(?:6[4-9]|[7-9]\d|1[01]\d|12[0-7])\.\d{1,3}\.\d{1,3}'  # Tailscale 用的 CGNAT 段
              r'|172\.(?:1[6-9]|2\d|3[01])\.\d{1,3}\.\d{1,3})(?![\w.]*\d)'
          )
          # 状态词只查文档和注释。排除“出现在”“实现在”之类的词，以及加引号的引用（规则本身会引这些词）；
          # “还没”只在后面跟着开发进度类的动词时算，“用户还没配置过”这类描述运行时状态的照常写。
          STATUS = re.compile(
              r'(?<![“"「‘\'])(?:目前|(?<![出实表体])现在(?!\s*[+＋-])'
              r'|还没(?:有)?(?:合入|合并|收|定稿|定|支持|实现|接入|上线|发布|做|写|适配|开放|提供|让))'
          )


          def digest(token):
              return hashlib.sha256(f'wonton-leak:{token.lower()}'.encode()).hexdigest()[:16]


          def leaked_name(line):
              for token in TOKEN.findall(line):
                  if any(digest(part) in ALWAYS for part in {token, *re.split(r'[-_]', token)}):
                      return True
              return any(digest(m.group('h')) in IN_HOST_CONTEXT for p in HOST_CONTEXTS for m in p.finditer(line))


          def findings(path, line):
              if leaked_name(line):
                  yield '主机名或内部脚本名'
              if NETWORKS.search(line):
                  yield '内网地址'
              stripped = line.lstrip()
              if (path.endswith('.md') or stripped.startswith(('#', '//'))) and STATUS.search(line):
                  yield '状态词（目前/现在/还没）'


          def load_allow():
              allow = []
              if not os.path.exists('.leak-allow'):
                  return allow
              with open('.leak-allow', encoding='utf-8') as source:
                  for number, raw in enumerate(source, 1):
                      if not raw.strip() or raw.lstrip().startswith('#'):
                          continue
                      parts = [part.strip() for part in raw.rstrip('\n').split('|')]
                      if len(parts) != 3 or not all(parts):
                          sys.exit(f'.leak-allow:{number}: 格式是“路径 | 行内片段 | 原因”，三项都要写')
                      allow.append([parts[0], parts[1], False])
              return allow


          def main():
              allow = load_allow()
              paths = subprocess.check_output(['git', 'ls-files', '-z']).split(b'\0')
              failed = False
              for raw_path in filter(None, paths):
                  path = os.fsdecode(raw_path)
                  if path == '.leak-allow' or not os.path.isfile(path):
                      continue
                  with open(path, 'rb') as source:
                      data = source.read()
                  if b'\0' in data[:8192]:
                      continue
                  for number, line in enumerate(data.decode('utf-8', errors='replace').splitlines(), 1):
                      for kind in findings(path, line):
                          entry = next((e for e in allow if fnmatch.fnmatch(path, e[0]) and e[1] in line), None)
                          if entry:
                              entry[2] = True
                              continue
                          failed = True
                          print(f'::error file={path},line={number}::{kind}')
                          print(f'{path}:{number}: [{kind}] {line.strip()}')
              for pattern, fragment, used in allow:
                  if not used:
                      print(f'::warning file=.leak-allow::豁免没有命中任何行，删掉：{pattern} | {fragment}')
              if failed:
                  print('插件仓库是公开的：上面这些行带了机器名、内部脚本名、内网地址或会过时的状态词。'
                        '示例地址用 192.0.2.10；确属误报的，在 .leak-allow 里按“路径 | 行内片段 | 原因”豁免。', file=sys.stderr)
              sys.exit(1 if failed else 0)


          main()
      # 插件仓库是公开的，核心的设计记录（ADR）读者打不开：注释、README、NOTICE 里写编号只会留下死链，
      # 要讲的道理直接写在原处。
      - name: 不引用 ADR 编号
        run: |
          if git grep -nIE 'ADR-?[0-9]{2,4}'; then
            echo "上面这些行引用了 ADR 编号：插件仓库是公开的，读者看不到 ADR，把要说的原因直接写出来。" >&2
            exit 1
          fi

  kit:
    name: 套件测试
    needs: changed
    if: needs.changed.outputs.shared == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # 套件自己的命令（logs、diag）的用例：用假 docker，不碰真的 Docker。
      - name: dev.sh 的 logs 和 diag（假 docker，不用真的 Docker）
        run: scripts/dev_test.sh

  plugin:
    name: 插件 ${{ matrix.plugin }}
    needs: changed
    if: needs.changed.outputs.plugins != '[]'
    runs-on: ubuntu-24.04
    strategy:
      # 一个插件失败不挡别的插件出结果。
      fail-fast: false
      matrix:
        plugin: ${{ fromJSON(needs.changed.outputs.plugins) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: ShellCheck（插件自带的脚本）
        run: |
          if compgen -G '${{ matrix.plugin }}/*.sh' >/dev/null; then
            shellcheck ${{ matrix.plugin }}/*.sh
          fi
      # PR 上跑非官方：官方要求里自家镜像的摘要要等发布流程推完镜像才写回 compose，新插件在第一次发布前
      # 满足不了；官方要求（摘要、健康检查、标签、许可证、作者、声明）由发布流程发版前的 plugin check --official
      # 把关，已发布插件的摘要回归也由它挡住。
      - name: 插件包检查
        env:
          WONTON_CORE_IMAGE: ${{ inputs.core-image }}
          WONTON_PLUGIN: ${{ matrix.plugin }}
        run: scripts/check.sh

  smoke-plan:
    name: 冒烟计划（GPU 前置）
    needs: changed
    if: ${{ (github.event_name == 'workflow_dispatch' || github.actor == 'dependabot[bot]' || github.event.pull_request.user.login == 'dependabot[bot]') && needs.changed.outputs.plugins != '[]' }}
    runs-on: ubuntu-24.04
    outputs:
      plugins: ${{ steps.plan.outputs.plugins }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: plan
        name: 按插件检查 GPU 可跑性
        shell: bash
        env:
          PLUGINS: ${{ needs.changed.outputs.plugins }}
        run: |
          set -u
          runnable='[]'
          while IFS= read -r plugin; do
            set +e
            WONTON_PLUGIN="$plugin" scripts/smoke-gpu.sh "$plugin"
            rc=$?
            set -e
            if [[ "$rc" == 0 ]]; then
              runnable="$(jq -c --arg p "$plugin" '. + [$p]' <<<"$runnable")"
            elif [[ "$rc" == 77 ]]; then
              echo "### 跳过：需要显卡，没跑：$plugin" >> "$GITHUB_STEP_SUMMARY"
              echo '该插件未安装、未执行冒烟，不计为通过。' >> "$GITHUB_STEP_SUMMARY"
            else
              exit "$rc"
            fi
          done < <(jq -r '.[]' <<<"$PLUGINS")
          echo "plugins=$runnable" >> "$GITHUB_OUTPUT"

  smoke:
    name: 冒烟 ${{ matrix.plugin }}
    # GPU 不可用的插件已在 smoke-plan 中排除；非 Dependabot/手动触发仍不跑冒烟。
    if: ${{ (github.event_name == 'workflow_dispatch' || github.actor == 'dependabot[bot]' || github.event.pull_request.user.login == 'dependabot[bot]') && needs.smoke-plan.outputs.plugins != '[]' }}
    needs: [changed, plugin, smoke-plan]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        plugin: ${{ fromJSON(needs.smoke-plan.outputs.plugins) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # 出口代理：声明 network.egress 的插件经核心的出口容器出网，出口容器把流量转发到
      # 这里起的转发代理。镜像和核心出口容器是同一个（gogost/gost，MIT，按摘要固定）。端口只绑
      # Docker 网桥的网关地址，不对公网暴露。对不出网的插件没有副作用：核心只为声明了 egress 的
      # 插件网络接出口容器，smoke 配好代理后会先探测这条链路，不通时冒烟当场失败并写明原因。
      - name: 起出口代理
        run: |
          gw="$(docker network inspect bridge --format '{{(index .IPAM.Config 0).Gateway}}')"
          docker run -d --name wonton-ci-egress -p "${gw}:3128:3128" \
            gogost/gost:3@sha256:f266f957c6e4f8d433ed23202a5745fa4969d08f3f0ef034fb9357345e16ad67 \
            -L "http://:3128"
          for i in $(seq 1 10); do
            curl -fsS -x "http://${gw}:3128" -o /dev/null https://github.com && break
            if [[ "$i" == 10 ]]; then docker logs wonton-ci-egress; exit 1; fi
            sleep 1
          done
          echo "WONTON_DEV_EGRESS_PROXY=http://${gw}:3128" >> "$GITHUB_ENV"
      - name: 端到端冒烟（装得上、网页打得开、用户身份能用、工具 Bot 调得到）
        env:
          WONTON_PLUGIN: ${{ matrix.plugin }}
          WONTON_CORE_IMAGE: ${{ inputs.core-image }}
          UPGRADE_FROM: ${{ inputs.upgrade-from }}
        # 指定起点时在 runner 本地打一个 tag 交给 smoke，不推到仓库：公开仓库里的 tag 会和以后正式发版的版本号撞上。
        run: |
          if [[ -n "$UPGRADE_FROM" ]]; then
            git tag -f smoke-upgrade-base "$UPGRADE_FROM"
            WONTON_PLUGIN="${{ matrix.plugin }}" scripts/dev.sh smoke --upgrade-from smoke-upgrade-base
          else
            WONTON_PLUGIN="${{ matrix.plugin }}" scripts/dev.sh smoke
          fi
      # 拉镜像、健康检查、探测这些失败原因只在 .wonton/<插件>/smoke.log 里，不打出来就没法分诊。
      # 令牌和会话 cookie 按约定只进 .env 和 cookie 文件，不进日志；这里仍按键名掩掉
      # credential 形态的值，防止哪个探测把带令牌的地址或响应原样打进来（sha256 摘要不受影响）。
      - name: 冒烟日志末尾（失败时）
        if: failure()
        run: |
          log=".wonton/${{ matrix.plugin }}/smoke.log"
          if [[ ! -s "$log" ]]; then
            echo "（$log 不存在或为空：冒烟在写日志前就退出了）"
            exit 0
          fi
          python3 - "$log" "$RUNNER_TEMP/smoke-redacted.log" <<'PY'
          import re
          import sys

          src, dst = sys.argv[1], sys.argv[2]
          # 键名允许带前缀（WONTON_SECRET_OWNER_PASSWORD、X-Auth-Token），键右侧要词边界。
          keys = (r"(?:[\w.-]+[-_])?(?:client_secret|access_token|refresh_token|session_token|"
                  r"api[-_]?key|password|passwd|secret|token|authorization)\b")
          patterns = [
              # Authorization: Bearer xxx 先掩，避免键值对规则把 "Bearer" 当值掩掉、令牌留下。
              re.compile(r"(?i)(bearer\s+)(\S+)()"),
              # key="value"
              re.compile(rf"(?i)(\b{keys}\s*=\s*[\"'])([^\"']*)([\"'])"),
              # key=value、key: value（URL 查询串、环境变量、YAML）
              re.compile(rf"(?i)(\b{keys}\s*[:=]\s*)([^\s&\"']+)()"),
          ]

          def mask(m: re.Match) -> str:
              prefix, value, suffix = m.group(1), m.group(2), m.group(3)
              if value.startswith("${") or value.lower() == "bearer":
                  return m.group(0)  # 变量引用和scheme词不是密钥，留着好排错
              return f"{prefix}***{suffix}"

          with open(dst, "w", encoding="utf-8") as out:
              for line in open(src, encoding="utf-8", errors="replace"):
                  for pat in patterns:
                      line = pat.sub(mask, line)
                  out.write(line)
          PY
          echo "== 冒烟日志末尾 80 行（已脱敏；完整日志见 artifact smoke-log）=="
          tail -n 80 "$RUNNER_TEMP/smoke-redacted.log"
      - name: 上传冒烟日志（失败时）
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-log-${{ matrix.plugin }}
          path: ${{ runner.temp }}/smoke-redacted.log
          if-no-files-found: ignore

  # 必需检查只设这个汇总作业：插件矩阵按改动生成，检查名不固定，规则集没法逐个列。
  summary:
    name: check 汇总
    needs: [changed, repo, kit, plugin, smoke-plan, smoke]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      RESULTS: ${{ join(needs.*.result, ' ') }}
    steps:
      - name: 各作业的结果
        run: |
          echo "$RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success|skipped) ;;
              *) exit 1 ;;
            esac
          done
