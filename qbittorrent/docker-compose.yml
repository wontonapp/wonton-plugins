# qBittorrent：经云吞网关打开 WebUI，把 BT 下载写入共享文件夹 downloads。
services:
  init:
    image: qbittorrentofficial/qbittorrent-nox:5.3.0-2@sha256:43b2d352cf76330a7ca34c7320b9b74227d6f31e662e0e123d0457206b09a7ea
    user: "${PUID}:${PGID}"
    entrypoint: ["/bin/sh", "/seed/init.sh"]
    environment:
      # 核心地址固定在插件网络的末端；只让网关来源免登录。
      WONTON_CORE_ADDRESS: "${WONTON_CORE_ADDRESS:?核心没有注入核心地址}"
      # 下载完成的通知邮件经核心的内部邮箱发信，转进收件人的 Wonton 私聊；收件人默认是主人（owner.identity）。
      WONTON_SMTP_HOST: "${WONTON_SMTP_HOST:?核心没有注入发信服务器}"
      WONTON_SMTP_PORT: "${WONTON_SMTP_PORT:?核心没有注入发信端口}"
      WONTON_MAIL_FROM: "${WONTON_MAIL_FROM:?核心没有注入发件地址}"
      WONTON_OWNER_EMAIL: "${WONTON_OWNER_EMAIL:?核心没有注入主人邮箱}"
      # VueTorrent 官方发版，版本号与 zip 的 sha256 写死在这里。Dependabot 认不出这个变量，
      # 升级时一起改两行，地址形如 https://github.com/VueTorrent/VueTorrent/releases/download/<版本>/vuetorrent.zip。
      VUETORRENT_VERSION: "v2.36.1"
      VUETORRENT_SHA256: "70b67531f0f3bc36c8bd05d82cc7ba1ee37c71c17f0b6c45f522200e35e66f37"
    volumes:
      - ${WONTON_APP_DATA}/config:/config
      - ${WONTON_APP_DATA}/vuetorrent:/vuetorrent
    configs:
      - source: config_seed
        target: /seed/qBittorrent.conf
      - source: config_init
        target: /seed/init.sh
    restart: "no"

  qbittorrent:
    image: qbittorrentofficial/qbittorrent-nox:5.3.0-2@sha256:43b2d352cf76330a7ca34c7320b9b74227d6f31e662e0e123d0457206b09a7ea
    user: "${PUID}:${PGID}"
    depends_on:
      init:
        condition: service_completed_successfully
    environment:
      # 官方镜像需要显式确认 qBittorrent 的法律提示，才能启动。
      QBT_LEGAL_NOTICE: confirm
      QBT_TORRENTING_PORT: "51413"
      QBT_WEBUI_PORT: "8080"
      TZ: ${TZ}
      # 只供核心检查识别应用的信任配置；实际白名单由 init 写入 qBittorrent.conf。
      WONTON_CORE_ADDRESS: "${WONTON_CORE_ADDRESS}"
    volumes:
      - ${WONTON_APP_DATA}/config:/config
      # 备用 WebUI 的静态文件，由 init 服务放进数据目录；应用只读。
      - ${WONTON_APP_DATA}/vuetorrent:/vuetorrent:ro
      - ${WONTON_SHARE_DOWNLOADS}:/downloads
    read_only: true
    tmpfs:
      - /tmp
    stop_grace_period: 30m
    healthcheck:
      # 根页面不需要应用会话；检查 WebUI 已真正监听并能返回页面。
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--max-time", "5", "-o", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      start_interval: 1s

configs:
  config_seed:
    file: config/qBittorrent.conf
  config_init:
    file: config/init.sh

x-wonton:
  spec: "0.17"
  id: org.qbittorrent.qbittorrent
  # 向其他插件提供下载器能力：经核心网络别名 torrent_client.wonton.internal 转发的
  # qBittorrent Web API v2（/api/v2/）请求免凭据（认证白名单只放核心地址）。
  provides:
    torrent_client: { service: qbittorrent, port: 8080 }
  version: 0.3.2
  kind: app
  title: { en: "qBittorrent" }
  subtitle: { zh: "BT 下载", en: "Torrent Downloader", zh-Hant: "BT 下載", ja: "トレントダウンローダー" }
  description:
    zh: 像迅雷：贴上磁力链接或种子文件就开始下载，下完自动存进共享文件夹 downloads，并在云吞私聊里通知你。手机上的界面也好用。
    en: "Like a download manager on your home server: paste a magnet link or add a .torrent file, and it downloads into the downloads shared folder and lets you know in Wonton when it's done. The interface works well on phones too."
    zh-Hant: 像迅雷：貼上磁力連結或種子檔就開始下載，下完自動存進共享資料夾 downloads，並在雲吞私聊裡通知你。手機上的介面也好用。
    ja: 迅雷のようなものです。マグネットリンクや .torrent ファイルを入れるとダウンロードが始まり、完了すると共有フォルダ downloads に保存され、Wonton のチャットで知らせます。スマホでも操作しやすい画面です。
  icon: icon.svg
  notices: [NOTICE]
  screenshots: [screenshots/home.png]
  author: { name: geraldpeng6, url: https://github.com/geraldpeng6 }
  homepage: https://www.qbittorrent.org
  license: GPL-2.0-or-later
  tags:
    zh: [下载, BT]
    en: [Downloads, BitTorrent]
  setup:
    zh: 打开就用，不用登录；贴磁力链接或加种子文件就开始下载。下载完成的通知发到你的 Wonton 私聊，收件人只能填家里人的地址。界面可以加到手机主屏当应用用。
    en: Open and use it — no login. Paste a magnet link or add a torrent file to start. Completion notices arrive in your Wonton chat, and recipients can only be household addresses. The interface can be added to your phone's home screen as an app.
    zh-Hant: 開啟就用，不用登入；貼磁力連結或加種子檔就開始下載。下載完成的通知發到你的 Wonton 私聊，收件人只能填家裡人的位址。介面可以加到手機主畫面當應用用。
    ja: 開けば使え、ログインは不要です。マグネットリンクまたはトレントファイルを入れると始まります。完了通知は Wonton チャットに届き、宛先は家族のアドレスだけです。画面はスマホのホーム画面にアプリとして追加できます。
  about:
    zh: |
      完整的 BT 下载器：添加磁力链接或种子文件，查看速度和进度，管理等待队列。

      界面是轻快的手机版，设置里可以切回原版界面。下载内容默认写入共享文件夹 downloads。

      网页只从云吞进来，不用再登一次；局域网里只开放下载本身要用的连接，网页不直接露在外面。下载完成会发一封通知，经云吞的内部信箱转进你的 Wonton 私聊。
    en: |
      A full BitTorrent client: add magnet links or torrent files, watch progress and speed, and manage the queue.

      The interface is a light mobile-friendly one; you can switch back to the stock UI in the settings. Downloads go to the downloads shared folder by default.

      The web page comes in through Wonton only, with no second login; on the LAN only the port BitTorrent itself needs is open, and the web page stays private. Completion notices go through Wonton's internal mailbox into your Wonton chat.
    zh-Hant: |
      完整的 BT 下載器：新增磁力連結或種子檔，查看速度和進度，管理等待佇列。

      介面是輕快的手機版，設定裡可以切回原版介面。下載內容預設寫入共享資料夾 downloads。

      網頁只從雲吞進來，不用再登一次；區域網路裡只開放下載本身要用的連線，網頁不直接露在外面。下載完成會寄一封通知，經雲吞的內部信箱轉進你的 Wonton 私聊。
    ja: |
      本格的な BitTorrent クライアントです。マグネットリンクやトレントファイルを追加し、速度と進捗を見て、待ち行列を管理します。

      画面は軽快なスマホ向けで、設定から元の画面に戻せます。ダウンロードは既定で共有フォルダ downloads に保存されます。

      Web ページは Wonton 経由でしか来ず、追加のログインはありません。LAN ではトレント自身に必要なポートだけを開き、Web ページは外に出しません。完了通知は Wonton の内部メールボックスを通ってチャットに届きます。
  release_notes:
    zh: |
      插件包迁入官方插件合仓，内容与上一版相同。

      商店介绍重写：下载和通知用法移到「安装后要做的事」，PWA、WebUI、端口等说法换成日常用语；补繁体中文和日文。
    en: |
      Package moved into the official Wonton plugin monorepo; same content as the previous release.

      Store copy rewritten: downloading and notification usage moved to the pre-install notice, with PWA/WebUI/port wording in everyday words; Traditional Chinese and Japanese added.
    zh-Hant: "外掛包遷入官方外掛合倉，內容與上一版相同。\n\n商店介紹重寫：下載和通知用法移到「安裝後要做的事」，PWA、WebUI、連接埠等說法換成日常用語；補繁體中文和日文。"
    ja: "プラグインを公式プラグインリポジトリへ移動しました。内容は前版と同じです。\n\nストア紹介を書き直し、ダウンロードと通知の使い方を「インストール後の手順」に移し、PWA・WebUI・ポートなどの言い方を日常的な言葉にしました。繁体字中国語と日本語を追加。"
  webui:
    service: qbittorrent
    port: 8080
    # qBittorrent 不识别 Remote-User；这里用 proxy 只为了获得稳定的 WONTON_CORE_ADDRESS，真正的免登录由 IP 白名单完成。
    sso: proxy
    proxy:
      headers:
        Remote-User: "{user}"
  lan:
    ports:
      - { service: qbittorrent, port: 51413 }
      - { service: qbittorrent, port: 51413, protocol: udp }
  permissions:
    - storage.share.downloads:write
    - notify
    - owner.identity
    - network.egress
    - network.lan
  requirements:
    arch: [amd64, arm64]
