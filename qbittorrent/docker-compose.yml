# qBittorrent：经云吞网关打开 WebUI，把 BT 下载写入共享文件夹 downloads。
services:
  init:
    image: qbittorrentofficial/qbittorrent-nox:5.3.0-2@sha256:43b2d352cf76330a7ca34c7320b9b74227d6f31e662e0e123d0457206b09a7ea
    user: "${PUID}:${PGID}"
    entrypoint: ["/bin/sh", "/seed/init.sh"]
    environment:
      # 核心地址固定在插件网络的末端；只让网关来源免登录。
      WONTON_CORE_ADDRESS: "${WONTON_CORE_ADDRESS:?核心没有注入核心地址}"
      # 下载完成的通知邮件经核心的内部邮箱发信，转进收件人的 Wonton 私聊；收件人默认是主人（owner.identity）。
      WONTON_SMTP_HOST: "${WONTON_SMTP_HOST:?核心没有注入发信服务器}"
      WONTON_SMTP_PORT: "${WONTON_SMTP_PORT:?核心没有注入发信端口}"
      WONTON_MAIL_FROM: "${WONTON_MAIL_FROM:?核心没有注入发件地址}"
      WONTON_OWNER_EMAIL: "${WONTON_OWNER_EMAIL:?核心没有注入主人邮箱}"
      # VueTorrent 官方发版，版本号与 zip 的 sha256 写死在这里。Dependabot 认不出这个变量，
      # 升级时一起改两行，地址形如 https://github.com/VueTorrent/VueTorrent/releases/download/<版本>/vuetorrent.zip。
      VUETORRENT_VERSION: "v2.36.1"
      VUETORRENT_SHA256: "70b67531f0f3bc36c8bd05d82cc7ba1ee37c71c17f0b6c45f522200e35e66f37"
    volumes:
      - ${WONTON_APP_DATA}/config:/config
      - ${WONTON_APP_DATA}/vuetorrent:/vuetorrent
    configs:
      - source: config_seed
        target: /seed/qBittorrent.conf
      - source: config_init
        target: /seed/init.sh
    restart: "no"

  qbittorrent:
    image: qbittorrentofficial/qbittorrent-nox:5.3.0-2@sha256:43b2d352cf76330a7ca34c7320b9b74227d6f31e662e0e123d0457206b09a7ea
    user: "${PUID}:${PGID}"
    depends_on:
      init:
        condition: service_completed_successfully
    environment:
      # 官方镜像需要显式确认 qBittorrent 的法律提示，才能启动。
      QBT_LEGAL_NOTICE: confirm
      QBT_TORRENTING_PORT: "51413"
      QBT_WEBUI_PORT: "8080"
      TZ: ${TZ}
      # 只供核心检查识别应用的信任配置；实际白名单由 init 写入 qBittorrent.conf。
      WONTON_CORE_ADDRESS: "${WONTON_CORE_ADDRESS}"
    volumes:
      - ${WONTON_APP_DATA}/config:/config
      # 备用 WebUI 的静态文件，由 init 服务放进数据目录；应用只读。
      - ${WONTON_APP_DATA}/vuetorrent:/vuetorrent:ro
      - ${WONTON_SHARE_DOWNLOADS}:/downloads
    read_only: true
    tmpfs:
      - /tmp
    stop_grace_period: 30m
    healthcheck:
      # 根页面不需要应用会话；检查 WebUI 已真正监听并能返回页面。
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--max-time", "5", "-o", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      start_interval: 1s

configs:
  config_seed:
    file: config/qBittorrent.conf
  config_init:
    file: config/init.sh

x-wonton:
  spec: "0.11"
  id: org.qbittorrent.qbittorrent
  # 向其他插件提供下载器能力：经核心网络别名 torrent_client.wonton.internal 转发的
  # qBittorrent Web API v2（/api/v2/）请求免凭据（认证白名单只放核心地址）。
  provides:
    torrent_client: { service: qbittorrent, port: 8080 }
  version: 0.3.1
  kind: app
  title: { zh: BT 下载器（qBittorrent）, en: Torrent Downloader (qBittorrent) }
  description:
    zh: 像迅雷：贴上磁力链接或种子文件就开始下载，下完自动存进共享文件夹 downloads，并在云吞私聊里通知你。手机上的界面也好用。
    en: "Like uTorrent on your home server: paste a magnet link or add a .torrent file, and it downloads into the downloads shared folder and lets you know in Wonton when it's done. The interface works well on phones too."
  icon: icon.svg
  notices: [NOTICE]
  screenshots: [screenshots/home.png]
  author: { name: geraldpeng6, url: https://github.com/geraldpeng6 }
  homepage: https://www.qbittorrent.org
  license: GPL-2.0-or-later
  tags:
    zh: [下载, BT]
    en: [Downloads, BitTorrent]
  about:
    zh: |
      qBittorrent 是一个完整的 BT 下载器：添加磁力链接或种子文件，查看速度和进度，管理队列。

      界面是 VueTorrent，手机上好用，可以安装成 PWA；设置里可以切回 qBittorrent 原版界面。下载内容默认写入共享文件夹 downloads。网页经云吞网关打开，网关所在网络免 qBittorrent 登录；局域网只开放 BT 连接端口，WebUI 不直接暴露。下载完成会发一封通知邮件，经云吞的内部邮箱转进你的 Wonton 私聊；收件人只能填家里人的内部邮箱，外部地址发不出去。
    en: |
      qBittorrent is a full BitTorrent client: add magnet links or torrent files, watch progress and speed, and manage the queue.

      The interface is VueTorrent — mobile friendly and installable as a PWA; you can switch back to the stock qBittorrent UI in its settings. Downloads go to the downloads shared folder by default. The WebUI is opened through the Wonton gateway, which is trusted without a second qBittorrent login; only the BitTorrent port is exposed on the LAN. When a download finishes, a notification email is delivered to your Wonton chat via the internal mailbox; recipients must be household internal addresses — external ones are rejected.
  release_notes: { zh: 插件包迁入官方插件合仓，内容与上一版相同。, en: "Package moved into the official Wonton plugin monorepo; same content as the previous release." }
  webui:
    service: qbittorrent
    port: 8080
    # qBittorrent 不识别 Remote-User；这里用 proxy 只为了获得稳定的 WONTON_CORE_ADDRESS，真正的免登录由 IP 白名单完成。
    sso: proxy
    proxy:
      headers:
        Remote-User: "{user}"
  lan:
    ports:
      - { service: qbittorrent, port: 51413 }
      - { service: qbittorrent, port: 51413, protocol: udp }
  permissions:
    - storage.share.downloads:write
    - notify
    - owner.identity
    - network.egress
    - network.lan
  requirements:
    arch: [amd64, arm64]
