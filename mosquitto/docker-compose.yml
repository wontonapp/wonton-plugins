# Mosquitto：家庭消息服务器，智能设备和其他插件经它互传消息。上游 EPL-2.0 OR BSD-3-Clause，
# 镜像按清单列表（index）的摘要固定；官方镜像自带 mosquitto_pub/sub/passwd，健康检查和口令初始化都不用另起镜像。
services:
  # 一次性服务：先于 broker 生成口令文件（health 是健康检查专用账号，主人账号给局域网设备和详情页显示）。
  # mosquitto_passwd 不带 -c 时对已有用户改口令、没有的用户新增，重跑幂等。
  init:
    image: eclipse-mosquitto:2.1.2-alpine@sha256:75d6662dee52c947dc9dd9c29f1d8d7ffef78ddaf38001caa09755681e8bbc98
    user: "1883:1883"
    entrypoint: ["/bin/sh", "/init/passwd.sh"]
    environment:
      WONTON_SECRET_HEALTH_PASSWORD: ${WONTON_SECRET_HEALTH_PASSWORD}
      WONTON_SECRET_CLIENT_PASSWORD: ${WONTON_SECRET_CLIENT_PASSWORD}
      WONTON_OWNER_NAME: ${WONTON_OWNER_NAME:?核心没有注入用户名}
    volumes:
      - ${WONTON_APP_DATA}:/mosquitto/data
    configs:
      - source: passwd-init
        target: /init/passwd.sh
    network_mode: none
    restart: "no"

  mosquitto:
    image: eclipse-mosquitto:2.1.2-alpine@sha256:75d6662dee52c947dc9dd9c29f1d8d7ffef78ddaf38001caa09755681e8bbc98
    # 官方镜像内置 1883:1883 的 mosquitto 用户；数据目录由核心按这个属主交给容器，直接以它写持久化。
    user: "1883:1883"
    read_only: true
    # 日志走 stdout；镜像声明了 VOLUME /mosquitto/log，用 tmpfs 顶住，避免每次重建留下匿名卷。
    # mosquitto_passwd 改口令文件时在 /tmp 建临时文件（mpw_tmpfile），只读根文件系统要给它一块可写的 /tmp。
    tmpfs:
      - /mosquitto/log
      - /tmp
    environment:
      # 健康检查在容器内用 health 账号订阅 $SYS；口令不进配置文件，也不进镜像。
      WONTON_SECRET_HEALTH_PASSWORD: ${WONTON_SECRET_HEALTH_PASSWORD}
    volumes:
      - ${WONTON_APP_DATA}:/mosquitto/data
    configs:
      - source: mosquitto-conf
        target: /mosquitto/config/mosquitto.conf
    depends_on:
      init:
        condition: service_completed_successfully
    healthcheck:
      # $SYS/broker/uptime 是保留消息（retain），订阅立即收到一条；-W 限时退出。
      test: ["CMD-SHELL", "mosquitto_sub -h 127.0.0.1 -p 1883 -u health -P \"$$WONTON_SECRET_HEALTH_PASSWORD\" -t '$$SYS/broker/uptime' -C 1 -W 8"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      start_interval: 1s

configs:
  mosquitto-conf:
    file: mosquitto.conf
  passwd-init:
    file: passwd-init.sh

x-wonton:
  spec: "0.11"
  id: org.eclipse.mosquitto
  version: 0.1.2
  kind: app
  title: { zh: "设备消息中转（Mosquitto）", en: "Device Message Relay (Mosquitto)", zh-Hant: "裝置訊息中轉（Mosquitto）", ja: "機器メッセージ中継（Mosquitto）" }
  description:
    zh: 像家里的邮局：智能设备发来的消息经它送到各个软件，软件的指令也经它送回设备。
    en: "A post office for your smart home: messages from devices are carried to your apps, and commands are carried back."
    zh-Hant: 像家裡的郵局：智慧裝置發來的訊息經它送到各個軟體，軟體的指令也經它送回裝置。
    ja: 家の中の郵便局のようなものです。機器からのメッセージを各アプリに届け、アプリの指示を機器へ送り返します。
  icon: icon.svg
  notices: [NOTICE]
  author: { name: geraldpeng6, url: https://github.com/geraldpeng6 }
  homepage: https://mosquitto.org
  # 上游应用的许可证；插件包自己的许可证在仓库 LICENSE 里（MIT）。
  license: EPL-2.0 OR BSD-3-Clause
  tags:
    zh: [智能家居, 工具]
    en: [Home, Tools]
  about:
    zh: |
      智能设备（ESP 开发板、网关）和 Zigbee2MQTT、ESPHome、Home Assistant、Node-RED 这类软件之间互传消息，都经过它。

      装好就能用，由别的软件和设备来连；地址和账号都在插件详情里。
    en: |
      Smart devices (ESP boards, gateways) and apps like Zigbee2MQTT, ESPHome, Home Assistant and Node-RED all exchange messages through it.

      Ready to use out of the box — other apps and devices do the connecting, and the address and account are in the plugin details.
    zh-Hant: |
      智慧裝置（ESP 開發板、閘道）和 Zigbee2MQTT、ESPHome、Home Assistant、Node-RED 這類軟體之間互傳訊息，都經過它。

      裝好就能用，由別的軟體和裝置來連；位址和帳號都在外掛詳情裡。
    ja: |
      スマート機器（ESP ボード、ゲートウェイ）と Zigbee2MQTT、ESPHome、Home Assistant、Node-RED などのアプリの間のメッセージは、すべてこれを通ります。

      導入すればすぐ使え、つなぐのは他のアプリや機器側です。アドレスとアカウントはプラグイン詳細にあります。
  setup:
    zh: 它没有自己的网页。连家里的设备或软件：在插件详情里打开「在局域网开放」，把显示出来的地址和账号填进去。
    en: It has no web page of its own. To connect devices or apps at home, turn on "Open on LAN" in the plugin details and enter the address and account shown there.
    zh-Hant: 它沒有自己的網頁。連家裡的裝置或軟體：在外掛詳情裡開啟「在區域網路開放」，把顯示出來的位址和帳號填進去。
    ja: 専用の Web ページはありません。家の機器やアプリをつなぐには、プラグイン詳細で「LAN で公開」をオンにし、表示されるアドレスとアカウントを入力します。
  release_notes:
    zh: |
      插件包迁入官方插件合仓，内容与上一版相同。

      商店介绍重写：把连接步骤收进「安装后要做的事」，去掉和说明重复的一段；补繁体中文和日文。
    en: |
      Package moved into the official Wonton plugin monorepo; same content as the previous release.

      Store copy rewritten: the connection steps moved to the pre-install notice and a duplicated paragraph dropped; Traditional Chinese and Japanese added.
    zh-Hant: "外掛包遷入官方外掛合倉，內容與上一版相同。\n\n商店介紹重寫：把連線步驟收進「安裝後要做的事」，去掉和說明重複的一段；補繁體中文和日文。"
    ja: "プラグインを公式プラグインリポジトリへ移動しました。内容は前版と同じです。\n\nストア紹介を書き直し、接続の手順を「インストール後の手順」にまとめ、重複した段落を削りました。繁体字中国語と日本語を追加。"
  # 局域网设备（ESP 开发板、网关）直连 1883；账号在详情页显示，默认不开。
  lan:
    ports:
      - { service: mosquitto, port: 1883 }
    client:
      address: "mqtt://{host}:1883"
      username: "{user}"
      password: "{secret:client_password}"
  secrets:
    client_password:
      generate: { bytes: 32 }
    health_password:
      generate: { bytes: 32 }
  permissions:
    # 在局域网上开放 1883 端口。
    - network.lan
    # 主人账号按注入的用户名建。
    - owner.identity
  # 上游没写最低内存；镜像 amd64 和 arm64 都有（docker-library/official-images 的 eclipse-mosquitto 条目）。
  requirements:
    arch: [amd64, arm64]
    memory: 64M
