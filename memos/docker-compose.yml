name: memos

services:
  # 以非 root 跑 Memos，数据目录归用户。旧版本或外部改过的数据可能是别的属主，先统一成运行用户；
  # 每次创建容器都跑一遍，幂等。
  chown:
    image: neosmemo/memos:26.11.0@sha256:087e7dc6b76b31fcd1107a5767398b2a310ced209adb791efd8760c745dc8034
    user: "0:0"
    entrypoint: ["/bin/sh", "-c", "chown -R ${PUID}:${PGID} /var/opt/memos"]
    volumes:
      - ${WONTON_APP_DATA}/data:/var/opt/memos
    network_mode: none
    restart: "no"

  memos:
    user: "${PUID}:${PGID}"
    depends_on:
      chown:
        condition: service_completed_successfully
    image: neosmemo/memos:26.11.0@sha256:087e7dc6b76b31fcd1107a5767398b2a310ced209adb791efd8760c745dc8034
    environment:
      MEMOS_INSTANCE_URL: ${WONTON_APP_URL}
      MEMOS_PORT: "5230"
      # 声明式配置只引用变量名，值由核心注入。
      WONTON_OWNER_NAME: ${WONTON_OWNER_NAME}
      # 声明式配置里的 ${env:…} 必须占满整个值，资源名这类拼起来的串在这里拼好。
      MEMOS_CONFIG_USER_NAME: "users/${WONTON_OWNER_NAME}"
      MEMOS_CONFIG_LINKED_NAME: "users/${WONTON_OWNER_NAME}/linkedIdentities/wonton"
      WONTON_OWNER_EMAIL: ${WONTON_OWNER_EMAIL}
      # 通知邮件的 SMTP：声明式配置引用 HOST 和 MAIL_FROM；PORT 是 proto 整数字段，${env:} 只能替换成
      # 字符串，配置里写死 25（核心约定的端口）。
      WONTON_SMTP_HOST: ${WONTON_SMTP_HOST}
      WONTON_SMTP_PORT: ${WONTON_SMTP_PORT}
      WONTON_MAIL_FROM: ${WONTON_MAIL_FROM}
      WONTON_OIDC_CLIENT_ID: ${WONTON_OIDC_CLIENT_ID}
      WONTON_OIDC_CLIENT_SECRET: ${WONTON_OIDC_CLIENT_SECRET}
      WONTON_OIDC_AUTH_URL: ${WONTON_OIDC_AUTH_URL}
      WONTON_OIDC_TOKEN_URL: ${WONTON_OIDC_TOKEN_URL}
      WONTON_OIDC_USERINFO_URL: ${WONTON_OIDC_USERINFO_URL}
      WONTON_SECRET_OWNER_PASSWORD: ${WONTON_SECRET_OWNER_PASSWORD}
    volumes:
      - ${WONTON_APP_DATA}/data:/var/opt/memos
    configs:
      - source: config
        target: /etc/memos/config/wonton.json
    healthcheck:
      # 数据库在 /healthz 里被探活；配置应用失败时进程起不来，这里也失败。
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:5230/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
      start_interval: 1s

  # 一次性服务：用声明式配置建好的主人账号签 MCP 令牌，MCP 需要带令牌才能调工具。
  init:
    image: curlimages/curl:8.23.0@sha256:3fb7e13e5d179a845c97d78204f3f1064d1907037f26a3ebf91710571151fd93
    entrypoint: ["/bin/sh", "/init.sh"]
    user: "${PUID}:${PGID}"
    environment:
      WONTON_OWNER_NAME: ${WONTON_OWNER_NAME}
      WONTON_SECRET_OWNER_PASSWORD: ${WONTON_SECRET_OWNER_PASSWORD}
    volumes:
      - ${WONTON_APP_DATA}/bridge:/bridge
    configs:
      - source: init
        target: /init.sh
    depends_on:
      memos:
        condition: service_healthy
    restart: "no"

  # MCP 的入口：核心的 MCP 总线不带凭据，这里替它加上用户账号的令牌。
  mcp:
    image: nginx:1.31.8-alpine@sha256:fed7e14be83cbd2661a75cdc5b872d936cf155d46c327084d30b8df19ae88d72
    user: "${PUID}:${PGID}"
    read_only: true
    # 只读根文件系统下还要有地方写 pid 和请求体临时文件：run 目录归运行用户，临时文件放 /dev/shm（1777 的 tmpfs，
    # 容量给到和请求体上限一样）。
    shm_size: 256m
    volumes:
      - ${WONTON_APP_DATA}/bridge:/etc/nginx/conf.d:ro
      - ${WONTON_APP_DATA}/run:/run
    depends_on:
      init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      start_interval: 1s

configs:
  config:
    file: config/wonton.json
  init:
    file: config/init.sh

x-wonton:
  spec: "0.17"
  id: com.usememos.memos
  version: 0.1.6
  kind: app
  title: { en: "Memos" }
  subtitle: { zh: "速记本", en: "Quick Notes", zh-Hant: "速記本", ja: "クイックメモ" }
  description:
    zh: 像给自己发朋友圈：想到什么随手记一条，笔记、日记、待办都行，打个标签，以后一搜就到。最轻巧，不用想放哪个文件夹。
    en: "Like posting to a private feed: jot down a thought, diary entry or to-do in seconds, tag it, and search finds it later. The lightest note app — no folders to think about."
    zh-Hant: 像給自己發朋友圈：想到什麼隨手記一條，筆記、日記、待辦都行，打個標籤，以後一搜就到。最輕巧，不用想放哪個資料夾。
    ja: 自分だけのタイムラインへの投稿のようなものです。思いついたことをメモ・日記・ToDo としてすぐ書き、タグを付ければ後で検索で見つかります。フォルダを考えなくていい、最も軽いメモアプリです。
  icon: icon.png
  notices: [NOTICE]
  screenshots:
    - screenshots/memos.png
    - screenshots/search.png
    - screenshots/tags.png
    - screenshots/todo.png
  author: { name: geraldpeng6, url: https://github.com/geraldpeng6 }
  homepage: https://usememos.com
  license: MIT
  tags:
    zh: [笔记]
    en: [Notes]
  setup:
    zh: 打开就用云吞账号登录，不用注册；默认只有你看得到。
    en: Opening the page signs you in with your Wonton account — no sign-up. Only you can see your notes by default.
    zh-Hant: 開啟就用雲吞帳號登入，不用註冊；預設只有你看得到。
    ja: 開けば Wonton アカウントでサインインでき、登録は不要です。既定では自分だけが見られます。
  about:
    zh: |
      随手记笔记、写日记、列待办，打上标签，之后全文搜索。默认只有你看得到，也可以逐条公开或按链接分享。

      助手也能搜、能新建和追加笔记，看到的就是你自己看得到的。

      网站自动通知、链接预览和语音转文字要连外网才能用，笔记本身不受影响。

      有人评论、提到你时，通知信会出现在你的 Wonton 私聊里；信只能发给家里的人。

      云吞更新后插件会自动重建，打开照常，不用重装。
    en: |
      Jot down notes, keep a journal, list todos, tag them and search everything later. Notes stay private by default; you can make one public or share it by link.

      The assistant can search, create and append notes, and sees exactly what you see.

      Site notifications, link previews and speech-to-text need the internet; notes work offline.

      Notification emails for comments and mentions arrive in your Wonton chat; mail only reaches people in your household.

      After a Wonton update the plugin is rebuilt automatically; pages open as before, with nothing to reinstall.
    zh-Hant: |
      隨手記筆記、寫日記、列待辦，打上標籤，之後全文搜尋。預設只有你看得到，也可以逐條公開或按連結分享。

      助手也能搜、能新建和追加筆記，看到的就是你自己看得到的。

      網站自動通知、連結預覽和語音轉文字要連外網才能用，筆記本身不受影響。

      有人留言、提到你時，通知信會出現在你的 Wonton 私聊裡；信只能發給家裡的人。

      雲吞更新後外掛會自動重建，開啟照常，不用重裝。
    ja: |
      メモ・日記・ToDo をすぐ書き、タグを付け、後で全文検索できます。既定では自分のみが見られ、個別に公開したりリンクで共有したりできます。

      アシスタントも検索・作成・追記ができ、自分に見えるものだけを見ます。

      サイトの通知・リンクプレビュー・音声入力にはインターネットが必要ですが、メモ自体は使えます。

      コメントやメンションの通知メールは Wonton チャットに届き、メールは家族にしか届きません。

      Wonton の更新後はプラグインが自動で作り直され、これまで通り開けます。入れ直す必要はありません。
  release_notes:
    zh: |
      在插件详情页的「谁能打开这个应用」里勾上「家人」后，家人第一次打开会自动建各自的账号；需要管理笔记时，主人可在应用里把家人设为管理员。

      修复自动重新登录：会话过期后打开速记本，现在能自己登录回来，不再停在报错页。

      商店介绍重写：登录说明移到「安装后要做的事」，Webhook、容器等说法换成日常用语；补繁体中文和日文。
    en: |
      After you tick “Family” under “Who can open this app” in the plugin detail page, members get their own account the first time they open Memos; the owner can promote them to administrator in the app when needed.

      Fixed automatic re-login: when a session expires, Memos signs you back in by itself instead of stopping at an error page.

      Store copy rewritten: the sign-in note moved to the pre-install notice, with webhook/container wording in everyday words; Traditional Chinese and Japanese added.
    zh-Hant: "在外掛詳情頁的「誰能開啟這個應用」裡勾上「家人」後，家人第一次開啟會自動建立各自的帳號；需要管理筆記時，主人可在應用裡把家人設為管理員。\n\n修復自動重新登入：會話過期後開啟速記本，現在能自己登入回來，不再停在報錯頁。\n\n商店介紹重寫：登入說明移到「安裝後要做的事」，Webhook、容器等說法換成日常用語；補繁體中文和日文。"
    ja: "プラグイン詳細ページの「このアプリを開ける人」で「家族」にチェックすると、家族が初めて開いたときに各自のアカウントが自動で作られます。メモの管理が必要なときは、オーナーがアプリ内で家族を管理者にできます。\n\n自動再ログインを修正しました。セッションが切れた後にメモを開いても、エラー画面で止まらず自分でログインし直せます。\n\nストア紹介を書き直し、サインインの説明を「インストール後の手順」に移し、Webhook やコンテナなどの言い方を日常的な言葉にしました。繁体字中国語と日本語を追加。"
  webui:
    service: memos
    port: 5230
    accounts: per_user
    sso: oidc
    oidc:
      redirect_paths: [/auth/callback]
      # 上游换令牌用 golang.org/x/oauth2 的 AuthStyleAutoDetect：先试 client_secret_basic，出错改用
      # client_secret_post 重试。经核心网关转发时 basic 那一跳会失败，登记成 post 才能让上游的重试被签发方接受。
      token_endpoint_auth_method: client_secret_post
  mcp:
    service: mcp
    port: 8080
    transport: streamable-http
  secrets:
    owner_password:
      generate: { bytes: 32 }
      # /auth/admin 的 Memos 密码表单用这个密码；不给主人看就填不出来。
      show_owner: { label: { zh: 管理员密码, en: Admin password } }
  permissions:
    - owner.identity
    # MCP 工具（PAT 侧车）经核心总线暴露给 Bot；规范 0.11 起只有声明 tools 权限的插件才注入 WONTON_MCP_URL。
    - tools
    # 收件箱通知邮件（评论、提及）经核心的内部邮箱发信。
    - notify
    # Webhook 推送、链接预览、AI 语音转写都要从容器里访问外网；插件内部互访核心已放进 NO_PROXY。
    - network.egress
  # 上游没写最低内存；本机空闲实测约 49M，取 128M。镜像支持 amd64 和 arm64（docker manifest inspect）。
  requirements:
    arch: [amd64, arm64]
    memory: 128M
