# Flood：经云吞网关打开的种子下载前端，经 torrent_client 能力连接 qBittorrent 插件。
services:
  flood:
    # 上游官方镜像（https://github.com/jesec/flood，Docker Hub jesec/flood），摘要按清单列表固定。
    image: docker.io/jesec/flood:4.16.4@sha256:72bdc95ff160e1f6b8ad72c171eff53f0bab8aa651389ca710ffff170278390a
    user: "${PUID}:${PGID}"
    environment:
      FLOOD_OPTION_RUNDIR: /data
      TZ: ${TZ}
      # torrent_client 能力：核心把 <能力>.wonton.internal 转发到用户选的下载器插件（qBittorrent Web API v2），
      # 免凭据。不支持能力依赖的核心不会注入：留空时回退 flood 自带账号（sso: none）。
      WONTON_TORRENT_CLIENT_URL: "${WONTON_TORRENT_CLIENT_URL:-}"
    entrypoint:
      - /bin/sh
      - -c
      - if [ -n "$$WONTON_TORRENT_CLIENT_URL" ]; then export FLOOD_OPTION_AUTH=none FLOOD_OPTION_QBURL="$$WONTON_TORRENT_CLIENT_URL" FLOOD_OPTION_QBUSER= FLOOD_OPTION_QBPASS=; fi; exec /sbin/tini -- flood
    volumes:
      - ${WONTON_APP_DATA}/flood:/data
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      # 根页面不需要应用会话；检查 Flood 已真正监听并能返回前端页面。
      # -Y off：busybox wget 不看 no_proxy，出口代理变量存在时也会被它劫持（规范“网络”一节）。
      test: ["CMD", "wget", "-q", "-Y", "off", "-T", "5", "-O", "/dev/null", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      start_interval: 1s

x-wonton:
  spec: "0.17"
  id: app.flood.flood
  version: 0.1.3
  kind: app
  title: { en: "Flood" }
  subtitle: { zh: "种子下载面板", en: "Torrent Dashboard", zh-Hant: "種子下載面板", ja: "トレント管理画面" }
  description:
    zh: 给种子下载换个更好看的界面：任务按进度、速度、标签整理，还能订阅更新自动下载。它自己不下载，要先装 qBittorrent。
    en: "A nicer-looking dashboard for your torrent downloads: sort tasks by progress, speed and tags, and subscribe to feeds for automatic downloads. It does not download on its own — install qBittorrent first."
    zh-Hant: 給種子下載換個更好看的介面：任務按進度、速度、標籤整理，還能訂閱更新自動下載。它自己不下載，要先裝 qBittorrent。
    ja: トレントのダウンロード画面を扱いやすくします。進捗・速度・タグで整理でき、フィードを購読して自動ダウンロードもできます。自身はダウンロードしないので、先に qBittorrent を入れてください。
  icon: icon.svg
  notices: [NOTICE]
  screenshots: [screenshots/torrents.png, screenshots/details.png, screenshots/add.png]
  author: { name: geraldpeng6, url: https://github.com/geraldpeng6 }
  homepage: https://flood.js.org
  # 应用（Flood）的许可证；插件包自己的许可证写在仓库的 LICENSE 里。
  license: GPL-3.0-only
  tags:
    zh: [下载, BT]
    en: [Downloads, BitTorrent]
  setup:
    zh: |
      先装 qBittorrent 插件，再到 Flood 的设置页把「下载器」选成它：Flood 自己连上，打开免登录、直接是任务列表。不接下载器时它用自己注册的账号，第一次打开要注册。
    en: |
      Install the qBittorrent plugin first, then pick it as the downloader on Flood's settings page: Flood connects by itself and opens straight to the task list with no login. Without a downloader it falls back to its own account and asks you to register on first open.
    zh-Hant: |
      先裝 qBittorrent 外掛，再到 Flood 的設定頁把「下載器」選成它：Flood 自己連上，開啟免登入、直接是任務清單。不接下載器時它用自己註冊的帳號，第一次開啟要註冊。
    ja: |
      先に qBittorrent プラグインを入れ、Flood の設定ページで「ダウンローダー」に選びます。Flood は自動で接続し、サインインなしでタスク一覧が開きます。ダウンローダーがない場合は独自アカウントに戻り、初回に登録を求めます。
  about:
    zh: |
      Flood 给种子下载换个更好看的界面：添加磁力链接和种子文件，按进度、速度和标签整理任务，订阅更新自动下载。

      它自己不下载，需要配合下载器使用；在设置页把下载器选成 qBittorrent 插件即可，之后不用再登录一次。
    en: |
      Flood is a modern dashboard for your torrent downloads: add magnet links and torrents, sort tasks by progress, speed and tags, and subscribe to feeds for automatic downloads.

      It does not download by itself and needs a client; install the qBittorrent plugin and pick it as the downloader while installing, and there is no second login afterwards.
    zh-Hant: |
      Flood 給種子下載換個更好看的介面：新增磁力連結和種子檔案，按進度、速度和標籤整理任務，訂閱更新自動下載。

      它自己不下載，需要配合下載器使用；裝好 qBittorrent 外掛並在安裝時選它作下載器即可，之後不用再登入一次。
    ja: |
      Flood はトレントのダウンロードを見やすくする画面です。マグネットリンクやトレントを追加し、進捗・速度・タグで整理でき、フィードを購読して自動ダウンロードもできます。

      自身はダウンロードせず、クライアントが必要です。qBittorrent プラグインを入れてインストール時にダウンローダーとして選べば、あとから再サインインは不要です。
  release_notes:
    zh: |
      介绍重写：「BT 下载器」改成「种子下载」。

      商店介绍重写：从哪里选下载器改写成安装时选，登录说明移到「安装后要做的事」；补繁体中文和日文。
    en: |
      Rewritten store copy: BT downloader is now called torrent downloads in plain words.

      Store copy rewritten: picking the downloader is now described as an install-time step and the login note moved to the pre-install notice; Traditional Chinese and Japanese added.
    zh-Hant: "介紹重寫：「BT 下載器」改成「種子下載」。\n\n商店介紹重寫：從哪裡選下載器改寫成安裝時選，登入說明移到「安裝後要做的事」；補繁體中文和日文。"
    ja: "紹介を書き直し、「BT ダウンローダー」を「トレントダウンロード」に変えました。\n\nストア紹介を書き直し、ダウンローダーの選択をインストール時の手順として書き、サインインの説明を「インストール後の手順」に移しました。繁体字中国語と日本語を追加。"
  webui:
    service: flood
    port: 3000
    # Flood 不支持 OIDC 和代登录请求头。有下载器连接时用上游自带的 auth=none（免登录）；没有时保留
    # 自带账号，第一次打开在应用里注册。网关挡在前面，只有主人打得开。
    sso: none
  # RSS 订阅和按 URL 添加种子要从服务器抓取外网地址。
  permissions: [network.egress]
  # 上游没写最低内存：空闲常驻实测约 254 MB（Node 堆），取整留出工作余量。
  requirements:
    arch: [amd64, arm64]
    memory: 512M
