# Radarr：电影自动下载，网页经云吞网关访问（应用是 External 认证模式，自己不做认证，交给网关）；
# 元数据和图片要出网（network.egress）；下载完的电影从共享文件夹 downloads 导入共享文件夹 media；
# 配了 torrent_client 能力（qBittorrent Web API）时，一次性服务把它登记成下载客户端；
# 一次性服务还把 Email 通知接到核心的内部邮箱（notify），应用发的信转进收件人的 Wonton 私聊。
services:
  radarr:
    # LinuxServer.io 的 Radarr 镜像，上游安装文档指定的镜像（lscr.io/linuxserver/radarr 的 Docker Hub 名），
    # amd64 和 arm64，按清单列表（index）的摘要固定；上游 GPL-3.0-only。
    image: linuxserver/radarr:6.4.4@sha256:51a9ac2a9eb47afc833541e5fd6c11b86eb9f810694c22fa2429e3078e9194b2
    # 镜像以 root 启动再降到 PUID:PGID（LSIO 约定），数据目录由核心按默认交给 PUID:PGID。
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
      # External 是官方的反代认证模式：应用自己不做任何认证，全靠网关挡着；API 仍要求 X-Api-Key。
      RADARR__AUTH__METHOD: External
      # API key 由核心生成、随清单 secrets 注入：一次性脚本和将来的能力使用方用同一把，不用去设置页抄。
      RADARR__AUTH__APIKEY: ${WONTON_SECRET_API_KEY}
    volumes:
      - ${WONTON_APP_DATA}/config:/config
      # 和 qbittorrent 插件同名同路径，Radarr 才能从 /downloads 导入它下好的文件。
      - ${WONTON_SHARE_DOWNLOADS}:/downloads
      # 和 jellyfin 插件同名同路径，Radarr 整理好的电影 Jellyfin 直接能扫到。
      - ${WONTON_SHARE_MEDIA}:/media
    healthcheck:
      # /ping 免鉴权，且会真查一次数据库，能发现应用起没起来。
      test: ["CMD", "curl", "--noproxy", "*", "--fail", "--silent", "--show-error", "http://127.0.0.1:7878/ping"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      start_interval: 2s
    stop_grace_period: 30s

  # 一次性服务：建电影根目录 /media/movies（以 PUID:PGID 运行，目录归用户的用户），
  # 再登记成 Radarr 的根目录，加片时下拉框里直接有。目录或登记已存在就不动。
  rootfolder:
    image: linuxserver/radarr:6.4.4@sha256:51a9ac2a9eb47afc833541e5fd6c11b86eb9f810694c22fa2429e3078e9194b2
    user: "${PUID}:${PGID}"
    entrypoint: ["/bin/sh", "/rootfolder.sh"]
    environment:
      WONTON_SECRET_API_KEY: ${WONTON_SECRET_API_KEY}
    volumes:
      - ${WONTON_SHARE_MEDIA}:/media
    configs:
      - source: rootfolder
        target: /rootfolder.sh
    depends_on:
      radarr:
        condition: service_healthy
    restart: "no"

  # 一次性服务：把 torrent_client 能力（qBittorrent Web API v2）登记成 Radarr 的下载客户端。
  # 能力没接线时（wants 没有提供方）如实说明并跳过，其他功能照常。
  torrentclient:
    image: linuxserver/radarr:6.4.4@sha256:51a9ac2a9eb47afc833541e5fd6c11b86eb9f810694c22fa2429e3078e9194b2
    entrypoint: ["/bin/sh", "/torrentclient.sh"]
    environment:
      WONTON_TORRENT_CLIENT_URL: ${WONTON_TORRENT_CLIENT_URL:-}
      WONTON_SECRET_API_KEY: ${WONTON_SECRET_API_KEY}
    configs:
      - source: torrentclient
        target: /torrentclient.sh
    depends_on:
      radarr:
        condition: service_healthy
    restart: "no"

  # 一次性服务：把 Email 通知接到核心的内部邮箱，收件人是主人的内部邮箱，信转进收件人的 Wonton 私聊。
  mail:
    image: linuxserver/radarr:6.4.4@sha256:51a9ac2a9eb47afc833541e5fd6c11b86eb9f810694c22fa2429e3078e9194b2
    entrypoint: ["/bin/sh", "/mail.sh"]
    environment:
      # 缺了就装不上：notify 没给 SMTP 三件套、owner.identity 没给收件地址，都要如实报错。
      WONTON_SMTP_HOST: ${WONTON_SMTP_HOST:?核心没有注入发信服务器}
      WONTON_SMTP_PORT: ${WONTON_SMTP_PORT:?核心没有注入发信端口}
      WONTON_MAIL_FROM: ${WONTON_MAIL_FROM:?核心没有注入发件地址}
      WONTON_OWNER_EMAIL: ${WONTON_OWNER_EMAIL:?核心没有注入主人邮箱}
      WONTON_SECRET_API_KEY: ${WONTON_SECRET_API_KEY}
    configs:
      - source: mail
        target: /mail.sh
    depends_on:
      radarr:
        condition: service_healthy
    restart: "no"

configs:
  rootfolder:
    file: scripts/rootfolder.sh
  torrentclient:
    file: scripts/torrentclient.sh
  mail:
    file: scripts/mail.sh

x-wonton:
  spec: "0.17"
  id: video.radarr.radarr
  version: 0.1.2
  kind: app
  title: { en: "Radarr" }
  subtitle: { zh: "电影下载", en: "Movie Downloads", zh-Hant: "電影下載", ja: "映画ダウンロード" }
  description:
    zh: 把想看的电影加进片单，自动搜索、下载、整理好，在 Jellyfin 里直接看
    en: Add movies to your watchlist and Radarr searches, downloads and organizes them for your media library
    zh-Hant: 把想看的電影加進片單，自動搜尋、下載、整理好，在 Jellyfin 裡直接看
    ja: 見たい映画をリストに追加すると、自動で検索・ダウンロード・整理し、Jellyfin ですぐ見られます。
  icon: icon.png
  notices: [NOTICE]
  screenshots: [screenshots/library.png, screenshots/movie.png]
  author: { name: geraldpeng6, url: https://github.com/geraldpeng6 }
  homepage: https://radarr.video
  # 应用（Radarr）的许可证；插件包自己的许可证写在仓库的 LICENSE 里。
  license: GPL-3.0-only
  tags:
    zh: [下载, 视频]
    en: [Downloads, Video]
  setup:
    zh: 第一次打开时自己定一个管理员账号和密码（之后在“设置 → 通用 → 安全”里改）。要能自动下载，先装 qBittorrent 插件，需要站点管理再装 Prowlarr。
    en: On first open, set an admin username and password of your choice (change them later under Settings → General → Security). For automatic downloads, install the qBittorrent plugin first; add Prowlarr if you want site management.
    zh-Hant: 第一次開啟時自己定一個管理員帳號和密碼（之後在「設定 → 一般 → 安全」裡改）。要能自動下載，先裝 qBittorrent 外掛，需要站點管理再裝 Prowlarr。
    ja: 初回に管理者のユーザー名とパスワードを自分で決めます（後で「設定 → 一般 → セキュリティ」で変更できます）。自動ダウンロードには先に qBittorrent プラグインを入れてください。サイト管理が必要なら Prowlarr も入れます。
  about:
    zh: |
      帮你追电影：把想看的加进片单，它会盯着资源，一有就自动下载、按电影名整理进媒体库，打开 Jellyfin 就能看，不用自己到处找种子、改名、挪文件。

      配了 qBittorrent 后下载直接进它的队列；配了 Prowlarr 后站点一处添加、自动同步过来。电影保存在家里的共享文件夹里，重装不丢。

      搜索和下载要能上网。应用的通知（电影下好了、出问题）会出现在收件人的 Wonton 私聊里；收件人只能是家里人，改成外部邮箱会发送失败。
    en: |
      Keeps an eye on the movies you want: add them to your watchlist and it automatically searches, downloads and renames them into your media library, ready to play in Jellyfin — no more hunting for torrents, renaming files or moving them by hand.

      With qBittorrent configured, downloads go straight into its queue; with Prowlarr, sites are added in one place and synced over. Movies live in your home shared folder and survive reinstalls.

      Searching and downloading need internet access. App notifications (movie downloaded, health issues) land in the recipient's Wonton chat; recipients must be household members — sending to an external address fails.
    zh-Hant: |
      幫你追電影：把想看的加進片單，它會盯著資源，一有就自動下載、按電影名整理進媒體庫，開啟 Jellyfin 就能看，不用自己到處找種子、改名、挪檔案。

      配了 qBittorrent 後下載直接進它的佇列；配了 Prowlarr 後站點一處新增、自動同步過來。電影保存在家裡的共享資料夾裡，重裝不丟。

      搜尋和下載要能上網。應用的通知（電影下好了、出問題）會出現在收件人的 Wonton 私聊裡；收件人只能是家裡人，改成外部信箱會發送失敗。
    ja: |
      見たい映画を追いかけます。リストに追加すると配信元を監視し、見つかれば自動でダウンロードして映画名でライブラリに整理し、Jellyfin ですぐ見られます。トレント探しや改名、ファイル移動は不要です。

      qBittorrent を設定してあればダウンロードはその待ち行列に入り、Prowlarr を設定してあればサイトは 1 か所で追加されて自動で同期されます。映画は家の共有フォルダに残り、入れ直しても消えません。

      検索とダウンロードにはインターネットが必要です。アプリの通知（ダウンロード完了、不具合）は受け取った人の Wonton チャットに届きます。受け取れるのは家族だけで、外部アドレスに変えると送信に失敗します。
  release_notes:
    zh: |
      插件包迁入官方插件合仓，内容与上一版相同。

      商店介绍重写：建管理员账号和装 qBittorrent 的步骤移到「安装后要做的事」，索引站等说法换成日常用语；补繁体中文和日文。
    en: |
      Package moved into the official Wonton plugin monorepo; same content as the previous release.

      Store copy rewritten: admin account creation and installing qBittorrent moved to the pre-install notice, with indexer wording in everyday words; Traditional Chinese and Japanese added.
    zh-Hant: "外掛包遷入官方外掛合倉，內容與上一版相同。\n\n商店介紹重寫：建管理員帳號和裝 qBittorrent 的步驟移到「安裝後要做的事」，索引站等說法換成日常用語；補繁體中文和日文。"
    ja: "プラグインを公式プラグインリポジトリへ移動しました。内容は前版と同じです。\n\nストア紹介を書き直し、管理者アカウントの作成と qBittorrent の導入を「インストール後の手順」に移し、インデクサなどの言い方を日常的な言葉にしました。繁体字中国語と日本語を追加。"
  webui:
    service: radarr
    port: 7878
    # 应用是 External 认证模式，打开网页不再有应用的登录页，身份由网关把关。
    sso: none
  # API key 由核心生成、保管：应用和一次性脚本经环境变量拿到同一把。
  secrets:
    api_key:
      generate: { bytes: 32 }
  # torrent_client 是软依赖：有 qBittorrent 就接上，没有也能管理片单和资料。
  wants: [torrent_client]
  provides:
    # Prowlarr 往这里同步索引器、Seerr 往这里发求片时经核心转发到这个端口。
    x-wonton.radarr: { service: radarr, port: 7878 }
  permissions:
    # 元数据来自 Radarr 的 api.radarr.video 和 TMDB 图片，要出网。
    - network.egress
    # 下载完的电影从 downloads 共享文件夹导入 media 共享文件夹。
    - storage.share.downloads:write
    - storage.share.media:write
    # 应用发的信经核心的内部 SMTP 转进收件人的 Wonton 私聊。
    - notify
    # 通知的收件地址用主人的内部邮箱（WONTON_OWNER_EMAIL）。
    - owner.identity
  requirements:
    arch: [amd64, arm64]
