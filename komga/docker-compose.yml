# Komga：漫画、漫画电子书和电子书的媒体库服务器。本地浏览器阅读、阅读进度和元数据管理。
#
# 登录走 sso: oidc：Komga 官方支持 OpenID Connect（spring.security.oauth2.client.*），
# 但它按邮箱匹配用户，且 OIDC 自动建号只会建普通用户（上游没有角色映射）。
# 所以用上游自己的首次启动接口 /api/v1/claim（网页首次创建管理员用的就是它），
# 用主人的邮箱认领管理员：OIDC 登录按邮箱落到这个管理员账号上，打开就是管理员本人。
#
# 漫画库放在共享文件夹里，只读挂载：Komga 的库里改元数据都写进自己的数据库，
# 只有“把元数据写回文件”“导入文件到库目录”这类主动开启的功能才要写库文件夹。
name: komga

services:
  komga:
    image: gotson/komga:1.30.1@sha256:d43bb3b57aeeafd274ea805214f5da71ff9306accf012fb14cc13dedc3307212
    # 上游镜像可按任意 uid 运行（官方文档用 user: "1000:1000"）。
    user: "${PUID}:${PGID}"
    environment:
      TZ: ${TZ}
      # OIDC 客户端。issuer 由核心注入，Komga 用 issuer-uri 自动发现各端点；
      # Spring 环境变量命名规则：点换下划线、去横线、转大写（上游配置文档同款）。
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_KOMGA_CLIENTID: ${WONTON_OIDC_CLIENT_ID}
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_KOMGA_CLIENTSECRET: ${WONTON_OIDC_CLIENT_SECRET}
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_KOMGA_CLIENTNAME: Komga
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_KOMGA_SCOPE: openid,profile,email
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_KOMGA_PROVIDER: komga
      SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_KOMGA_ISSUERURI: ${WONTON_OIDC_ISSUER}
      # 主人经 OIDC 登录命中认领好的管理员；家人登录时按邮箱自动建普通用户（身份提供方是核心，可开）。
      KOMGA_OAUTH2ACCOUNTCREATION: "true"
    volumes:
      - ${WONTON_APP_DATA:?核心没有注入插件数据目录}/config:/config
      - ${WONTON_SHARE_MEDIA:?核心没有注入 media 共享文件夹}:/data:ro
    healthcheck:
      # actuator health 会检查数据库，不只是进程活着。
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:25600/actuator/health"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      start_interval: 2s

  # 首次装好（库为空）时认领服务器：用主人的邮箱建管理员，密码是核心生成的随机值，
  # 之后 OIDC 按邮箱匹配到这个账号。已认领（重装保留数据、升级重建容器）就直接退出。
  init:
    image: gotson/komga:1.30.1@sha256:d43bb3b57aeeafd274ea805214f5da71ff9306accf012fb14cc13dedc3307212
    depends_on:
      komga:
        condition: service_healthy
    environment:
      CLAIM_EMAIL: ${WONTON_OWNER_EMAIL:?安装前先在 App 里填好邮箱}
      CLAIM_PASSWORD: ${WONTON_SECRET_ADMIN_PASSWORD:?核心没有注入管理员密码}
    # 镜像的 ENTRYPOINT 是 java，command 只会接到它后面：这里整体换成 sh 跑认领脚本。
    entrypoint:
      - sh
      - -ec
      - |
        claim="http://komga:25600/api/v1/claim"
        status="$$(curl -fsS "$$claim")"
        case "$$status" in
          *'"isClaimed":true'*) echo "服务器已认领，跳过：$$status"; exit 0 ;;
          *'"isClaimed":false'*) ;;
          *) echo "认领状态读不出来：$$status"; exit 1 ;;
        esac
        curl -fsS -X POST \
          -H "X-Komga-Email: $$CLAIM_EMAIL" \
          -H "X-Komga-Password: $$CLAIM_PASSWORD" \
          "$$claim" >/dev/null
        echo "已认领管理员"
    restart: "no"

x-wonton:
  spec: "0.17"
  id: app.komga.komga
  version: 0.1.3
  kind: app
  title: { en: "Komga" }
  subtitle: { zh: "漫画书库", en: "Comic Library", zh-Hant: "漫畫書庫", ja: "コミックライブラリ" }
  description:
    zh: 把家里的漫画和电子书收成书库，在手机浏览器里翻页阅读，看到哪记住哪。
    en: Turn your comics and ebooks into a library and read them in the phone browser, with your place remembered.
    zh-Hant: 把家裡的漫畫和電子書收成書庫，在手機瀏覽器裡翻頁閱讀，看到哪記住哪。
    ja: 家のコミックや電子書をライブラリにまとめ、スマホのブラウザでページをめくって読み、読んだ位置を覚えます。
  icon: icon.svg
  notices: [NOTICE]
  screenshots: [screenshots/libraries.png, screenshots/series.png, screenshots/reader.png]
  author: { name: geraldpeng6, url: https://github.com/geraldpeng6 }
  homepage: https://komga.org
  license: MIT
  tags:
    zh: [阅读, 漫画]
    en: [Reading, Comics]
  setup:
    zh: 打开就用云吞账号登录，不用注册。漫画和电子书放进 media 共享文件夹，再在网页里建书库、点扫描。家人用各自的账号登录，只能看到你分享给他们的书库。
    en: Opening it signs you in with your Wonton account — no sign-up. Put comics and ebooks in the media shared folder, then create a library in the page and press scan. Family members sign in with their own accounts and only see the libraries you share with them.
    zh-Hant: 開啟就用雲吞帳號登入，不用註冊。漫畫和電子書放進 media 共享資料夾，再在網頁裡建書庫、點掃描。家人用各自的帳號登入，只能看到你分享給他們的書庫。
    ja: 開けば Wonton アカウントでサインインでき、登録は不要です。コミックや電子書は共有フォルダ media に入れ、ページでライブラリを作ってスキャンを押します。家族は各自のアカウントでサインインし、共有されたライブラリだけを見られます。
  about:
    zh: |
      把共享文件夹里的漫画和电子书扫成书库，在手机浏览器里翻页阅读、记住进度。

      能建多个书库、按系列整理、看阅读历史、自己修正作品信息。

      漫画库放在 media 共享文件夹里，插件只读不写；你改的作品信息存在插件自己的库里。
    en: |
      Scan the comics and ebooks in your shared folder into a library and read in the phone browser with progress tracking.

      Multiple libraries, series organization, reading history and editing of work details are included.

      The library lives in the media shared folder and is read-only for the plugin; the details you edit are stored in the plugin's own database.
    zh-Hant: |
      把共享資料夾裡的漫畫和電子書掃成書庫，在手機瀏覽器裡翻頁閱讀、記住進度。

      能建多個書庫、按系列整理、看閱讀歷史、自己修正作品資訊。

      漫畫庫放在 media 共享資料夾裡，外掛唯讀不寫；你改的作品資訊存在外掛自己的庫裡。
    ja: |
      共有フォルダのコミックや電子書をライブラリにスキャンし、スマホのブラウザで読んだ位置を覚えながら読み進めます。

      複数のライブラリ、シリーズ整理、閲覧履歴、作品情報の編集ができます。

      コミックは共有フォルダ media にあり、プラグインは読み取り専用です。編集した作品情報はプラグイン専用のデータベースに保存されます。
  release_notes:
    zh: |
      补充登录和数据持久化的冒烟验证。

      商店介绍重写：登录和建书库移到「安装后要做的事」，普通用户、元数据等说法换成日常用语，并加了中文标题；补繁体中文和日文。
    en: |
      Added smoke checks for sign-in and data persistence.

      Store copy rewritten: sign-in and library creation moved to the pre-install notice, with regular-user/metadata wording in everyday words and a Chinese title added; Traditional Chinese and Japanese added.
    zh-Hant: "補充登入和資料持久化的冒煙驗證。\n\n商店介紹重寫：登入和建書庫移到「安裝後要做的事」，一般使用者、中繼資料等說法換成日常用語，並加了中文標題；補繁體中文和日文。"
    ja: "ログインとデータ永続化のスモーク検証を追加しました。\n\nストア紹介を書き直し、サインインとライブラリ作成を「インストール後の手順」に移し、一般ユーザーやメタデータなどの言い方を日常的な言葉にして中国語タイトルも付けました。繁体字中国語と日本語を追加。"
  webui:
    service: komga
    port: 25600
    # 直接打开 OIDC 登录起点，跳过 Komga 自己的登录页。
    path: /oauth2/authorization/komga
    sso: oidc
    oidc:
      redirect_paths: [/login/oauth2/code/komga]
  permissions:
    - storage.share.media:read
    - owner.identity
  secrets:
    admin_password:
      generate: { bytes: 32 }
  requirements:
    arch: [amd64, arm64]
    # 上游文档：JVM 默认堆上限约 1G，内存吃紧时可用 JAVA_TOOL_OPTIONS=-Xmx 调小。
    memory: 512M
