# 镜像里同名文件的副本，只把监听端口从 80 改成 8080。oidc-relay 要在 127.0.0.1:<核心网页端口> 上转发，
# apache 是 0.0.0.0 监听，同一个 netns 里同端口不能共存（加了 SO_REUSEADDR 也不行）。核心默认端口 8480
# 撞不上 8080；核心网页端口若也填 8080，setup 会报出来。TLS 在网关上终结，443 的段照上游留着。
# 上游改这个文件（端口、新的模块段）时要跟着更新。

Listen 8080

<IfModule ssl_module>
	Listen 443
</IfModule>

<IfModule mod_gnutls.c>
	Listen 443
</IfModule>
