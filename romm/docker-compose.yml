# RomM：复古游戏库。扫描 games 共享文件夹里的 ROM，浏览器里用 EmulatorJS 直接玩。
#
# 登录全走核心的 OIDC： RomM 官方支持 OIDC（authlib 发现文档 + 授权码 + PKCE），核心的身份
# 提供方是 http，RomM 对此没有强制（源码和它自己的测试都用 http 的 issuer，docs 里
# "HTTPS is required" 指的是第三方 IdP 常见要求）。DISABLE_SETUP_WIZARD 关掉首次的本地
# 管理员向导，groups 声明把主人（["owner"]）映射成 RomM 管理员，打开网页就进应用。
# RomM 首次登录要求 ID 令牌里有 email（缺了直接 400）：云吞的 email 声明是用户的内部邮箱，恒有值。
#
# Redis 用镜像内置的 valkey（上游文档的默认做法）：不设 REDIS_HOST 时由入口脚本自己拉起，
# 数据落在挂载的 /redis-data。元数据提供方（IGDB 等）要用户自己的密钥，底座没有让用户
# 自填密钥的渠道，v0.1 一个都不配：扫描、整理、游玩照常，见 README。
services:
  romm:
    image: rommapp/romm:5.4.1@sha256:8677fb7b81b1d3db20b849e989a1dadc2a11159e51eb34a2acdcb01102274edf
    # 镜像里 /romm 归 uid 1000；整个容器以 PUID 运行，nginx/valkey/gunicorn 都跟着降权。
    user: "${PUID}:${PGID}"
    depends_on:
      db:
        condition: service_healthy
    environment:
      TZ: ${TZ}
      # MariaDB（上游文档的推荐驱动）
      ROMM_DB_DRIVER: mariadb
      DB_HOST: db
      DB_NAME: romm
      DB_USER: romm
      DB_PASSWD: ${WONTON_SECRET_DB_PASSWORD}
      # 会话签名密钥：不写的话每次启动随机生成，重启后所有会话失效。
      ROMM_AUTH_SECRET_KEY: ${WONTON_SECRET_AUTH_KEY}
      # OIDC：发现文档直接给全地址，避免依赖 authlib 的 URL 拼法。
      OIDC_ENABLED: "true"
      OIDC_AUTOLOGIN: "true"
      OIDC_PROVIDER: Wonton
      OIDC_CLIENT_ID: ${WONTON_OIDC_CLIENT_ID}
      OIDC_CLIENT_SECRET: ${WONTON_OIDC_CLIENT_SECRET}
      OIDC_REDIRECT_URI: ${WONTON_APP_URL}/api/oauth/openid
      OIDC_SERVER_METADATA_URL: ${WONTON_OIDC_ISSUER}/.well-known/openid-configuration
      # 核心的 groups 声明恒为 ["owner"]（见云吞规范）：主人进来自动建成管理员。
      OIDC_CLAIM_ROLES: groups
      OIDC_ROLE_ADMIN: owner
      OIDC_ROLE_VIEWER: owner
      # 首次打开跳过本地管理员向导，直接由 OIDC 建号（账号是主人自己，角色是管理员）。
      DISABLE_SETUP_WIZARD: "true"
      # 网页对外地址：重置链接和通知里的链接用它拼；不给的话（默认 http://0.0.0.0，不是可分享的
      # 地址）RomM 不发重置邮件，只把链接写进日志。
      ROMM_BASE_URL: ${WONTON_APP_URL}
      # 发信走核心的内部邮箱：不认证、不加密，信转进收件人的 Wonton 私聊。
      SMTP_HOST: ${WONTON_SMTP_HOST}
      SMTP_PORT: ${WONTON_SMTP_PORT}
      SMTP_FROM: ${WONTON_MAIL_FROM}
      # 核心不宣告 STARTTLS，明文直连；不填用户名密码，RomM 就跳过 login。
      SMTP_SECURITY: none
    volumes:
      # 游戏库：共享文件夹按平台子文件夹组织（如 games/gba/）；RomM 在这里建目录和收上传。
      - ${WONTON_SHARE_GAMES}:/romm/library
      - ${WONTON_APP_DATA}/assets:/romm/assets
      - ${WONTON_APP_DATA}/resources:/romm/resources
      - ${WONTON_APP_DATA}/config:/romm/config
      # 内置 valkey 的快照目录，不挂的话重建容器就丢队列和会话。
      - ${WONTON_APP_DATA}/redis:/redis-data
    healthcheck:
      # /api/heartbeat 不需要登录，后端会查一遍数据库和缓存：200 就是整条链真的可用。
      # busybox wget 不读 no_proxy，加 -Y off 防止宿主代理拦内部地址。
      test: ["CMD-SHELL", "wget -q -Y off -O /dev/null http://127.0.0.1:8080/api/heartbeat"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s
      start_interval: 5s

  db:
    image: mariadb:11.8.9@sha256:c4124d1afa875e47f2892edf26b482fa54f796e2f342d3717a04ca091a22a9bd
    environment:
      MARIADB_ROOT_PASSWORD: ${WONTON_SECRET_DB_ROOT_PASSWORD}
      MARIADB_DATABASE: romm
      MARIADB_USER: romm
      MARIADB_PASSWORD: ${WONTON_SECRET_DB_PASSWORD}
    volumes:
      - ${WONTON_APP_DATA}/db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
      start_interval: 5s

x-wonton:
  spec: "0.11"
  id: app.romm.romm
  version: 0.2.0
  kind: app
  title: { zh: 复古游戏厅（RomM）, en: Retro Game Room (RomM) }
  description:
    zh: 像网页版的怀旧游戏机：把红白机、GBA 这些老游戏的文件放进去，点开就在浏览器里玩，存档跟着账号走。
    en: "A retro console in your browser: add game files for the NES, Game Boy Advance and other classics, then play right in the browser with saves tied to your account."
  icon: icon.svg
  notices: [NOTICE]
  screenshots: [screenshots/library.png, screenshots/game.png, screenshots/search.png, screenshots/play.png]
  author: { name: geraldpeng6, url: https://github.com/geraldpeng6 }
  homepage: https://romm.app
  license: AGPL-3.0-only
  tags:
    zh: [游戏, 模拟器, 复古游戏]
    en: [Games, Emulators, Retro games]
  about:
    zh: |
      把老游戏的文件（ROM）整理成网页游戏库：扫描、搜索、看封面和介绍，点开就在浏览器里玩（游戏模拟器已内置），存档和即时存档跟着账号走。

      游戏文件放在共享文件夹 games 里，按上游 5.x 的库结构放 roms 子目录再按平台分（如 games/roms/gba/ 放 GBA 的 ROM，支持的平台见 RomM 文档）；也可以直接在网页里上传。

      登录用云吞的账号，打开就进库，不用再注册或设密码。

      应用发的信（密码重置、通知确认码）会出现在你的 Wonton 私聊里；通知渠道填云吞以外的邮箱收不到，RomM 会报发送失败。

      封面和介绍等元数据依赖 IGDB 一类的外部服务，需要用户自己的 API 密钥；本版本不预填密钥，扫描和游玩不依赖元数据。

      核心升级后，插件容器会按新的签发方自动重建，打开照常，不用重装。
    en: |
      Turn your old game files (ROMs) into a web library: scan, search, browse covers and descriptions, and play right in the browser with emulators built in. Saves and save states follow your account.

      ROM files live in the games shared folder, in a roms folder grouped by platform (e.g. games/roms/gba/ for GBA; supported platforms are listed in the RomM docs). You can also upload from the web UI.

      Sign-in uses your Wonton account; the library opens straight away, with no second sign-up or password.

      Emails the app sends (password resets, notification codes) show up in your Wonton private chat; notification channels pointed at addresses outside Wonton won't be delivered — RomM reports the failure.

      Metadata (covers, descriptions) comes from external services such as IGDB and requires your own API keys. This release ships without keys; scanning and playing work without metadata.

      After a core upgrade the plugin's containers are rebuilt with the new issuer automatically; pages open as before, with nothing to reinstall.
  release_notes:
    zh: 应用发的信（密码重置、通知确认码）走云吞的内部邮箱，出现在你的 Wonton 私聊里。
    en: Emails the app sends (password resets, notification codes) go through Wonton's internal mailbox and land in your Wonton private chat.
  webui:
    service: romm
    port: 8080
    sso: oidc
    oidc:
      redirect_paths: [/api/oauth/openid]
  secrets:
    db_password:
      generate: { bytes: 32 }
    db_root_password:
      generate: { bytes: 32 }
    auth_key:
      generate: { bytes: 32 }
  permissions:
    # 元数据提供方（IGDB、ScreenScraper、SteamGridDB 等）和它们的令牌服务在公网。
    - network.egress
    # RomM 在 games 共享文件夹里建平台目录、收网页上传。
    - storage.share.games:write
    # 应用发的信（密码重置、通知确认码）经核心的内部邮箱投递，落进收件人的 Wonton 私聊。
    - notify
  # 上游没写最低内存。单容器实测（5.4.1，空库扫描后空闲）：romm 约 654M + mariadb 约 42M，取 1G。镜像有 amd64 和 arm64。
  requirements:
    arch: [amd64, arm64]
    memory: 1G
