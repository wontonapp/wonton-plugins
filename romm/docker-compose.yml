# RomM：复古游戏库。扫描 games 共享文件夹里的 ROM，浏览器里用 EmulatorJS 直接玩。
#
# 登录全走核心的 OIDC： RomM 官方支持 OIDC（authlib 发现文档 + 授权码 + PKCE），核心的身份
# 提供方是 http，RomM 对此没有强制（源码和它自己的测试都用 http 的 issuer，docs 里
# "HTTPS is required" 指的是第三方 IdP 常见要求）。DISABLE_SETUP_WIZARD 关掉首次的本地
# 管理员向导，groups 声明把主人（["owner"]）映射成 RomM 管理员，打开网页就进应用。
# RomM 首次登录要求 ID 令牌里有 email（缺了直接 400）：云吞的 email 声明是用户的内部邮箱，恒有值。
#
# Redis 用镜像内置的 valkey（上游文档的默认做法）：不设 REDIS_HOST 时由入口脚本自己拉起，
# 数据落在挂载的 /redis-data。元数据提供方（IGDB 等）要用户自己的密钥，底座没有让用户
# 自填密钥的渠道，v0.1 一个都不配：扫描、整理、游玩照常，见 README。
services:
  romm:
    image: rommapp/romm:5.4.1@sha256:8677fb7b81b1d3db20b849e989a1dadc2a11159e51eb34a2acdcb01102274edf
    # 镜像里 /romm 归 uid 1000；整个容器以 PUID 运行，nginx/valkey/gunicorn 都跟着降权。
    user: "${PUID}:${PGID}"
    depends_on:
      db:
        condition: service_healthy
    environment:
      TZ: ${TZ}
      # MariaDB（上游文档的推荐驱动）
      ROMM_DB_DRIVER: mariadb
      DB_HOST: db
      DB_NAME: romm
      DB_USER: romm
      DB_PASSWD: ${WONTON_SECRET_DB_PASSWORD}
      # 会话签名密钥：不写的话每次启动随机生成，重启后所有会话失效。
      ROMM_AUTH_SECRET_KEY: ${WONTON_SECRET_AUTH_KEY}
      # OIDC：发现文档直接给全地址，避免依赖 authlib 的 URL 拼法。
      OIDC_ENABLED: "true"
      OIDC_AUTOLOGIN: "true"
      OIDC_PROVIDER: Wonton
      OIDC_CLIENT_ID: ${WONTON_OIDC_CLIENT_ID}
      OIDC_CLIENT_SECRET: ${WONTON_OIDC_CLIENT_SECRET}
      OIDC_REDIRECT_URI: ${WONTON_APP_URL}/api/oauth/openid
      OIDC_SERVER_METADATA_URL: ${WONTON_OIDC_ISSUER}/.well-known/openid-configuration
      # 核心的 groups 声明恒为 ["owner"]（见云吞规范）：主人进来自动建成管理员。
      OIDC_CLAIM_ROLES: groups
      OIDC_ROLE_ADMIN: owner
      OIDC_ROLE_VIEWER: owner
      # 首次打开跳过本地管理员向导，直接由 OIDC 建号（账号是主人自己，角色是管理员）。
      DISABLE_SETUP_WIZARD: "true"
      # 网页对外地址：重置链接和通知里的链接用它拼；不给的话（默认 http://0.0.0.0，不是可分享的
      # 地址）RomM 不发重置邮件，只把链接写进日志。
      ROMM_BASE_URL: ${WONTON_APP_URL}
      # 发信走核心的内部邮箱：不认证、不加密，信转进收件人的 Wonton 私聊。
      SMTP_HOST: ${WONTON_SMTP_HOST}
      SMTP_PORT: ${WONTON_SMTP_PORT}
      SMTP_FROM: ${WONTON_MAIL_FROM}
      # 核心不宣告 STARTTLS，明文直连；不填用户名密码，RomM 就跳过 login。
      SMTP_SECURITY: none
    volumes:
      # 游戏库：共享文件夹按平台子文件夹组织（如 games/gba/）；RomM 在这里建目录和收上传。
      - ${WONTON_SHARE_GAMES}:/romm/library
      - ${WONTON_APP_DATA}/assets:/romm/assets
      - ${WONTON_APP_DATA}/resources:/romm/resources
      - ${WONTON_APP_DATA}/config:/romm/config
      # 内置 valkey 的快照目录，不挂的话重建容器就丢队列和会话。
      - ${WONTON_APP_DATA}/redis:/redis-data
    healthcheck:
      # /api/heartbeat 不需要登录，后端会查一遍数据库和缓存：200 就是整条链真的可用。
      # busybox wget 不读 no_proxy，加 -Y off 防止宿主代理拦内部地址。
      test: ["CMD-SHELL", "wget -q -Y off -O /dev/null http://127.0.0.1:8080/api/heartbeat"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s
      start_interval: 5s

  db:
    image: mariadb:11.8.9@sha256:d36f18d65a0459510b8b0f643b226a6d299e3206486e2b64ff20754a6d291707
    environment:
      MARIADB_ROOT_PASSWORD: ${WONTON_SECRET_DB_ROOT_PASSWORD}
      MARIADB_DATABASE: romm
      MARIADB_USER: romm
      MARIADB_PASSWORD: ${WONTON_SECRET_DB_PASSWORD}
    volumes:
      - ${WONTON_APP_DATA}/db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
      start_interval: 5s

x-wonton:
  spec: "0.13"
  id: app.romm.romm
  version: 0.2.1
  kind: app
  title: { zh: "复古游戏厅（RomM）", en: "Retro Game Room (RomM)", zh-Hant: "復古遊戲廳（RomM）", ja: "レトロゲームルーム（RomM）" }
  description:
    zh: 像网页版的怀旧游戏机：把红白机、GBA 这些老游戏的文件放进去，点开就在浏览器里玩，存档跟着账号走。
    en: "A retro console in your browser: add game files for the NES, Game Boy Advance and other classics, then play right in the browser with saves tied to your account."
    zh-Hant: 像網頁版的懷舊遊戲機：把紅白機、GBA 這些老遊戲的檔案放進去，點開就在瀏覽器裡玩，存檔跟著帳號走。
    ja: ブラウザの中のレトロゲーム機です。ファミコンや GBA などのゲームファイルを入れれば、ブラウザですぐ遊べ、セーブはアカウントに付きます。
  icon: icon.svg
  notices: [NOTICE]
  screenshots: [screenshots/library.png, screenshots/game.png, screenshots/search.png, screenshots/play.png]
  author: { name: geraldpeng6, url: https://github.com/geraldpeng6 }
  homepage: https://romm.app
  license: AGPL-3.0-only
  tags:
    zh: [游戏, 模拟器, 复古游戏]
    en: [Games, Emulators, Retro games]
  setup:
    zh: 打开就用云吞账号登录，不用注册。游戏文件放进共享文件夹 games 的 roms 里，再按机器分文件夹（如 games/roms/gba/ 放 GBA 游戏），网页里也能直接上传。
    en: Opening the page signs you in with your Wonton account — no sign-up. Put game files under roms in the games shared folder, one folder per console (e.g. games/roms/gba/ for GBA); you can also upload from the web page.
    zh-Hant: 開啟就用雲吞帳號登入，不用註冊。遊戲檔案放進共享資料夾 games 的 roms 裡，再按主機分資料夾（如 games/roms/gba/ 放 GBA 遊戲），網頁裡也能直接上傳。
    ja: 開けば Wonton アカウントでサインインでき、登録は不要です。ゲームファイルは共有フォルダ games の roms に、機種ごとのフォルダを作って置きます（GBA なら games/roms/gba/）。Web ページからもアップロードできます。
  about:
    zh: |
      把老游戏整理成网页游戏库：扫描、搜索、看封面和介绍，点开就在浏览器里玩（游戏机已内置），存档和即时存档跟着账号走。游戏机支持哪些机型见 RomM 自己的文档。

      应用发的信（找回密码、确认码）会出现在你的 Wonton 私聊里；通知渠道填云吞以外的邮箱收不到，RomM 会报发送失败。

      封面和介绍这些资料来自外面的服务（如 IGDB），要填自己的密钥；本版本不预填，没有它也能扫描和游玩。

      云吞更新后插件会自动重建，打开照常，不用重装。
    en: |
      Turn old game files into a web library: scan, search, browse covers and descriptions, and play right in the browser with consoles built in. Saves and save states follow your account. Supported consoles are listed in RomM's own docs.

      Emails the app sends (password resets, confirmation codes) show up in your Wonton private chat; notification channels pointed at addresses outside Wonton won't be delivered — RomM reports the failure.

      Covers and descriptions come from outside services (such as IGDB) and need your own key, which this release does not prefill; scanning and playing work without it.

      After a Wonton update the plugin is rebuilt automatically; pages open as before, with nothing to reinstall.
    zh-Hant: |
      把老遊戲整理成網頁遊戲庫：掃描、搜尋、看封面和介紹，點開就在瀏覽器裡玩（遊戲機已內建），存檔和即時存檔跟著帳號走。遊戲機支援哪些機型見 RomM 自己的文件。

      應用寄的信（找回密碼、確認碼）會出現在你的 Wonton 私聊裡；通知頻道填雲吞以外的信箱收不到，RomM 會報發送失敗。

      封面和介紹這些資料來自外面的服務（如 IGDB），要填自己的密鑰；本版本不預填，沒有它也能掃描和遊玩。

      雲吞更新後外掛會自動重建，開啟照常，不用重裝。
    ja: |
      古いゲームを Web ライブラリに変えます。スキャン・検索・ジャケットや説明の閲覧ができ、機種エミュレータは内蔵されていてブラウザですぐ遊べます。セーブとセーブステートはアカウントに付きます。対応機種は RomM 自身のドキュメントにあります。

      アプリが送るメール（パスワード再設定、確認コード）は自分の Wonton チャットに届きます。Wonton 以外のアドレスを通知先にしても届かず、RomM が失敗を報告します。

      ジャケットや説明は外部サービス（IGDB など）から取得し、自分のキーが必要です。本バージョンでは未設定で、なくてもスキャンとプレイはできます。

      Wonton の更新後はプラグインが自動で作り直され、これまで通り開けます。入れ直す必要はありません。
  release_notes:
    zh: |
      主人打开网页就是管理员，保存设置、管理资料不再被拒（登录令牌里带上应用认的 owner 组）。

      应用发的信（密码重置、通知确认码）走云吞的内部邮箱，出现在你的 Wonton 私聊里。

      商店介绍重写：放游戏文件和登录移到「安装后要做的事」，ROM、IGDB、容器等说法换成日常用语；补繁体中文和日文。
    en: |
      The owner now arrives as admin — saving settings and managing content is no longer refused (the sign-in token carries the owner group again).

      Emails the app sends (password resets, notification codes) go through Wonton's internal mailbox and land in your Wonton private chat.

      Store copy rewritten: putting game files in place and signing in moved to the pre-install notice, with ROM/IGDB/container wording in everyday words; Traditional Chinese and Japanese added.
    zh-Hant: "主人開啟網頁就是管理員，儲存設定、管理資料不再被拒（登入權杖裡帶上應用認的 owner 組）。\n\n應用發的信（密碼重置、通知確認碼）走雲吞的內部郵箱，出現在你的 Wonton 私聊裡。\n\n商店介紹重寫：放遊戲檔案和登入移到「安裝後要做的事」，ROM、IGDB、容器等說法換成日常用語；補繁體中文和日文。"
    ja: "オーナーはページを開くと管理者として入り、設定の保存やコンテンツ管理が拒否されなくなります（サインインのトークンにアプリが認識する owner グループが入ります）。\n\nアプリが送るメール（パスワード再設定、通知の確認コード）は Wonton の内部メールを通り、あなたの Wonton ダイレクトメッセージに現れます。\n\nストア紹介を書き直し、ゲームファイルの配置とサインインを「インストール後の手順」に移し、ROM・IGDB・コンテナなどの言い方を日常的な言葉にしました。繁体字中国語と日本語を追加。"
  webui:
    service: romm
    port: 8080
    sso: oidc
    oidc:
      redirect_paths: [/api/oauth/openid]
      # RomM 按 ID 令牌的 groups 里有没有 owner 决定给不给管理员（OIDC_ROLE_ADMIN=owner），而核心只把清单
      # 这里声明的组名放进 groups：不声明时 OIDC 回调 403「User has not been granted any roles」，连登录都不成。
      admin_groups: [owner]
  secrets:
    db_password:
      generate: { bytes: 32 }
    db_root_password:
      generate: { bytes: 32 }
    auth_key:
      generate: { bytes: 32 }
  permissions:
    # 元数据提供方（IGDB、ScreenScraper、SteamGridDB 等）和它们的令牌服务在公网。
    - network.egress
    # RomM 在 games 共享文件夹里建平台目录、收网页上传。
    - storage.share.games:write
    # 应用发的信（密码重置、通知确认码）经核心的内部邮箱投递，落进收件人的 Wonton 私聊。
    - notify
  # 上游没写最低内存。单容器实测（5.4.1，空库扫描后空闲）：romm 约 654M + mariadb 约 42M，取 1G。镜像有 amd64 和 arm64。
  requirements:
    arch: [amd64, arm64]
    memory: 1G
