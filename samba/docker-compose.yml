# 云吞插件：Samba。镜像用上游 dockurr/samba，按清单列表（index）的摘要固定；选型和没选的镜像见 PR 描述。
name: samba
services:
  samba:
    # dockurr/samba 不含发现服务（WS-Discovery/mDNS），入口脚本按 USER/UID/GID 建唯一的 SMB 账号，
    # 密码从 /run/secrets/pass 读（见它的 samba.sh），不进容器环境。
    image: dockurr/samba:4.23.10@sha256:2a0452a12b7a244a22f18d0f233101bb8d4952b5500ae263905e3b9dad3bf2ae
    environment:
      USER: ${WONTON_OWNER_NAME}
      UID: "${PUID}"
      GID: "${PGID}"
      # 镜像自带 PASS=secret；清空后密码只认 /run/secrets/pass，文件为空时账号建为禁用密码，不落到弱口令。
      PASS: ""
    volumes:
      - ${WONTON_SHARE_PHOTOS}:/shares/photos
      - ${WONTON_SHARE_DOCUMENTS}:/shares/documents
      - ${WONTON_SHARE_MUSIC}:/shares/music
      - ${WONTON_SHARE_DOWNLOADS}:/shares/downloads
      - ${WONTON_SHARE_TRANSFERS}:/shares/transfers
    configs:
      - source: smb-conf
        target: /etc/samba/smb.conf
      - source: samba-pass
        target: /run/secrets/pass
        mode: 0400
    healthcheck:
      # 用真实凭据列出共享：SMB 协商、账号和共享都可用才算健康。
      test: ["CMD-SHELL", "smbclient --configfile=/etc/samba/smb.conf -L //127.0.0.1 -U \"$$USER%$$(cat /run/secrets/pass)\" -m SMB3 | grep -q transfers"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      start_interval: 1s

  web:
    # 连接信息页：stdlib 的 http.server，无框架（web/serve.py）。
    image: python:3.15-alpine3.23@sha256:8d77d813a53e534dec9e1e5182cbd5b651b70d63b27e4ea7c1f616b37cf9aad2
    user: "${PUID}:${PGID}"
    command: ["python3", "/app/serve.py"]
    environment:
      WONTON_LAN_ADDRESSES: ${WONTON_LAN_ADDRESSES}
      WONTON_OWNER_NAME: ${WONTON_OWNER_NAME}
      # 网关代登录的密钥（清单 webui.proxy.headers 引用的 web_key），serve.py 启动时核对它。
      WONTON_WEB_KEY: ${WONTON_SECRET_WEB_KEY}
    configs:
      - source: serve-py
        target: /app/serve.py
      - source: web-pass
        target: /run/wonton/samba-pass
        mode: 0444
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      start_interval: 1s

configs:
  smb-conf:
    content: |
      [global]
          server string = wonton
          server role = standalone server
          # 最低 SMB3；关 NetBIOS（137-139），只听 445。
          server min protocol = SMB3
          server signing = required
          # 能协商加密就加密（SMB3 encryption），对吞吐的影响见 PR 实测。
          smb encrypt = desired
          # 只认 passdb 里唯一的账号，拒绝 guest 和匿名，含匿名枚举。
          map to guest = never
          restrict anonymous = 2
          disable netbios = yes
          smb ports = 445
          load printers = no
          printing = bsd
          printcap name = /dev/null
          disable spoolss = yes
          dns proxy = no
          local master = no
          log level = 1
          unix charset = UTF-8
          mangled names = no
          # macOS 客户端兼容：文件名编码与扩展属性。
          vfs objects = catia fruit streams_xattr
          fruit:metadata = stream
          fruit:model = MacSamba

      [photos]
          path = /shares/photos
          read only = no
          guest ok = no
          browseable = yes
          force user = ${WONTON_OWNER_NAME}
          force group = smb

      [documents]
          path = /shares/documents
          read only = no
          guest ok = no
          browseable = yes
          force user = ${WONTON_OWNER_NAME}
          force group = smb

      [music]
          path = /shares/music
          read only = no
          guest ok = no
          browseable = yes
          force user = ${WONTON_OWNER_NAME}
          force group = smb

      [downloads]
          path = /shares/downloads
          read only = no
          guest ok = no
          browseable = yes
          force user = ${WONTON_OWNER_NAME}
          force group = smb

      [transfers]
          path = /shares/transfers
          read only = no
          guest ok = no
          browseable = yes
          force user = ${WONTON_OWNER_NAME}
          force group = smb
  samba-pass:
    content: "${WONTON_SECRET_SAMBA_PASSWORD}"
  serve-py:
    file: web/serve.py
  web-pass:
    content: "${WONTON_SECRET_SAMBA_PASSWORD}"

x-wonton:
  spec: "0.11"
  id: org.samba.samba
  version: 0.1.4
  kind: app
  title: { zh: "电脑共享盘（Samba）", en: "Network Drive (Samba)", zh-Hant: "電腦共享磁碟（Samba）", ja: "共有ドライブ（Samba）" }
  description:
    zh: 让家里的电脑像打开 U 盘一样打开共享文件夹：在 Windows 资源管理器、Mac 访达里直接用，不用装软件。只在家里的网络能用，出门连不上。
    en: "Open the shared folders from your computer's own file manager, like a USB drive: works in Windows File Explorer and Mac Finder with nothing to install. Only works on your home network."
    zh-Hant: 讓家裡的電腦像開啟隨身碟一樣開啟共享資料夾：在 Windows 檔案總管、Mac Finder 裡直接用，不用裝軟體。只在家裡的網路能用，出門連不上。
    ja: 家のパソコンから USB メモリのように共有フォルダを開けます。Windows エクスプローラーや Mac Finder でそのまま使え、ソフトのインストールも要りません。家のネットワーク内だけで、外出先からはつながりません。
  icon: icon.png
  notices: [NOTICE]
  screenshots: [screenshots/web.png, screenshots/web-dark.png]
  author: { name: geraldpeng6 }
  homepage: https://www.samba.org
  license: GPL-3.0-or-later
  tags:
    zh: [文件, 网络]
    en: [Files, Network]
  setup:
    zh: 打开插件网页，地址、用户名和密码都在页面上，点一下就能复制。Mac 在访达的「连接服务器」里填地址，Windows 在资源管理器地址栏填。只在局域网开放，不通互联网。
    en: "Open the plugin page: the address, user name and password are all there, each with one-tap copy. On Mac, paste the address into Finder's Connect to Server; on Windows, into the Explorer address bar. It only opens on your network, never to the internet."
    zh-Hant: 開啟外掛網頁，位址、使用者名稱和密碼都在頁面上，點一下就能複製。Mac 在 Finder 的「連接伺服器」裡填位址，Windows 在檔案總管位址列填。只在區域網路開放，不通網際網路。
    ja: プラグインページを開くと、アドレス・ユーザー名・パスワードが表示され、ワンタップでコピーできます。Mac は Finder の「サーバへ接続」に、Windows はエクスプローラーのアドレスバーに入力します。LAN のみで、インターネットには出ません。
  about:
    zh: |
      让家里的电脑直接打开家里的共享文件夹，像插上 U 盘一样往里拷、往外拿，不用网页也不用装软件。

      文件夹和里面能做什么由云吞的共享文件夹规则决定；改了规则，已有连接要断开重连才生效。
    en: |
      Open your shared folders from a computer at home and copy files in and out like a USB drive — no web page and no extra software.

      Which folders and what is allowed there follow Wonton's shared-folder rules; after changing them, reconnect existing connections to pick up the change.
    zh-Hant: |
      讓家裡的電腦直接開啟家裡的共享資料夾，像插上隨身碟一樣往裡拷、往外拿，不用網頁也不用裝軟體。

      資料夾和裡面能做什麼由雲吞的共享資料夾規則決定；改了規則，已有連線要斷開重連才生效。
    ja: |
      家のパソコンから共有フォルダを直接開き、USB メモリのように出し入れできます。Web ページも追加ソフトも不要です。

      使えるフォルダと操作は Wonton の共有フォルダ設定に従います。設定を変えた後は、既存の接続をやり直すと反映されます。
  release_notes:
    zh: |
      连接信息页的运行时镜像升到 Python 3.15。

      商店介绍重写：连接步骤移到「安装后要做的事」，局域网、地址等说法换成日常用语；补繁体中文和日文。
    en: |
      The connection-info page's runtime image moves to Python 3.15.

      Store copy rewritten: connection steps moved to the pre-install notice, with LAN/address wording in everyday words; Traditional Chinese and Japanese added.
    zh-Hant: "連線資訊頁的執行時映象升到 Python 3.15。\n\n商店介紹重寫：連線步驟移到「安裝後要做的事」，區域網路、位址等說法換成日常用語；補繁體中文和日文。"
    ja: "接続情報ページのランタイムイメージを Python 3.15 に上げました。\n\nストア紹介を書き直し、接続手順を「インストール後の手順」に移し、LAN やアドレスなどの言い方を日常的な言葉にしました。繁体字中国語と日本語を追加。"
  webui:
    service: web
    port: 8080
    # 连接信息页上有 SMB 密码，而插件网络不是信任边界：别的出网插件经用户代理也能连到这个端口。
    # 网关代登录声明 X-Wonton-Web-Key（值是核心生成的密钥），serve.py 收到的请求没有这个头或值
    # 不对就 403（/healthz 除外）。页面显示的用户名来自核心注入的 WONTON_OWNER_NAME，不认
    # Remote-User 这类客户端可带的身份头。
    sso: proxy
    proxy:
      headers:
        X-Wonton-Web-Key: "{secret:web_key}"
  secrets:
    samba_password:
      generate: { bytes: 32 }
    web_key:
      generate: { bytes: 32 }
  lan:
    ports:
      - { service: samba, port: 445 }
  permissions:
    - network.lan
    - storage.share.photos:write
    - storage.share.documents:write
    - storage.share.music:write
    - storage.share.downloads:write
    - storage.share.transfers:write
    - owner.identity
  # 上游没写最低内存；本机空闲实测约 24M，取 64M。镜像支持 amd64 和 arm64（docker manifest inspect）。
  requirements:
    arch: [amd64, arm64]
    memory: 64M
