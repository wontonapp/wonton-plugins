# 家庭记账 ezBookkeeping：单容器，SQLite 和附件都在数据目录，不额外起数据库。
#
# 登录用应用自己的账号密码（sso: none），不接核心的 OIDC：上游的 MCP 令牌签发强制过账号密码确认，
# 而 OIDC 自动建号的账号没有密码，装好时给不出 MCP 令牌（核心要求 mcp.headers 引用的密钥在安装时就有值）。
# 规范对 sso:oidc 的要求是"不用脚本预建账号、打开不再看到登录页"，做不到时写明原因退到 none——
# 详见 README 的"登录"一节和 PR 里的取舍。
services:
  web:
    image: mayswind/ezbookkeeping:2.1.1@sha256:584e4d7f6fc1642773e840b56296f8782912e3bb17abfe3c49097508b198cdb7
    # 上游镜像固定以 1000 运行，二进制可用任意 uid 跑；数据目录交给运行用户。
    user: "${PUID}:${PGID}"
    environment:
      TZ: ${TZ}
      # 回调地址、MCP 地址展示都按它拼。
      EBK_SERVER_ROOT_URL: ${WONTON_APP_URL}/
      # 日志只走 stdout，交给 Docker 收集；不写容器里的文件，免得重建后丢、不清理涨满。
      EBK_LOG_MODE: console
      # 令牌签名密钥由核心生成；重启后不变，会话才不失效。
      EBK_SECURITY_SECRET_KEY: ${WONTON_SECRET_APP_SECRET_KEY}
      # 本地密码登录和自助注册都是上游默认（打开）：主人用预建账号登录，家人自己注册各自的账本。
      # MCP（Streamable HTTP）：总线带 MCP 令牌（init 在装好时签发，主人在应用里吊销后重建容器会重签）。
      EBK_MCP_ENABLE_MCP: "true"
      # 小票/文字识别走云吞的模型网关（OpenAI 兼容接口）；网关没接上时变量是空串，
      # 空的环境值不覆盖 ini 默认（false），功能保持关闭。
      EBK_AI_TRANSACTION_FROM_AI_TEXT_RECOGNITION: ${WONTON_MODEL_DEFAULT:+true}
      EBK_AI_TRANSACTION_FROM_AI_IMAGE_RECOGNITION: ${WONTON_MODEL_DEFAULT:+true}
      EBK_LLM_TEXT_RECOGNITION_LLM_PROVIDER: ${WONTON_MODEL_DEFAULT:+openai_compatible}
      EBK_LLM_TEXT_RECOGNITION_OPENAI_COMPATIBLE_BASE_URL: ${WONTON_MODEL_BASE_URL}
      EBK_LLM_TEXT_RECOGNITION_OPENAI_COMPATIBLE_API_KEY: ${WONTON_MODEL_API_KEY}
      EBK_LLM_TEXT_RECOGNITION_OPENAI_COMPATIBLE_MODEL_ID: ${WONTON_MODEL_DEFAULT}
      EBK_LLM_IMAGE_RECOGNITION_LLM_PROVIDER: ${WONTON_MODEL_DEFAULT:+openai_compatible}
      EBK_LLM_IMAGE_RECOGNITION_OPENAI_COMPATIBLE_BASE_URL: ${WONTON_MODEL_BASE_URL}
      EBK_LLM_IMAGE_RECOGNITION_OPENAI_COMPATIBLE_API_KEY: ${WONTON_MODEL_API_KEY}
      EBK_LLM_IMAGE_RECOGNITION_OPENAI_COMPATIBLE_MODEL_ID: ${WONTON_MODEL_DEFAULT}
    volumes:
      # SQLite 库和附件分两个目录，卸载 --purge 删得干净。
      - ${WONTON_APP_DATA}/data:/ezbookkeeping/data
      - ${WONTON_APP_DATA}/storage:/ezbookkeeping/storage
    healthcheck:
      # /healthz.json 不在鉴权之后，答出 status=ok 才算应用可用，不只是进程活着。
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz.json"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      start_interval: 1s

  # 一次性服务：给主人建账号（用户名/邮箱用核心注入的，和云吞一致；中文、人民币）
  # 并给 MCP 入口签发用户令牌，令牌交给核心保管（见 secrets.mcp_token）。幂等：令牌还在就直接收工。
  init:
    image: curlimages/curl:8.17.0@sha256:935d9100e9ba842cdb060de42472c7ca90cfe9a7c96e4dacb55e79e560b3ff40
    user: "${PUID}:${PGID}"
    entrypoint: ["/bin/sh", "/init.sh"]
    environment:
      WONTON_OWNER_NAME: ${WONTON_OWNER_NAME}
      WONTON_OWNER_EMAIL: ${WONTON_OWNER_EMAIL}
      WONTON_SECRET_OWNER_PASSWORD: ${WONTON_SECRET_OWNER_PASSWORD}
    volumes:
      - ${WONTON_APP_DATA}/mcp:/ebk-bridge
    configs:
      - source: init
        target: /init.sh
    depends_on:
      web:
        condition: service_healthy
    restart: "no"

configs:
  init:
    file: config/init.sh

x-wonton:
  spec: "0.11"
  id: net.mayswind.ezbookkeeping
  version: 0.1.0
  kind: app
  title: { zh: 家庭记账（ezBookkeeping）, en: Home Bookkeeping (ezBookkeeping) }
  description:
    zh: 像随身的小账本，记下每天的花销和收入，还能导入支付宝、微信的账单
    en: "A pocket ledger for daily spending and income, with Alipay and WeChat bill import"
  icon: icon.png
  notices: [NOTICE]
  screenshots: [screenshots/home.png]
  author: { name: geraldpeng6, url: https://github.com/geraldpeng6 }
  homepage: https://ezbookkeeping.mayswind.net
  license: MIT
  tags:
    zh: [记账, 理财]
    en: [Finance, Money]
  about:
    zh: |
      记一笔只要几秒：选类别、输金额，花销收入一目了然。像百度网盘存照片一样，账目都在自己家里，不交给任何公司。

      可以导入支付宝、微信导出的账单对账；拍下小票让助手识别金额和商家。家人各自注册各自的账本，数据互相独立。

      打开应用用云吞的用户名登录，初始密码在插件设置里能查看，登录后可以改成自己的。你的账本默认就是中文和人民币。

      助手（Bot）装好就能帮你记账和查账，看到的是你的账本；在应用里吊销 MCP 令牌后，重建容器时会自动重新签发。

      汇率换算和 AI 识别需要访问外网；模型网关没接上时，AI 识别在应用里如实显示不可用。
    en: |
      Record an expense in seconds: pick a category, type an amount, and see where the money goes. Like keeping photos in your own cloud, the books live at home, not with any company.

      Import Alipay and WeChat statement exports to reconcile; snap a receipt and let the assistant read the amount and vendor. Each family member registers their own books, independent of others.

      Sign in with your Wonton username; the initial password is in this plugin's settings and can be changed after signing in. Your books start in Chinese with CNY as the default currency.

      The assistant (bot) can record and look up transactions for you right after install, seeing your books; if you revoke the MCP token in the app, a container rebuild re-issues it.

      Exchange rates and AI recognition need internet access; without a model gateway the AI features report as unavailable in the app.
  release_notes: { zh: 首个版本：ezBookkeeping 2.1.1。, en: "Initial release: ezBookkeeping 2.1.1." }
  # 主人的账号是装好时按云吞用户名预建的（登录方式见 about）；初始密码在这里查看。
  setup:
    zh: 打开应用，用云吞的用户名登录；初始密码在插件设置里查看。
    en: Open the app and sign in with your Wonton username; the initial password is in the plugin settings.
  webui:
    service: web
    port: 8080
    sso: none
  tabs:
    - id: ledger
      title: { zh: 记账, en: Ledger }
      icon: tabs/ledger.svg
      icon_selected: tabs/ledger-fill.svg
      path: /
  mcp:
    service: web
    port: 8080
    transport: streamable-http
    # 上游的 MCP 只认它自己签发的用户令牌；init 在装好时签发，核心从这里收存并带给总线。
    headers:
      Authorization: "Bearer {secret:mcp_token}"
  secrets:
    # 令牌签名密钥，由核心生成；重装保留数据时沿用，换掉会让所有登录失效。
    app_secret_key:
      generate: { bytes: 32 }
    # 主人的初始密码：装好时建账号用，主人在插件设置里查看后登录应用。
    owner_password:
      generate: { bytes: 32 }
      show_owner: { label: { zh: 初始密码, en: Initial password, zh-Hant: 初始密碼, ja: 初期パスワード } }
    # MCP 令牌：init 签发后写进数据目录，核心从这里收存；吊销后重建容器时重签。
    mcp_token:
      collect: { service: init, path: /ebk-bridge/token }
  permissions:
    # init 要知道主人的用户名和邮箱来建账号。
    - owner.identity
    # 汇率数据源（欧洲央行）在应用里拉取，要出网；AI 识别经模型网关（内部地址，不走代理）。
    - network.egress
    - models
  # 上游没写最低内存；本机空闲实测后取整（见 PR 验证）。镜像有 amd64 和 arm64。
  requirements:
    arch: [amd64, arm64]
    memory: 128M
