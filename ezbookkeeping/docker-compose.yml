# 家庭记账 ezBookkeeping：单容器，SQLite 和附件都在数据目录，不额外起数据库。
#
# 登录用应用自己的账号密码（sso: none），不接核心的 OIDC：上游的 MCP 令牌签发强制过账号密码确认，
# 而 OIDC 自动建号的账号没有密码，装好时给不出 MCP 令牌（核心要求 mcp.headers 引用的密钥在安装时就有值）。
# 规范对 sso:oidc 的要求是"不用脚本预建账号、打开不再看到登录页"，做不到时写明原因退到 none——
# 详见 README 的"登录"一节和 PR 里的取舍。
services:
  web:
    image: mayswind/ezbookkeeping:2.1.1@sha256:584e4d7f6fc1642773e840b56296f8782912e3bb17abfe3c49097508b198cdb7
    # 上游镜像固定以 1000 运行，二进制可用任意 uid 跑；数据目录交给运行用户。
    user: "${PUID}:${PGID}"
    environment:
      TZ: ${TZ}
      # 回调地址、MCP 地址展示都按它拼。
      EBK_SERVER_ROOT_URL: ${WONTON_APP_URL}/
      # 日志只走 stdout，交给 Docker 收集；不写容器里的文件，免得重建后丢、不清理涨满。
      EBK_LOG_MODE: console
      # 令牌签名密钥由核心生成；重启后不变，会话才不失效。
      EBK_SECURITY_SECRET_KEY: ${WONTON_SECRET_APP_SECRET_KEY}
      # 本地密码登录和自助注册都是上游默认（打开）：主人用预建账号登录，家人自己注册各自的账本。
      # MCP（Streamable HTTP）：总线带 MCP 令牌（init 在装好时签发，主人在应用里吊销后重建容器会重签）。
      EBK_MCP_ENABLE_MCP: "true"
      # 小票/文字识别走云吞的模型网关（OpenAI 兼容接口）；网关没接上时变量是空串，
      # 空的环境值不覆盖 ini 默认（false），功能保持关闭。
      EBK_AI_TRANSACTION_FROM_AI_TEXT_RECOGNITION: ${WONTON_MODEL_DEFAULT:+true}
      EBK_AI_TRANSACTION_FROM_AI_IMAGE_RECOGNITION: ${WONTON_MODEL_DEFAULT:+true}
      EBK_LLM_TEXT_RECOGNITION_LLM_PROVIDER: ${WONTON_MODEL_DEFAULT:+openai_compatible}
      EBK_LLM_TEXT_RECOGNITION_OPENAI_COMPATIBLE_BASE_URL: ${WONTON_MODEL_BASE_URL}
      EBK_LLM_TEXT_RECOGNITION_OPENAI_COMPATIBLE_API_KEY: ${WONTON_MODEL_API_KEY}
      EBK_LLM_TEXT_RECOGNITION_OPENAI_COMPATIBLE_MODEL_ID: ${WONTON_MODEL_DEFAULT}
      EBK_LLM_IMAGE_RECOGNITION_LLM_PROVIDER: ${WONTON_MODEL_DEFAULT:+openai_compatible}
      EBK_LLM_IMAGE_RECOGNITION_OPENAI_COMPATIBLE_BASE_URL: ${WONTON_MODEL_BASE_URL}
      EBK_LLM_IMAGE_RECOGNITION_OPENAI_COMPATIBLE_API_KEY: ${WONTON_MODEL_API_KEY}
      EBK_LLM_IMAGE_RECOGNITION_OPENAI_COMPATIBLE_MODEL_ID: ${WONTON_MODEL_DEFAULT}
    volumes:
      # SQLite 库和附件分两个目录，卸载 --purge 删得干净。
      - ${WONTON_APP_DATA}/data:/ezbookkeeping/data
      - ${WONTON_APP_DATA}/storage:/ezbookkeeping/storage
    healthcheck:
      # /healthz.json 不在鉴权之后，答出 status=ok 才算应用可用，不只是进程活着。
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz.json"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      start_interval: 1s

  # 一次性服务：给主人建账号（用户名/邮箱用核心注入的，和云吞一致；中文、人民币）
  # 并给 MCP 入口签发用户令牌，令牌交给核心保管（见 secrets.mcp_token）。幂等：令牌还在就直接收工。
  init:
    image: curlimages/curl:8.23.0@sha256:3fb7e13e5d179a845c97d78204f3f1064d1907037f26a3ebf91710571151fd93
    user: "${PUID}:${PGID}"
    entrypoint: ["/bin/sh", "/init.sh"]
    environment:
      WONTON_OWNER_NAME: ${WONTON_OWNER_NAME}
      WONTON_OWNER_EMAIL: ${WONTON_OWNER_EMAIL}
      WONTON_SECRET_OWNER_PASSWORD: ${WONTON_SECRET_OWNER_PASSWORD}
    volumes:
      - ${WONTON_APP_DATA}/mcp:/ebk-bridge
    configs:
      - source: init
        target: /init.sh
    depends_on:
      web:
        condition: service_healthy
    restart: "no"

configs:
  init:
    file: config/init.sh

x-wonton:
  spec: "0.17"
  id: net.mayswind.ezbookkeeping
  version: 0.1.4
  kind: app
  title: { en: "ezBookkeeping" }
  subtitle: { zh: "随身账本", en: "Pocket Ledger", zh-Hant: "隨身帳本", ja: "ポケット家計簿" }
  description:
    zh: 像随身的小账本，记下每天的花销和收入，还能导入支付宝、微信的账单
    en: A pocket ledger for daily spending and income, with Alipay and WeChat bill import
    zh-Hant: 像隨身的小帳本，記下每天的花費和收入，還能匯入支付寶、微信的帳單
    ja: 持ち歩く小さな家計簿のようなもの。日々の支出と収入を記録でき、Alipay や WeChat の明細も取り込めます。
  icon: icon.png
  notices: [NOTICE]
  screenshots: [screenshots/home.png]
  author: { name: geraldpeng6, url: https://github.com/geraldpeng6 }
  homepage: https://ezbookkeeping.mayswind.net
  license: MIT
  tags:
    zh: [记账, 理财]
    en: [Finance, Money]
  about:
    zh: |
      记一笔只要几秒：选类别、输金额，花销收入一目了然。账目都在自己家里，不交给任何公司。

      可以导入支付宝、微信导出的账单对账；拍下小票让助手识别金额和商家。家人各自注册各自的账本，数据互相独立。你的账本默认就是中文和人民币。

      助手（Bot）装好就能帮你记账和查账，看到的是你的账本；在应用里吊销掉给助手的凭证后，云吞更新重建时也会自动重新给一份。

      汇率换算和拍照识别要能上外网；没接上 AI 服务时，这类功能会在应用里如实显示不可用。
    en: |
      Record an expense in seconds: pick a category, type an amount, and see where the money goes. The books live at home, not with any company.

      Import Alipay and WeChat statement exports to reconcile; snap a receipt and let the assistant read the amount and vendor. Each family member registers their own books, independent of others. Your books start in Chinese with CNY as the default currency.

      The assistant (bot) can record and look up transactions for you right after install, seeing your books; if you revoke its credential in the app, a later Wonton update puts a fresh one in place.

      Exchange rates and photo recognition need internet access; without an AI service connected those features report as unavailable in the app.
    zh-Hant: |
      記一筆只要幾秒：選類別、輸金額，花費收入一目了然。帳目都在自己家裡，不交給任何公司。

      可以匯入支付寶、微信匯出的帳單對帳；拍下收據讓助手辨識金額和商家。家人各自註冊各自的帳本，資料互相獨立。你的帳本預設就是中文和人民幣。

      助手（Bot）裝好就能幫你記帳和查帳，看到的是你的帳本；在應用裡撤銷給助手的憑證後，雲吞更新重建時也會自動重新給一份。

      匯率換算和拍照辨識要能連上外網；沒接上 AI 服務時，這類功能會在應用裡如實顯示不可用。
    ja: |
      一件の記録は数秒です。カテゴリを選び金額を入れれば、支出と収入が一目でわかります。家計簿は家の中にあり、どこかの会社に預けません。

      Alipay や WeChat が書き出した明細を取り込んで照合でき、レシートを撮ればアシスタントが金額と店名を読み取ります。家族はそれぞれ自分の家計簿を登録し、データは独立します。あなたの家計簿は最初から日本語環境ではなく中国語・人民元が既定です。

      ボットは導入後すぐに記帳と照会ができ、あなたの家計簿を見ます。アプリでボットの資格情報を取り消しても、Wonton の更新時の再構築で新しいものが自動で入ります。

      為替換算と写真の読み取りにはインターネットが必要です。AI サービスが未接続のときは、アプリ上で利用できないとそのまま表示されます。
  release_notes:
    zh: |
      介绍重写：首次登录提示单独成段放在最前。

      商店介绍重写：首次登录只在「安装后要做的事」里说一次，MCP 令牌、容器、模型网关改成凭证、重建、AI 服务；补繁体中文和日文。
    en: |
      Rewritten store copy: the first-open sign-in note stands alone up front.

      Store copy rewritten: the first sign-in appears only in the pre-install notice, and MCP token/container/model-gateway wording became credential/rebuild/AI service; Traditional Chinese and Japanese added.
    zh-Hant: "介紹重寫：首次登入提示單獨成段放在最前。\n\n商店介紹重寫：首次登入只在「安裝後要做的事」裡說一次，MCP 令牌、容器、模型閘道改成憑證、重建、AI 服務；補繁體中文和日文。"
    ja: "紹介を書き直し、初回ログインの注意を最初の段落に分けました。\n\nストア紹介を書き直し、初回サインインは「インストール後の手順」だけにまとめ、MCP トークン・コンテナ・モデルゲートウェイを資格情報・再構築・AI サービスという言い方にしました。繁体字中国語と日本語を追加。"
  # 主人的账号是装好时按云吞用户名预建的（登录方式见 about）；初始密码在这里查看。
  setup:
    zh: 打开应用，用云吞的用户名登录；初始密码在插件设置里查看，登录后马上改成自己的。
    en: Open the app and sign in with your Wonton username; the initial password is in the plugin settings — change it to your own right after signing in.
    zh-Hant: 開啟應用，用雲吞的使用者名稱登入；初始密碼在外掛設定裡查看，登入後馬上改成自己的。
    ja: アプリを開き、Wonton のユーザー名でサインインします。初期パスワードはプラグイン設定で確認でき、サインイン後すぐ自分のものに変えてください。
  webui:
    service: web
    port: 8080
    sso: none
  tabs:
    - id: ledger
      title: { zh: 记账, en: Ledger }
      icon: tabs/ledger.svg
      icon_selected: tabs/ledger-fill.svg
      path: /
  mcp:
    service: web
    port: 8080
    transport: streamable-http
    # 上游的 MCP 只认它自己签发的用户令牌；init 在装好时签发，核心从这里收存并带给总线。
    headers:
      Authorization: "Bearer {secret:mcp_token}"
  secrets:
    # 令牌签名密钥，由核心生成；重装保留数据时沿用，换掉会让所有登录失效。
    app_secret_key:
      generate: { bytes: 32 }
    # 主人的初始密码：装好时建账号用，主人在插件设置里查看后登录应用。
    owner_password:
      generate: { bytes: 32 }
      show_owner: { label: { zh: 初始密码, en: Initial password, zh-Hant: 初始密碼, ja: 初期パスワード } }
    # MCP 令牌：init 签发后写进数据目录，核心从这里收存；吊销后重建容器时重签。
    mcp_token:
      collect: { service: init, path: /ebk-bridge/token }
  # 小票/文字识别走模型网关（可选能力：没接上网关时 AI 识别如实显示不可用）。
  wants: [models]
  permissions:
    # init 要知道主人的用户名和邮箱来建账号。
    - owner.identity
    # 汇率数据源（欧洲央行）在应用里拉取，要出网。
    - network.egress
  # 上游没写最低内存；本机空闲实测后取整（见 PR 验证）。镜像有 amd64 和 arm64。
  requirements:
    arch: [amd64, arm64]
    memory: 128M
