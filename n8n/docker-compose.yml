# n8n 工作流自动化：单容器，SQLite 存在数据目录里，经核心网关对外。
# 模型网关的凭据由一次性服务在应用启动前写进数据库（import:credentials），
# 没接上网关时不预置；核心接上网关后重建容器会重跑本服务，到时再写。
services:
  seed-credentials:
    image: n8nio/n8n:3.2.0@sha256:9e67c2627d3c30dbb0d51f5da83d4499ac7913f6b4f358a900a58026a832ba12
    # 镜像固定以 uid 1000（node）运行，任意 uid 会写不了数据目录（上游不认 PUID/PGID）。
    user: "1000:1000"
    # HOME 和 N8N_USER_FOLDER 指向数据卷；n8n 的用户数据（.n8n）和 npm 缓存仍落在原有插件数据目录。
    entrypoint: ["node", "/seed/seed-credentials.js"]
    environment:
      HOME: /data
      N8N_USER_FOLDER: /data
      N8N_ENCRYPTION_KEY: ${WONTON_SECRET_ENCRYPTION_KEY}
      WONTON_MODEL_BASE_URL: ${WONTON_MODEL_BASE_URL}
      WONTON_MODEL_API_KEY: ${WONTON_MODEL_API_KEY}
    volumes:
      - ${WONTON_APP_DATA}:/data
    configs:
      - source: seed-credentials
        target: /seed/seed-credentials.js
    # 只写本地数据库；import/export 命令会自己建库、跑迁移，然后退出。
    network_mode: none
    restart: "no"

  n8n:
    image: n8nio/n8n:3.2.0@sha256:9e67c2627d3c30dbb0d51f5da83d4499ac7913f6b4f358a900a58026a832ba12
    user: "1000:1000"
    depends_on:
      seed-credentials:
        condition: service_completed_successfully
    environment:
      HOME: /data
      N8N_USER_FOLDER: /data
      # 凭据加密密钥由核心生成保管：换了解不开库里的凭据，保留数据重装沿用同一个值。
      N8N_ENCRYPTION_KEY: ${WONTON_SECRET_ENCRYPTION_KEY}
      # 网关反代：webhook、编辑器和回调地址都用公开入口；前面只有网关一层。
      # N8N_HOST 不用设：设了 WEBHOOK 和 EDITOR_BASE_URL 后它只是兜底（UrlService 的回退链）。
      N8N_WEBHOOK_URL: ${WONTON_APP_URL}/
      N8N_EDITOR_BASE_URL: ${WONTON_APP_URL}
      N8N_PROXY_HOPS: "1"
      # 网关按明文 http 转给插件（生产时用户侧 https 由网关终结），Secure cookie 会登录不上。
      N8N_SECURE_COOKIE: "false"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      GENERIC_TIMEZONE: ${TZ}
      TZ: ${TZ}
      # 关掉外联的遥测、版本提示、注册问卷和招聘横幅；工作流模板保留（api.n8n.io，出网已有）。
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_HIRING_BANNER_ENABLED: "false"
      # 流程里连云吞工具总线：MCP Client Tool 节点的 Endpoint URL 填 {{ $env.WONTON_MCP_URL }}。
      WONTON_MCP_URL: ${WONTON_MCP_URL}
    volumes:
      - ${WONTON_APP_DATA}:/data
    healthcheck:
      # readiness 确认数据库连上、迁移完成，不只是进程活着。
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:5678/healthz/readiness"]
      interval: 30s
      timeout: 10s
      start_period: 90s
      start_interval: 2s

configs:
  seed-credentials:
    file: configs/seed-credentials.js

x-wonton:
  spec: "0.17"
  id: io.n8n.n8n
  version: 0.1.3
  kind: app
  title: { en: "n8n" }
  subtitle: { zh: "自动流程", en: "Workflow Automation", zh-Hant: "自動流程", ja: "自動ワークフロー" }
  description:
    zh: 像手机的“快捷指令”：把到点抓取、整理、通知这些重复的事串成自动流程，AI 也能参与。自带几百种常用服务的积木，照模板就能搭。
    en: "Like Shortcuts on your phone: chain repetitive jobs into automatic flows, with AI in the loop. Hundreds of ready-made blocks; start from a template."
    zh-Hant: 像手機的「捷徑」：把到點抓取、整理、通知這些重複的事串成自動流程，AI 也能參與。內建幾百種常用服務的積木，照範本就能搭。
    ja: スマホの「ショートカット」のようなものです。定時の取得・整理・通知といった繰り返しを自動フローにつなぎ、AI も組み込めます。よく使うサービス向けの部品が何百もそろい、テンプレートから作れます。
  icon: icon.svg
  notices: [NOTICE]
  screenshots: [screenshots/overview.png, screenshots/workflow-editor.png, screenshots/model-gateway-credential.png]
  author: { name: geraldpeng6 }
  homepage: https://n8n.io
  # 应用（n8n）的许可证：Sustainable Use License（fair-code，非 OSI），SPDX 短标识 SUL-1.0。
  license: SUL-1.0
  tags:
    zh: [AI, 效率, 自动化]
    en: [AI, Productivity, Automation]
  about:
    zh: |
      把重复的事串成自动流程，到点自动跑。比如每天早上把天气和日程发给你，收到邮件附件自动存下来，监控的网页一有变化就提醒你。

      打开就是搭流程的画布：左边挑积木（几百种常用服务的现成连接），连起来就是一条流程，照现成模板改改就能用。流程里的 AI 步骤默认走云吞的模型服务，不用填密钥；也能用家里其他应用提供的功能，接法见插件文件夹里的 README。

      注意：流程能上网、能运行代码、能调用任何网站，相当于交出管理员权限，装之前请让家里人都知道它是干什么的。别的网站主动来调你的流程需要一个从外网能打开的地址，现在的家门打不开，所以这类流程用不了；手动执行和浏览器里测试不受影响。

      它用的是自己的许可（Sustainable Use License），个人和公司内部使用免费。
    en: |
      Chain repetitive jobs into automatic flows that run on schedule: morning weather and calendar in one message, attachments saved as they arrive, a nudge the moment a watched page changes.

      You get a visual canvas: pick blocks on the left (ready-made connections to hundreds of services), wire them into a flow, or start from a template. AI steps use Wonton's model service by default, no key to fill in; flows can also call features your other home apps provide — see the README in the plugin folder.

      Note: flows can reach the internet, run code and call any service, which is admin-level power — make sure everyone at home knows what it does. A flow that an outside site must call needs an address reachable from the internet, which the current front door cannot offer; manual runs and editor tests are unaffected.

      It uses its own Sustainable Use License: free for personal and internal company use.
    zh-Hant: |
      把重複的事串成自動流程，到點自動跑。例如每天早上把天氣和行程發給你，收到信件附件自動存下來，監控的網頁一有變化就提醒你。

      開啟就是搭流程的畫布：左邊挑積木（幾百種常用服務的現成連接），連起來就是一條流程，照現成範本改改就能用。流程裡的 AI 步驟預設走雲吞的模型服務，不用填金鑰；也能用家裡其他應用提供的功能，接法見外掛資料夾裡的 README。

      注意：流程能上網、能執行程式、能呼叫任何網站，相當於交出管理員權限，裝之前請讓家裡人都知道它是幹什麼的。別的網站主動來呼叫你的流程需要一個從外網能開啟的位址，現在的門口打不開，所以這類流程用不了；手動執行和瀏覽器裡測試不受影響。

      它用自己的授權（Sustainable Use License），個人和公司內部使用免費。
    ja: |
      繰り返しの作業を自動フローにつなぎ、定時に走らせます。朝の天気と予定を 1 通にまとめる、届いた添付を保存する、監視ページが変わったらすぐ知らせる、といったことができます。

      開くとフローを組むキャンバスになります。左から部品（よく使うサービスへの既製の接続が何百も）を選んでつなぐだけで 1 本のフローになり、テンプレートを直せばすぐ使えます。AI のステップは既定で Wonton のモデルサービスを使い、キーの入力は不要です。家の他のアプリの機能も呼べます。接続方法はプラグインフォルダの README を参照してください。

      注意：フローはインターネットに出てコードを実行し、どんなサイトも呼べるので、管理者権限を渡すのに等しいです。導入前に家族全員に何をするものかを伝えてください。外部サイトからフローを呼ぶには外から届くアドレスが必要ですが、今の玄関では提供できません。手動実行とエディタでのテストは影響を受けません。

      ライセンスは独自の Sustainable Use License で、個人利用と社内利用は無料です。
  release_notes:
    zh: |
      插件包迁入官方插件合仓，功能与上一版相同。

      商店介绍重写：建账号的步骤补进「安装后要做的事」，模型网关、凭据、公网地址等说法换成日常用语；补繁体中文和日文。
    en: |
      Package moved into the official Wonton plugin monorepo; functionality is unchanged.

      Store copy rewritten: account creation moved into the pre-install notice, with model-gateway/credential/public-address wording in everyday words; Traditional Chinese and Japanese added.
    zh-Hant: "外掛包遷入官方外掛合倉，功能與上一版相同。\n\n商店介紹重寫：建帳號的步驟補進「安裝後要做的事」，模型閘道、憑據、公網位址等說法換成日常用語；補繁體中文和日文。"
    ja: "プラグインを公式プラグインリポジトリへ移動しました。機能は前版と同じです。\n\nストア紹介を書き直し、アカウント作成を「インストール後の手順」に加え、モデルゲートウェイや認証情報、公開アドレスなどの言い方を日常的な言葉にしました。繁体字中国語と日本語を追加。"
  setup:
    zh: 第一次打开时建管理员账号：填一个邮箱和自己定的密码（至少 8 位，要有数字和大写字母）。要收找回密码的信，邮箱得填真的。
    en: "On first open, create the admin account: any email plus a password you choose (at least 8 characters, with a digit and an uppercase letter). Use a real mailbox if you want password-reset mail."
    zh-Hant: 第一次開啟時建管理員帳號：填一個信箱和自己定的密碼（至少 8 位，要有數字和大寫字母）。要收找回密碼的信，信箱得填真的。
    ja: 初回に管理者アカウントを作ります。任意のメールアドレスと自分で決めたパスワード（8 文字以上、数字と大文字を含む）を入力します。パスワード再設定のメールを受け取るなら実在のメールボックスを使ってください。
  webui:
    service: n8n
    port: 5678
    # 社区版没有 SSO（OIDC/SAML 是企业版功能），第一次打开自己注册管理员。
    sso: none
  # 流程里的 AI 步骤走可选能力模型网关（OpenAI 兼容接口）。
  # AI steps in flows go through the optional model gateway (OpenAI-compatible API).
  wants: [models]
  permissions:
    # 出网：调用流程里的外部服务、安装社区节点、拉取工作流模板。
    # Egress: call external services in flows, install community nodes, fetch workflow templates.
    - network.egress
    # MCP Client Tool 节点经云吞工具总线调用家里其他应用的能力。
    # The MCP Client Tool node reaches other home apps through the Wonton tool bus.
    - tools
  secrets:
    # n8n 用它加密数据库里的凭据；核心生成保管，保留数据重装沿用。
    encryption_key:
      generate: { bytes: 32 }
  # 镜像支持 amd64 和 arm64（docker buildx imagetools inspect）。上游没写最低内存；本机空闲实测约 xxxM，取 1G。
  requirements:
    arch: [amd64, arm64]
    memory: 1G
