# BookStack 家庭 Wiki：书、章节、页面，所见即所得编辑和全文搜索。
# 登录用 BookStack 自己的账号（sso: none）：核心只签发 http 的 OIDC，BookStack 上游硬性要求 https
# 签发方（核心网关在隧道里不用 TLS），接不上，原因写在 README。管理员不设任何默认账密：
# init 一次性服务在首次启动时把它建成主人的邮箱 + 核心生成的随机密码，账密经 lan.client
# 显示在插件详情页（lan_webui 开关后面）。
# 上游文档指向的镜像是 linuxserver.io 打包的（BookStack 项目自己不发镜像），MIT 应用 + GPL-2.0 的 MariaDB 数据库，
# 都用上游官方镜像、按清单列表（index）的摘要固定。
services:
  bookstack:
    image: lscr.io/linuxserver/bookstack:v26.09.2-ls295@sha256:33f61a72d9aaa021f7e687987b9fcb992673d9ca3fc08f63f5ddaddf59e94efc
    # LinuxServer 镜像以 root 起初始化（迁移数据库、改属主）再降权到 PUID/PGID，数据目录归用户的用户。
    depends_on:
      db:
        condition: service_healthy
    environment:
      TZ: ${TZ}
      # 网页地址用核心注入的插件网页地址；应用生成的链接和回调地址都以它为准。
      APP_URL: ${WONTON_APP_URL}
      # 会话加密密钥由核心生成保管，保留数据重装沿用同一个值（换了它已有会话全部失效）。
      APP_KEY: base64:${WONTON_SECRET_APP_KEY}
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: bookstack
      DB_USERNAME: bookstack
      DB_PASSWORD: ${WONTON_SECRET_DB_PASSWORD}
      # 界面默认中文，浏览器语言是英文的访客自己切。
      APP_LANG: zh_CN
      PUID: ${PUID}
      PGID: ${PGID}
    volumes:
      - ${WONTON_APP_DATA}/config:/config
    healthcheck:
      # /status 是 BookStack 的就绪端点：连不上数据库或缓存时返回 500，只看进程活着时它也是 200。
      # 用 -T 而不是 --max-time：容器里的 wget 是 busybox 的，不认 curl 的选项。
      test: ["CMD", "wget", "-q", "-T", "5", "-O", "/dev/null", "http://127.0.0.1/status"]
      interval: 30s
      timeout: 10s
      start_period: 2m
      start_interval: 5s
    restart: unless-stopped

  # 一次性服务：等应用健康（迁移已跑完）后初始化管理员。bookstack:create-admin --initial 的语义
  # 正合幂等要求：全新库直接创建；只有默认 admin@admin.com 时把它改成给定资料；已有非默认管理员
  # （保留数据重装、升级）时跳过（退出码 2），密码保持不变。所有非 0/2 的退出都让安装失败。
  # 以 root 跑（镜像的 /app/www/bootstrap/cache 只归 root 组，PUID 写不了；镜像官方的 artisan
  # 用法就是 root 的 docker exec）。成功路径只在镜像内的缓存目录写文件，/config 里落盘的只有头像。
  init:
    image: lscr.io/linuxserver/bookstack:v26.09.2-ls295@sha256:33f61a72d9aaa021f7e687987b9fcb992673d9ca3fc08f63f5ddaddf59e94efc
    depends_on:
      bookstack:
        condition: service_healthy
    # 镜像的入口是 s6 的 /init、工作目录是 /，跑 artisan 要覆盖入口并指到 webroot。
    entrypoint: ["sh", "-c"]
    working_dir: /app/www
    command:
      - |
        php artisan bookstack:create-admin --initial \
          --email="$$WONTON_OWNER_EMAIL" --name="$$WONTON_OWNER_NAME" --password="$$WONTON_SECRET_ADMIN_PASSWORD"
        rc=$$?
        [ "$$rc" = 0 ] || [ "$$rc" = 2 ] || exit "$$rc"
    environment:
      # 管理员登录用邮箱，必须先填好云吞邮箱才能装。
      WONTON_OWNER_EMAIL: ${WONTON_OWNER_EMAIL:?}
      WONTON_OWNER_NAME: ${WONTON_OWNER_NAME}
      WONTON_SECRET_ADMIN_PASSWORD: ${WONTON_SECRET_ADMIN_PASSWORD}
      # artisan 走同一套应用配置：应用密钥、数据库连接都要和主服务一致。
      APP_KEY: base64:${WONTON_SECRET_APP_KEY}
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: bookstack
      DB_USERNAME: bookstack
      DB_PASSWORD: ${WONTON_SECRET_DB_PASSWORD}
      TZ: ${TZ}
    volumes:
      - ${WONTON_APP_DATA}/config:/config
    restart: "no"

  db:
    image: mariadb:12.3.3@sha256:4aaf88b3106382c8c18e49f0cec60267be618fc22f858c4503afb2a2555afed3
    environment:
      MARIADB_DATABASE: bookstack
      MARIADB_USER: bookstack
      MARIADB_PASSWORD: ${WONTON_SECRET_DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${WONTON_SECRET_DB_ROOT_PASSWORD}
      TZ: ${TZ}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      # ping 数据库本身，不只看进程；密码错时这里失败。
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 30s
      timeout: 10s
      start_period: 1m
      start_interval: 5s
    restart: unless-stopped

volumes:
  db-data:

x-wonton:
  spec: "0.11"
  id: app.bookstack.bookstack
  version: 0.1.2
  kind: app
  title: { zh: "家庭文档库（BookStack）", en: "Home Wiki (BookStack)", zh-Hant: "家庭文件庫（BookStack）", ja: "家庭向け Wiki（BookStack）" }
  description:
    zh: 像家里的一本本百科书：分书、章节、页面记资料，贴图带附件，全文搜索随找。用自己的账号登录，不占云吞身份。
    en: "Like a shelf of home encyclopedias: books, chapters and pages hold your notes with images and attachments, all full-text searchable. Signs in with its own account, apart from Wonton."
    zh-Hant: 像家裡的一本本百科書：分書、章節、頁面記資料，貼圖帶附件，全文搜尋隨找。用自己的帳號登入，不佔用雲吞身分。
    ja: 家に並ぶ百科事典のようなもの。本・章・ページに画像や添付を交えて記録をまとめ、全文検索で探せます。Wonton とは別の専用アカウントでサインインします。
  icon: icon.png
  notices: [NOTICE]
  author: { name: geraldpeng6, url: https://github.com/geraldpeng6 }
  homepage: https://www.bookstackapp.com
  # 应用（BookStack）的许可证；数据库 MariaDB（GPL-2.0）作为独立容器分发。
  license: MIT
  tags:
    zh: [文档]
    en: [Documents]
  setup:
    zh: 打开后用你的云吞邮箱登录，密码在插件详情页的「管理员密码」里查看，第一次登录后改成自己的；家人可以在登录页自己注册。
    en: Open the page and sign in with your Wonton email; the password is under “Admin password” in the plugin details — change it after the first sign-in. Family members can register on the sign-in page.
    zh-Hant: 開啟後用你的雲吞信箱登入，密碼在外掛詳情頁的「管理員密碼」裡查看，第一次登入後改成自己的；家人可以在登入頁自行註冊。
    ja: 開いたら Wonton のメールアドレスでサインインします。パスワードはプラグイン詳細の「管理者パスワード」で確認でき、初回サインイン後に自分のものへ変更してください。家族はサインインページから自分で登録できます。
  about:
    zh: 把家里的知识整理成书：一本书分章节，章节里一页页写，图文所见即所得，图片和附件直接贴进页面，之后全文搜索。
    en: "Organise your knowledge into books: chapters hold pages, editing shows the result as you type, images and attachments go straight into the page, and everything stays searchable."
    zh-Hant: 把家裡的知識整理成書：一本書分章節，章節裡一頁頁寫，圖文所見即所得，圖片和附件直接貼進頁面，之後全文搜尋。
    ja: 家の知識を本にまとめます。本を章に分け、章にページを書き足していきます。編集中に仕上がりがそのまま見え、画像や添付もページに直接置けて、あとから全文検索できます。
  release_notes:
    zh: |
      插件包迁入官方插件合仓，内容与上一版相同。

      商店介绍重写：补通俗中文标题，登录和账号内容移到「安装后要做的事」；补繁体中文和日文。
    en: |
      Package moved into the official Wonton plugin monorepo; same content as the previous release.

      Store copy rewritten: added a plain Chinese title and moved sign-in and account notes to the pre-install notice; Traditional Chinese and Japanese added.
    zh-Hant: "外掛包遷入官方外掛合倉，內容與上一版相同。\n\n商店介紹重寫：補通俗中文標題，登入和帳號內容移到「安裝後要做的事」；補繁體中文和日文。"
    ja: "プラグインを公式プラグインリポジトリへ移動しました。内容は前版と同じです。\n\nストア紹介を書き直し、わかりやすい中国語タイトルを付け、サインインとアカウントの説明を「インストール後の手順」に移しました。繁体字中国語と日本語を追加。"
  webui:
    service: bookstack
    port: 80
    sso: none
  # 管理员账密走 lan.client 显示在插件详情页（lan_webui 开关后面，开关打开前端口不开）。
  # 管理员账号由 init 服务在首次启动时建好，邮箱是主人的邮箱，密码是核心生成的随机值。
  lan:
    ports:
      - { service: bookstack, port: 80 }
    client:
      address: "http://{host}"
      username: "{email}"
      password: "{secret:admin_password}"
  secrets:
    # 管理员密码：核心生成、详情页展示，init 服务写进应用；保留数据重装沿用同一个值（密码不变）。
    admin_password:
      generate: { bytes: 32 }
    # Laravel 会话加密密钥（APP_KEY），应用文档要求 base64 编码的 32 字节。
    app_key:
      generate: { bytes: 32, encoding: base64 }
    db_password:
      generate: { bytes: 32 }
    db_root_password:
      generate: { bytes: 32 }
  # network.lan：lan.client 和详情页展示账密要它；webui 端口列在 lan.ports 里，lan_webui 开关默认关。
  # owner.identity：管理员账号用主人的邮箱和用户名。
  permissions:
    - network.lan
    - owner.identity
  # 上游没写最低内存；BookStack + MariaDB 空闲实测约 350M（docker stats，验证时 v26.09.2-ls295），取 512M。
  # 两个镜像都有 amd64 和 arm64（docker buildx imagetools inspect）。
  requirements:
    arch: [amd64, arm64]
    memory: 512M
