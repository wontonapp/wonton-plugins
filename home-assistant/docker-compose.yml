# Home Assistant：宿主网络用于 mDNS、SSDP 和 DHCP 发现；网页只监听回环，由核心中继接入网关。
services:
  init:
    image: ghcr.io/home-assistant/home-assistant:2026.11.1@sha256:6785d1eca68747a524c156faae1b139ed415c07357386ae6fe17291986e59e82
    user: "${PUID}:${PGID}"
    entrypoint: ["python3", "/wonton/seed.py"]
    environment:
      TZ: ${TZ}
    volumes:
      - ${WONTON_APP_DATA}/config:/config
    configs:
      - source: seed
        target: /wonton/seed.py
      - source: configuration
        target: /wonton/configuration.yaml
    network_mode: none
    restart: "no"

  home-assistant:
    image: ghcr.io/home-assistant/home-assistant:2026.11.1@sha256:6785d1eca68747a524c156faae1b139ed415c07357386ae6fe17291986e59e82
    # 上游 /init 的 s6 启动链需要 root；不使用 privileged，DHCP 只加 NET_RAW。
    entrypoint: ["python3", "/wonton/start.py"]
    configs:
      - source: start
        target: /wonton/start.py
    depends_on:
      init:
        condition: service_completed_successfully
    environment:
      TZ: ${TZ}
    volumes:
      - ${WONTON_APP_DATA}/config:/config
    network_mode: host
    cap_add:
      - NET_RAW
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8123/manifest.json"]
      interval: 30s
      timeout: 5s
      start_period: 120s
      start_interval: 2s

  onboarding:
    image: ghcr.io/home-assistant/home-assistant:2026.11.1@sha256:6785d1eca68747a524c156faae1b139ed415c07357386ae6fe17291986e59e82
    entrypoint: ["python3", "/wonton/onboard.py"]
    network_mode: host
    restart: "no"
    environment:
      OWNER_NAME: ${WONTON_OWNER_NAME}
      OWNER_PASSWORD: ${WONTON_SECRET_OWNER_PASSWORD}
    depends_on:
      home-assistant:
        condition: service_healthy
    configs:
      - source: onboarding
        target: /wonton/onboard.py

  web:
    # 官方 nginx（BSD-2-Clause）：HA 拒绝带 XFF 的非代理请求，可信代理又不能用于 trusted_networks。
    # 只去掉转发头，不注入身份；两个监听端口都限定回环，核心仍负责网关认证和 unix 中继。
    image: nginx:1.31.8-alpine@sha256:fed7e14be83cbd2661a75cdc5b872d936cf155d46c327084d30b8df19ae88d72
    network_mode: host
    depends_on:
      onboarding:
        condition: service_completed_successfully
    configs:
      - source: web
        target: /etc/nginx/conf.d/default.conf
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:18123/manifest.json"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      start_interval: 1s

configs:
  seed:
    file: init/seed.py
  start:
    file: init/start.py
  onboarding:
    file: init/onboard.py
  web:
    file: web/default.conf
  configuration:
    file: config/configuration.yaml

x-wonton:
  spec: "0.11"
  id: io.home-assistant.home-assistant
  version: 0.2.2
  kind: app
  title: { zh: 智能家居中控（Home Assistant）, en: Smart Home Hub (Home Assistant) }
  description:
    zh: 像米家 App，但不挑牌子：把家里各品牌的智能设备放进一个界面控制，开灯、调空调，还能设“到家自动开灯”这样的联动。
    en: 'One app for every smart device, whatever the brand: control lights and air conditioning in one place and set routines like "lights on when I get home".'
  icon: icon.svg
  notices: [NOTICE]
  screenshots: [screenshots/home.png]
  author: { name: geraldpeng6, url: https://github.com/geraldpeng6 }
  homepage: https://www.home-assistant.io
  license: Apache-2.0
  tags:
    zh: [智能家居, 自动化]
    en: [Smart Home, Automation]
  about:
    zh: |
      把家里不同牌子的智能设备放进一个界面：开灯、调空调、看摄像头，设备之间的联动（比如“到家自动开灯”）都在这里设。

      第一次打开：主人的账号装好时就建好了，打开网页直接用，不用输密码。界面默认中文，应用的数据统计默认关闭，你做的配置和集成都保存在插件自己的数据目录里。

      它要直接待在局域网里才能发现设备，所以用的是能直接访问本机和局域网的最高级别网络权限。网页只经云吞的通道进来，但本机上的程序和直接联网的其他容器也能绕过网页、用这个免密码入口——不要在不信任的共用主机上启用。

      自动发现新设备需要收发底层网络包的权限（已声明）；蓝牙的完整接入还需要底座暂不支持的能力，所以没有申请蓝牙权限。
    en: |
      One place for the smart devices of every brand: control lights, air conditioning and cameras, and set routines between devices like "lights on when I get home".

      First open: the owner's account is set up at install — open the web page and use it, no password asked. Chinese is the default language, analytics are disabled, and your configuration and integrations persist in the plugin's own data.

      Finding devices on the network needs the highest-level network permission: the plugin can reach the host machine and the LAN directly. The web page is only reached through Wonton's channel, but host processes and other host-network containers can also skip the page and use this passwordless entry — do not enable it on an untrusted shared host.

      Automatic device discovery needs permission to send and receive low-level network packets (declared); full Bluetooth support needs a capability the plugin spec does not allow, so no Bluetooth permission is declared.
  release_notes: { zh: 介绍重写：账号免密码登录的说明单独成段放在最前，网络权限和蓝牙限制改成日常说法。, en: "Rewritten store copy: the passwordless sign-in note stands alone up front, and network permissions and the Bluetooth limitation are explained in everyday words." }
  webui:
    service: web
    port: 18123
    sso: none
  permissions:
    - network.host
    - cap.NET_RAW
    - owner.identity
  secrets:
    owner_password:
      generate: { bytes: 32 }
  requirements:
    arch: [amd64, arm64]
    memory: 1G
