# Home Assistant：宿主网络用于 mDNS、SSDP 和 DHCP 发现；网页只监听回环，由核心中继接入网关。
services:
  init:
    image: ghcr.io/home-assistant/home-assistant:2026.11.1@sha256:6785d1eca68747a524c156faae1b139ed415c07357386ae6fe17291986e59e82
    user: "${PUID}:${PGID}"
    entrypoint: ["python3", "/wonton/seed.py"]
    environment:
      TZ: ${TZ}
    volumes:
      - ${WONTON_APP_DATA}/config:/config
    configs:
      - source: seed
        target: /wonton/seed.py
      - source: configuration
        target: /wonton/configuration.yaml
    network_mode: none
    restart: "no"

  home-assistant:
    image: ghcr.io/home-assistant/home-assistant:2026.11.1@sha256:6785d1eca68747a524c156faae1b139ed415c07357386ae6fe17291986e59e82
    # 上游 /init 的 s6 启动链需要 root；不使用 privileged，DHCP 只加 NET_RAW。
    entrypoint: ["python3", "/wonton/start.py"]
    configs:
      - source: start
        target: /wonton/start.py
    depends_on:
      init:
        condition: service_completed_successfully
    environment:
      TZ: ${TZ}
    volumes:
      - ${WONTON_APP_DATA}/config:/config
    network_mode: host
    cap_add:
      - NET_RAW
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8123/manifest.json"]
      interval: 30s
      timeout: 5s
      start_period: 120s
      start_interval: 2s

  onboarding:
    image: ghcr.io/home-assistant/home-assistant:2026.11.1@sha256:6785d1eca68747a524c156faae1b139ed415c07357386ae6fe17291986e59e82
    entrypoint: ["python3", "/wonton/onboard.py"]
    network_mode: host
    restart: "no"
    environment:
      OWNER_NAME: ${WONTON_OWNER_NAME}
      OWNER_PASSWORD: ${WONTON_SECRET_OWNER_PASSWORD}
    depends_on:
      home-assistant:
        condition: service_healthy
    configs:
      - source: onboarding
        target: /wonton/onboard.py

  web:
    # 官方 nginx（BSD-2-Clause）：HA 拒绝带 XFF 的非代理请求，可信代理又不能用于 trusted_networks。
    # 只去掉转发头，不注入身份；两个监听端口都限定回环，核心仍负责网关认证和 unix 中继。
    image: nginx:1.31.8-alpine@sha256:713fc2ebfd92e8217db451477182ee91944b123d2b1ee9fd5a8c6e91ca6c3a11
    network_mode: host
    depends_on:
      onboarding:
        condition: service_completed_successfully
    configs:
      - source: web
        target: /etc/nginx/conf.d/default.conf
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:18123/manifest.json"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      start_interval: 1s

configs:
  seed:
    file: init/seed.py
  start:
    file: init/start.py
  onboarding:
    file: init/onboard.py
  web:
    file: web/default.conf
  configuration:
    file: config/configuration.yaml

x-wonton:
  spec: "0.11"
  id: io.home-assistant.home-assistant
  version: 0.2.1
  kind: app
  title: { zh: 智能家居中控（Home Assistant）, en: Smart Home Hub (Home Assistant) }
  description:
    zh: 像米家 App，但不挑牌子：把家里各品牌的智能设备放进一个界面控制，开灯、调空调，还能设“到家自动开灯”这样的联动。
    en: 'One app for every smart device, whatever the brand: control lights and air conditioning in one place and set routines like "lights on when I get home".'
  icon: icon.svg
  notices: [NOTICE]
  screenshots: [screenshots/home.png]
  author: { name: geraldpeng6, url: https://github.com/geraldpeng6 }
  homepage: https://www.home-assistant.io
  license: Apache-2.0
  tags:
    zh: [智能家居, 自动化]
    en: [Smart Home, Automation]
  about:
    zh: |
      Home Assistant 是一个开源智能家居平台：接入设备，创建自动化，并在仪表盘中查看和控制家里的状态。

      插件使用宿主网络来支持局域网发现。网页只监听 127.0.0.1，由云吞核心中继接入；宿主网络仍意味着插件可以访问本机服务和局域网。DHCP 发现需要 NET_RAW。蓝牙完整接入还需要容器规范尚未允许的 /run/dbus 挂载，因此未声明蓝牙权限。

      安装时通过上游 onboarding 接口创建主人的账号，密码由核心随机生成，打开网页后经回环可信网络免密码登录。默认中文，分析和遥测默认关闭，配置与集成保存在插件数据目录。宿主进程和其他宿主网络容器也能使用这个免密码入口；不要在不信任的共用主机上启用。
    en: |
      Home Assistant is an open-source smart home platform for connecting devices, building automations, and viewing and controlling the home from dashboards.

      This plugin uses the host network for LAN discovery. The web server listens only on 127.0.0.1 and is reached through the Wonton core relay; host networking still lets the plugin reach services on the host and the LAN. DHCP discovery needs NET_RAW. Full Bluetooth support also needs a /run/dbus mount that the plugin spec does not allow, so Bluetooth permissions are not declared.

      Upstream onboarding creates the owner's account using a password generated by Wonton. Loopback trusted-network authentication opens the app without asking for that password. Chinese is the default language, analytics are disabled, and configuration and integrations persist in the plugin data. Host processes and other host-network containers can also use this passwordless entry; do not enable it on an untrusted shared host.
  release_notes: { zh: 插件包迁入官方插件合仓，保留当前分支的宿主网络发现、onboarding 初始化和数据探针。, en: "Moved the plugin package into the official Wonton plugin monorepo; retains host-network discovery, onboarding initialization and data probes from the current branch." }
  webui:
    service: web
    port: 18123
    sso: none
  permissions:
    - network.host
    - cap.NET_RAW
    - owner.identity
  secrets:
    owner_password:
      generate: { bytes: 32 }
  requirements:
    arch: [amd64, arm64]
    memory: 1G
