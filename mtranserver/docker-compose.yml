# MTranServer 离线翻译：家里的 CPU 跑本地翻译模型，浏览器翻译扩展连局域网端口，网页经核心网关（代注入 API 令牌）。
# 上游 xxnuo/MTranServer，Apache-2.0，镜像按清单列表（index）的摘要固定。
# 镜像默认只跑 CPU（GPU 由上游单独的 compose 提供，不做），以 root 运行，数据目录由核心交给 PUID:PGID。
services:
  mtranserver:
    image: xxnuo/mtranserver:5.1.1@sha256:2f0301ddeda29b8820926e841343252d35f2bef29b45c7fe02260ffbab0c8f2b
    environment:
      MT_PORT: "8989"
      # 配置（records.json 模型索引、UI 保存的 server.json、日志）和模型各自一个目录，换机器都要带走。
      # server.json 固定写在 homeDir（/root/.config/mtran）而非 MT_CONFIG_DIR，所以挂整个 mtran 目录。
      MT_CONFIG_DIR: /root/.config/mtran/server
      MT_MODEL_DIR: /app/models
      # 保持联网模式：首次翻译一个语言方向时自动下载模型文件，之后同一方向离线可用。
      MT_OFFLINE: "false"
      MT_API_TOKEN: ${WONTON_SECRET_API_TOKEN}
    volumes:
      - ${WONTON_APP_DATA}/config:/root/.config/mtran
      - ${WONTON_APP_DATA}/models:/app/models
    # 镜像没有 curl/wget，用自带的 node 调无鉴权的 /health。
    # 出网代理开着时核心注入的 NO_PROXY 含回环，检查不会被送去代理。
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8989/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      start_interval: 2s

  # OpenAPI→MCP 适配器由合仓 kiwix/images/mcp-openapi-proxy/ 构建，按 kiwix/v0.1.2 发布摘要共用，
  # 把 mtranserver 的翻译接口包成 MCP 工具给 Bot 用，规范见 mcp/openapi.json。
  # 上游 mcp-openapi-proxy 0.4.0（MIT），镜像只是 pip 安装上游包，没有改源码。
  # 翻译、检测都是只读计算（不写任何数据）；spec 里 summary 以查询动词开头，适配器据此给 POST 工具
  # 标只读（否则总线上每次调用都要用户确认）。
  mcp:
    image: ghcr.io/wontonapp/mcp-openapi-proxy:0.1.2@sha256:71fda0bebe5985a5e340b6d14e0451002f41c3b5fed8c21b7fa03e0d62536ce1
    user: "${PUID}:${PGID}"
    read_only: true
    environment:
      MCP_TRANSPORT: streamable-http
      MCP_HOST: 0.0.0.0
      MCP_PORT: "8000"
      OPENAPI_SPEC_URL: file:///mcp/openapi.json
      SERVER_URL_OVERRIDE: http://mtranserver:8989
      # 上游认 Bearer 令牌：适配器对上游发 Authorization: Bearer <API_KEY>，复用插件已有的密钥。
      API_KEY: ${WONTON_SECRET_API_TOKEN}
      # 适配器只连插件网络里的上游，不出网：代理变量写空（写成空=这个服务不走代理）。
      # python 客户端会读这些变量，服务名不在 NO_PROXY 名单里时内网请求会被送去出网代理，报 502。
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      http_proxy: ""
      https_proxy: ""
    configs:
      - source: openapi
        target: /mcp/openapi.json
    depends_on:
      mtranserver:
        condition: service_healthy
    healthcheck:
      # 镜像只有 python（slim 没有 curl/wget），健康检查就用它。
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=5)"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      start_interval: 2s

configs:
  openapi:
    file: mcp/openapi.json

x-wonton:
  spec: "0.17"
  id: app.github.xxnuo.mtranserver
  version: 0.1.3
  kind: app
  title: { en: "MTranServer" }
  subtitle: { zh: "离线翻译", en: "Offline Translation", zh-Hant: "離線翻譯", ja: "オフライン翻訳" }
  description:
    zh: 在自己家里跑的翻译服务，像翻译网站一样好用：装上浏览器翻译扩展接上它，整页、划词都能翻，文字不出家门。
    en: "A translation service running at home, like the online ones: browser translate extensions plug into it, and your text never leaves home."
    zh-Hant: 在自己家裡跑的翻譯服務，像翻譯網站一樣好用：裝上瀏覽器翻譯擴充接上它，整頁、劃詞都能翻，文字不出家門。
    ja: 家で動く翻訳サービスで、オンラインのものと同じように使えます。ブラウザの翻訳拡張をこれにつなげば、ページ全体も選択部分も翻訳でき、文章は家から出ません。
  icon: icon.png
  notices: [NOTICE]
  screenshots: [screenshots/home.png, screenshots/history.png]
  author: { name: geraldpeng6, url: https://github.com/geraldpeng6 }
  homepage: https://github.com/xxnuo/MTranServer
  # 应用（MTranServer）的许可证；插件包自己的许可证写在仓库的 LICENSE 里。
  license: Apache-2.0
  tags:
    zh: [工具, 翻译]
    en: [Tools, Translation]
  setup:
    zh: 网页里直接就能翻，不用设置。浏览器扩展要连的话：先在插件详情里打开「在局域网开放」，把地址和「连接密码」按扩展的要求填进去。
    en: The web page translates as is, no setup. For a browser extension, first turn on "Open on LAN" in the plugin details, then fill its address and the connection password into the extension.
    zh-Hant: 網頁裡直接就能翻，不用設定。瀏覽器擴充要連的話：先在外掛詳情裡開啟「在區域網路開放」，把位址和「連線密碼」照擴充的要求填進去。
    ja: Web ページは設定なしでそのまま翻訳できます。ブラウザ拡張からつなぐ場合は、先にプラグイン詳細で「LAN で公開」をオンにし、アドレスと「接続パスワード」を拡張の指示に従って入力します。
  about:
    zh: |
      翻译在自己家里的电脑上完成，不用显卡：速度取决于电脑配置和文本长度，日常阅读、看懂大意都够快。

      在浏览器里装沉浸式翻译、简约翻译、划词翻译这类扩展，指到这台服务器上，读外文网页就不用一段段复制了。支持 DeepL、DeepLX、Google 翻译接口的软件也能接。

      第一次翻某个语言方向时会联网下载语言包（几十到一百多 MB），之后这个方向就不用联网。

      家里的助手也能帮你翻：让它翻一段话，它就用家里的翻译服务来翻。
    en: |
      Translation runs on your home computer, no graphics card needed: speed depends on the machine and the text length, and everyday reading is plenty fast.

      In a browser with an extension like Immersive Translate, KISS Translator or 划词翻译, point the service at this server and read foreign pages without copy-pasting. Software that speaks the DeepL, DeepLX or Google Translate APIs works too.

      The first translation in a language pair downloads its pack (tens to over a hundred MB); after that the pair works without internet.

      The home assistant can translate for you too: ask it to translate something and it uses the home service.
    zh-Hant: |
      翻譯在自己家裡的電腦上完成，不用顯示卡：速度取決於電腦設定和文字長度，日常閱讀、看懂大意都夠快。

      在瀏覽器裡裝沉浸式翻譯、簡約翻譯、劃詞翻譯這類擴充，指到這台伺服器上，讀外文網頁就不用一段段複製了。支援 DeepL、DeepLX、Google 翻譯介面的軟體也能接。

      第一次翻某個語言方向時會連網下載語言包（幾十到一百多 MB），之後這個方向就不用連網。

      家裡的助手也能幫你翻：讓它翻一段話，它就用家裡的翻譯服務來翻。
    ja: |
      翻訳は家のパソコン上で完結し、グラフィックカードは不要です。速度はマシンの構成と文章の長さ次第で、普段の読書には十分な速さです。

      Immersive Translate、KISS Translator、劃詞翻訳などの拡張を入れたブラウザからこのサーバを指定すれば、外国語のページをコピペせずに読めます。DeepL・DeepLX・Google 翻訳の API に対応したソフトからも使えます。

      ある言語方向を初めて翻訳するときに言語パックをダウンロードし（数十〜100 MB 以上）、その後はその方向をオフラインで翻訳できます。

      家のアシスタントにも頼めます。翻訳を頼むと家の翻訳サービスを使います。
  release_notes:
    zh: |
      插件包迁入官方插件合仓，翻译工具共用官方发布的适配器镜像。

      商店介绍重写：扩展接入步骤移到「安装后要做的事」，令牌、翻译文件等说法换成日常用语；补繁体中文和日文。
    en: |
      Moved into the official Wonton plugin monorepo; translation tools share the officially published adapter image.

      Store copy rewritten: extension setup moved to the pre-install notice, with token/model-file wording in everyday words; Traditional Chinese and Japanese added.
    zh-Hant: "外掛包遷入官方外掛合倉，翻譯工具共用官方釋出的介面卡映象。\n\n商店介紹重寫：擴充接入步驟移到「安裝後要做的事」，令牌、翻譯檔等說法換成日常用語；補繁體中文和日文。"
    ja: "プラグインを公式プラグインリポジトリへ移しました。翻訳ツールが共有するアダプターイメージは公式配布のものを使います。\n\nストア紹介を書き直し、拡張の接続手順を「インストール後の手順」に移し、トークンや翻訳ファイルなどの言い方を日常的な言葉にしました。繁体字中国語と日本語を追加。"
  webui:
    service: mtranserver
    port: 8989
    # 应用不认用户，只认自己的 API 令牌：网关代注入 Authorization: Bearer，网页里的翻译不用用户再填令牌。
    sso: proxy
    proxy:
      headers:
        Authorization: "Bearer {secret:api_token}"
  mcp:
    service: mcp
    port: 8000
    transport: streamable-http
  # 浏览器翻译扩展连这个端口。8989 同时是网页端口，但代注入只用 {secret:…}、不代用户身份，
  # 核心判定不需要 lan_webui 开关：端口装好就开（实测确认）。
  # 应用只有令牌、没有用户名；令牌用 show_owner 给主人看。
  lan:
    ports:
      - { service: mtranserver, port: 8989 }
  secrets:
    api_token:
      generate: { bytes: 24 }
      show_owner: { label: { zh: API 令牌, en: API token } }
  permissions:
    # 首次翻译一个语言方向时从 Mozilla 的模型源下载文件（Firefox 翻译模型）。
    - network.egress
    # 翻译扩展在局域网里直连（装好后即开放；装在不可信局域网时注意已知限制，见 README）。
    - network.lan
    # MCP 工具经核心总线暴露给 Bot；规范 0.11 起只有声明 tools 权限的插件才注入 WONTON_MCP_URL。
    - tools
  # 上游没写最低内存：官方数据英译中峰值约 392 MiB，加余量取 512M。
  requirements:
    arch: [amd64, arm64]
    memory: 512M
