name: homebox

configs:
  init-mail:
    file: ./init-mail.py

services:
  # 一次性初始化：把应用里账号的邮箱同步成注入的内部邮箱。homebox 的 OIDC 登录按 issuer+sub 认
  # 既有账号，命中后不再更新邮箱字段，核心换成内部邮箱后装好的实例要改一次；脚本幂等，首次安装
  # 时还没有数据库，什么都不做。
  init-mail:
    # 只为读 SQLite：python:3.13-alpine 官方镜像（Python-2.0 许可证），homebox 镜像里没有 sqlite3，
    # 上游也没有改邮箱的命令行或接口。
    image: docker.io/library/python:3.13-alpine@sha256:1e1f6334529d1fb26a2ef619d7cffb30a7c7d7cc1cc7338ebee283a58d1aeaca
    entrypoint: ["python3", "/init-mail.py"]
    configs:
      - source: init-mail
        target: /init-mail.py
    user: "${PUID}:${PGID}"
    environment:
      WONTON_OWNER_EMAIL: ${WONTON_OWNER_EMAIL}
    volumes:
      - ${WONTON_APP_DATA}:/data
    network_mode: none
    restart: "no"

  homebox:
    # 上游在 ghcr 只发 latest/main/nightly（没有版本标签），在 Docker Hub 发版本标签；这里用 Docker Hub 的
    # 版本标签 0.27.1 加清单列表摘要固定，摘要与此前 ghcr latest 固定的是同一份（逐字节相同）。
    # 装好后核对 /api/v1/status 里的版本和发布说明一致。
    image: docker.io/sysadminsmedia/homebox:0.27.1@sha256:9d0b64776c694f018c0ca06faf52105a33ca376024f46bb58e6ab0e2b728bb61
    # 上游镜像默认 root，这里以主人的用户跑：SQLite 和附件对属主无要求，宿主上的文件归主人。
    user: "${PUID}:${PGID}"
    depends_on:
      init-mail:
        condition: service_completed_successfully
    environment:
      HBOX_MODE: production
      # 数据全在 /data：SQLite 库（下面两条是上游 Dockerfile 里的 ENV，写显了免得读镜像才知道）和附件
      # （存储根 file:/// 加前缀 data），挂进插件数据目录。
      HBOX_STORAGE_CONN_STRING: "file:///?no_tmp_dir=true"
      # 没申请出网：关掉启动时的版本检查，免得每次启动记一条连不上 GitHub 的错误。
      HBOX_OPTIONS_GITHUB_RELEASE_CHECK: "false"
      # 只经 OIDC 用，不给注册和密码登录留入口。
      HBOX_OPTIONS_ALLOW_REGISTRATION: "false"
      HBOX_OPTIONS_ALLOW_LOCAL_LOGIN: "false"
      # 网关会重设 X-Forwarded-*，据此生成 OIDC 回调地址。
      HBOX_OPTIONS_TRUST_PROXY: "true"
      HBOX_OIDC_ENABLED: "true"
      HBOX_OIDC_ISSUER_URL: ${WONTON_OIDC_ISSUER}
      HBOX_OIDC_CLIENT_ID: ${WONTON_OIDC_CLIENT_ID}
      HBOX_OIDC_CLIENT_SECRET: ${WONTON_OIDC_CLIENT_SECRET}
      # 打开网页直接跳 OIDC 登录。
      HBOX_OIDC_AUTO_REDIRECT: "true"
      # API 密钥的哈希混入密钥（上游要求 ≥32 字节，必须跨重启稳定），由核心生成、保管。
      HBOX_AUTH_API_KEY_PEPPER: ${WONTON_SECRET_API_KEY_PEPPER}
    volumes:
      - ${WONTON_APP_DATA}:/data
    healthcheck:
      # /api/v1/status 只收 GET（HEAD 返回 405），不能用 --spider。
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:7745/api/v1/status"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
      start_interval: 1s

x-wonton:
  spec: "0.11"
  id: software.homebox
  version: 0.2.0
  kind: app
  title: { zh: 家庭物品清单（HomeBox）, en: Home Inventory (HomeBox) }
  description:
    zh: 把家里的东西登记在册：放在哪、多少钱买的、保修到哪天，一查就知道；还能打印二维码贴上，扫一下就找到。
    en: "A record of everything you own: where it is, what it cost and when the warranty ends. Print a QR label, stick it on, and a scan pulls up the item."
  icon: icon.svg
  notices: [NOTICE]
  screenshots: [screenshots/home.png]
  author: { name: geraldpeng6, url: https://github.com/geraldpeng6 }
  homepage: https://homebox.software
  license: AGPL-3.0-only
  tags:
    zh: [物品清单, 家庭]
    en: [Inventory, Home]
  about:
    zh: |
      把家里的东西登记成清单：每件物品记下放在哪个位置、拍了什么照片、值多少钱、保修到什么时候。位置一层层往下分，
      每个位置和物品都有自己的资产编号和二维码，打印出来贴上，扫码就能找到。

      清单存在自己家里，登录走云吞的身份，打开就是自己的清单。应用发的信（保养到期提醒）会出现在你的 Wonton 私聊里。

      核心升级后，插件容器会按新的签发方自动重建，打开照常，不用重装。
    en: |
      Register what you own as an inventory: for each item note where it is, what it looks like, what it's worth
      and when the warranty ends. Locations nest level by level; every location and item gets an asset ID and a
      QR code you can print and stick on, so finding things is a scan away.

      Your inventory stays at home. Sign-in goes through Wonton's identity, and it opens straight to your own
      inventory. Mail the app sends (maintenance reminders) shows up in your Wonton chat.

      After a core upgrade the plugin's containers are rebuilt with the new issuer automatically; pages open as before, with nothing to reinstall.
  release_notes: { zh: 插件包迁入官方插件合仓，保留当前分支的内部邮箱通知支持。, en: "Package moved into the official Wonton plugin monorepo; retains the current branch's internal-mail notification support." }
  webui:
    service: homebox
    port: 7745
    sso: oidc
    oidc:
      redirect_paths: [/api/v1/users/login/oidc/callback]
  # notify：让应用能把信发进收件人的 Wonton 私聊。homebox 的发信入口是网页「通知（Notifiers）」里按人
  # 配的 Shoutrrr smtp:// URL，不带用户名密码就不认证，直连核心邮箱服务器；它没有环境变量入口，注入的
  # WONTON_SMTP_* compose 里用不上，但不申请 notify 核心不在插件网络里放这个服务。owner.identity 是
  # 一次性初始化要 WONTON_OWNER_EMAIL 把应用账号的邮箱同步成内部地址（见 init-mail）。
  permissions: [notify, owner.identity]
  secrets:
    api_key_pepper:
      generate: { bytes: 32 }
  # 上游没写最低内存；requirements.memory 按开发环境实测空闲占用取整（见提交时的验证记录）。镜像支持 amd64 和 arm64。
  requirements:
    arch: [amd64, arm64]
    memory: 256M
