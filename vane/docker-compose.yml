# Vane：AI 搜索，内置 SearXNG。模型走核心的模型网关，没接上网关时用户在设置里配自己的 provider。
#
# Vane 的配置是一份 data/config.json，应用启动时还会改写它。模型网关的地址和凭据在每次创建容器时都要跟着
# 注入值走，所以由一次性服务在应用启动前写进数据目录，只动自己的 provider（模型和本地 embedding），
# 不动用户加的其他 provider；没接上网关时摘掉网关的 provider，模型要用户自己配。
# 配置写坏了、解析不了时安装失败，不静默覆盖。
services:
  seed-config:
    # 镜像按摘要固定（这里是多架构清单列表的摘要），标签写上游的版本。
    image: itzcrazykns1337/vane:v1.12.2@sha256:61f2bbf3386ff3df08911fb3de0e1893b04702a4d49ef13fbadbda937b47ab7c
    # 镜像里没有别的 JS 运行时依赖，直接用 node 跑包里的脚本。
    entrypoint: ["node", "/seed/seed-config.js"]
    environment:
      WONTON_MODEL_BASE_URL: ${WONTON_MODEL_BASE_URL}
      WONTON_MODEL_API_KEY: ${WONTON_MODEL_API_KEY}
      WONTON_MODEL_DEFAULT: ${WONTON_MODEL_DEFAULT}
    volumes:
      # 应用把配置和数据库写在 DATA_DIR（/home/vane/data）里。和 uploads 是平级的两块，不嵌套。
      - ${WONTON_APP_DATA}/data:/home/vane/data
    configs:
      - source: seed-config
        target: /seed/seed-config.js
    network_mode: none
    restart: "no"

  vane:
    image: itzcrazykns1337/vane:v1.12.2@sha256:61f2bbf3386ff3df08911fb3de0e1893b04702a4d49ef13fbadbda937b47ab7c
    # 镜像以 root 启动，再用 sudo 降成 searxng 用户起内置的 SearXNG；写成 PUID 没有 sudo 权限。
    # 入口要改镜像层里的 SearXNG 设置和 .next 产物，所以不用 read_only；数据目录里的文件也因此归 root。
    # Docker 把 HOSTNAME 设成容器名，Next 的独立服务器据此绑定；不覆盖时只监听容器 IP，127.0.0.1 连不上。
    environment:
      HOSTNAME: "0.0.0.0"
      # 镜像里的 SearXNG 设置写着一个公开的 secret_key，SearXNG 用它签 session；换成本插件自己的。
      SEARXNG_SECRET: ${WONTON_SECRET_SEARXNG_SECRET}
      # 有自己代理设置的 SearXNG 用它，不碰核心注入的 HTTP(S)_PROXY；没配代理时是空串。
      WONTON_PROXY_URL: ${WONTON_PROXY_URL}
    entrypoint: ["/bin/sh", "/seed/entrypoint.sh"]
    configs:
      - source: entrypoint
        target: /seed/entrypoint.sh
      - source: patch-search
        target: /seed/patch-search.cjs
    volumes:
      - ${WONTON_APP_DATA}/data:/home/vane/data
      - ${WONTON_APP_DATA}/uploads:/home/vane/uploads
      # transformers.js 把本地 embedding 模型下到 node_modules 里的 .cache，放进命名卷，重建容器不用重下。
      - hf-cache:/home/vane/node_modules/@huggingface/transformers/.cache
    depends_on:
      seed-config:
        condition: service_completed_successfully
    healthcheck:
      # API 能返回 200 说明应用和配置都在，SearXNG 的页面能出来说明内置的搜索引擎起来了。
      # 不看 provider 列表的内容：模型网关没接上时没有 chat provider，也是健康。
      test:
        - CMD-SHELL
        - curl -fsS http://127.0.0.1:3000/api/providers && curl -fsS -o /dev/null http://127.0.0.1:8080/
      interval: 30s
      timeout: 15s
      start_period: 90s
      start_interval: 3s
      retries: 3

volumes:
  # 本地 embedding 模型的下载缓存。
  hf-cache:

configs:
  seed-config:
    file: web/seed-config.js
  entrypoint:
    file: web/entrypoint.sh
  patch-search:
    file: web/patch-search.cjs

x-wonton:
  spec: "0.11"
  id: com.github.itzcrazykns.vane
  version: 0.2.2
  kind: app
  title: { zh: "AI 搜索（Vane）", en: "AI Search (Vane)", zh-Hant: "AI 搜尋（Vane）", ja: "AI 検索（Vane）" }
  description:
    zh: 会先查资料再回答的 AI：每个问题都先上网搜，再写出标明出处的回答，适合查新闻、找资料。
    en: "An AI that searches before it answers: every question goes to the web first, and the answer comes back with its sources. Good for news and research."
    zh-Hant: 會先查資料再回答的 AI：每個問題都先上網搜，再寫出標明出處的回答，適合查新聞、找資料。
    ja: 調べてから答える AI です。どの質問も先に Web を検索し、出典を示した回答を書きます。ニュースや調べ物に向きます。
  icon: icon.png
  notices: [NOTICE]
  screenshots: [screenshots/01-home.png, screenshots/02-searching.png, screenshots/03-answer.png, screenshots/04-answer-end.png, screenshots/05-library.png]
  author: { name: geraldpeng6, url: https://github.com/geraldpeng6 }
  homepage: https://github.com/ItzCrazyKns/Vane
  license: MIT
  tags:
    zh: [AI, 搜索]
    en: [AI, Search]
  setup:
    zh: 打开直接提问，也能带一份文档提问。模型默认走云吞的模型服务，装好就能用；要换服务商，在设置里填自己的地址和密钥。
    en: Open it and ask — you can also attach a document. The model goes through Wonton's model service by default, ready to use; to use another provider, enter your own address and key in the settings.
    zh-Hant: 開啟直接提問，也能帶一份文件提問。模型預設走雲吞的模型服務，裝好就能用；要換服務商，在設定裡填自己的位址和密鑰。
    ja: 開いてそのまま質問でき、資料を添えることもできます。モデルは既定で Wonton のモデルサービスを通り、すぐ使えます。別のサービスを使うときは、設定で自分のアドレスとキーを入れます。
  about:
    zh: |
      先搜网页，再让 AI 读结果、写出带出处的回答。

      可以只搜网页、论文或社区讨论，也可以带着文档提问，搜到的网页也能自己打开看。

      搜索历史留在这台机器上。搜索本身要能上网。
    en: |
      It searches the web first, then has the AI read the results and write an answer with sources.

      Search the web, papers or discussions only, or attach a document to the question; you can also open the pages it found yourself.

      Search history stays on this machine. Searching needs internet access.
    zh-Hant: |
      先搜網頁，再讓 AI 讀結果、寫出帶出處的回答。

      可以只搜網頁、論文或社群討論，也可以帶著文件提問，搜到的網頁也能自己開啟看。

      搜尋歷史留在這台機器上。搜尋本身要能上網。
    ja: |
      先に Web を検索し、その結果を AI に読ませて出典付きの回答を書かせます。

      Web・論文・コミュニティの議論だけを対象にしたり、資料を添えて質問したりでき、見つかったページは自分で開くこともできます。

      検索履歴はこのマシンに残ります。検索にはインターネットが必要です。
  release_notes:
    zh: |
      插件包迁入官方插件合仓，保留当前分支的可选模型网关支持。

      商店介绍重写：模型接法和文档提问移到「安装后要做的事」，模型网关、key 等说法换成日常用语；补繁体中文和日文。
    en: |
      Moved the plugin package into the official Wonton plugin monorepo; retains the optional model-gateway support from the current branch.

      Store copy rewritten: model wiring and document questions moved to the pre-install notice, with model-gateway/key wording in everyday words; Traditional Chinese and Japanese added.
    zh-Hant: "外掛包遷入官方外掛合倉，保留當前分支的可選模型閘道器支援。\n\n商店介紹重寫：模型接法和文件提問移到「安裝後要做的事」，模型閘道、key 等說法換成日常用語；補繁體中文和日文。"
    ja: "プラグインを公式プラグインリポジトリへ移動しました。現行ブランチのオプションのモデルゲートウェイ対応は維持しています。\n\nストア紹介を書き直し、モデル接続と資料付きの質問を「インストール後の手順」に移し、モデルゲートウェイやキーなどの言い方を日常的な言葉にしました。繁体字中国語と日本語を追加。"
  webui:
    service: vane
    port: 3000
    # Vane 没有账号体系，本来不需要登录（规范：proxy 要应用官方支持代理头认证或固定密钥）；网关照常校验会话。
    sso: none
  # 模型只走可选能力模型网关。
  # Models go through the optional model gateway only.
  wants: [models]
  permissions:
    # SearXNG 要访问外部的搜索引擎，本地 embedding 模型从 Hugging Face 下载。
    # SearXNG queries external search engines and the local embedding model comes from Hugging Face.
    - network.egress
  secrets:
    searxng_secret:
      generate: { bytes: 32 }
  # 上游没写最低内存；本机空闲实测约 338M，取 512M。镜像支持 amd64 和 arm64（docker manifest inspect）。
  requirements:
    arch: [amd64, arm64]
    memory: 512M
