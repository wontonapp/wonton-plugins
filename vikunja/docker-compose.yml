# Vikunja：API、前端和 SQLite 在同一个进程里，不额外起数据库。
#
# 登录全走核心的 OIDC：`auth.local.enabled` 关掉本地登录和注册，用户打开就由核心的身份提供方登进去。
# Vikunja 的 OIDC 只写 issuer（`authurl`），端点由它自己从发现文档取；2.8.0 接受 http 的 issuer
# （实测，核心的 OIDC 是 http）。`requireavailability` 让核心连不上时启动直接失败，不装作正常。
services:
  vikunja:
    image: vikunja/vikunja:2.8.0@sha256:35d937baf3b5d5803bed6b9e11d007448b7b536df9e4346dc35551e1072636c3
    # 镜像里的二进制固定以 1000 运行；两个数据目录交给它。
    user: "1000:1000"
    environment:
      TZ: ${TZ}
      # 发信（notify）：核心的内部 SMTP 不宣告 STARTTLS，Vikunja 的机会性 TLS 保持明文；
      # 不填用户名密码，避免 Go 的 PlainAuth 在明文连接上拒绝认证。信转进收件人的 Wonton 私聊。
      VIKUNJA_MAILER_ENABLED: "true"
      VIKUNJA_MAILER_HOST: ${WONTON_SMTP_HOST}
      VIKUNJA_MAILER_PORT: ${WONTON_SMTP_PORT}
      VIKUNJA_MAILER_FROMEMAIL: ${WONTON_MAIL_FROM}
    volumes:
      # SQLite 库和附件。
      - ${WONTON_APP_DATA}/db:/db
      - ${WONTON_APP_DATA}/files:/app/vikunja/files
    configs:
      - source: config
        target: /app/vikunja/config.yml
    healthcheck:
      # 镜像只有二进制，没有 shell 和 curl。`doctor` 检查配置、数据库、附件目录和 OIDC 发现，
      # 有一项不过就以 1 退出。
      test: ["CMD", "/app/vikunja/vikunja", "doctor"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 60s
      start_interval: 2s

configs:
  config:
    content: |
      service:
        publicurl: ${WONTON_APP_URL}/
        timezone: ${TZ}
        # 不写就每次启动随机生成，重启后所有会话失效。
        secret: ${WONTON_SECRET_SERVICE_SECRET}
      database:
        type: sqlite
      files:
        basepath: /app/vikunja/files
      # 前端只认用户设置里的语言，OIDC 建号时拿不到浏览器语言，默认给中文。
      defaultsettings:
        language: zh-CN
        timezone: ${TZ}
        # 提醒邮件也进 Wonton 私聊，新建用户默认开；上游对外部邮箱默认关是怕扰人。
        email_reminders_enabled: true
      auth:
        local:
          enabled: false
        openid:
          enabled: true
          providers:
            wonton:
              name: Wonton
              authurl: ${WONTON_OIDC_ISSUER}
              clientid: ${WONTON_OIDC_CLIENT_ID}
              clientsecret: ${WONTON_OIDC_CLIENT_SECRET}
              requireavailability: true

x-wonton:
  spec: "0.17"
  id: io.vikunja.vikunja
  version: 0.3.1
  kind: app
  title: { en: "Vikunja" }
  subtitle: { zh: "待办清单", en: "To-Do Lists", zh-Hant: "待辦清單", ja: "To-Do リスト" }
  description:
    zh: 像贴满便利贴的任务墙：把要做的事列成清单、设截止日期、和家人分工，做完拖到“完成”那栏；快到期会在云吞私聊里提醒你。
    en: "Like a wall of sticky notes: list what needs doing, set due dates, split the work with family and drag tasks to Done; reminders arrive in your Wonton chat."
    zh-Hant: 像貼滿便利貼的任務牆：把要做的事列成清單、設截止日期、和家人分工，做完拖到「完成」那欄；快到期會在雲吞私聊裡提醒你。
    ja: 付箋を貼ったタスクの壁のようなものです。やることをリストにし、期限を決め、家族で分担し、終わったら「完了」へドラッグします。期限が近いと Wonton チャットで知らせます。
  icon: icon.png
  notices: [NOTICE]
  screenshots: [screenshots/tasks.png]
  author: { name: geraldpeng6, url: https://github.com/geraldpeng6 }
  homepage: https://vikunja.io
  license: AGPL-3.0-only
  tags:
    zh: [待办, 任务, 看板, 清单]
    en: [Todo, Tasks, Kanban, Lists]
  setup:
    zh: 打开就用云吞账号直接进去，不用注册或设密码。先建一个清单，再邀请家人分工；快到期的提醒会进你的 Wonton 私聊。
    en: Opening it puts you straight in with your Wonton account — no sign-up or password. Create a list first, then invite family to share the work; due reminders arrive in your Wonton chat.
    zh-Hant: 開啟就用雲吞帳號直接進去，不用註冊或設密碼。先建一個清單，再邀請家人分工；快到期的提醒會進你的 Wonton 私聊。
    ja: 開けば Wonton アカウントでそのまま入れ、登録やパスワードは不要です。まずリストを作り、家族を招いて分担します。期限が近いと Wonton チャットに届きます。
  about:
    zh: |
      待办和任务管理：清单、任务、截止日期、标签、优先级和看板，进度一眼看到。

      评论和 @ 提到别人的通知、任务提醒都会出现在私聊里。
    en: |
      Todo and task management: lists, tasks, due dates, labels, priorities and kanban boards, so progress is visible at a glance.

      Comment and @-mention notices, and task reminders, arrive in your chat.
    zh-Hant: |
      待辦和任務管理：清單、任務、截止日期、標籤、優先級和看板，進度一眼看到。

      評論和 @ 提到別人的通知、任務提醒都會出現在私聊裡。
    ja: |
      To-Do とタスク管理：リスト、タスク、期限、ラベル、優先度、かんばんがあり、進捗が一目で分かります。

      コメントや @ の通知、タスクのリマインダーはチャットに届きます。
  release_notes:
    zh: |
      应用发的信接进云吞：任务提醒、评论和 @ 提到等通知转进收件人的 Wonton 私聊。插件包迁入官方插件合仓。

      商店介绍重写：登录和建清单移到「安装后要做的事」，看板、@ 提到等说法换成日常用语；补繁体中文和日文。
    en: |
      Emails the app sends now arrive in Wonton: task reminders, comments and @-mentions land in the recipient's Wonton chat. Package moved into the official Wonton plugin monorepo.

      Store copy rewritten: sign-in and list creation moved to the pre-install notice, with kanban/@-mention wording in everyday words; Traditional Chinese and Japanese added.
    zh-Hant: "應用發的信接進雲吞：任務提醒、評論和 @ 提到等通知轉進收件人的 Wonton 私聊。外掛包遷入官方外掛合倉。\n\n商店介紹重寫：登入和建清單移到「安裝後要做的事」，看板、@ 提到等說法換成日常用語；補繁體中文和日文。"
    ja: "アプリからの通知を Wonton につなぎました。タスクのリマインダー、コメント、@ メンションなどを受信者の Wonton ダイレクトメッセージへ転送します。プラグインは公式プラグインリポジトリへ移動しました。\n\nストア紹介を書き直し、サインインとリスト作成を「インストール後の手順」に移し、かんばんや @ などの言い方を日常的な言葉にしました。繁体字中国語と日本語を追加。"
  webui:
    service: vikunja
    port: 3456
    # 打开网页直接进 OIDC 登录，不用先点登录按钮。
    path: /login?redirectToProvider=wonton
    sso: oidc
    oidc:
      redirect_paths: [/auth/openid/wonton]
  secrets:
    service_secret:
      generate: { bytes: 32 }
  permissions:
    # 提醒和通知信经核心的内部 SMTP 转进收件人的 Wonton 私聊。
    - notify
    # Webhook、链接预览和 CalDAV 客户端要出网；出网时核心给内部地址写好 NO_PROXY，
    # 应用访问核心的 OIDC 才不被宿主代理挡住。
    - network.egress
  # 上游没写最低内存，本机空闲实测约 55M，取 128M。镜像有 amd64 和 arm64。
  requirements:
    arch: [amd64, arm64]
    memory: 128M
