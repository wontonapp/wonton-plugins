# Trilium 个人知识库：Node 服务 + SQLite 一体，单容器，数据全在插件数据目录。
#
# 认证交给云吞网关（TRILIUM_GENERAL_NOAUTHENTICATION）：插件网络是内部网络，能到 Trilium 的
# 只有带着主人会话的网关，容器不出网、不开局域网端口。上游文档明确这种场景可以关掉自带认证
# （docs/User Guide/.../Server Installation/Authentication.md："if authentication is handled by
# another component"）。不用 sso: oidc：Trilium 的 OIDC 要先在 Options 里把登录方式切到
# OpenID Connect，再从已登录会话点 Connect account 完成绑定（apps/server/src/services/open_id.ts
# 的 isOpenIDEnabled 要求 mfaMethod 选项为 oauth 且 subject identifier 已保存），新装实例没有
# 本地密码可登录，绑定无从发起，装上就会把用户挡在设置向导外。
#
# 首次打开是 Trilium 自己的设置向导（新建文档，或从旧实例同步/备份迁移），不做预置、不改数据。
services:
  trilium:
    image: triliumnext/trilium:v0.107.0@sha256:739ba0f0488f506549f7c21dc9e792decd99382cc759f01d5ec1abba32e87da8
    # 官方入口以 root 起，按 USER_UID/USER_GID 改 node 用户后降权运行（start-docker.sh：
    # usermod + chown -R /home/node + su）。服务不写 user，核心把数据目录交给 PUID:PGID，正好衔接。
    environment:
      TRILIUM_DATA_DIR: /home/node/trilium-data
      USER_UID: ${PUID}
      USER_GID: ${PGID}
      TZ: ${TZ}
      TRILIUM_GENERAL_NOAUTHENTICATION: "true"
    volumes:
      - ${WONTON_APP_DATA}/data:/home/node/trilium-data
    healthcheck:
      # /api/health-check 由监听中的服务真实作答（routes.ts 里注册，不带鉴权中间件）；
      # 镜像自带的 HEALTHCHECK 走同一个端点，这里按官方索引要求在 compose 里显式写出。
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/api/health-check"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      start_interval: 2s

x-wonton:
  spec: "0.17"
  id: org.triliumnotes.trilium
  version: 0.1.2
  kind: app
  title: { en: "Trilium" }
  subtitle: { zh: "树状笔记", en: "Note Tree", zh-Hant: "樹狀筆記", ja: "ツリー式ノート" }
  description:
    zh: 像一棵能无限展开的笔记树：笔记一层套一层分门别类，也能互相链接、画思维导图。适合喜欢按目录从大到小整理资料的人。
    en: "A note tree that unfolds as deep as you like: file notes inside notes, link them together and add mind maps. For people who like organizing things folder by folder."
    zh-Hant: 像一棵能無限展開的筆記樹：筆記一層套一層分門別類，也能互相連結、畫思維導圖。適合喜歡按目錄從大到小整理資料的人。
    ja: いくらでも深く枝分かれするノートの木のようなものです。ノートをノートの中に入れ、互いにリンクし、マインドマップも描けます。フォルダで細かく整理するのが好きな人向けです。
  icon: icon.svg
  notices: [NOTICE]
  screenshots: [screenshots/notes.png, screenshots/tree.png, screenshots/editor.png]
  author: { name: geraldpeng6, url: https://github.com/geraldpeng6 }
  homepage: https://triliumnotes.org
  # Trilium 是 AGPL-3.0；插件包自己的许可证在 LICENSE（MIT）。
  license: AGPL-3.0-only
  tags:
    zh: [笔记, 知识库]
    en: [Notes, Knowledge base]
  setup:
    zh: 第一次进去选“新建文档”（或从旧 Trilium 迁移）就能开始，之后不用登录。要格外保密的笔记可以设成“受保护”，单独加一层密码。
    en: On the first visit, choose "New document" (or migrate from an old Trilium) and you're in; there is no sign-in afterwards. Notes that need extra secrecy can be marked "protected" with a password of their own.
    zh-Hant: 第一次進去選「新建文件」（或從舊 Trilium 遷移）就能開始，之後不用登入。要格外保密的筆記可以設成「受保護」，單獨加一層密碼。
    ja: 初回は「新しいドキュメント」を選ぶ（または古い Trilium から移行する）と始められ、以後ログインは不要です。とくに秘密にしたいノートは「保護」にして別のパスワードを掛けられます。
  about:
    zh: |
      个人知识库：笔记能一层层往下分，笔记之间连成网，还有画布、思维导图、代码笔记和内置日历。

      富文本和 Markdown 都能写，能全文搜索，改动留着历史记录；数据库和附件都存在自己家里。
    en: |
      A personal knowledge base: notes nest without limit and link into a network, with canvas, mind maps, code notes and a built-in day planner.

      Write in rich text or Markdown, find anything with full-text search, and every change keeps a history; the database and attachments stay at home.
    zh-Hant: |
      個人知識庫：筆記能一層層往下分，筆記之間連成網，還有畫布、思維導圖、程式碼筆記和內建日曆。

      富文字和 Markdown 都能寫，能全文搜尋，改動留著歷史紀錄；資料庫和附件都存在自己家裡。
    ja: |
      個人の知識ベースです。ノートはいくらでも階層化でき、互いにつながります。キャンバス、マインドマップ、コードノート、内蔵カレンダーも備えます。

      リッチテキストでも Markdown でも書け、全文検索ができ、変更履歴も残ります。データベースと添付は自宅に残ります。
  release_notes:
    zh: |
      插件包迁入官方插件合仓，保留旧仓库默认分支的 Trilium v0.107.0 升级。

      商店介绍重写：首次创建、迁移和受保护笔记移到「安装后要做的事」，修订历史、全文搜索等说法换成日常用语；补繁体中文和日文。
    en: |
      Moved the plugin package into the official Wonton plugin monorepo; retains the Trilium v0.107.0 upgrade from the source default branch.

      Store copy rewritten: first document creation, migration and protected notes moved to the pre-install notice, with revision-history/full-text-search wording in everyday words; Traditional Chinese and Japanese added.
    zh-Hant: "外掛包遷入官方外掛合倉，保留舊倉庫預設分支的 Trilium v0.107.0 升級。\n\n商店介紹重寫：首次建立、遷移和受保護筆記移到「安裝後要做的事」，修訂歷史、全文搜尋等說法換成日常用語；補繁體中文和日文。"
    ja: "プラグインを公式プラグインリポジトリへ移しました。旧リポジトリ既定ブランチの Trilium v0.107.0 アップグレードは維持しています。\n\nストア紹介を書き直し、初回の作成・移行と保護ノートを「インストール後の手順」に移し、変更履歴や全文検索などの言い方を日常的な言葉にしました。繁体字中国語と日本語を追加。"
  webui:
    service: trilium
    port: 8080
  permissions: []
  # 镜像支持 amd64、arm64、armv7；这里声明 amd64 和 arm64。上游没写最低内存，本机空闲实测约
  # 100M（v0.106.1，单用户空库，docker stats），编辑与同步有尖峰，取 256M。
  requirements:
    arch: [amd64, arm64]
    memory: 256M
