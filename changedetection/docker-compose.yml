# changedetection.io：盯着网页的变化，变了就提醒。JS 渲染的抓取由同插件的 sockpuppetbrowser 完成。
services:
  changedetection:
    # 上游官方镜像，按清单列表摘要固定（amd64/arm64/arm），标签只给人看。
    image: dgtlmoon/changedetection.io:0.70.4@sha256:b6aae2572a0bf1a671b1b202365ddcfe16a31fa8a60be89df606705731b55f8b
    # 镜像不挑 uid：实测以 ${PUID} 启动可写数据目录，数据归主人的用户。
    user: "${PUID}:${PGID}"
    environment:
      TZ: ${TZ}
      # 通知正文里的链接指回经网关的插件地址。
      BASE_URL: ${WONTON_APP_URL}
      # 设置页和监控页的"添加邮件通知"输入行按这个前缀拼 URL，{TO} 换成填的地址（上游 notification-setup.js
      # 的 buildEmailUrl）。上游默认给 mailtos:// 会强制 STARTTLS，内部 SMTP 不加密，得用 mailto://。
      NOTIFICATION_MAIL_BUTTON_PREFIX: "mailto://${WONTON_SMTP_HOST}:${WONTON_SMTP_PORT}/?from=${WONTON_MAIL_FROM}&to={TO}"
      # "Playwright Chrome" 抓取方式连上游 compose 推荐的 sockpuppetbrowser：每个连接起一个独立
      # Chrome。stealth 和 --disable-web-security 是上游 wiki 给这条 URL 的推荐参数。
      PLAYWRIGHT_DRIVER_URL: ws://browser-sockpuppet-chrome:3000/?stealth=1&--disable-web-security=true
    volumes:
      # 配置、每个网页的抓取历史和截图（上游用 JSON 文件存储），卸载保留数据时不删除。
      - ${WONTON_APP_DATA}:/datastore
    healthcheck:
      # 上游没有健康端点：首页 200 表示 Flask 应用加载数据目录后真正起来了，不是只有进程。
      # ProxyHandler({})：出网代理的环境变量不拦本机请求。
      test: ["CMD", "python3", "-c", "import urllib.request as r; r.build_opener(r.ProxyHandler({})).open('http://127.0.0.1:5000/', timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      start_interval: 2s

  browser-sockpuppet-chrome:
    # 上游 compose 推荐的 Chrome 抓取后端（旧 playwright-chrome 镜像的继任者）。上游只发
    # latest 和更旧的版本 tag，没有更新的版本号，按清单列表摘要固定。init 收割退出的 Chrome 进程。
    image: dgtlmoon/sockpuppetbrowser:latest@sha256:1d8f72d2ce2085faed4232e5ae1e65c02efe5b831a18e127829b267c260b4fb2
    init: true
    # Chrome 的 /dev/shm 用量；不预占内存。
    shm_size: 1g
    healthcheck:
      # /stats 报告实际探测到的 chrome_version：unknown 说明浏览器起不来，不算健康。
      test: ["CMD", "python3", "-c", "import json,urllib.request as r; s=json.load(r.build_opener(r.ProxyHandler({})).open('http://127.0.0.1:8080/stats', timeout=5)); assert s.get('chrome_version','unknown') != 'unknown'"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      start_interval: 2s

  # 一次性初始化：把全局邮件通知指到主人的内部邮箱，监控到变化就发信进 Wonton 私聊。等应用健康后调它
  # 自己的 REST API（见 config/configure-mail.py），datastore 里留标记，之后不再动用户改过的配置。
  mail-init:
    image: dgtlmoon/changedetection.io:0.70.4@sha256:b6aae2572a0bf1a671b1b202365ddcfe16a31fa8a60be89df606705731b55f8b
    # 只读写 datastore（读 API 密钥、写标记），和应用同一属主。
    user: "${PUID}:${PGID}"
    command: ["python3", "/init/configure-mail.py"]
    environment:
      WONTON_SMTP_HOST: ${WONTON_SMTP_HOST}
      WONTON_SMTP_PORT: ${WONTON_SMTP_PORT}
      WONTON_MAIL_FROM: ${WONTON_MAIL_FROM}
      WONTON_OWNER_EMAIL: ${WONTON_OWNER_EMAIL}
    volumes:
      - ${WONTON_APP_DATA}:/datastore
    configs:
      - source: configure_mail
        target: /init/configure-mail.py
    depends_on:
      changedetection:
        condition: service_healthy
    restart: "no"

configs:
  configure_mail:
    file: config/configure-mail.py

x-wonton:
  spec: "0.11"
  id: io.changedetection
  version: 0.1.2
  kind: app
  title: { zh: "网页变化提醒（changedetection.io）", en: "Web Page Change Alerts (changedetection.io)", zh-Hant: "網頁變化提醒（changedetection.io）", ja: "ページ変化の通知（changedetection.io）" }
  description:
    zh: 给在意的网页定个闹钟：降价、补货、新公告，它定时去看，页面一变就提醒你。
    en: "Set an alarm on any web page — price drops, restocks, new announcements: it checks on a schedule and tells you as soon as the page changes."
    zh-Hant: 給在意的網頁定個鬧鐘：降價、補貨、新公告，它定時去看，頁面一變就提醒你。
    ja: 気になるページに目覚まし時計をかけます。値下げ、入荷、新しいお知らせなど、定期的に見て、変わったらすぐ知らせます。
  icon: icon.png
  notices: [NOTICE]
  screenshots: [screenshots/watch-list.png, screenshots/edit.png, screenshots/diff.png, screenshots/settings.png]
  author: { name: geraldpeng6, url: https://github.com/geraldpeng6 }
  homepage: https://changedetection.io
  license: Apache-2.0
  tags: { zh: [监控, 工具], en: [Monitoring, Tools] }
  setup:
    zh: 打开网页，把要盯的网页加进来，再选怎么提醒。默认发到你的 Wonton 私聊；要发给外部邮箱会失败，应用会当场报错。想在应用里再加一道自己的口令，在「设置」里开。
    en: Open the page, add the page to watch, and pick how to be alerted. The default lands in your Wonton chat; sending to external addresses fails and the app reports it. To add your own password on top, turn it on in the app's Settings.
    zh-Hant: 開啟網頁，把要盯的網頁加進來，再選怎麼提醒。預設發到你的 Wonton 私聊；要發給外部信箱會失敗，應用會當場報錯。想在應用裡再加一道自己的口令，在「設定」裡開。
    ja: ページを開いて監視するページを追加し、通知方法を選びます。既定では Wonton チャットに届きます。外部アドレスに送ると失敗し、アプリがその場で報告します。アプリ側で独自のパスワードも掛けたい場合は「設定」でオンにします。
  about:
    zh: |
      把要盯的网页加进来，它定期去检查内容，变了就提醒你；重排过的网页可以在差异页里逐条看哪里变了。

      能按真正在浏览器里打开的方式去看（会跑网页里的程序、能截图对比），也能只看纯文字和订阅源。

      网页只从云吞进来，云吞已经替你认了身份，应用自己默认不用登录（上游本来就没有口令）。
    en: |
      Add the pages you want to watch; it rechecks them on a schedule and alerts you when they change, with a diff page listing each change one by one.

      It can look at pages the way a real browser does (running scripts and comparing screenshots), or watch plain HTML and feeds.

      The page comes in through Wonton only, and Wonton already authenticates you, so the app needs no sign-in by default (upstream ships with no password).
    zh-Hant: |
      把要盯的網頁加進來，它定期去檢查內容，變了就提醒你；重排過的網頁可以在差異頁裡逐條看哪裡變了。

      能按真正在瀏覽器裡開啟的方式去看（會跑網頁裡的程式、能截圖對比），也能只看純文字和訂閱源。

      網頁只從雲吞進來，雲吞已經替你認了身分，應用自己預設不用登入（上游本來就沒有口令）。
    ja: |
      監視したいページを追加すると、定期的に確認し、変わったら知らせます。変わった箇所は差分ページで 1 件ずつ確認できます。

      実際のブラウザのように見ることも（スクリプトを実行し、スクリーンショットを比較）、プレーンな HTML やフィードだけを見ることもできます。

      ページは Wonton からしか来ず、Wonton がすでに本人確認をするため、アプリ側のサインインは既定で不要です（上流にパスワードはありません）。
  release_notes:
    zh: |
      邮件提醒开箱即用——装好就把全局邮件通知配到云吞的内部邮箱，监控到变化信进你的 Wonton 私聊，设置页的添加邮件通知也预填了内部服务器；发往外部邮箱的会被拒收。

      商店介绍重写：添加网页和配提醒移到「安装后要做的事」，Playwright、Webhook、口令等说法换成日常用语；补繁体中文和日文。
    en: |
      Email alerts work out of the box — watch changes land in your Wonton chat, and the Add email notification box comes prewired for the built-in mail server. Mail to outside addresses is rejected.

      Store copy rewritten: adding pages and configuring alerts moved to the pre-install notice, with Playwright/webhook/password wording in everyday words; Traditional Chinese and Japanese added.
    zh-Hant: "郵件提醒開箱即用——裝好就把全域性郵件通知配到雲吞的內部郵箱，監控到變化信進你的 Wonton 私聊，設定頁的新增郵件通知也預填了內部伺服器；發往外部郵箱的會被拒收。\n\n商店介紹重寫：新增網頁和配提醒移到「安裝後要做的事」，Playwright、Webhook、口令等說法換成日常用語；補繁體中文和日文。"
    ja: "メール通知は設定不要です。インストールすると全体のメール通知が Wonton の内部メールにつながり、変更を検知したことを知らせるメールがあなたの Wonton ダイレクトメッセージに届きます。設定ページのメール通知追加も内部サーバー入りで始まります。外部アドレスへのメールは受け付けられません。\n\nストア紹介を書き直し、ページの追加と通知設定を「インストール後の手順」に移し、Playwright や webhook、パスワードなどの言い方を日常的な言葉にしました。繁体字中国語と日本語を追加。"
  webui:
    service: changedetection
    port: 5000
    # 上游没有 OIDC，也不认代登录头；上游默认无访问口令，经网关打开直接可用，没有第二次登录。
    sso: none
  # 监控目标在公网上，普通和 Playwright 抓取都要出网（也意味着能访问局域网，安装确认会写明）。
  # owner.identity 拿主人的内部邮箱当告警收件地址；notify 让应用发的信走核心的内部 SMTP。
  permissions: [network.egress, owner.identity, notify]
  # 上游没写最低内存；本机空闲实测两个服务合计约 140M，Chrome 渲染高峰更高，取 1G。
  requirements:
    arch: [amd64, arm64]
    memory: 1G
