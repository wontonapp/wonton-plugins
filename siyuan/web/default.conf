# 思源的来源校验靠 Host（上游 Docker 文档：反代要保留原始 Host，用 $http_host 带端口）；
# WebSocket 是思源网页的常规通道。其余请求头原样透传（含网关设置好的 X-Forwarded-* 和 Origin）。
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    location = /healthz {
        access_log off;
        return 200 'ok';
    }

    # / 和 /welcome 都是引导页：没有工作区会话时展示访问授权码，有会话时由页面 JS
    # 直接跳进应用（思源自己的 / 只做 UA 分流，这里用同一招代替）。
    location = / {
        root /usr/share/nginx/html;
        try_files /welcome.html =404;
    }
    location = /welcome {
        root /usr/share/nginx/html;
        try_files /welcome.html =404;
    }

    location / {
        proxy_pass http://siyuan:6806;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
