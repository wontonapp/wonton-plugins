# Seerr：影视求片和订阅，配合 Jellyfin、Emby 或 Plex 使用。
services:
  init:
    # 首次写入和每次重建时更新 Jellyfin 连接信息和发信配置（见 init/init-settings.js）。
    # 与主服务同一个官方镜像，避免再引入一个工具镜像。
    image: ghcr.io/seerr-team/seerr:v3.5.2@sha256:aadee014b40e28cf9aa4928bc9d1183a6eb08f8c44d543cddc9efdcb16549be2
    user: "${PUID}:${PGID}"
    entrypoint: ["node", "/seed/init-settings.js"]
    environment:
      WONTON_JELLYFIN_URL: ${WONTON_JELLYFIN_URL:-}
      WONTON_JELLYFIN_KEY: ${WONTON_JELLYFIN_KEY:-}
      WONTON_SMTP_HOST: ${WONTON_SMTP_HOST:-}
      WONTON_SMTP_PORT: ${WONTON_SMTP_PORT:-}
      WONTON_MAIL_FROM: ${WONTON_MAIL_FROM:-}
    volumes:
      - ${WONTON_APP_DATA}/config:/app/config
    configs:
      - source: init_settings
        target: /seed/init-settings.js
    network_mode: none
    restart: "no"

  seerr:
    depends_on:
      init:
        condition: service_completed_successfully
    # Seerr v3.5.1 官方多架构镜像（amd64、arm64）。
    # 官方镜像以 node 用户运行，这里跟随云吞注入的 PUID/PGID，数据目录属主与之一致。
    image: ghcr.io/seerr-team/seerr:v3.5.2@sha256:aadee014b40e28cf9aa4928bc9d1183a6eb08f8c44d543cddc9efdcb16549be2
    user: "${PUID}:${PGID}"
    environment:
      TZ: ${TZ}
    volumes:
      - ${WONTON_APP_DATA}/config:/app/config
    healthcheck:
      # /api/v1/settings/public 是无需登录的接口，返回 200 说明数据库迁移完成、
      # HTTP 服务已就绪；不用 /api/v1/status，它默认会请求 GitHub 检查新版本。
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:5055/api/v1/settings/public"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
      start_interval: 2s

  # Seerr 的用户邮箱来自向导里媒体服务器登录表单，常常不是能收信的地址；通知和找回密码
  # 都发到它。应用建号之后不会再自己改，所以每次重建容器用 Seerr 自己的接口对齐一次：
  # 已是内部邮箱就不动，改不动就退出报错（见 init/init-owner-email.js）。
  init-mail:
    depends_on:
      seerr:
        condition: service_healthy
    image: ghcr.io/seerr-team/seerr:v3.5.2@sha256:aadee014b40e28cf9aa4928bc9d1183a6eb08f8c44d543cddc9efdcb16549be2
    user: "${PUID}:${PGID}"
    entrypoint: ["node", "/seed/init-owner-email.js"]
    environment:
      WONTON_OWNER_EMAIL: ${WONTON_OWNER_EMAIL:-}
    volumes:
      # 只读挂载：从 settings.json 拿接口认证用的 API 密钥。
      - ${WONTON_APP_DATA}/config:/app/config:ro
    configs:
      - source: init_owner_email
        target: /seed/init-owner-email.js
    restart: "no"

configs:
  init_settings:
    file: init/init-settings.js
  init_owner_email:
    file: init/init-owner-email.js

x-wonton:
  spec: "0.11"
  id: app.seerr.seerr
  version: 0.2.0
  kind: app
  title: { zh: 求片点播（Seerr）, en: Movie & TV Requests (Seerr) }
  description:
    zh: 像给家庭影院“点单”：搜到想看的电影或剧集一键求片，片子进了 Jellyfin 等影库就通知你。它自己不播放也不下载，要配合家庭影院用。
    en: "Like ordering for your home theater: find a movie or show, request it with one tap, and get a heads-up when it lands in Jellyfin or another library. It doesn't play or download anything itself."
  icon: icon.svg
  notices: [NOTICE]
  screenshots: [screenshots/setup.png, screenshots/login.png, screenshots/requests.png]
  author: { name: geraldpeng6, url: https://github.com/geraldpeng6 }
  homepage: https://seerr.dev
  license: MIT
  tags:
    zh: [视频, 追剧, 求片]
    en: [Video, TV, Requests]
  about:
    zh: |
      在 Seerr 里搜索想看的电影和剧集，一键求片；媒体库有了就通知你。

      Seerr 连接 Jellyfin、Emby 或 Plex：第一次打开需要完成 Seerr 自己的向导，
      填媒体服务器地址，并用它的管理员账号登录——这个账号随之成为 Seerr 管理员。
      之后家人用各自媒体服务器账号登录就能求片。

      连接 Jellyfin 的地址和 API 密钥由云吞自动注入（核心的能力依赖接口上线后生效），
      在那之前要手填一台 Seerr 能访问到的媒体服务器地址。

      Seerr 发的信（找回密码、求片进展、初始密码）会出现在收件人的云吞“Wonton”私聊里。
      只能发给家里的人：收件人填的是外部地址（比如 Plex 账号的邮箱）时发送失败。

      出网权限用于查询 TMDB 的影视元数据和海报。想全自动下载，还要在设置里
      连接 Radarr 或 Sonarr（以及下载器），这一步按 Seerr 自己的文档配置。
    en: |
      Search for movies and shows in Seerr and request them with one tap; get notified when they land in your library.

      Seerr connects to Jellyfin, Emby or Plex. The first opening runs Seerr's own setup wizard: enter the media server address and sign in with an administrator account of that server — that account becomes the Seerr administrator. Family members then sign in with their own media server accounts to request titles.

      The Jellyfin address and API key are injected automatically by Wonton (effective once the core's capability dependency interface ships); until then, enter an address that Seerr can reach.

      Email that Seerr sends (password resets, request updates, initial passwords) shows up in the recipient's Wonton chat. It only reaches people in your home: sending to an external address (such as a Plex account email) fails.

      The internet permission is used for TMDB metadata and posters. For fully automatic downloading, connect Radarr or Sonarr (plus a downloader) in the settings, following Seerr's own documentation.
  release_notes:
    zh: 接上云吞内部邮箱：Seerr 发的邮件转进收件人的云吞私聊；主人账号的邮箱在重建容器时自动改成云吞内部邮箱。
    en: >-
      Connect to Wonton's internal mailbox: email that Seerr sends lands in the recipient's Wonton chat,
      and the owner account's email is switched to the Wonton internal address when the container is recreated.
  webui:
    service: seerr
    port: 5055
    sso: none
  permissions:
    # TMDB 元数据、海报、版本检查都走外网。
    - network.egress
    # 应用自己发信（找回密码、求片通知、建号初始密码）：核心提供 SMTP，信转进收件人的私聊。
    - notify
    # 一次性初始化要把主人账号的邮箱改成主人的内部邮箱（WONTON_OWNER_EMAIL）。
    - owner.identity
  requirements:
    arch: [amd64, arm64]
    # 上游没写最低内存；官方镜像空载实测 131MiB，扫描媒体库和缓存海报按三倍余量取整。
    memory: 512M
