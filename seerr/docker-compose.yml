# Seerr：影视求片和订阅，配合 Jellyfin、Emby 或 Plex 使用。
services:
  init:
    # 首次写入和每次重建时更新 Jellyfin 连接信息和发信配置（见 init/init-settings.js）。
    # 与主服务同一个官方镜像，避免再引入一个工具镜像。
    image: ghcr.io/seerr-team/seerr:v3.5.2@sha256:aadee014b40e28cf9aa4928bc9d1183a6eb08f8c44d543cddc9efdcb16549be2
    user: "${PUID}:${PGID}"
    entrypoint: ["node", "/seed/init-settings.js"]
    environment:
      WONTON_JELLYFIN_URL: ${WONTON_JELLYFIN_URL:-}
      WONTON_JELLYFIN_KEY: ${WONTON_JELLYFIN_KEY:-}
      WONTON_SMTP_HOST: ${WONTON_SMTP_HOST:-}
      WONTON_SMTP_PORT: ${WONTON_SMTP_PORT:-}
      WONTON_MAIL_FROM: ${WONTON_MAIL_FROM:-}
    volumes:
      - ${WONTON_APP_DATA}/config:/app/config
    configs:
      - source: init_settings
        target: /seed/init-settings.js
    network_mode: none
    restart: "no"

  seerr:
    depends_on:
      init:
        condition: service_completed_successfully
    # Seerr v3.5.1 官方多架构镜像（amd64、arm64）。
    # 官方镜像以 node 用户运行，这里跟随云吞注入的 PUID/PGID，数据目录属主与之一致。
    image: ghcr.io/seerr-team/seerr:v3.5.2@sha256:aadee014b40e28cf9aa4928bc9d1183a6eb08f8c44d543cddc9efdcb16549be2
    user: "${PUID}:${PGID}"
    environment:
      TZ: ${TZ}
    volumes:
      - ${WONTON_APP_DATA}/config:/app/config
    healthcheck:
      # /api/v1/settings/public 是无需登录的接口，返回 200 说明数据库迁移完成、
      # HTTP 服务已就绪；不用 /api/v1/status，它默认会请求 GitHub 检查新版本。
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:5055/api/v1/settings/public"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
      start_interval: 2s

  # Seerr 的用户邮箱来自向导里媒体服务器登录表单，常常不是能收信的地址；通知和找回密码
  # 都发到它。应用建号之后不会再自己改，所以每次重建容器用 Seerr 自己的接口对齐一次：
  # 已是内部邮箱就不动，改不动就退出报错（见 init/init-owner-email.js）。
  init-mail:
    depends_on:
      seerr:
        condition: service_healthy
    image: ghcr.io/seerr-team/seerr:v3.5.2@sha256:aadee014b40e28cf9aa4928bc9d1183a6eb08f8c44d543cddc9efdcb16549be2
    user: "${PUID}:${PGID}"
    entrypoint: ["node", "/seed/init-owner-email.js"]
    environment:
      WONTON_OWNER_EMAIL: ${WONTON_OWNER_EMAIL:-}
    volumes:
      # 只读挂载：从 settings.json 拿接口认证用的 API 密钥。
      - ${WONTON_APP_DATA}/config:/app/config:ro
    configs:
      - source: init_owner_email
        target: /seed/init-owner-email.js
    restart: "no"

configs:
  init_settings:
    file: init/init-settings.js
  init_owner_email:
    file: init/init-owner-email.js

x-wonton:
  spec: "0.11"
  id: app.seerr.seerr
  version: 0.2.1
  kind: app
  title: { zh: "求片点播（Seerr）", en: "Movie & TV Requests (Seerr)", zh-Hant: "求片點播（Seerr）", ja: "視聴リクエスト（Seerr）" }
  description:
    zh: 像给家庭影院“点单”：搜到想看的电影或剧集一键求片，片子进了 Jellyfin 等影库就通知你。它自己不播放也不下载，要配合家庭影院用。
    en: "Like ordering for your home theater: find a movie or show, request it with one tap, and get a heads-up when it lands in Jellyfin or another library. It doesn't play or download anything itself."
    zh-Hant: 像給家庭電影院「點單」：搜到想看的電影或劇集一鍵求片，片子進了 Jellyfin 等影庫就通知你。它自己不播放也不下載，要配合家庭電影院用。
    ja: 家庭のホームシアターへの注文のようなものです。見たい映画やドラマを見つけてワンタップでリクエストし、Jellyfin などのライブラリに入ると知らせます。再生もダウンロードもしません。
  icon: icon.svg
  notices: [NOTICE]
  screenshots: [screenshots/setup.png, screenshots/login.png, screenshots/requests.png]
  author: { name: geraldpeng6, url: https://github.com/geraldpeng6 }
  homepage: https://seerr.dev
  license: MIT
  tags:
    zh: [视频, 追剧, 求片]
    en: [Video, TV, Requests]
  setup:
    zh: 第一次打开要完成 Seerr 自己的向导：填媒体服务器地址，用它的管理员账号登录，这个账号就成为 Seerr 管理员；家人之后用各自的账号登录就能求片。想全自动下载，再在设置里接上 Radarr 或 Sonarr 和下载器。
    en: "The first opening runs Seerr's own wizard: enter the media server address and sign in with its administrator account, which becomes the Seerr admin; family members then sign in with their own accounts to request titles. For fully automatic downloads, connect Radarr or Sonarr plus a downloader in the settings."
    zh-Hant: 第一次開啟要完成 Seerr 自己的精靈：填媒體伺服器位址，用它的管理員帳號登入，這個帳號就成為 Seerr 管理員；家人之後用各自的帳號登入就能求片。想全自動下載，再在設定裡接上 Radarr 或 Sonarr 和下載器。
    ja: 初回は Seerr 自身の設定ウィザードを完了します。メディアサーバーのアドレスを入れ、その管理者アカウントでサインインすると、そのアカウントが Seerr の管理者になります。以後、家族は各自のアカウントでサインインしてリクエストできます。全自動ダウンロードには、設定で Radarr や Sonarr とダウンローダーを接続します。
  about:
    zh: |
      在 Seerr 里搜索想看的电影和剧集，一键求片；媒体库有了就通知你。它连接 Jellyfin、Emby 或 Plex。

      Jellyfin 的地址和密钥由云吞自动填（要等云吞那边对应的能力上线），在那之前要自己填一个 Seerr 能访问到的媒体服务器地址。

      Seerr 发的信（找回密码、求片进展、初始密码）会出现在收件人的 Wonton 私聊里。只能发给家里的人，收件人填外部地址（比如 Plex 账号的邮箱）会发送失败。

      搜片名、看介绍和海报要能上网。
    en: |
      Search for movies and shows in Seerr and request them with one tap; get notified when they land in your library. It connects to Jellyfin, Emby or Plex.

      Wonton fills in the Jellyfin address and key automatically (once the matching Wonton capability ships); until then, enter an address that Seerr can reach.

      Email that Seerr sends (password resets, request updates, initial passwords) shows up in the recipient's Wonton chat. It only reaches people in your home: sending to an external address (such as a Plex account email) fails.

      Searching titles and loading descriptions and posters need internet access.
    zh-Hant: |
      在 Seerr 裡搜尋想看的電影和劇集，一鍵求片；媒體庫有了就通知你。它連接 Jellyfin、Emby 或 Plex。

      Jellyfin 的位址和密鑰由雲吞自動填（要等雲吞那邊對應的能力上線），在那之前要自己填一個 Seerr 能存取到的媒體伺服器位址。

      Seerr 寄的信（找回密碼、求片進展、初始密碼）會出現在收件人的 Wonton 私聊裡。只能發給家裡的人，收件人填外部位址（比如 Plex 帳號的信箱）會發送失敗。

      搜片名、看介紹和海報要能上網。
    ja: |
      Seerr で見たい映画やドラマを検索し、ワンタップでリクエストします。ライブラリに入ると通知が届きます。Jellyfin・Emby・Plex に接続します。

      Jellyfin のアドレスとキーは Wonton が自動で入れます（対応する Wonton の機能の提供後）。それまでは Seerr から届くアドレスを自分で入れます。

      Seerr が送るメール（パスワード再設定、リクエストの進捗、初期パスワード）は受け取った人の Wonton チャットに届きます。家族にしか届かず、外部アドレス（Plex アカウントのメールなど）に送ると失敗します。

      タイトルの検索と説明・ポスターの取得にはインターネットが必要です。
  release_notes:
    zh: |
      接上云吞内部邮箱：Seerr 发的邮件转进收件人的云吞私聊；主人账号的邮箱在重建容器时自动改成云吞内部邮箱。

      商店介绍重写：首次向导和自动下载的接法移到「安装后要做的事」，API 密钥、元数据等说法换成日常用语；补繁体中文和日文。
    en: |
      Connect to Wonton's internal mailbox: email that Seerr sends lands in the recipient's Wonton chat, and the owner account's email is switched to the Wonton internal address when the container is recreated.

      Store copy rewritten: the first-run wizard and automatic-download setup moved to the pre-install notice, with API-key/metadata wording in everyday words; Traditional Chinese and Japanese added.
    zh-Hant: "接上雲吞內部郵箱：Seerr 發的郵件轉進收件人的雲吞私聊；主人賬號的郵箱在重建容器時自動改成雲吞內部郵箱。\n\n商店介紹重寫：首次精靈和自動下載的接法移到「安裝後要做的事」，API 密鑰、中繼資料等說法換成日常用語；補繁體中文和日文。"
    ja: "Wonton の内部メールにつなぎました。Seerr が送るメールは受信者の Wonton ダイレクトメッセージに届きます。主人アカウントのメールはコンテナ再作成時に Wonton の内部メールへ自動で変えます。\n\nストア紹介を書き直し、初回ウィザードと自動ダウンロードの設定を「インストール後の手順」に移し、API キーやメタデータなどの言い方を日常的な言葉にしました。繁体字中国語と日本語を追加。"
  webui:
    service: seerr
    port: 5055
    sso: none
  permissions:
    # TMDB 元数据、海报、版本检查都走外网。
    - network.egress
    # 应用自己发信（找回密码、求片通知、建号初始密码）：核心提供 SMTP，信转进收件人的私聊。
    - notify
    # 一次性初始化要把主人账号的邮箱改成主人的内部邮箱（WONTON_OWNER_EMAIL）。
    - owner.identity
  requirements:
    arch: [amd64, arm64]
    # 上游没写最低内存；官方镜像空载实测 131MiB，扫描媒体库和缓存海报按三倍余量取整。
    memory: 512M
