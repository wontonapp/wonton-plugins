; 所有进程以容器用户（PUID:PGID）运行；日志和运行时文件只写 /tmp，不污染持久 profile。
[supervisord]
nodaemon=true
; 不写 logfile/pidfile 的话，supervisord 默认写到配置文件旁边的 /etc/wonton（镜像里只读）。
logfile=/tmp/supervisord.log
pidfile=/tmp/supervisord.pid
environment=DISPLAY=":99",HOME="/config"
childlogdir=/tmp

[program:xvfb]
command=/usr/bin/Xvfb :99 -screen 0 1280x800x24 -nolisten tcp
priority=10
autorestart=true

; x11vnc 的 TCP 端口原生支持不校验 Origin 的 WebSocket；只用 Unix socket，避免同容器网页绕过 websockify。
[program:x11vnc]
command=/usr/bin/x11vnc -display :99 -rfbport 0 -rfbportv6 0 -noipv6 -unixsock /tmp/x11vnc.sock -shared -forever -wait 10 -defer 10 -o /tmp/x11vnc.log
priority=20
autorestart=true

; ExpectOrigin 在升级时精确匹配网关页面的 Origin；同容器的恶意网页直连 loopback 也不能绕过。
[program:websockify]
command=/usr/bin/websockify --web /usr/share/novnc --auth-plugin ExpectOrigin --auth-source %(ENV_WONTON_APP_URL)s --unix-target /tmp/x11vnc.sock 0.0.0.0:6080
priority=20
autorestart=true
redirect_stderr=true

; Chromium 的 DevTools 只肯绑 127.0.0.1（headful 下 --remote-debugging-address 被忽略），而且是容器里
; 先起谁谁先占端口：nginx 对外听 9222，转发到 Chromium 内部用的 19222，两个端口不能重合。
[program:cdp-relay]
command=/usr/sbin/nginx -c /etc/wonton/cdp-relay.conf -g "daemon off;"
priority=20
autorestart=true
redirect_stderr=true

[program:chromium]
command=/usr/local/bin/start-chromium.sh
priority=30
autorestart=true
startretries=30
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/tmp/chromium.log
