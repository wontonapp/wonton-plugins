# CDP 中转：Chromium 的 DevTools 只肯绑 127.0.0.1，而且只接受 Host 是 IP 或 localhost 的请求
# （否则 500 "Host header is specified and is not an IP address or localhost"）。它转给
# Chromium 内部用的 19222，并把 Host 改写成 127.0.0.1:19222；CDP 的 WebSocket 靠 Upgrade 透传。
# 改写 Host 等于拆掉 Chromium 的反 DNS rebinding 检查，所以这里按白名单自己挡：mcp 用服务名
# browser，健康检查用 127.0.0.1，别的名字（网页把 attacker.com 解析到本机时就是它）一律 421。
# 路径都在 /tmp：容器以 PUID:PGID 运行，不碰镜像里归 root 的默认目录。
worker_processes 1;
pid /tmp/cdp-nginx.pid;
error_log /tmp/cdp-nginx-error.log warn;

events {
    worker_connections 128;
}

http {
    access_log off;
    client_body_temp_path /tmp/cdp-nginx-body;
    proxy_temp_path /tmp/cdp-nginx-proxy;
    fastcgi_temp_path /tmp/cdp-nginx-fastcgi;
    uwsgi_temp_path /tmp/cdp-nginx-uwsgi;
    scgi_temp_path /tmp/cdp-nginx-scgi;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        listen 9222;
        # CDP 里会有大块帧（截图、PDF）。
        client_max_body_size 0;
        if ($http_origin != "") { return 403; }
        if ($http_sec_fetch_site != "") { return 403; }
        if ($http_host !~ "^(browser|127\.0\.0\.1|localhost):9222$") {
            return 421;
        }

        location / {
            # Playwright 先请求 /json/version/，Chromium 只认不带斜杠的那条。
            rewrite ^(.+[^/])/+$ $1 break;
            proxy_pass http://127.0.0.1:19222;
            # Chromium 用请求的 Host 拼 webSocketDebuggerUrl，Host 又被改写成 127.0.0.1:19222，
            # 拼出来的 ws 地址在别的容器里连不通。把响应里的地址换回客户端请求的 Host。
            sub_filter_types application/json;
            sub_filter 'ws://127.0.0.1:19222' 'ws://$http_host';
            sub_filter_once off;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host 127.0.0.1:19222;
            # DevTools 的调试连接长时间没有字节是正常的。
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }

    # 核心按动态容器名/IP 连接。前置入口只认非浏览器客户端；真正的 MCP 仅认 localhost Host。
    server {
        listen 8931;
        if ($http_origin != "") { return 403; }
        if ($http_sec_fetch_site != "") { return 403; }

        location = /mcp {
            proxy_pass http://mcp:8931;
            proxy_http_version 1.1;
            proxy_set_header Host localhost:8931;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_read_timeout 660s;
        }
        location / { return 404; }
    }
}
