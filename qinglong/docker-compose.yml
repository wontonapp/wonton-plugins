# 青龙面板：定时跑 Python / JavaScript / Shell 脚本的管理面板。
#
# 通知：青龙的脚本通知走它自己的配置文件 /ql/data/config/config.sh（面板"配置文件"里编辑）。
# 首次启动前由一次性服务把 config.sh 预置成"自定义通知"通道，指向核心的通知接口：任务脚本里调用
# notify（Python）或 sendNotify（JS）就会发进主人的"云吞"私聊。只在文件不存在时写入，用户后来
# 在面板里改过的内容不会被覆盖。
services:
  seed-config:
    # 镜像按摘要固定（多架构清单列表的摘要），标签只给人看。复用主镜像，不额外拉包。
    image: whyour/qinglong:2.24.0@sha256:2431b8b92d5822423d7d598110294691ae2a32d7fbde5c5d5a963db8b4f47cc3
    entrypoint:
      - bash
      - -c
      - mkdir -p /ql/data/config && { test -s /ql/data/config/config.sh || cp /seed/config.sh /ql/data/config/config.sh; }
    volumes:
      - ${WONTON_APP_DATA}:/ql/data
    configs:
      - source: seed-config
        target: /seed/config.sh
    network_mode: none
    restart: "no"

  qinglong:
    # 上游以 root 运行（pm2、crond、apk 装依赖），不写 user；镜像默认时区为 Asia/Shanghai，
    # 面板里的定时按北京时间。
    image: whyour/qinglong:2.24.0@sha256:2431b8b92d5822423d7d598110294691ae2a32d7fbde5c5d5a963db8b4f47cc3
    depends_on:
      seed-config:
        condition: service_completed_successfully
    environment:
      # 面板装的 Python / Node 依赖走国内镜像源（环境变量对所有 pip、npm、pnpm 调用生效，
      # 重建容器不丢；面板"依赖设置"里改的是容器内的配置文件，重建会丢，且被这里的变量盖过）。
      PIP_INDEX_URL: https://pypi.tuna.tsinghua.edu.cn/simple
      npm_config_registry: https://registry.npmmirror.com
    volumes:
      - ${WONTON_APP_DATA}:/ql/data
    healthcheck:
      # /api/health 检查 HTTP 服务和调度器（gRPC）都就绪，不只是进程活着。
      test: ["CMD", "curl", "-sf", "--noproxy", "*", "http://127.0.0.1:5700/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
      start_interval: 3s

configs:
  seed-config:
    content: |
      ## 云吞预置：任务脚本的通知经青龙的"自定义通知"发给云吞，进了"云吞"私聊。
      ## 面板"配置文件"里可以改成别的通知渠道。
      export HITOKOTO="false"
      export WEBHOOK_URL="${WONTON_NOTIFY_URL}"
      export WEBHOOK_METHOD="POST"
      export WEBHOOK_CONTENT_TYPE="application/json"
      export WEBHOOK_BODY='title: $$title
      body: $$content'

x-wonton:
  spec: "0.17"
  id: com.github.whyour.qinglong
  version: 0.1.2
  kind: app
  title: { zh: "青龙", en: "Qinglong", zh-Hant: "青龍", ja: "Qinglong" }
  subtitle: { zh: "定时任务", en: "Scheduled Tasks", zh-Hant: "定時任務", ja: "定時タスク" }
  description:
    zh: 像手机上的定时提醒，在家里电脑上定时跑脚本：每天备份文件、抓取信息、发条提醒都行。会写 Python、JavaScript 或 Shell 脚本，把它交给青龙到点执行；现成的脚本仓库也能一键导入。
    en: "Like a recurring reminder on your phone, it runs scripts on schedule at home: daily backups, fetching information, sending a notice. Hand it any Python, JavaScript or Shell script and Qinglong runs it on time; ready-made script repos can be imported with one click."
    zh-Hant: 像手機上的定時提醒，在家裡電腦上定時跑腳本：每天備份檔案、抓取資訊、發條提醒都行。會寫 Python、JavaScript 或 Shell 腳本，把它交給青龍到點執行；現成的腳本倉庫也能一鍵匯入。
    ja: スマホの繰り返しリマインダーのようなものです。家のパソコンでスクリプトを定時に実行し、毎日のバックアップや情報取得、通知を行えます。Python・JavaScript・Shell のスクリプトを渡せば、Qinglong が時間通りに実行します。既製のスクリプトリポジトリも 1 クリックで取り込めます。
  icon: icon.svg
  notices: [NOTICE]
  screenshots: [screenshots/01-crontab.png, screenshots/02-script.png, screenshots/03-log.png, screenshots/04-env.png]
  author: { name: geraldpeng6, url: https://github.com/geraldpeng6 }
  homepage: https://github.com/whyour/qinglong
  # 青龙面板（qinglong）的许可证；插件包自己的许可证写在仓库的 LICENSE 里。
  license: Apache-2.0
  tags:
    zh: [效率, 工具]
    en: [Productivity, Tools]
  about:
    zh: |
      在家里电脑上定时跑脚本的面板：到点执行 Python、JavaScript、Shell 脚本，不用再开着电脑手动跑。

      备份、抓取、提醒都能定时，脚本、定时规则和要用的软件包都在面板里管，任务日志随时回看。

      通知已经接好：脚本里调用青龙的通知（Python 的 notify、JavaScript 的 sendNotify），消息会发进你的 Wonton 私聊，不用再配推送渠道。

      注意：脚本相当于在这台电脑上跑程序，只装自己信得过的脚本和仓库。
    en: |
      A panel that runs scripts on a schedule on your home computer: Python, JavaScript and Shell scripts execute on time, no computer left open by hand.

      Backups, fetching and reminders can all be scheduled, and scripts, cron rules and needed packages are managed in the panel with task logs at hand.

      Notifications are wired up: call Qinglong's notify (Python) or sendNotify (JavaScript) in a script and the message lands in your Wonton chat, no push channel to configure.

      Note: scripts are programs running on this machine, so only install scripts and repos you trust.
    zh-Hant: |
      在家裡電腦上定時跑腳本的面板：到點執行 Python、JavaScript、Shell 腳本，不用再開著電腦手動跑。

      備份、抓取、提醒都能定時，腳本、定時規則和要用的軟體套件都在面板裡管，任務紀錄隨時回看。

      通知已經接好：腳本裡呼叫青龍的通知（Python 的 notify、JavaScript 的 sendNotify），訊息會發進你的 Wonton 私聊，不用再配推送頻道。

      注意：腳本相當於在這台電腦上跑程式，只裝自己信得過的腳本和倉庫。
    ja: |
      家のパソコンでスクリプトを定時に走らせるパネルです。Python・JavaScript・Shell のスクリプトを時間通りに実行し、パソコンを開きっぱなしにする必要はありません。

      バックアップ・取得・リマインダーを定時にでき、スクリプト・スケジュール・必要なパッケージはパネルで管理し、実行ログもいつでも見られます。

      通知は設定済みです。スクリプトで Qinglong の通知（Python の notify、JavaScript の sendNotify）を呼べば Wonton チャットに届き、プッシュ経路の設定は不要です。

      注意：スクリプトはこのパソコンで動くプログラムです。信頼できるスクリプトとリポジトリだけを入れてください。
  release_notes:
    zh: |
      插件包迁入官方插件合仓，内容与上一版相同。

      商店介绍重写：首次设账号移到「安装后要做的事」，环境变量、依赖等说法换成日常用语，并修掉重复的一句；补繁体中文和日文。
    en: |
      Package moved into the official Wonton plugin monorepo; same content as the previous release.

      Store copy rewritten: first-time account setup moved to the pre-install notice, with env-var/dependency wording in everyday words and a duplicated phrase fixed; Traditional Chinese and Japanese added.
    zh-Hant: "外掛包遷入官方外掛合倉，內容與上一版相同。\n\n商店介紹重寫：首次設帳號移到「安裝後要做的事」，環境變數、依賴等說法換成日常用語，並修掉重複的一句；補繁體中文和日文。"
    ja: "プラグインを公式プラグインリポジトリへ移動しました。内容は前版と同じです。\n\nストア紹介を書き直し、初回のアカウント設定を「インストール後の手順」に移し、環境変数や依存関係などの言い方を日常的な言葉にして重複表現も直しました。繁体字中国語と日本語を追加。"
  setup:
    zh: 第一次打开时自己定管理员用户名和密码，务必记牢；再去脚本页写脚本或用仓库导入，然后加定时规则。
    en: On first open, set an admin username and password and remember them; then write a script or import a repo, and add a schedule.
    zh-Hant: 第一次開啟時自己定管理員使用者名稱和密碼，務必記牢；再去腳本頁寫腳本或用倉庫匯入，然後加定時規則。
    ja: 初回に管理者のユーザー名とパスワードを自分で決め、必ず覚えてください。次にスクリプトを書くかリポジトリを取り込み、スケジュールを追加します。
  webui:
    service: qinglong
    port: 5700
    # 应用自带登录：第一次打开在页面里初始化管理员，网关挡在前面，注册页只有主人打得开。
    sso: none
  permissions:
    # 面板要拉脚本仓库、装依赖、脚本自己也要访问外部服务。
    # The panel pulls script repos, installs dependencies, and scripts reach outside services.
    - network.egress
    # 任务脚本的通知经核心发进主人的"云吞"私聊。
    # Task script notifications go through the core into the owner's Wonton chat.
    - notify
  # 上游官方镜像，amd64、arm64、armv7 都有；上游没写最低内存，按本机空闲实测取整（空载实测约 256M，取 512M 留任务运行余量）。
  requirements:
    arch: [amd64, arm64]
    memory: 512M
