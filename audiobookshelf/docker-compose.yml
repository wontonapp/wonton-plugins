# Audiobookshelf 有声书/播客服务器：有声书放在共享文件夹 audiobooks（只读），网页经核心网关用 OIDC 登录。
# 上游 GPL-3.0-only，镜像按清单列表（index）的摘要固定（amd64/arm64）。
#
# OIDC 和发信的接法：ABS 的认证、发信设置都存在自己的数据库里、只能由管理员改（上游无环境变量入口），
# 所以由一次性 provision 服务配置：空库时用注入的用户名建 root 账号（密码是本插件的核心密钥），
# 登录后把 OIDC 指向核心的身份提供方，发信服务器接到核心的内部 SMTP（只在应用还没配过时写，不覆盖）。
# 每次创建容器（安装、升级、重建）都会重跑，OIDC 的客户端密钥换了就更新，不是"已存在就跳过"。
services:
  audiobookshelf:
    image: advplyr/audiobookshelf:2.38.0@sha256:60064c23f32fd9099fd39e82c5132c51701d1221135bbca04cd099b589e1edc3
    # 镜像不依赖 root：以用户身份运行，配置和数据目录由核心按 user 交给 PUID:PGID。
    user: "${PUID}:${PGID}"
    environment:
      # 上游 docker 镜像的网页在 /audiobookshelf 子路径下（构建期定死在客户端 bundle 里，运行时改不了），
      # webui.path 与回调、登出路径都对齐它；根路径也能打开（上游有前缀中间件）。
      TZ: ${TZ}
    volumes:
      - ${WONTON_APP_DATA}/config:/config
      - ${WONTON_APP_DATA}/metadata:/metadata
      # 有声书只读（storage.share.audiobooks:read）；播客由应用按 RSS 下载，存自己的数据目录。
      - ${WONTON_SHARE_AUDIOBOOKS}:/audiobooks:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:80/healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      start_interval: 2s

  # 一次性服务：等主服务健康后配 OIDC（见文件头注释）。脚本只用镜像里自带的 node。
  provision:
    image: advplyr/audiobookshelf:2.38.0@sha256:60064c23f32fd9099fd39e82c5132c51701d1221135bbca04cd099b589e1edc3
    user: "${PUID}:${PGID}"
    entrypoint: ["node", "/app/provision.cjs"]
    # 变量只用于 compose 插值，容器里要显式写上。
    environment:
      APP_URL: http://audiobookshelf:80
      WONTON_OWNER_NAME: ${WONTON_OWNER_NAME:?核心没有注入用户名}
      WONTON_OWNER_EMAIL: ${WONTON_OWNER_EMAIL:?核心没有注入邮箱}
      WONTON_SECRET_ADMIN_PASSWORD: ${WONTON_SECRET_ADMIN_PASSWORD}
      # 发信：应用不发环境变量能配的 SMTP，由 provision 经应用自己的 API 写进设置（spec 0.11 的 notify）
      WONTON_SMTP_HOST: ${WONTON_SMTP_HOST:?核心没有注入发信服务器}
      WONTON_SMTP_PORT: ${WONTON_SMTP_PORT:?核心没有注入发信端口}
      WONTON_MAIL_FROM: ${WONTON_MAIL_FROM:?核心没有注入发件地址}
      WONTON_OIDC_ISSUER: ${WONTON_OIDC_ISSUER}
      WONTON_OIDC_CLIENT_ID: ${WONTON_OIDC_CLIENT_ID}
      WONTON_OIDC_CLIENT_SECRET: ${WONTON_OIDC_CLIENT_SECRET}
      WONTON_OIDC_AUTH_URL: ${WONTON_OIDC_AUTH_URL}
      WONTON_OIDC_TOKEN_URL: ${WONTON_OIDC_TOKEN_URL}
      WONTON_OIDC_USERINFO_URL: ${WONTON_OIDC_USERINFO_URL}
    configs:
      - source: provision
        target: /app/provision.cjs
    depends_on:
      audiobookshelf:
        condition: service_healthy
    restart: "no"

configs:
  provision:
    file: provision.cjs

x-wonton:
  spec: "0.17"
  id: app.audiobookshelf
  version: 0.2.1
  kind: app
  title: { en: "Audiobookshelf" }
  subtitle: { zh: "有声书架", en: "Audiobooks & Podcasts", zh-Hant: "有聲書架", ja: "オーディオブック棚" }
  description:
    zh: 像自家的喜马拉雅：共享文件夹里的有声书排成书架，听到哪记到哪，手机和网页之间接着听，还能订阅播客。适合睡前、通勤听书的人。
    en: "Like your own Audible: the audiobooks in your shared folder sit on a shelf that remembers where you stopped, so you can switch between phone and browser — with podcast subscriptions too. Great for bedtime and commutes."
    zh-Hant: 像自家的喜馬拉雅：共享資料夾裡的有聲書排成書架，聽到哪記到哪，手機和網頁之間接著聽，還能訂閱播客。適合睡前、通勤聽書的人。
    ja: 自前のオーディオブックサービスです。共有フォルダのオーディオブックが棚に並び、どこまで聞いたかを覚えてくれるので、スマホとブラウザを行き来して続きを聞けます。ポッドキャストの購読もできます。寝る前や通勤で聞く人向け。
  icon: icon.png
  notices: [NOTICE]
  screenshots: [screenshots/library.png, screenshots/book.png, screenshots/player.png]
  author: { name: geraldpeng6 }
  homepage: https://www.audiobookshelf.org
  # 应用（audiobookshelf）的许可证；插件包自己的许可证写在仓库的 LICENSE 里。
  license: GPL-3.0-only
  tags:
    zh: [有声书, 播客, 阅读]
    en: [Audiobooks, Podcasts, Reading]
  setup:
    zh: 第一次打开会引导你建一个有声书库，目录选 /audiobooks，共享文件夹里的书就都在书架上了。
    en: The first open walks you through creating a library; pick /audiobooks to scan the books in the shared folder.
    zh-Hant: 第一次開啟會引導你建立一個有聲書庫，目錄選 /audiobooks，共享資料夾裡的書就都在書架上了。
    ja: 初回起動でライブラリ作成の案内が出ます。ディレクトリには /audiobooks を選ぶと、共有フォルダの本が棚に並びます。
  about:
    zh: |
      把共享文件夹 audiobooks 里的有声书整理成自己的书架：按书名、作者和系列浏览，播放进度在手机和网页之间同步。打开就是你的账号，不用再登录一次。

      有声书文件只读，不会被改动；播客在应用里按订阅地址下载，存在插件自己的空间里。

      应用发的测试信会出现在你的 Wonton 私聊里；“发送到阅读器”这类发到外部邮箱（Kindle 等）的信投不出去，应用会报发送失败。

      云吞更新后插件会跟着自动重建，打开照常，不用重装。
    en: |
      Turn the audiobooks in your shared folder into your own library: browse by title, author and series, and keep playback progress in sync between your phone and the web. Opening the page is enough, there is no second login.

      Audiobook files are read-only and never modified. Podcasts are downloaded from their subscription addresses inside the app and kept in the plugin's own space.

      Test emails the app sends land in your Wonton chat; mail addressed outside home, like "Send to e-reader" to a Kindle, cannot be delivered and the app reports a send failure.

      After a Wonton update the plugin is rebuilt automatically; pages open as before, with nothing to reinstall.
    zh-Hant: |
      把共享資料夾 audiobooks 裡的有聲書整理成自己的書架：按書名、作者和系列瀏覽，播放進度在手機和網頁之間同步。開啟就是你的帳號，不用再登入一次。

      有聲書檔案唯讀，不會被改動；播客在應用裡按訂閱網址下載，存在外掛自己的空間裡。

      應用寄的測試信會出現在你的 Wonton 私聊裡；「傳送到閱讀器」這類寄到外部信箱（Kindle 等）的信送不出去，應用會回報傳送失敗。

      雲吞更新後外掛會跟著自動重建，開啟照常，不用重裝。
    ja: |
      共有フォルダ audiobooks のオーディオブックを自分の棚にまとめます。タイトル・著者・シリーズで探せて、再生位置はスマホとブラウザの間で引き継ぎます。開けば自分のアカウントなので、もう一度サインインする必要はありません。

      オーディオブックのファイルは読み取り専用で変更されません。ポッドキャストはアプリ内で購読アドレスからダウンロードし、プラグイン専用の領域に保存します。

      アプリが送るテストメールは Wonton の個別チャットに届きます。「リーダーへ送る」のように外部メール（Kindle など）宛てのメールは送れず、アプリが送信失敗を表示します。

      Wonton の更新後はプラグインが自動で作り直され、これまで通り開けます。入れ直す必要はありません。
  release_notes:
    zh: |
      接入云吞的内部邮箱：安装时自动把应用的发信服务器配好，应用里的「发送测试邮件」会寄进你的 Wonton 私聊。

      「发送到阅读器」这类发到外部邮箱的信（Kindle 等）发不出去，云吞只投递家里人的地址。

      商店介绍重写：首次建库步骤移到「安装后要做的事」，RSS、容器这类说法换成日常用语；补繁体中文和日文。
    en: |
      Wires the app to Wonton's internal mailbox: the outgoing mail server is configured on install, and "Send test email" in the app lands in your Wonton chat.

      Mail to outside addresses ("Send to e-reader" to a Kindle) cannot be delivered; Wonton only accepts mail for your household.

      Store copy rewritten: the first-run library step moved to the pre-install notice, and RSS/container wording replaced with everyday words; Traditional Chinese and Japanese added.
    zh-Hant: "接入雲吞的內部郵箱：安裝時自動把應用的發信伺服器配好，應用裡的「傳送測試郵件」會寄進你的 Wonton 私聊。\n\n      「傳送到閱讀器」這類發到外部郵箱的信（Kindle 等）發不出去，雲吞只投遞家裡人的地址。\n\n商店介紹重寫：首次建庫步驟移到「安裝後要做的事」，RSS、容器這類說法換成日常用語；補繁體中文和日文。"
    ja: "Wonton の内部メールにつなぎました。インストール時にアプリの送信サーバー設定を自動で済ませ、アプリ内の「テストメール送信」はあなたの Wonton ダイレクトメッセージに届きます。\n\n「リーダーへ送信」のように外部メールアドレスへ送るメール（Kindle など）は送れません。Wonton は家族のアドレスにだけ配信します。\n\nストア紹介を書き直し、初回のライブラリ作成手順を「インストール後の手順」に移し、RSS やコンテナなどの言い方を日常的な言葉にしました。繁体字中国語と日本語を追加。"
  webui:
    service: audiobookshelf
    port: 80
    # 上游镜像的网页在 /audiobookshelf 子路径下；path 指到 /login（应用的 OIDC 起点，打开即自动跳单点登录）。
    # ABS 登出固定回 /audiobookshelf/login，核心默认登记的 webui.path 恰好整串对上，不用再声明回跳路径。
    path: /audiobookshelf/login
    sso: oidc
    oidc:
      redirect_paths: [/audiobookshelf/auth/openid/callback]
  secrets:
    # root 账号的密码：provision 建号和每次核对时用，也是应用内本地登录（/login/?autoLaunch=0）的备用入口。
    admin_password:
      generate: { bytes: 32 }
  permissions:
    # 知道用户名：root 账号按注入的用户名建，OIDC 按用户名把核心用户连到它。
    - owner.identity
    # 应用发信经核心的内部 SMTP（安装时注入的 WONTON_SMTP_*），信转进收件人的 Wonton 私聊
    - notify
    - storage.share.audiobooks:read
    # 播客 RSS 下载和元数据匹配（封面、简介）要访问外网；OIDC 的身份提供方地址在核心的 NO_PROXY 里，不走代理。
    - network.egress
  # 上游没写最低内存；本机实测（单容器、4 本书空库播放中）约 31M，真实书库扫描和匹配更重，取 256M。
  requirements:
    arch: [amd64, arm64]
    memory: 256M
