# Prowlarr 索引器管理：网页经云吞网关访问（sso: none），索引器出网由 network.egress 提供；
# 配了 torrent_client 能力（qBittorrent Web API）时，一次性服务把它登记成下载客户端；
# 一次性服务还把 Email 通知接到核心的内部邮箱（notify），应用发的信转进收件人的 Wonton 私聊。
services:
  prowlarr:
    # LinuxServer.io 的 Prowlarr 镜像，上游安装文档指定的镜像（lscr.io/linuxserver/prowlarr 的 Docker Hub 名），
    # amd64 和 arm64，按清单列表（index）的摘要固定；上游 GPL-3.0-only。
    image: linuxserver/prowlarr:2.7.0@sha256:431d7efebcef466e56adaa40a7a2fa2b0e85159a037b8bf465eaadbf0cf5bedf
    # 镜像以 root 启动再降到 PUID:PGID（LSIO 约定），数据目录由核心按默认交给 PUID:PGID。
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
      # 认证用应用自带的 Forms：不设 PROWLARR__AUTH__METHOD 时默认 None，
      # 第一次打开会命中 *arr 的"启用认证"强制页，主人自己设账号和密码，之后应用侧多一层凭据。
    volumes:
      - ${WONTON_APP_DATA}/config:/config
    healthcheck:
      # /ping 免鉴权，且会真查一次数据库，能发现应用起没起来。
      test: ["CMD", "curl", "--noproxy", "*", "--fail", "--silent", "--show-error", "http://127.0.0.1:9696/ping"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      start_interval: 2s
    stop_grace_period: 30s

  # 一次性服务：把 torrent_client 能力（qBittorrent Web API）登记成 Prowlarr 的下载客户端。
  # 核心不支持能力依赖时不注入 WONTON_TORRENT_CLIENT_URL：没注入就如实说明并跳过，装得上、其他功能照常；
  # 等能力声明字段定稿后这里改成必填。
  provision:
    image: linuxserver/prowlarr:2.7.0@sha256:431d7efebcef466e56adaa40a7a2fa2b0e85159a037b8bf465eaadbf0cf5bedf
    entrypoint: ["/bin/sh", "/provision.sh"]
    environment:
      WONTON_TORRENT_CLIENT_URL: ${WONTON_TORRENT_CLIENT_URL:-}
    volumes:
      - ${WONTON_APP_DATA}/config:/config:ro
    configs:
      - source: provision
        target: /provision.sh
    depends_on:
      prowlarr:
        condition: service_healthy
    restart: "no"

  # 一次性服务：把 Email 通知接到核心的内部邮箱，收件人是主人的内部邮箱，信转进收件人的 Wonton 私聊。
  mail:
    image: linuxserver/prowlarr:2.7.0@sha256:431d7efebcef466e56adaa40a7a2fa2b0e85159a037b8bf465eaadbf0cf5bedf
    entrypoint: ["/bin/sh", "/mail.sh"]
    environment:
      # 缺了就装不上：notify 没给 SMTP 三件套、owner.identity 没给收件地址，都要如实报错。
      WONTON_SMTP_HOST: ${WONTON_SMTP_HOST:?}
      WONTON_SMTP_PORT: ${WONTON_SMTP_PORT:?}
      WONTON_MAIL_FROM: ${WONTON_MAIL_FROM:?}
      WONTON_OWNER_EMAIL: ${WONTON_OWNER_EMAIL:?}
    volumes:
      - ${WONTON_APP_DATA}/config:/config:ro
    configs:
      - source: mail
        target: /mail.sh
    depends_on:
      prowlarr:
        condition: service_healthy
    restart: "no"

configs:
  provision:
    file: provision.sh
  mail:
    file: mail.sh

x-wonton:
  spec: "0.11"
  id: com.prowlarr.prowlarr
  version: 0.2.2
  kind: app
  title: { zh: "资源站管理（Prowlarr）", en: "Torrent Site Manager (Prowlarr)", zh-Hant: "資源站管理（Prowlarr）", ja: "配信サイト管理（Prowlarr）" }
  description:
    zh: 把你常去找资源的下载网站集中管好：添加一次，自动同步给 Radarr、Sonarr、qBittorrent 这些应用，也能在这里直接搜、送去下载。偏进阶，装了自动追剧工具才用得上。
    en: "Keeps the download sites you search in one place: add them once and they sync to download apps like Radarr, Sonarr and qBittorrent, or search and send things to download right here. For advanced setups with automatic movie and TV downloaders."
    zh-Hant: 把你常去找資源的網站集中管好：新增一次，自動同步給 Radarr、Sonarr、qBittorrent 這些應用，也能在這裡直接搜、送去下載。偏進階，裝了自動追劇工具才用得上。
    ja: よく使う配信サイトを 1 か所にまとめます。一度追加すれば Radarr、Sonarr、qBittorrent などのアプリに同期され、ここから直接検索してダウンロードへ送ることもできます。上級者向けで、自動で映画やドラマを落とす仕組みと一緒に使います。
  icon: icon.svg
  notices: [NOTICE]
  screenshots: [screenshots/indexers.png, screenshots/add-indexer.png, screenshots/search.png]
  author: { name: geraldpeng6, url: https://github.com/geraldpeng6 }
  homepage: https://prowlarr.com
  # 应用（Prowlarr）的许可证；插件包自己的许可证写在仓库的 LICENSE 里。
  license: GPL-3.0-only
  tags:
    zh: [下载, 影视, 搜索]
    en: [Downloads, Video, Search]
  setup:
    zh: 第一次打开时自己定一个管理员账号和密码（之后在“设置 → 通用 → 安全”里改）。再到网站列表里加你常去的网站，配了 qBittorrent、Radarr 这些应用后会自动同步过去。
    en: On first open, set an admin username and password of your choice (change them later under Settings → General → Security). Then add the sites you use; with qBittorrent, Radarr and the like configured, they sync over automatically.
    zh-Hant: 第一次開啟時自己定一個管理員帳號和密碼（之後在「設定 → 一般 → 安全」裡改）。再到網站列表裡加你常去的網站，配了 qBittorrent、Radarr 這些應用後會自動同步過去。
    ja: 初回に管理者のユーザー名とパスワードを自分で決めます（後で「設定 → 一般 → セキュリティ」で変更できます）。次に使うサイトを一覧に追加します。qBittorrent や Radarr などを設定してあれば自動で同期されます。
  about:
    zh: |
      把你找资源用的网站集中到一处：从内置的几百个网站里添加，测能不能连上，自动同步给 Radarr、Sonarr、qBittorrent 这类应用，也能直接搜索、把种子送进下载队列。

      网站配置都保存在家里，重装不丢。搜索要能访问外网。应用的通知（出问题、恢复正常、有更新）会出现在收件人的 Wonton 私聊里；收件人只能是家里人，改成外部邮箱会发送失败。
    en: |
      Keep the sites you search for downloads in one place: add them from a few hundred built-in definitions, test them, sync them to apps like Radarr, Sonarr or qBittorrent, and search and send torrents straight to your download queue.

      Site settings live at home and survive reinstalls. Searching needs internet access. App notifications (health issues, health restored, app updates) land in the recipient's Wonton chat; recipients must be household members — sending to an external address fails.
    zh-Hant: |
      把你找資源用的網站集中到一處：從內建的幾百個網站裡新增，測能不能連上，自動同步給 Radarr、Sonarr、qBittorrent 這類應用，也能直接搜尋、把種子送進下載佇列。

      網站設定都保存在家裡，重裝不丟。搜尋要能連外網。應用的通知（出問題、恢復正常、有更新）會出現在收件人的 Wonton 私聊裡；收件人只能是家裡人，改成外部信箱會發送失敗。
    ja: |
      配信サイトを 1 か所にまとめます。内蔵の数百の定義から追加して接続を試し、Radarr・Sonarr・qBittorrent などのアプリに同期し、検索してトレントをそのままダウンロード待ちに入れられます。

      サイト設定は家に残り、入れ直しても消えません。検索にはインターネットが必要です。アプリの通知（不具合、復旧、アプリ更新）は受け取った人の Wonton チャットに届きます。受け取れるのは家族だけで、外部アドレスに変えると送信に失敗します。
  release_notes:
    zh: |
      介绍重写：首次登录提示单独成段放在最前。

      商店介绍重写：建管理员账号移到「安装后要做的事」，索引站、网关等说法换成日常用语；补繁体中文和日文。
    en: |
      Rewritten store copy: the first-open sign-in note stands alone up front.

      Store copy rewritten: admin account creation moved to the pre-install notice, with indexer/gateway wording in everyday words; Traditional Chinese and Japanese added.
    zh-Hant: "介紹重寫：首次登入提示單獨成段放在最前。\n\n商店介紹重寫：建管理員帳號移到「安裝後要做的事」，索引站、閘道等說法換成日常用語；補繁體中文和日文。"
    ja: "紹介を書き直し、初回ログインの注意を最初の段落に分けました。\n\nストア紹介を書き直し、管理者アカウントの作成を「インストール後の手順」に移し、インデクサやゲートウェイなどの言い方を日常的な言葉にしました。繁体字中国語と日本語を追加。"
  webui:
    service: prowlarr
    port: 9696
  permissions:
    # 抓索引站、拉取索引器定义更新都要出网。
    - network.egress
    # 应用发的信经核心的内部 SMTP 转进收件人的 Wonton 私聊。
    - notify
    # 通知的收件地址用主人的内部邮箱（WONTON_OWNER_EMAIL）。
    - owner.identity
  requirements:
    arch: [amd64, arm64]
