# Frigate：本地 NVR，摄像头画面的实时目标检测和录像都留在自己家里。
# 用上游官方镜像的 -tensorrt 标签：它内置 onnxruntime-gpu（CUDA 12.8 系运行库，见上游
# docker/tensorrt/requirements-amd64.txt@v0.18.2），RTX 50 系（sm_120）原生可用，不需要自建镜像。
# 登录走网关代登录：Frigate 不实现 OIDC，官方支持关闭自带认证、改认反向代理带来的请求。
# 不用 Remote-User 头（{user} 会让官方检查按“没证明只信任核心”判不合格，而 Frigate 没有可配的
# 代理白名单项），只用 X-Proxy-Secret：网关只给登录用户的请求带这个密钥，Frigate 校验
# auth_secret，对不上的请求进不来。关掉自带登录后 Frigate 不分用户，主人就是 admin。
services:
  # 一次性：建好数据目录结构，首次启动放种子配置。Frigate 会在网页里改写 config.yml，
  # 所以复制进数据目录后不再覆盖（升级、重建都不动用户改过的配置）。
  # 两个 init 都复用 frigate 镜像（同一镜像各写一遍，不用锚点）：插件包只依赖上游一个镜像，
  # 镜像自带 sh、curl 和 sha256sum，初始化要的都够了。
  init-config:
    image: ghcr.io/blakeblackshear/frigate:0.18.2-tensorrt@sha256:1cafb6ebbaff0aaf275cc3f31951bcf7e29f3989f18a10ba9565091367d8736c
    # 绕过镜像入口（s6 只服务常驻启动），以 PUID 建目录、放配置。
    user: "${PUID}:${PGID}"
    entrypoint: ["sh", "-c"]
    command:
      - mkdir -p /cfg/model_cache && test -f /cfg/config.yml || cp /seed/config.yml /cfg/config.yml
    volumes:
      # 挂和 frigate 相同的子目录：同一插件的绑定挂载不能嵌套（不能挂整个数据目录）。
      - ${WONTON_APP_DATA}/config:/cfg
    configs:
      - source: seed-config
        target: /seed/config.yml
    network_mode: none
    restart: "no"

  # 一次性：下载检测模型。模型不打进镜像（约 3.7 MB），放进数据目录，重装、升级不丢；
  # 下载后按 sha256 校验，已有就跳过。需要出网，走插件网络的出口。
  init-model:
    image: ghcr.io/blakeblackshear/frigate:0.18.2-tensorrt@sha256:1cafb6ebbaff0aaf275cc3f31951bcf7e29f3989f18a10ba9565091367d8736c
    user: "${PUID}:${PGID}"
    entrypoint: ["sh", "-c"]
    command:
      - test -f /cfg/model_cache/yolox_nano.onnx || (curl -fsSL -C - --retry 3 -o /cfg/model_cache/yolox_nano.onnx.part https://github.com/Megvii-BaseDetection/YOLOX/releases/download/0.1.1rc0/yolox_nano.onnx && printf 'c789161ed43c8269fcd4e67c67eeeb4e80c622da2eb296a20bc6007bd18a0b7d  /cfg/model_cache/yolox_nano.onnx.part\n' | sha256sum -c - && mv /cfg/model_cache/yolox_nano.onnx.part /cfg/model_cache/yolox_nano.onnx)
    volumes:
      - ${WONTON_APP_DATA}/config:/cfg
    depends_on:
      init-config:
        condition: service_completed_successfully
    restart: "no"

  frigate:
    image: ghcr.io/blakeblackshear/frigate:0.18.2-tensorrt@sha256:1cafb6ebbaff0aaf275cc3f31951bcf7e29f3989f18a10ba9565091367d8736c
    environment:
      TZ: ${TZ}
    volumes:
      # 配置、数据库和模型缓存（首次推理生成的缓存按显卡型号存，换卡后 Frigate 自己重建）。
      - ${WONTON_APP_DATA}/config:/config
      # 录像、事件快照和导出，体积随摄像头数量和码率增长。
      - ${WONTON_APP_DATA}/media:/media/frigate
    # Frigate 用共享内存在进程间传帧，官方 compose 建议 256mb。
    shm_size: 256m
    tmpfs:
      # 录像段先写这里再落盘，给个上限防止写满内存。
      - /tmp/cache:size=1g
    depends_on:
      init-config:
        condition: service_completed_successfully
      init-model:
        condition: service_completed_successfully
    # 查真实可用：/api/config 要配置加载完、数据库能查才答话；镜像里自带 curl。
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:5000/api/config"]
      interval: 30s
      timeout: 10s
      start_period: 3m
      start_interval: 5s

configs:
  seed-config:
    content: |
      # 云吞插件给 Frigate 的种子配置：首次启动复制进数据目录，之后在 Frigate 网页里改的就是这一份。
      # 摄像头在 Frigate 网页的设置向导里添加，这里不预置；0.18 起这一节必填（没有摄像头写空表）。
      cameras: {}

      mqtt:
        enabled: false

      detectors:
        # -tensorrt 镜像里 onnxruntime-gpu 带 CUDA 和 TensorRT 两个执行器；
        # AUTO 自动选 CUDA（官方对桌面 NVIDIA 显卡的推荐写法），device 改成 Tensorrt
        # 可以改用 TensorRT 引擎（首次推理多花几分钟建引擎，缓存在 model_cache 里）。
        onnx:
          type: onnx
          device: AUTO

      model:
        # YOLOX nano 416x416，上游 YOLOX 发布的 ONNX，由 init-model 服务下载并校验。
        # 选 nano：安装门（默认 5 分钟）内要下完模型，nano 最小；要更高精度换 tiny/s。
        model_type: yolox
        width: 416
        height: 416
        input_tensor: nchw
        input_dtype: float_denorm
        path: /config/model_cache/yolox_nano.onnx
        labelmap_path: /labelmap/coco-80.txt

      # go2rtc 的 RTSP 回放流要过认证：局域网里的设备必须带上账号才能拉流；
      # 这个认证不作用于 localhost，Frigate 自己的摄像头取流不受影响（上游文档
      # restream.md "Securing Restream With Authentication"）。
      # 摄像头的回放流在 Frigate 网页或设置向导里加，这里不预置。
      go2rtc:
        rtsp:
          username: wonton
          password: ${WONTON_SECRET_RTSP_PASSWORD}

      # 网页登录交给云吞网关：关掉 Frigate 自己的登录，只认带 X-Proxy-Secret 的请求
      # （网关只给登录用户的请求带），对不上就 401。
      auth:
        enabled: false
        # 登录限流按真实客户端 IP：只信任云吞核心网关的地址。
        trusted_proxies:
          - ${WONTON_CORE_ADDRESS}/32

      # 8971 默认强 TLS（上游自签证书）；网关到插件这段在插件网络里，TLS 由网关对外负责。
      tls:
        enabled: false

      proxy:
        # 网关只放行登录用户，这个实例的主人就是 admin。
        default_role: admin
        # 网关在每个请求上带 X-Proxy-Secret 证明请求来自网关；值由云吞生成，装进配置。
        auth_secret: ${WONTON_SECRET_FRIGATE_PROXY}

x-wonton:
  spec: "0.17"
  # 反向域名：上游官网 frigate.video。
  id: video.frigate.frigate
  version: 0.1.2
  kind: app
  title: { en: "Frigate" }
  subtitle: { zh: "家庭监控", en: "Home Camera NVR", zh-Hant: "家庭監控", ja: "防犯カメラ録画" }
  description:
    zh: 像 24 小时值班的保安：接上家里的摄像头，有人、车、动物出现才录像并标出来，手机上随时回看，录像只存在家里。
    en: "Like a 24/7 security guard: connect your home cameras and it records only when a person, car or animal shows up, marks them, and lets you review events from your phone — recordings never leave home."
    zh-Hant: 像 24 小時值班的保全：接上家裡的攝影機，有人、車、動物出現才錄影並標出來，手機上隨時回看，錄影只存在家裡。
    ja: 24 時間警備員のようなものです。家のカメラをつなぐと、人・車・動物が現れたときだけ録画して印を付け、スマホからいつでも見返せます。録画は家から出ません。
  icon: icon.svg
  notices: [NOTICE]
  screenshots: [screenshots/review.png, screenshots/explore.png, screenshots/review-all.png]
  author: { name: geraldpeng6, url: https://github.com/geraldpeng6 }
  homepage: https://frigate.video
  # 上游 Frigate 的许可证；插件包自己的许可证写在仓库的 LICENSE 里。
  license: MIT
  tags:
    zh: [监控, 智能家居]
    en: [Monitoring, Home]
  setup:
    zh: 在网页的设置向导里逐台添加摄像头，填摄像头的地址就行。别的设备（VLC、Home Assistant 等）要取画面时，先在插件设置里打开局域网开关，再按插件详情页里显示的回放地址和账号密码去连。
    en: Add each camera in the web setup wizard with its address. To pull streams into other software (VLC, Home Assistant), turn on the LAN switch in the plugin settings first, then use the restream address and account shown in the plugin details.
    zh-Hant: 在網頁的設定精靈裡逐台新增攝影機，填攝影機的位址就行。別的裝置（VLC、Home Assistant 等）要取畫面時，先在外掛設定裡開啟區域網路開關，再按外掛詳情頁裡顯示的回放位址和帳號密碼去連。
    ja: Web の設定ウィザードでカメラを一台ずつ追加し、カメラのアドレスを入力します。他のソフト（VLC、Home Assistant など）で映像を見る場合は、先にプラグイン設定で LAN スイッチをオンにし、プラグイン詳細に表示される再配信アドレスとアカウントで接続します。
  about:
    zh: |
      把 Frigate 装在自己家里：接入家里的摄像头，画面没动静就不录，有动静才录，认出的人和车、动物会被框出来，事件能在手机上回看，录像不出门。

      有 NVIDIA 显卡就自动用显卡来认（新出的 RTX 50 系也行）。默认的识别程序装的时候自动下载，不到 0.5 GB 显存，几 GB 的卡就够；显卡越大能同时看着的摄像头越多。想换认得更准的程序，见插件目录里的 README。

      检测、录像、回放在网页里都能改。
    en: |
      Run Frigate at home: connect your cameras, record only when something moves, mark the people, cars and animals it recognises, review events from your phone — recordings never leave your machine.

      An NVIDIA card is used automatically for recognition (RTX 50 series included). The default recognition model downloads on install and needs under 0.5 GB of VRAM, so a card with a few GB is enough; more VRAM means more simultaneous cameras. To swap in a more accurate model, see the README in the plugin folder.

      Detection, recording and playback are all adjustable in the web page.
    zh-Hant: |
      把 Frigate 裝在自己家裡：接入家裡的攝影機，畫面沒動靜就不錄，有動靜才錄，認出的人和車、動物會被框出來，事件能在手機上回看，錄影不出門。

      有 NVIDIA 顯示卡就自動用顯示卡來辨識（新出的 RTX 50 系也行）。預設的辨識程式裝的時候自動下載，不到 0.5 GB 顯示記憶體，幾 GB 的卡就夠；顯示卡越大能同時看著的攝影機越多。想換認得更準的程式，見外掛目錄裡的 README。

      偵測、錄影、回放都能在網頁裡改。
    ja: |
      Frigate を家で動かします。家のカメラをつなぎ、動きがあったときだけ録画して、認識した人・車・動物に枠を付け、スマホから見返せます。録画は外に出ません。

      NVIDIA のカードがあれば自動で認識に使います（新しい RTX 50 系も可）。既定の認識モデルはインストール時に自動でダウンロードし、0.5 GB 未満のビデオメモリで足りるので数 GB のカードで十分です。メモリが多いほど同時に扱えるカメラが増えます。より精度の高いモデルへの差し替えはプラグインフォルダの README を参照してください。

      検出・録画・再生はすべて Web ページで調整できます。
  release_notes:
    zh: |
      插件包迁入官方插件合仓，内容与上一版相同。

      商店介绍重写：加摄像头和对外取画面的步骤移到「安装后要做的事」，模型、显存、回放流等说法换成日常用语；补繁体中文和日文。
    en: |
      Package moved into the official Wonton plugin monorepo; same content as the previous release.

      Store copy rewritten: camera setup and restream steps moved to the pre-install notice, with model/VRAM/restream wording in everyday words; Traditional Chinese and Japanese added.
    zh-Hant: "外掛包遷入官方外掛合倉，內容與上一版相同。\n\n商店介紹重寫：加攝影機和對外取畫面的步驟移到「安裝後要做的事」，模型、顯示記憶體、回放流等說法換成日常用語；補繁體中文和日文。"
    ja: "プラグインを公式プラグインリポジトリへ移動しました。内容は前版と同じです。\n\nストア紹介を書き直し、カメラ追加と再配信の手順を「インストール後の手順」に移し、モデル・ビデオメモリ・再配信などの言い方を日常的な言葉にしました。繁体字中国語と日本語を追加。"
  webui:
    service: frigate
    port: 8971
    sso: proxy
    proxy:
      headers:
        # Frigate 校验 X-Proxy-Secret（auth_secret），密钥只有网关认出用户后才带上；
        # 不用 {user}：Frigate 关掉自带登录后不按用户区分，也证明不了只信任核心（信任边界见公开插件规范的“网关代登录”一节）。
        X-Proxy-Secret: "{secret:frigate_proxy}"
  lan:
    ports:
      # go2rtc 的 RTSP 回放流，给局域网里的播放器和 Home Assistant 用。
      # Frigate 网页里的实时画面走网页端口，不经这里。
      # 带 client 时端口默认关，用户在插件设置里打开后，详情页显示地址和账号。
      - { service: frigate, port: 8554 }
    client:
      # 摄像头名是用户在 Frigate 里自己取的，地址里留占位；账号固定，密码由云吞生成。
      address: "rtsp://{host}:8554/<摄像头名>"
      username: "wonton"
      password: "{secret:rtsp_password}"
  secrets:
    frigate_proxy:
      generate: { bytes: 32 }
    rtsp_password:
      generate: { bytes: 24 }
  permissions:
    # 检测模型推理在显卡上跑。
    - devices.gpu
    # 拉摄像头的 RTSP 流（局域网）、下载检测模型（外网）、检查新版本。
    - network.egress
    # 在局域网上开放 RTSP 回放流端口。
    - network.lan
  # 显卡给 frigate 服务；required：本插件的核心功能就是显卡检测。
  gpu:
    services: [frigate]
  requirements:
    # 上游 -tensorrt 镜像只发 amd64。
    arch: [amd64]
    # 上游没写最低内存，按本机实测取整（一路 768x432 摄像头检测+录像时容器 RSS 约 1.4 GiB，多路按此估）。
    memory: 2G
    gpu: { need: required }
