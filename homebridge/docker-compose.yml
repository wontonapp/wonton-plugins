# Homebridge：宿主网络是 HomeKit 的硬要求——iPhone 靠 mDNS 发现桥，桥接网络里广播出不去（上游 README
# "network_mode: host — Required"）。config-ui-x 网页只监听 127.0.0.1，局域网绕不过网关，核心经回环中继接入。
# 登录用上游自己的首次设置向导（5.x 无默认账号，auth.json 不存在时向导强制先建管理员）。
services:
  # 一次性：首次启动前种一份 config.json，把 UI 绑到回环。已存在不覆盖（用户在网页里改的就是这一份）。
  # 不种 bridge 块：hb-service 首次启动时自己生成随机 username/port/PIN（缺什么补什么）。
  init:
    image: homebridge/homebridge:2026-11-10@sha256:49e10e19bce69de56b0b77c724f317858dcd32e17cd9f379833660b1af26dbd5
    entrypoint: ["sh", "-c"]
    command:
      - test -f /data/config.json || cp /seed/config.json /data/config.json
    volumes:
      - ${WONTON_APP_DATA}/homebridge:/data
    configs:
      - source: seed-config
        target: /seed/config.json
    network_mode: none
    restart: "no"

  homebridge:
    image: homebridge/homebridge:2026-11-10@sha256:49e10e19bce69de56b0b77c724f317858dcd32e17cd9f379833660b1af26dbd5
    depends_on:
      init:
        condition: service_completed_successfully
    environment:
      TZ: ${TZ}
      # npm 源保持官方默认（registry.npmjs.org）：上游 config-ui-x 网页没有换源设置，镜像每次
      # 启动还会用自带默认覆盖数据目录里的 .npmrc，改文件没用。
    volumes:
      - ${WONTON_APP_DATA}/homebridge:/homebridge
    # 上游要求宿主网络：HomeKit 桥和 mDNS 广播（镜像内置 avahi）。出网走宿主自己的路由，
    # 不经平台出网代理，也不申请 network.egress。
    network_mode: host
    # 宿主网络的 webui 必须写健康检查（规范硬要求）；查 /api/auth/settings 是 API 真答话，
    # config.json 载入成功才 200，不是只看进程活着。
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8581/api/auth/settings"]
      interval: 30s
      timeout: 10s
      start_period: 180s
      start_interval: 5s

configs:
  seed-config:
    file: config/config.json

x-wonton:
  spec: "0.12"
  # 反向域名：上游官网 homebridge.io。
  id: io.homebridge.homebridge
  version: 0.1.3
  kind: app
  title: { zh: "苹果家庭桥接（Homebridge）", en: "Apple Home Bridge (Homebridge)", zh-Hant: "蘋果家庭橋接（Homebridge）", ja: "Apple Home ブリッジ（Homebridge）" }
  description:
    zh: 把米家、涂鸦这些本来不支持苹果“家庭”App 的智能设备接进去，像请了个翻译把各家设备的话翻给 iPhone 听。
    en: Bring smart devices that Apple Home does not support (Mi Home, Tuya, …) into the Home app and Siri — like a translator between your gadgets and your iPhone.
    zh-Hant: 把米家、塗鴉這些本來不支援蘋果「家庭」App 的智慧裝置接進去，像請了翻譯把各家裝置的話翻給 iPhone 聽。
    ja: Apple の「ホーム」アプリに対応しないスマート家電（Mi Home、Tuya など）をホームアプリと Siri につなぎます。家電と iPhone の間の翻訳者のようなものです。
  icon: icon.svg
  notices: [NOTICE]
  screenshots: [screenshots/wizard.png, screenshots/wizard-account.png]
  author: { name: geraldpeng6, url: https://github.com/geraldpeng6 }
  homepage: https://homebridge.io
  # 上游 Homebridge 的许可证；插件包自己的许可证写在仓库的 LICENSE 里。
  license: Apache-2.0
  tags:
    zh: [智能家居, Siri]
    en: [Home, Siri]
  about:
    zh: |
      在家里架一座桥：不支持苹果“家庭”的设备（米家、涂鸦等）装上对应的接入插件后，会出现在“家庭”App 里，能用 Siri 和自动化控制，和原生支持苹果的设备放在同一个家里。

      网页只从云吞进来，局域网绕不过登录；但 iPhone 要能直接发现并控制它，所以它在局域网里是开着的，桥接和发现都走局域网——这是苹果家庭的工作方式。
    en: |
      Run a bridge at home: devices without Apple Home support (Mi Home, Tuya, …) show up in the Home app once their device plugins are installed, so Siri and automations control them next to natively supported accessories.

      The web page is reached through Wonton only, so the LAN cannot bypass its login; but iPhones must be able to find and control it directly, so it stays open on the LAN — that is how Apple Home works.
    zh-Hant: |
      在家裡架一座橋：不支援蘋果「家庭」的裝置（米家、塗鴉等）裝上對應的接入外掛後，會出現在「家庭」App 裡，能用 Siri 和自動化控制，和原生支援蘋果的裝置放在同一個家裡。

      網頁只從雲吞進來，區域網路繞不過登入；但 iPhone 要能直接發現並控制它，所以它在區域網路裡是開著的，橋接和發現都走區域網路——這是蘋果家庭的工作方式。
    ja: |
      家にブリッジを立てます。Apple ホーム非対応の機器（Mi Home、Tuya など）も対応プラグインを入れれば「ホーム」アプリに現れ、Siri やオートメーションで、もともと対応している機器と同じ家の中で操作できます。

      Web ページは Wonton 経由でしか来ないため、LAN からログインを迂回することはできません。ただし iPhone が直接見つけて操作できる必要があるので、LAN には開いたままです。これが Apple ホームの仕組みです。
  release_notes:
    zh: |
      介绍重写：首次打开建管理员账号的提示单独成段放在最前。

      商店介绍重写：建账号和装接入插件的步骤移到「安装后要做的事」；补繁体中文和日文。
    en: |
      Rewritten store copy: the create-the-admin-account note stands alone up front.

      Store copy rewritten: account and device-plugin steps moved to the pre-install notice; Traditional Chinese and Japanese added.
    zh-Hant: "介紹重寫：首次開啟建管理員賬號的提示單獨成段放在最前。\n\n商店介紹重寫：建帳號和裝接入外掛的步驟移到「安裝後要做的事」；補繁體中文和日文。"
    ja: "紹介を書き直し、初回起動時の管理者アカウント作成の注意を最初の段落に分けました。\n\nストア紹介を書き直し、アカウント作成と機器プラグインの手順を「インストール後の手順」に移しました。繁体字中国語と日本語を追加。"
  setup:
    zh: 打开网页，按向导建管理员账号；再到网页的「插件」页装上你设备对应的接入插件。配好后在 iPhone 的“家庭”App 里扫网页上显示的配对码，把它添加进来。
    en: Open the web page and create the admin account in the wizard; then install the matching device plugin from the web page's Plugins tab. Once configured, scan the pairing code shown there from the Home app on your iPhone to add it.
    zh-Hant: 開啟網頁，照精靈建立管理員帳號；再到網頁的「外掛」頁裝上你裝置對應的接入外掛。配好後在 iPhone 的「家庭」App 裡掃網頁上顯示的配對碼，把它加進來。
    ja: Web ページを開き、ウィザードで管理者アカウントを作ります。次に Web ページの「プラグイン」タブでお使いの機器に対応するプラグインを入れます。設定できたら、iPhone の「ホーム」アプリでページに表示されるペアリングコードを読み取り、追加します。
  webui:
    service: homebridge
    port: 8581
    # 上游有自己的登录和首次设置向导（建管理员），不需要也不支持代登录。
    sso: none
  permissions:
    # HomeKit 靠 mDNS 广播和本机桥接端口，必须用宿主网络（上游官方要求）。
    - network.host
  requirements:
    arch: [amd64, arm64]
    # 上游没写最低内存；按本机实测取整（Homebridge 2.5.0 + UI 5.30.0 空载 RSS 约 2xx MB，见 PR 验证记录）。
    memory: 512M
