# Ente 的单源入口：同一个地址上伺服网页应用、museum API 和对象存储的预签名请求。
# 浏览器所有请求同源，不触发 CORS。三段路由的原理见 docker-compose.yml 的文件头注释。

server {
    listen 80;
    # 照片和分片经这里进 MinIO，不设上限（museum 和 MinIO 自己管大小）。
    client_max_body_size 0;

    # /api/ → museum（museum 的接口都在根上，剥掉前缀）。响应体里 museum 给出的
    # 对象存储预签名 URL 带的是容器网络里的主机名（http://minio:3200/…），浏览器到不了，
    # 改写成相对路径，浏览器按当前源访问；MinIO 收到请求时 Host 由下面的桶路由还原成
    # 签名用的 minio:3200，签名校验两边一致。
    location /api/ {
        proxy_pass http://museum:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Connection "";
        # 关掉上游压缩，sub_filter 才能改写响应体。
        proxy_set_header Accept-Encoding "";
        sub_filter 'http://minio:3200' '';
        sub_filter 'http://wasabi-eu-central-2-v3:3200' '';
        sub_filter 'http://scw-eu-fr-v3:3200' '';
        sub_filter_once off;
        sub_filter_types application/json;
    }

    # 对象存储的路径式预签名请求（/桶名/对象?X-Amz-…）→ MinIO。
    # Host 必须还原成 museum 签名用的 minio:3200，否则签名对不上。
    # 桶名是 museum 配置里写死的三个，不会和网页应用的路径相撞。
    location ~ ^/(b2-eu-cen|wasabi-eu-central-2-v3|scw-eu-fr-v3)(/|$) {
        proxy_pass http://minio:3200;
        proxy_http_version 1.1;
        proxy_set_header Host "minio:3200";
        proxy_set_header Connection "";
        proxy_request_buffering off;
    }

    # 其余全部是 Ente Photos 网页应用（静态文件）。
    location / {
        proxy_pass http://web:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Connection "";
    }
}
