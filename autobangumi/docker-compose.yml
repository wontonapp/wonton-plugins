# AutoBangumi：按 RSS 自动追番，网页经云吞网关访问（sso: none，应用自己的登录）；
# RSS 刷新、元数据和海报要出网；下载器经 torrent_client 能力（qBittorrent Web API）连接，
# 文件在下载器侧，硬链接到媒体库时需要读 downloads、写 media。
services:
  # 一次性服务：首次启动前把下载器地址写进配置（仅当配置还不存在且能力地址已注入）。
  # 不写时 AB 用出厂默认配置，首次打开网页会走它自己的设置向导。
  seed:
    image: ghcr.io/estrellaxd/auto_bangumi:4.0.0@sha256:d2e2955b5e4caf345b4325db7bee150e861afaae5911181e5bd5646ddbcb66be
    entrypoint: ["/bin/sh", "/seed.sh"]
    environment:
      # requires torrent_client 注入的使用方地址；能力未注入时（依赖尚未支持）留空跳过。
      WONTON_TORRENT_CLIENT_URL: ${WONTON_TORRENT_CLIENT_URL:-}
    volumes:
      - ${WONTON_APP_DATA}/config:/app/config
    configs:
      - source: seed
        target: /seed.sh
    network_mode: none
    restart: "no"

  autobangumi:
    image: ghcr.io/estrellaxd/auto_bangumi:4.0.0@sha256:d2e2955b5e4caf345b4325db7bee150e861afaae5911181e5bd5646ddbcb66be
    depends_on:
      seed:
        condition: service_completed_successfully
    environment:
      TZ: ${TZ}
      PUID: ${PUID}
      PGID: ${PGID}
    volumes:
      - ${WONTON_APP_DATA}/config:/app/config
      - ${WONTON_APP_DATA}/data:/app/data
      # 硬链接到媒体库：读下载文件（改名经下载器 API，不写这里），写媒体库给 Jellyfin 看。
      - ${WONTON_SHARE_DOWNLOADS}:/downloads:ro
      - ${WONTON_SHARE_MEDIA}:/media
    stop_grace_period: 30s
    healthcheck:
      # /health 免鉴权且总返回 200，断言 body 里的 db_ok 才是真查过数据库。
      test: ["CMD", "python", "-c", "import json,urllib.request as u; r=json.load(u.build_opener(u.ProxyHandler({})).open('http://127.0.0.1:7892/health', timeout=3)); assert r['db_ok']"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 2s

  # 一次性服务：给核心的 MCP 总线签发 AB 的 MCP 令牌（AB 的 /mcp 只认令牌，
  # mcp_whitelist 默认拒绝一切 IP 访问）。令牌存应用数据库，容器重建仍有效；
  # 已有有效令牌就复用，不重复签发。
  mcp-token:
    image: curlimages/curl:8.23.0@sha256:3fb7e13e5d179a845c97d78204f3f1064d1907037f26a3ebf91710571151fd93
    entrypoint: ["/bin/sh", "/init.sh"]
    user: "${PUID}:${PGID}"
    volumes:
      - ${WONTON_APP_DATA}/mcp:/bridge
    configs:
      - source: mcp_init
        target: /init.sh
    depends_on:
      autobangumi:
        condition: service_healthy
    restart: "no"

configs:
  seed:
    file: config/seed.sh
  mcp_init:
    file: config/mcp-token.sh

x-wonton:
  spec: "0.13"
  id: org.autobangumi.autobangumi
  version: 0.1.3
  kind: app
  title: { zh: "自动追番（AutoBangumi）", en: "Anime Auto-Downloader (AutoBangumi)", zh-Hant: "自動追番（AutoBangumi）", ja: "アニメ自動追跡（AutoBangumi）" }
  description:
    zh: 像订追剧日历一样自动追新番：番剧一更新就自动下载、改好名字放进媒体库
    en: Follows new anime for you — each new episode is downloaded, renamed and filed into your media library automatically
    zh-Hant: 像訂追劇日曆一樣自動追新番：番劇一更新就自動下載、改好名字放進媒體庫
    ja: 新作アニメを自動で追いかけます。新しい話が配信されるたびに自動でダウンロードし、名前を整えてメディアライブラリに置きます。
  icon: icon.svg
  notices: [NOTICE]
  screenshots: [screenshots/home.png]
  author: { name: geraldpeng6, url: https://github.com/geraldpeng6 }
  homepage: https://www.autobangumi.org
  # 应用（AutoBangumi）的许可证；插件包自己的许可证写在仓库的 LICENSE 里。
  license: MIT
  tags:
    zh: [下载, 追番, 动漫]
    en: [Downloads, Anime]
  about:
    zh: |
      把想看的番加进来，之后不用管：到了更新时间自动下载新一集，改好名字放进媒体库文件夹。

      装了下载工具（qBittorrent）插件的话，下载器已经配好，粘贴订阅地址就能自动下载。在设置的插件页可以打开「硬链接到媒体库」：下载完的剧集会以同一份文件放进媒体库文件夹（Jellyfin 直接能看，不占双份空间），下载目录继续做种（别人也能从你这里下到）不受影响。

      机器人能查追番列表、搜番、订阅和退订、看下载进度。追番要能上外网（订阅地址、番剧资料和海报），家里断网时它会把失败如实标出来。
    en: |
      Add a show once and leave it: when a new episode airs it is downloaded, renamed and filed into your media library folder automatically.

      With the qBittorrent plugin installed the downloader is already configured — paste your subscription address and new episodes download themselves. In Settings → Plugins you can enable "Hardlink to media library": finished episodes appear in the media shared folder as the same file (Jellyfin picks them up, no duplicate space) while the download directory keeps seeding.

      A bot can list your subscriptions, search anime, subscribe or unsubscribe, and check download progress. Needs internet access for subscription addresses, anime info and posters; failures are reported honestly when offline.
    zh-Hant: |
      把想看的番加進來，之後不用管：到了更新時間自動下載新一集，改好名字放進媒體庫資料夾。

      裝了下載工具（qBittorrent）外掛的話，下載器已經設好，貼上訂閱網址就能自動下載。在設定的外掛頁可以開啟「連結到媒體庫」：下載完的劇集會以同一份檔案放進媒體庫資料夾（Jellyfin 直接能看，不佔兩份空間），下載目錄繼續做種（別人也能從你這裡下到）不受影響。

      機器人能查追番清單、搜番、訂閱和退訂、看下載進度。追番要能連上外網（訂閱網址、番劇資料和海報），家裡斷網時它會如實標出失敗。
    ja: |
      見たいアニメを一度追加すれば、あとは放っておけます。配信時間になると新しい話を自動でダウンロードし、名前を整えてメディアライブラリのフォルダに置きます。

      ダウンロードツール（qBittorrent）プラグインを入れていればダウンローダーは設定済みです。購読アドレスを貼り付けるだけで自動ダウンロードできます。設定のプラグインページで「メディアライブラリへハードリンク」を有効にすると、落とした話は同じファイルのままメディア共有フォルダに入ります（Jellyfin でそのまま見られ、容量も二重になりません）。ダウンロード先はシードを続けられます。

      ボットは購読一覧の確認、検索、購読と解除、進捗確認ができます。購読アドレス、アニメ情報、ポスターの取得にインターネットが必要で、家がオフラインの時は失敗したことをそのまま表示します。
  release_notes:
    zh: |
      介绍重写：首次登录提示单独成段放在最前，硬链接、RSS 抓种子等说法改成日常用语。

      商店介绍重写：首次登录步骤移到「安装后要做的事」，硬链接、RSS、订阅源等说法改成日常用语；补繁体中文和日文。
    en: |
      Rewritten store copy: the first-open sign-in note stands alone up front, and jargon like hardlinks and RSS is explained in everyday words.

      Store copy rewritten: the first-open sign-in moved to the pre-install notice, and hardlink/RSS wording replaced with everyday words; Traditional Chinese and Japanese added.
    zh-Hant: "介紹重寫：首次登入提示單獨成段放在最前，硬連結、RSS 抓種子等說法改成日常用語。\n\n商店介紹重寫：首次登入步驟移到「安裝後要做的事」，硬連結、RSS、訂閱來源等說法改成日常用語；補繁體中文和日文。"
    ja: "紹介を書き直し、初回ログインの注意を最初の段落に分けました。ハードリンクや RSS でのトレント取得などの表現を日常的な言い方に変えました。\n\nストア紹介を書き直し、初回サインインの手順を「インストール後の手順」に移し、ハードリンクや RSS などの言い方を日常的な言葉にしました。繁体字中国語と日本語を追加。"
  setup:
    zh: 第一次打开用 admin / adminadmin 登录并马上改密码，然后把蜜柑计划给你的订阅地址粘进来。
    en: Sign in with admin / adminadmin, change the password, then paste the subscription address Mikan gives you.
    zh-Hant: 第一次開啟用 admin / adminadmin 登入並馬上改密碼，然後把蜜柑計畫給你的訂閱網址貼進來。
    ja: 初回は admin / adminadmin でサインインしてすぐパスワードを変更し、蜜柑計画が発行する購読アドレスを貼り付けます。
  webui:
    service: autobangumi
    port: 7892
    sso: none
  mcp:
    service: autobangumi
    port: 7892
    path: /mcp
    transport: streamable-http
    headers:
      Authorization: Bearer {secret:mcp_token}
  secrets:
    mcp_token:
      collect: { service: mcp-token, path: /bridge/token }
  requires: [torrent_client]
  permissions:
    # RSS 刷新、TMDB/Bangumi 元数据和海报要出网。
    - network.egress
    # 硬链接到媒体库：读下载目录里的文件。
    - storage.share.downloads:read
    # 硬链接要写进媒体库共享文件夹。
    - storage.share.media:write
  requirements:
    arch: [amd64, arm64]
    # 上游没写最低内存；Python 单进程，按本机空闲实测取整。
    memory: 256M
