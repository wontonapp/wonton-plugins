# Traccar 定位平台：定位器和手机客户端把位置报进来，网页地图看位置、轨迹和电子围栏。
# 设备协议端口开在局域网（lan.ports），网页经核心网关 OIDC 登录。
services:
  traccar:
    image: traccar/traccar:6.17.0@sha256:b32d9346adf46df7c33c58577e17ad60f6feadd1f3cd87c876041f6c79317ef1
    environment:
      TZ: ${TZ}
      # 上游约定（Config.java）：设了这个变量后所有配置键都能用环境变量覆盖，
      # 键名规则是点换下划线、驼峰拆开大写（web.url → WEB_URL）。
      CONFIG_USE_ENVIRONMENT_VARIABLES: "true"
      # 上游按 web.url 拼 OIDC 回调（<web.url>/api/session/openid/callback），
      # 必须和核心登记的回调地址一致。
      WEB_URL: ${WONTON_APP_URL}
      OPENID_ISSUER_URL: ${WONTON_OIDC_ISSUER}
      OPENID_CLIENT_ID: ${WONTON_OIDC_CLIENT_ID}
      OPENID_CLIENT_SECRET: ${WONTON_OIDC_CLIENT_SECRET}
      # 跳过 traccar 自己的登录页，直接走核心登录；上游同时停用密码登录（含 Basic 认证）。
      OPENID_FORCE: "true"
      # 上游数据库里 registration 默认 false，家人经核心认证后首次登录会被拒；
      # 打开这个开关才给他们自动建号（都是核心认证过的家庭成员）。
      OPENID_ALLOW_REGISTRATION: "true"
      # 带 admin 组的人上游授管理员。
      OPENID_ADMIN_GROUP: admin
      # 默认 geocoder（locationiq）要 API key，没有 key 每个定位点都会报错；默认关掉，
      # 要地址的用户改 geocoder.* 配置（见 README）。
      GEOCODER_ENABLE: "false"
      # 上游默认开全部 60 多种协议的端口；只开家用常见的三种：
      # OsmAnd 5055（手机 Traccar Client / OsmAnd）、GT06 5023（车载定位器）、H02 5013（手表、项圈）。
      PROTOCOLS_ENABLE: osmand,gt06,h02
    volumes:
      # H2 数据库和照片等媒体文件；日志按上游默认写在 ./logs。
      - ${WONTON_APP_DATA}/data:/opt/traccar/data
      - ${WONTON_APP_DATA}/logs:/opt/traccar/logs
    # JVM 按容器内存自动封顶堆（25% ≈ 512M），家庭规模（几个设备）富余。
    mem_limit: 2G
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8082/api/server"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      start_interval: 2s

x-wonton:
  spec: "0.13"
  id: org.traccar.traccar
  version: 0.1.4
  kind: app
  title: { zh: "定位地图（Traccar）", en: "Location Map (Traccar)", zh-Hant: "定位地圖（Traccar）", ja: "位置マップ（Traccar）" }
  description:
    zh: 像一张全家共用的定位地图：手机、车载定位器、老人手表和宠物项圈的位置和轨迹都汇到这里看。
    en: "One shared map for the family: see the location and history of phones, car trackers, watches and pet collars."
    zh-Hant: 像一張全家共用的定位地圖：手機、車用定位器、老人手錶和寵物項圈的位置和軌跡都匯到這裡看。
    ja: 家族で共有する地図のようなものです。スマホ、車載トラッカー、見守り腕時計、ペットの首輪の位置と履歴を 1 か所で見られます。
  icon: icon.svg
  notices: [NOTICE]
  screenshots: [screenshots/map.jpg]
  author: { name: geraldpeng6, url: https://github.com/geraldpeng6 }
  homepage: https://www.traccar.org
  license: Apache-2.0
  tags:
    zh: [定位, 地图]
    en: [Location, Map]
  setup:
    zh: 打开网页加一台设备，拿到它的编号，填进定位器或手机客户端，位置就会出现在地图上。定位器或手机要连家里的网络，地址和端口在网页里有。
    en: Open the page, add a device, and enter its identifier into the tracker or phone app; its position then appears on the map. The tracker or phone must be on your home network — the address and port are in the page.
    zh-Hant: 開啟網頁加一台裝置，拿到它的編號，填進定位器或手機用戶端，位置就會出現在地圖上。定位器或手機要連家裡的網路，位址和埠在網頁裡有。
    ja: ページを開いて端末を追加し、その ID をトラッカーやスマホアプリに入れると、位置が地図に出ます。トラッカーやスマホは家のネットワークにつないでください。アドレスとポートはページにあります。
  about:
    zh: |
      给家里的车、老人、孩子和宠物装上定位器后，在一张地图上看他们在哪、走过哪里。可以画一个范围，进出这个范围时给你发通知（支持私聊、Telegram 等，要在网页里配）。

      手机装 Traccar Client（或 OsmAnd 的跟踪插件）后填这台服务器的局域网地址就能上报；车载定位器、手表这类设备也填同一个地址和端口。

      定位只在家的网络里上报，设备离开家里的网络后位置不再更新；网页地图在哪都能打开。
    en: |
      Put trackers on the family car, seniors, kids or pets, and see on one map where they are and where they have been. Draw a zone and get notified when it is crossed (private chat, Telegram and more, configured in the page).

      Install Traccar Client (or the OsmAnd tracking plugin) on a phone, enter the server's LAN address, and it reports; dedicated trackers use the same address and port.

      Positions are only reported on the home network: once a device leaves it, its location stops updating, while the map page itself opens from anywhere.
    zh-Hant: |
      給家裡的車、老人、孩子和寵物裝上定位器後，在一張地圖上看他們在哪、走過哪裡。可以畫一個範圍，進出這個範圍時給你發通知（支援私聊、Telegram 等，要在網頁裡設定）。

      手機裝 Traccar Client（或 OsmAnd 的跟蹤外掛）後填這台伺服器的區域網部位址就能上報；車用定位器、手錶這類裝置也填同一個位址和埠。

      定位只在家的網路裡上報，裝置離開家裡的網路後位置不再更新；網頁地圖在哪都能開啟。
    ja: |
      家の車、高齢者、子ども、ペットにトラッカーを付け、1 枚の地図で現在地と履歴を見ます。範囲を描き、出入りしたら通知を受け取れます（チャット、Telegram など。ページで設定）。

      スマホに Traccar Client（または OsmAnd の追跡プラグイン）を入れ、サーバーの LAN アドレスを入力すると報告します。専用トラッカーも同じアドレスとポートを使います。

      位置の報告は家のネットワーク内だけです。機器が家のネットワークを離れると更新は止まりますが、地図ページ自体はどこからでも開けます。
  release_notes:
    zh: |
      插件包迁入官方插件合仓，内容与上一版相同。

      商店介绍重写：加设备和填编号移到「安装后要做的事」，唯一编号、电子围栏等说法换成日常用语，并加了中文标题；补繁体中文和日文。
    en: |
      Package moved into the official Wonton plugin monorepo; same content as the previous release.

      Store copy rewritten: adding a device and entering its ID moved to the pre-install notice, with identifier/geofence wording in everyday words and a Chinese title added; Traditional Chinese and Japanese added.
    zh-Hant: "外掛包遷入官方外掛合倉，內容與上一版相同。\n\n商店介紹重寫：加裝置和填編號移到「安裝後要做的事」，唯一編號、電子圍欄等說法換成日常用語，並加了中文標題；補繁體中文和日文。"
    ja: "プラグインを公式プラグインリポジトリへ移動しました。内容は前版と同じです。\n\nストア紹介を書き直し、端末の追加と ID の入力を「インストール後の手順」に移し、識別子やジオフェンスなどの言い方を日常的な言葉にして中国語タイトルも付けました。繁体字中国語と日本語を追加。"
  webui:
    service: traccar
    port: 8082
    # 入口指上游 OIDC 起点：服务端 302 进核心登录链，无 JS 也能走通。
    # 不能用根路径：SPA 建应用会话靠 JS，curl 型探测走不到。
    path: /api/session/openid/auth
    sso: oidc
    oidc:
      redirect_paths: [/api/session/openid/callback]
      admin_groups: [admin]
  # 设备上报端口开在局域网：家里和同网的设备直接连，连接不经核心登录，上游协议自带设备编号认设备。
  # 只发布 TCP：上游 6.17 的 OsmAnd 解码器只处理 HTTP over TCP（手机客户端也是 HTTP GET），
  # 协议里的 UDP 通道不解码（实测发包不产生定位），不发布。
  lan:
    ports:
      - { service: traccar, port: 5055 }
      - { service: traccar, port: 5023 }
      - { service: traccar, port: 5013 }
  permissions:
    # 把 5055/5023/5013 发布到局域网地址上。
    - network.lan
    # 报警通知走用户在网页里配置的渠道（邮件、Telegram 等），这些是容器向外的连接。
    - network.egress
  # 镜像多架构（amd64 + arm64，docker buildx imagetools inspect）；上游没写最低内存，按空闲实测取 1G。
  requirements:
    arch: [amd64, arm64]
    memory: 1G
