name: stirling-pdf

services:
  # Stirling 以镜像里固定的 uid 1000（stirlingpdfuser）运行：容器以 root 起来后由上游入口脚本
  # setpriv 降权，compose 不写 user。核心对 root 启动的服务把数据目录交给 PUID:PGID，
  # 宿主 PUID 不是 1000 时应用就写不了；这里统一交给 1000，每次创建容器跑一遍，幂等。
  init:
    image: stirlingtools/stirling-pdf:3.3.0@sha256:ed7b1775c6706b5e5ea24fa6155f078eff1027bd35a17d21834e4407036025e6
    user: "0:0"
    environment:
      # notify 权限注入的发信三变量；应用不读环境变量，由下面的脚本写进配置文件。
      WONTON_SMTP_HOST: ${WONTON_SMTP_HOST:?}
      WONTON_SMTP_PORT: ${WONTON_SMTP_PORT:?}
      WONTON_MAIL_FROM: ${WONTON_MAIL_FROM:?}
    entrypoint:
      - /bin/sh
      - -c
      - |
        chown -R 1000:1000 /configs /storage
        # 应用首次启动会把带默认值的 settings.yml 写进 /configs 并从此以它为准，环境变量
        # DOCKER_ENABLE_SECURITY=false 压不住（实测 security profile 恒开、预建 admin 账号）。
        # 关登录和发信配置都写在应用不覆盖的 custom_settings.yml 里（settings.yml 之后加载，
        # 同名键以它为准）：没有账号体系，网关是唯一的门。每次创建容器按注入值重写一遍，
        # 幂等，也把 mail 段补进 0.1.1 只写了 security 的旧文件。服务器不提供 STARTTLS，
        # 明文 25 端口直连，不填用户名密码（应用在无凭据时自己关掉 SMTP AUTH）。
        cat > /configs/custom_settings.yml <<EOF
        security:
          enableLogin: false
        mail:
          enabled: true
          host: $$WONTON_SMTP_HOST
          port: $$WONTON_SMTP_PORT
          from: $$WONTON_MAIL_FROM
          startTlsEnable: false
        EOF
    volumes:
      - ${WONTON_APP_DATA}/configs:/configs
      - ${WONTON_APP_DATA}/storage:/storage
    network_mode: none
    restart: "no"

  app:
    image: stirlingtools/stirling-pdf:3.3.0@sha256:ed7b1775c6706b5e5ea24fa6155f078eff1027bd35a17d21834e4407036025e6
    depends_on:
      init:
        condition: service_completed_successfully
    environment:
      TZ: ${TZ}
      # 应用自己的登录用 custom_settings.yml 关掉（见 init 服务的说明）：网页始终在网关
      # 登录后面，打开就能用。上游 OIDC 虽然免费，但无法用配置把用户的身份配成管理员（应用拒绝
      # 同名密码账号走 SSO 登录，自动建的用户固定是 USER），所以不开应用登录。
      DOCKER_ENABLE_SECURITY: "false"
      # 登录关了，但安全模块仍会预建管理员；不指定时上游用写死的 admin/stirling，经
      # /api/v1/auth/login 仍可登成 ROLE_ADMIN（实测）。这里用核心生成的密码预建同名账号，
      # 默认口令失效；密码无人使用，只存在核心密钥库。
      SECURITY_INITIALLOGIN_USERNAME: admin
      SECURITY_INITIALLOGIN_PASSWORD: ${WONTON_SECRET_ADMIN_PASSWORD}
      # 界面默认中文；关闭统计（PostHog/Scarf）和首次启动的统计询问；搜索屏蔽保持默认。
      # 新版本检查是应用发起的外连，插件不出网，关掉（更新看商店或上游仓库）。
      SYSTEM_DEFAULTLOCALE: zh-CN
      SYSTEM_ENABLEANALYTICS: "false"
      SYSTEM_GOOGLEVISIBILITY: "false"
      SYSTEM_SHOWUPDATE: "false"
      SHOW_SURVEY: "false"
    volumes:
      # 用户库（H2 数据库）、设置和堆转储在 /configs，处理中的文件在 /storage，官方都要求挂卷，
      # 否则容器重建即丢。
      - ${WONTON_APP_DATA}/configs:/configs
      - ${WONTON_APP_DATA}/storage:/storage
    healthcheck:
      # 上游镜像自带的健康检查端点。
      test: ["CMD-SHELL", "curl -fs --max-time 10 http://127.0.0.1:8080/api/v1/info/status"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
      start_interval: 2s

x-wonton:
  spec: "0.17"
  id: com.stirlingtools.stirling-pdf
  version: 0.2.1
  kind: app
  title: { en: "Stirling-PDF" }
  subtitle: { zh: "PDF 工具箱", en: "PDF Toolbox", zh-Hant: "PDF 工具箱", ja: "PDF ツールボックス" }
  description:
    zh: 处理 PDF 的万能工具箱：合并、拆分、压缩、加密码、转图片、认字等 60 多种操作，打开网页就能用，文件只在家里处理。
    en: "An all-in-one PDF toolbox: merge, split, compress, add a password, convert to images, recognize text and more — over 60 tools in the browser, with files processed at home."
    zh-Hant: 處理 PDF 的萬能工具箱：合併、拆分、壓縮、加密碼、轉圖片、辨識文字等 60 多種操作，開啟網頁就能用，檔案只在家裡處理。
    ja: PDF を扱う万能ツールボックスです。結合・分割・圧縮・パスワード付与・画像変換・文字認識など 60 以上の操作を、ページを開くだけで使え、ファイルは家の中で処理されます。
  icon: icon.svg
  notices: [NOTICE]
  screenshots: [screenshots/phone.png]
  author: { name: geraldpeng6, url: https://github.com/geraldpeng6 }
  homepage: https://stirling.com
  # 应用主体 MIT；镜像按 STIRLING_FLAVOR=proprietary 构建，app/proprietary/、engine/ 是
  # Stirling PDF User License（免费版 5 用户上限），见 NOTICE。
  license: MIT AND LicenseRef-Stirling-PDF-User-License
  tags:
    zh: [PDF, 文档, 工具]
    en: [PDF, Documents, Tools]
  setup:
    zh: 打开网页就用，不用登录。处理完的文件要当场下载走，只临时放着，重装不保留。
    en: "Open the page and work — no login. Download finished files right away: they are only kept temporarily and do not survive reinstalls."
    zh-Hant: 開啟網頁就用，不用登入。處理完的檔案要當場下載走，只臨時放著，重裝不保留。
    ja: ページを開けば使え、ログインは不要です。処理したファイルはその場でダウンロードしてください。一時的に置かれるだけで、入れ直すと残りません。
  about:
    zh: |
      60 多个 PDF 工具：合并、拆分、压缩、加密码、去密码、转图片、图片转 PDF、Office 互转、认字、页面整理、水印、签名、修改文件信息等，全部在自己家里处理。

      中文认字开箱即用（内置简体中文语言包）。

      应用发的信（签名邀请、把文件发到邮箱）会出现在收件人的 Wonton 私聊里，收件人限家里人；发给外部邮箱会发送失败，应用当场报错。

      登录、用户管理等模块按上游的专有许可发布，免费版即可用，最多 5 个用户。只在家里处理，不连外网。
    en: |
      Over 60 PDF tools: merge, split, compress, add or remove passwords, convert to images, images to PDF, Office conversion, text recognition, page organizing, watermarks, signing, editing file details and more, all processed at home.

      Chinese text recognition works out of the box (Simplified Chinese language pack included).

      Emails the app sends (signing invites, emailing a file) arrive in the recipient's Wonton chat, household members only; sending to outside addresses fails on the spot.

      Sign-in, user management and similar modules ship under the upstream proprietary licence; the free tier is usable with up to 5 users. Everything is processed at home, with no internet connection.
    zh-Hant: |
      60 多個 PDF 工具：合併、拆分、壓縮、加密碼、去密碼、轉圖片、圖片轉 PDF、Office 互轉、辨識文字、頁面整理、浮水印、簽名、修改檔案資訊等，全部在自己家裡處理。

      中文辨識開箱即用（內建簡體中文語言包）。

      應用寄的信（簽名邀請、把檔案寄到信箱）會出現在收件人的 Wonton 私聊裡，收件人限家裡人；寄給外部信箱會發送失敗，應用當場報錯。

      登入、使用者管理等模組按上游的專有授權發布，免費版即可用，最多 5 個使用者。只在家裡處理，不連外網。
    ja: |
      60 以上の PDF ツールがあります。結合・分割・圧縮・パスワードの付与と解除・画像変換・画像から PDF・Office 相互変換・文字認識・ページ整理・透かし・署名・ファイル情報の編集などを、すべて自宅で処理します。

      中国語の文字認識はすぐ使えます（簡体字中国語の言語パック内蔵）。

      アプリが送るメール（署名依頼、ファイルのメール送信）は受け取った人の Wonton チャットに届き、宛先は家族だけです。外部アドレスに送るとその場で失敗します。

      サインインやユーザー管理などのモジュールは上流の独自ライセンスで提供され、無料版は 5 ユーザーまで使えます。処理はすべて家の中で行い、インターネットには出ません。
  release_notes:
    zh: |
      接上云吞的内部邮箱：签名邀请、邮件发送等应用发的信会送进收件人的「Wonton」私聊；收件人限家里人，发外部地址会失败。

      商店介绍重写：登录和临时文件的说明移到「安装后要做的事」，专有许可、出网等说法换成日常用语；补繁体中文和日文。
    en: |
      Connected to Wonton's internal mailbox: emails the app sends (signing invites, the email tool) arrive in the recipient's Wonton chat; recipients are limited to household members, external addresses fail.

      Store copy rewritten: sign-in and temporary-file notes moved to the pre-install notice, with proprietary-licence/outbound wording in everyday words; Traditional Chinese and Japanese added.
    zh-Hant: "接上雲吞的內部郵箱：簽名邀請、郵件傳送等應用發的信會送進收件人的「Wonton」私聊；收件人限家裡人，發外部地址會失敗。\n\n商店介紹重寫：登入和臨時檔案的說明移到「安裝後要做的事」，專有授權、外網等說法換成日常用語；補繁體中文和日文。"
    ja: "Wonton の内部メールにつなぎました。署名依頼やメール送信など、アプリが送るメールは受信者の Wonton ダイレクトメッセージに届きます。宛先は家族に限られ、外部アドレスへの送信は失敗します。\n\nストア紹介を書き直し、サインインと一時ファイルの説明を「インストール後の手順」に移し、独自ライセンスや外部通信などの言い方を日常的な言葉にしました。繁体字中国語と日本語を追加。"
  # 镜像支持 amd64 和 arm64（docker buildx imagetools inspect）；上游未写最低内存，JVM 按容器内存自动调，
  # OCR 加 LibreOffice 转换按 2G 报。
  requirements:
    arch: [amd64, arm64]
    memory: 2G
  webui:
    service: app
    port: 8080
  secrets:
    admin_password:
      generate: { bytes: 32 }
  permissions: [notify]
