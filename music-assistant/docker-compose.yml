# Music Assistant（全屋音乐）：一个曲库（本地音乐 + 各种流媒体）推送到家里所有音箱，多房间同步播放。
# 上游官方要求宿主网络（network_mode: host）：发现和推流靠 mDNS/SSDP 这类本地组播，AirPlay、Chromecast、
# DLNA、Sonos 还要直接在局域网上开随机端口，桥接网络属于上游明确不支持的形态。
# 宿主网络的服务连不到插件网络，网页经核心的中继容器（relay-webui）进网关；出网走宿主自己的路由，
# 不经出口容器，也不声明 network.egress（核心对宿主网络出网的定论）。
# 容器内挂 SMB/NFS 才需要的 SYS_ADMIN、DAC_READ_SEARCH、apparmor:unconfined 一律不申请：
# 本地音乐用共享文件夹 music 只读挂载，正是官方推荐的更安全做法。
services:
  server:
    image: ghcr.io/music-assistant/server:2.10.11@sha256:b14d5c1c93d776f33b9670a3c6febe3f072566d7b2f4f431a09dcca79bd8ac05
    network_mode: host
    # 镜像按非 root 运行设计（上游 Dockerfile：/app 与 /tmp 对所有用户可写）；数据目录由核心按 user 交给 PUID:PGID。
    user: "${PUID}:${PGID}"
    environment:
      TZ: ${TZ}
    volumes:
      - ${WONTON_APP_DATA}:/data
      # 本地音乐文件夹（storage.share.music:read），用户在应用里加"本地文件夹"音乐源时路径填 /music。
      - ${WONTON_SHARE_MUSIC}:/music:ro
    healthcheck:
      # /info 是 webserver 的公开端点（无需登录、初始设置前也可用），返回服务器信息 JSON：
      # 检查的是网页端口真的在应答，不只是进程活着。镜像里只有 wget，没有 curl。
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8095/info"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      start_interval: 2s

x-wonton:
  spec: "0.17"
  id: io.music-assistant.server
  version: 0.1.3
  kind: app
  title: { en: "Music Assistant" }
  subtitle: { zh: "全屋音乐", en: "Whole-Home Music", zh-Hant: "全屋音樂", ja: "家中音楽システム" }
  description:
    zh: 把家里的音箱连成一个音响系统：本地音乐和各家在线音乐合成一个曲库，推到每个房间播放，还能让几个房间同步放同一首。适合家里有好几个房间、想统一控制音箱的人；和一个人戴耳机听的音乐库不一样。
    en: "Turn your speakers into one sound system: local music and online music services in a single library, played in every room, in sync if you like. For homes with speakers in several rooms that want one place to control them; not a personal headphone library."
    zh-Hant: 把家裡的音箱連成一個音響系統：本地音樂和各家的線上音樂合成一個曲庫，推到每個房間播放，還能讓幾個房間同步放同一首。適合家裡有好幾個房間、想統一控制音箱的人；和一個人戴耳機聽的音樂庫不一樣。
    ja: 家のスピーカーを 1 つのオーディオシステムにします。ローカル音楽と各社のオンライン音楽を 1 つのライブラリにまとめ、各部屋で再生でき、複数室の同時再生もできます。複数の部屋にスピーカーがある家で、まとめて操作したい人向け。1 人でヘッドホンで聴く音楽ライブラリとは違います。
  icon: icon.svg
  notices: [NOTICE]
  screenshots: [screenshots/setup.png, screenshots/library.png]
  author: { name: geraldpeng6, url: https://github.com/geraldpeng6 }
  homepage: https://www.music-assistant.io
  # 上游应用的许可证；插件包自己的许可证写在仓库的 LICENSE 里。
  license: Apache-2.0
  tags:
    zh: [音乐, 智能家居]
    en: [Music, Home]
  about:
    zh: |
      把本地音乐和各家的在线音乐合成一个曲库，推送到家里的音箱上播放：AirPlay、Chromecast、Sonos、DLNA 这类音箱装好就会被自动找到，几个房间可以同步放同一首歌，也可以各放各的。

      它要直接待在局域网里才能找到音箱，所以拿到了最高一级的网络权限；代价是网页也直接开在本机网络里，局域网里的设备能绕过云吞打开它——应用自己的登录会挡住陌生人，介意的话可以在路由器上把 8095 端口拦掉。

      封面和专辑资料要连外网去取，走本机自己的网络出去，不经云吞的出口。
    en: |
      Combine local music and online music services into one library and play it on the speakers around your home: AirPlay, Chromecast, Sonos and DLNA speakers are found automatically, several rooms can play the same song in sync, or each its own.

      Finding speakers needs to sit directly on the LAN, so it gets the highest network permission; the cost is that the web page also opens on the host's own network, and LAN devices can reach it without Wonton — the app's own login keeps strangers out, and you can block port 8095 on your router if you prefer.

      Artwork and album details are fetched via the host's own connection, not through Wonton's outbound proxy.
    zh-Hant: |
      把本地音樂和各家的線上音樂合成一個曲庫，推送到家裡的音箱上播放：AirPlay、Chromecast、Sonos、DLNA 這類音箱裝好就會被自動找到，幾個房間可以同步放同一首歌，也可以各放各的。

      它要直接待在區域網路裡才能找到音箱，所以拿到了最高一級的網路權限；代價是網頁也直接開在本機網路裡，區域網路裡的裝置能繞過雲吞開啟它——應用自己的登入會擋住陌生人，介意的話可以在路由器上把 8095 連接埠擋掉。

      封面和專輯資料要連外網去取，走本機自己的網路出去，不經雲吞的出口。
    ja: |
      ローカル音楽と各社のオンライン音楽を 1 つのライブラリにまとめ、家のスピーカーで再生します。AirPlay・Chromecast・Sonos・DLNA のスピーカーは導入すれば自動で見つかり、複数室で同じ曲を同期再生することも、別々に再生することもできます。

      スピーカーを見つけるには LAN に直接いる必要があるため、最上位のネットワーク権限を持ちます。その代わり Web ページも本機のネットワークに直接開き、LAN の機器は Wonton を通さずに開けます。アプリ自体のログインが他人を防ぎますが、気になる場合はルータでポート 8095 を塞いでください。

      ジャケットやアルバム情報は本機の回線で取りに行き、Wonton の出口プロキシは使いません。
  release_notes:
    zh: |
      介绍重写：首次登录提示单独成段放在最前，「流媒体」改成「在线音乐」。

      商店介绍重写：首次设置移到「安装后要做的事」，宿主网络、端口、出口代理等说法换成日常用语；补繁体中文和日文。
    en: |
      Rewritten store copy: the first-open sign-in note stands alone up front, and streaming services are called online music services.

      Store copy rewritten: first-time setup moved to the pre-install notice, with host-network/port/proxy wording in everyday words; Traditional Chinese and Japanese added.
    zh-Hant: "介紹重寫：首次登入提示單獨成段放在最前，「流媒體」改成「線上音樂」。\n\n商店介紹重寫：首次設定移到「安裝後要做的事」，宿主網路、連接埠、出口代理等說法換成日常用語；補繁體中文和日文。"
    ja: "紹介を書き直し、初回ログインの注意を最初の段落に分け、「ストリーミング」を「オンライン音楽」に変えました。\n\nストア紹介を書き直し、初回設定を「インストール後の手順」に移し、ホストネットワーク・ポート・出口プロキシなどの言い方を日常的な言葉にしました。繁体字中国語と日本語を追加。"
  setup:
    zh: 打开网页先设管理员账号和密码，务必记牢——忘了只能清空数据重来。再到「设置 → 音乐源」添加“本地文件夹”，路径填 /music；在线音乐也在同一页登录添加。
    en: Open the page and set the admin account and password first — remember them, a wipe is the only reset. Then add a "Local filesystem" source under Settings → Music sources with the path /music; online services are signed in on the same page.
    zh-Hant: 開啟網頁先設管理員帳號和密碼，務必記牢——忘了只能清空資料重來。再到「設定 → 音樂來源」新增「本機資料夾」，路徑填 /music；線上音樂也在同一頁登入新增。
    ja: ページを開いてまず管理者アカウントとパスワードを設定し、必ず覚えてください。忘れるとデータを消すしかありません。次に「設定 → 音楽ソース」で「ローカルフォルダ」を追加し、パスに /music を入れます。オンライン音楽も同じページでサインインして追加します。
  webui:
    service: server
    port: 8095
    # 2.10 起应用自带用户认证：首次打开由用户自己注册管理员，符合"应用自带的登录"。
    sso: none
  permissions:
    # 宿主网络（很高）：mDNS/SSDP 组播发现音箱、给 AirPlay/Chromecast/DLNA/Sonos 推流，上游要求 network_mode: host。
    - network.host
    # 本地音乐文件夹，只读挂载。
    - storage.share.music:read
  requirements:
    # 上游官方支持 aarch64（树莓派 4 及以上），镜像有 amd64 和 arm64。
    arch: [amd64, arm64]
    # 上游官方最低要求：设备或容器 2GB 内存。
    memory: 2G
