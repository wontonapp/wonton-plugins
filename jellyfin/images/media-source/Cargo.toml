[package]
name = "wonton-jellyfin-media"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
publish = false

[lib]
name = "wonton_jellyfin_media"
path = "src/lib.rs"

[[bin]]
name = "wonton-jellyfin-media"
path = "src/main.rs"

[dependencies]
axum = "0.8"
base64 = "0.22"
bytes = "1"
futures-util = { version = "0.3", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "fs", "io-std", "io-util"] }

[dependencies.reqwest]
version = "0.12"
default-features = false
features = ["json", "stream"]

[profile.release]
strip = true
panic = "abort"

# 独立的一个 crate，不并进任何上层 workspace。
[workspace]
