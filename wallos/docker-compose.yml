# Wallos：订阅和续费管家（视频会员、云盘、域名等按期扣费的服务）。
# 上游单容器：nginx + php-fpm + cron 同进程组（startup.sh 托管），SQLite 存数据。
# 登录走核心 OIDC（上游官方环境变量，运行时覆盖数据库值，不预建账号，首次登录自动建号）；
# 到期提醒经核心的内部 SMTP 转进主人的 Wonton 私聊。
services:
  wallos:
    image: bellamy/wallos:5.11.1@sha256:182d4be4dae26834cc5cec3686bb142e78b0a139a0eb1059355d061d8c0de3e5
    # 上游 startup.sh 以 root 起步，把 www-data 改成 PUID/PGID 后降权，容器不能直接写 user:。
    environment:
      TZ: ${TZ}
      PUID: ${PUID}
      PGID: ${PGID}
      # 登录只认核心的身份提供方；全部是上游官方环境变量（README「OIDC」节），运行时覆盖数据库值。
      OIDC_ENABLED: "1"
      OIDC_PROVIDER_NAME: 云吞
      OIDC_ISSUER: ${WONTON_OIDC_ISSUER}
      OIDC_CLIENT_ID: ${WONTON_OIDC_CLIENT_ID}
      OIDC_CLIENT_SECRET: ${WONTON_OIDC_CLIENT_SECRET}
      # 回调落在插件根：任意带 ?code=&state= 的页面都会被上游 checksession 处理，
      # 核心按清单的 redirect_paths 登记回调地址，两者必须一致。
      OIDC_REDIRECT_URL: ${WONTON_APP_URL}/
      OIDC_AUTO_CREATE_USER: "1"
      OIDC_DISABLE_PASSWORD_LOGIN: "1"
      # 认人只按 sub；首次建号走 email 声明，不依赖 email_verified（IdP 是核心自己）。
      OIDC_REQUIRE_EMAIL_VERIFIED: "0"
      # 上游对 OIDC 端点和 SMTP 主机做私网拦截（SSRF allowlist）。核心的 auth/smtp
      # 别名都是私网名；allowlist 存在 admin 表，由 seed 服务按注入值刷新（见 seed.php），
      # compose 的插值不支持从 WONTON_OIDC_ISSUER 里剥出主机名。
    volumes:
      # SQLite 库（wallos.db）。
      - ${WONTON_APP_DATA}/db:/var/www/html/db
      # 订阅图标。
      - ${WONTON_APP_DATA}/logos:/var/www/html/images/uploads/logos
    configs:
      # 网页入口（webui.path /wonton-login.php）：种 OIDC state 后直跳核心登录。
      - source: wonton-login
        target: /var/www/html/wonton-login.php
    healthcheck:
      # health.php 只回 200 不查东西；login.php 真读 SQLite 渲染页面，
      # 没用户时 302 去注册页，curl 同样算通。
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1/login.php"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      start_interval: 2s

  seed:
    # 一次性服务：把邮件提醒通道写进应用配置表（email_notifications /
    # notification_settings），上游这两项只能登录后在网页里填，没有环境变量。
    # 装好时还没有用户，先写 user_id=1——首次 OIDC 登录自动建号就是 id 1（管理员）。
    image: bellamy/wallos:5.11.1@sha256:182d4be4dae26834cc5cec3686bb142e78b0a139a0eb1059355d061d8c0de3e5
    user: "${PUID}:${PGID}"
    entrypoint:
      - sh
      - -c
      - |
        i=0
        until test -w /var/www/html/db/wallos.db; do
          i=$$((i+1))
          if [ "$$i" -gt 60 ]; then
            echo "wallos.db 还没就绪或还没交给运行用户（应用初始化未完成）" >&2
            exit 1
          fi
          sleep 2
        done
        exec php /wonton/seed.php
    environment:
      WONTON_SMTP_HOST: ${WONTON_SMTP_HOST}
      WONTON_SMTP_PORT: ${WONTON_SMTP_PORT}
      WONTON_MAIL_FROM: ${WONTON_MAIL_FROM}
      WONTON_OIDC_ISSUER: ${WONTON_OIDC_ISSUER}
    volumes:
      - ${WONTON_APP_DATA}/db:/var/www/html/db
    configs:
      - source: seed
        target: /wonton/seed.php
    depends_on:
      wallos:
        condition: service_healthy
    network_mode: none
    restart: "no"

configs:
  seed:
    file: seed.php
  wonton-login:
    file: wonton-login.php

x-wonton:
  spec: "0.11"
  id: app.wallos.wallos
  version: 0.1.0
  kind: app
  title: { zh: 订阅管家（Wallos）, en: Wallos }
  description:
    zh: 像给订阅请的记账员：视频会员、网盘、域名这些按期扣费的服务记在一起，到期前提醒，全家花销一目了然
    en: "A ledger for your recurring subscriptions: track what you pay for, see upcoming renewals and get a heads-up before each due date"
  icon: icon.png
  notices: [NOTICE]
  screenshots: [screenshots/subscriptions.png, screenshots/home.png]
  author: { name: geraldpeng6, url: https://github.com/geraldpeng6 }
  homepage: https://wallosapp.com
  license: GPL-3.0-only
  tags:
    zh: [记账, 订阅]
    en: [Finance, Subscriptions]
  about:
    zh: |
      把家里按期扣费的服务（视频会员、网盘、域名、软件授权……）记到一处：每笔记价格和周期，
      日历里看最近的扣费日，统计里看每月、每年一共花多少。

      到期前几天自动提醒，提醒会出现在你的 Wonton 私聊里，不用盯着每个服务的续费日。

      支持多币种：在应用设置里把汇率源选成 Frankfurter（免费、不用 key）就能自动换算，
      想用 Fixer 的话自己填 key。应用内还能加家庭成员，记录每笔订阅是谁付的。

      登录用云吞的账号，打开就在里面，不用再注册或设密码。
    en: |
      Keep every recurring charge in one place: subscriptions for streaming, cloud storage,
      domains and software, each with its price and cycle, a calendar of upcoming renewals
      and monthly/yearly statistics.

      You get a heads-up in your Wonton chat a few days before each due date, so renewals
      never sneak up on you.

      Multiple currencies are supported: pick Frankfurter (free, no key) as the rate source
      in the app settings for automatic conversion, or enter your own Fixer key. Household
      members can be added inside the app to track who pays for what.

      Sign-in uses your Wonton account; the app opens straight into your subscriptions,
      with no second sign-up or password.
  release_notes: { zh: 首个版本：Wallos 5.11.1，登录接云吞账号，到期提醒发进 Wonton 私聊。, en: "Initial release: Wallos 5.11.1, Wonton sign-in and renewal reminders in your Wonton chat." }
  setup:
    zh: 想按人民币看金额：第一次登录后，在应用的 设置 → 货币 里把主货币换成人民币（CNY）。
    en: "To see amounts in yuan: after the first sign-in, pick CNY as the main currency under Settings → Currency in the app."
  webui:
    service: wallos
    port: 80
    # 入口先种 OIDC state 再跳核心登录，不经过上游登录页（上游有用户前还会先跳注册页）。
    path: /wonton-login.php
    sso: oidc
    oidc:
      # 上游在任意页面处理 ?code=&state= 回调，redirect_url 设的是插件根。
      redirect_paths: ["/"]
      # 上游把 client_secret 放在令牌请求体里（handle_oidc_callback.php）。
      token_endpoint_auth_method: client_secret_post
  tabs:
    - id: subscriptions
      title: { zh: 订阅, en: Home }
      icon: tabs/subscriptions.svg
      icon_selected: tabs/subscriptions-fill.svg
      path: /
  permissions:
    # 到期提醒经核心的内部 SMTP 转进收件人的 Wonton 私聊。
    - notify
    # 图标搜索（要用户自己的 SerpAPI key）、汇率源（Frankfurter/Fixer）和更新检查要出网。
    - network.egress
  requirements:
    arch: [amd64, arm64]
    # 上游没写最低内存，按本机空闲实测取整（安装后空闲实测约 37M，取 64M）。
    memory: 64M
