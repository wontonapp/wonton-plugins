# Reactive Resume（v6）：一个 Node 进程把网页、接口、工具接口和上传文件都从 3000 端口送出去，
# PDF 由应用自己渲染（编辑器里在浏览器用 WebAssembly，服务器端用内置引擎），v6 起没有无头浏览器服务，
# 官方自托管文档的推荐形态就是「应用 + PostgreSQL」两个容器（docs.rxresu.me 的 self-hosting/docker）。
# 上传走应用内置的本地存储（/app/data），文件由应用自己经同一路径发给浏览器，不需要单独的对象存储服务。
name: reactive-resume

services:
  db:
    # 上游官方 postgres:18（自托管文档推荐的大版本），按清单列表（index）的摘要固定。
    image: postgres:18@sha256:e3d24f6906d0760bf4da0dae872415391ededefad23fd471c47dc53b0ddf3c42
    restart: unless-stopped
    environment:
      TZ: ${TZ}
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${WONTON_SECRET_DB_PASSWORD}
    # postgres 18 镜像的数据根目录是 /var/lib/postgresql；镜像入口以 root 起步，自己把数据目录交给 postgres 用户。
    volumes:
      - ${WONTON_APP_DATA}/db:/var/lib/postgresql
    healthcheck:
      # 镜像自带的官方检查：连得上、库已建好并接受查询。
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "postgres"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 60s
      start_interval: 2s

  app:
    image: amruthpillai/reactive-resume:v6.1.0@sha256:0dcd0c372e78935ba04c9bb04fa0811177ee7fc4b961ce08acce49e13a1ac2a2
    restart: unless-stopped
    # 上游镜像固定以 node（uid 1000）运行；按云吞的规则让容器直接以用户的用户跑，数据目录归同一个用户。
    user: "${PUID}:${PGID}"
    environment:
      TZ: ${TZ}
      # 网页地址必须和浏览器地址栏完全一致，登录回调和会话 Cookie 都按它拼。
      APP_URL: ${WONTON_APP_URL}
      # 库密码是核心生成的十六进制串，只有 URL 安全字符，可以直接拼进连接串。
      DATABASE_URL: postgresql://postgres:${WONTON_SECRET_DB_PASSWORD}@db:5432/postgres
      # 会话签名密钥，核心生成；换掉它所有登录作废，所以放密钥里长期不变。
      AUTH_SECRET: ${WONTON_SECRET_AUTH_SECRET}
      # 登录走云吞：Better Auth 的 custom OAuth，从发现文档取端点，令牌请求把密钥放表单体
      # （Better Auth 带 clientSecret 时的默认方式），清单因此写 token_endpoint_auth_method: client_secret_post。
      OAUTH_PROVIDER_NAME: 云吞
      OAUTH_CLIENT_ID: ${WONTON_OIDC_CLIENT_ID}
      OAUTH_CLIENT_SECRET: ${WONTON_OIDC_CLIENT_SECRET}
      OAUTH_DISCOVERY_URL: ${WONTON_OIDC_ISSUER}/.well-known/openid-configuration
      # 只留云吞登录：关掉邮箱密码的注册、登录、改密和找回，这些流程都要发信；
      # 第一次用云吞登录的人自动建号（FLAG_DISABLE_SIGNUPS 不开，家人也能各建各的账号）。
      FLAG_DISABLE_EMAIL_AUTH: "true"
    volumes:
      - ${WONTON_APP_DATA}/data:/app/data
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # 应用自己的健康检查：数据库和存储都可访问才算健康（镜像自带的就是它，这里按官方索引要求写出来）。
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then((r) => { if (!r.ok) process.exit(1); }).catch(() => process.exit(1));"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
      start_interval: 2s

x-wonton:
  spec: "0.17"
  id: me.rxresu.resume
  version: 0.1.3
  kind: app
  title: { en: "Reactive Resume" }
  subtitle: { zh: "简历制作", en: "Resume Builder", zh-Hant: "履歷製作", ja: "履歴書作成" }
  description:
    zh: 在线做一份好看的简历：像用现成模板填空，填好经历挑个模板，就能导出 PDF 去投递。
    en: "Build a polished resume online: fill in your experience, pick one of dozens of templates and export a PDF."
    zh-Hant: 線上做一份好看的履歷：像用現成範本填空，填好經歷挑個範本，就能匯出 PDF 去投遞。
    ja: 見栄えのする履歴書をオンラインで作ります。経歴を埋めてテンプレートを選ぶだけで、応募用の PDF に書き出せます。
  icon: icon.svg
  notices: [NOTICE]
  screenshots: [screenshots/dashboard.png, screenshots/builder.png]
  author: { name: Wonton plugin authors }
  homepage: https://rxresu.me
  license: MIT
  tags:
    zh: [简历, 求职, 文档]
    en: [Resume, Job hunting, Documents]
  setup:
    zh: 打开就用云吞账号登录，第一次打开会自动建号；家里各人各写各的简历。
    en: Opening the page signs you in with your Wonton account, created on first visit; everyone at home keeps their own resumes.
    zh-Hant: 開啟就用雲吞帳號登入，第一次開啟會自動建號；家裡各人各寫各的履歷。
    ja: 開けば Wonton アカウントでサインインし、初回にアカウントが作られます。家族はそれぞれ自分の履歴書を作ります。
  about:
    zh: |
      在家里做简历：写好教育、工作经历和技能，从几十个现成模板里挑一个，一边编辑一边预览，导出 PDF、Word 或网页链接。

      各写各的，互不可见；做完想给谁看，就开一个分享链接，不想公开了随时关掉。

      在编辑器里导出 PDF 不用联网；用网页里那种“服务端导出”的 PDF 要联网取字体，没开外网时会失败。AI 功能（求职助手、自动填写）默认关闭，简历只存在家里。
    en: |
      Make resumes at home: write your education, work experience and skills, pick one of dozens of templates, edit with a live preview, and export to PDF, Word or a share link.

      Each person keeps their own resumes. Share one by link and turn the link off whenever you like.

      Exporting a PDF in the editor needs no internet; the server-side export fetches fonts online and fails without internet. AI features (job-search assistant, autofill) are off by default, and resume data stays at home.
    zh-Hant: |
      在家裡做履歷：寫好學歷、工作經歷和技能，從幾十個現成範本裡挑一個，一邊編輯一邊預覽，匯出 PDF、Word 或網頁連結。

      各寫各的，互不可見；做完想給誰看，就開一個分享連結，不想公開了隨時關掉。

      在編輯器裡匯出 PDF 不用連網；用網頁裡那種「伺服器端匯出」的 PDF 要連網取字型，沒開外網時會失敗。AI 功能（求職助手、自動填寫）預設關閉，履歷只存在家裡。
    ja: |
      家で履歴書を作ります。学歴・職歴・スキルを書き、数十のテンプレートから選び、編集しながらプレビューし、PDF・Word・共有リンクに書き出せます。

      各自が自分の履歴書を持ちます。共有したいときはリンクを発行し、いつでも止められます。

      エディタでの PDF 書き出しはオフラインででき、サーバー側の書き出しはフォントをネットから取るためオフラインでは失敗します。AI 機能（求職アシスタント、自動入力）は既定でオフで、履歴書は家に残ります。
  release_notes:
    zh: |
      插件包迁入官方插件合仓，内容与上一版相同。

      商店介绍重写：登录说明移到「安装后要做的事」，服务器端导出、API 等说法换成日常用语；补繁体中文和日文。
    en: |
      Package moved into the official Wonton plugin monorepo; same content as the previous release.

      Store copy rewritten: the sign-in note moved to the pre-install notice, with server-side-export/API wording in everyday words; Traditional Chinese and Japanese added.
    zh-Hant: "外掛包遷入官方外掛合倉，內容與上一版相同。\n\n商店介紹重寫：登入說明移到「安裝後要做的事」，伺服器端匯出、API 等說法換成日常用語；補繁體中文和日文。"
    ja: "プラグインを公式プラグインリポジトリへ移動しました。内容は前版と同じです。\n\nストア紹介を書き直し、サインインの説明を「インストール後の手順」に移し、サーバー側書き出しや API などの言い方を日常的な言葉にしました。繁体字中国語と日本語を追加。"
  webui:
    service: app
    port: 3000
    # 打开网页直接落在登录页：这里只剩「继续使用云吞」一个按钮，已登录的人会被送进简历列表。
    path: /auth
    sso: oidc
    oidc:
      # 上游固定回调 /api/auth/callback/custom（Better Auth 的 custom provider，docs.rxresu.me/self-hosting/sso）。
      redirect_paths: [/api/auth/callback/custom]
      token_endpoint_auth_method: client_secret_post
  tabs:
    - id: resumes
      title: { zh: 简历, en: Resumes }
      icon: tabs/resumes.svg
      path: /dashboard
  secrets:
    db_password:
      generate: { bytes: 32 }
    auth_secret:
      generate: { bytes: 32 }
  permissions: []
  # 官方文档的最低要求：应用 1 GB，和 PostgreSQL 同机时留 2 GB（docs.rxresu.me/self-hosting/docker）。
  # 镜像支持 amd64 和 arm64（docker buildx imagetools inspect）。
  requirements:
    arch: [amd64, arm64]
    memory: 2G
