# Reactive Resume（v6）：一个 Node 进程把网页、接口、工具接口和上传文件都从 3000 端口送出去，
# PDF 由应用自己渲染（编辑器里在浏览器用 WebAssembly，服务器端用内置引擎），v6 起没有无头浏览器服务，
# 官方自托管文档的推荐形态就是「应用 + PostgreSQL」两个容器（docs.rxresu.me 的 self-hosting/docker）。
# 上传走应用内置的本地存储（/app/data），文件由应用自己经同一路径发给浏览器，不需要单独的对象存储服务。
name: reactive-resume

services:
  db:
    # 上游官方 postgres:18（自托管文档推荐的大版本），按清单列表（index）的摘要固定。
    image: postgres:18@sha256:e3d24f6906d0760bf4da0dae872415391ededefad23fd471c47dc53b0ddf3c42
    restart: unless-stopped
    environment:
      TZ: ${TZ}
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${WONTON_SECRET_DB_PASSWORD}
    # postgres 18 镜像的数据根目录是 /var/lib/postgresql；镜像入口以 root 起步，自己把数据目录交给 postgres 用户。
    volumes:
      - ${WONTON_APP_DATA}/db:/var/lib/postgresql
    healthcheck:
      # 镜像自带的官方检查：连得上、库已建好并接受查询。
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "postgres"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 60s
      start_interval: 2s

  app:
    image: amruthpillai/reactive-resume:v6.1.0@sha256:0dcd0c372e78935ba04c9bb04fa0811177ee7fc4b961ce08acce49e13a1ac2a2
    restart: unless-stopped
    # 上游镜像固定以 node（uid 1000）运行；按云吞的规则让容器直接以用户的用户跑，数据目录归同一个用户。
    user: "${PUID}:${PGID}"
    environment:
      TZ: ${TZ}
      # 网页地址必须和浏览器地址栏完全一致，登录回调和会话 Cookie 都按它拼。
      APP_URL: ${WONTON_APP_URL}
      # 库密码是核心生成的十六进制串，只有 URL 安全字符，可以直接拼进连接串。
      DATABASE_URL: postgresql://postgres:${WONTON_SECRET_DB_PASSWORD}@db:5432/postgres
      # 会话签名密钥，核心生成；换掉它所有登录作废，所以放密钥里长期不变。
      AUTH_SECRET: ${WONTON_SECRET_AUTH_SECRET}
      # 登录走云吞：Better Auth 的 custom OAuth，从发现文档取端点，令牌请求把密钥放表单体
      # （Better Auth 带 clientSecret 时的默认方式），清单因此写 token_endpoint_auth_method: client_secret_post。
      OAUTH_PROVIDER_NAME: 云吞
      OAUTH_CLIENT_ID: ${WONTON_OIDC_CLIENT_ID}
      OAUTH_CLIENT_SECRET: ${WONTON_OIDC_CLIENT_SECRET}
      OAUTH_DISCOVERY_URL: ${WONTON_OIDC_ISSUER}/.well-known/openid-configuration
      # 只留云吞登录：关掉邮箱密码的注册、登录、改密和找回，这些流程都要发信；
      # 第一次用云吞登录的人自动建号（FLAG_DISABLE_SIGNUPS 不开，家人也能各建各的账号）。
      FLAG_DISABLE_EMAIL_AUTH: "true"
    volumes:
      - ${WONTON_APP_DATA}/data:/app/data
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # 应用自己的健康检查：数据库和存储都可访问才算健康（镜像自带的就是它，这里按官方索引要求写出来）。
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then((r) => { if (!r.ok) process.exit(1); }).catch(() => process.exit(1));"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
      start_interval: 2s

x-wonton:
  spec: "0.11"
  id: me.rxresu.resume
  version: 0.1.2
  kind: app
  title: { zh: 简历制作（Reactive Resume）, en: Resume Builder (Reactive Resume) }
  description:
    zh: 在线做一份好看的简历：像用现成模板填空，填好经历挑个模板，就能导出 PDF 去投递。
    en: >-
      Build a polished resume online: fill in your experience, pick one of dozens of templates
      and export a PDF.
  icon: icon.svg
  notices: [NOTICE]
  screenshots: [screenshots/dashboard.png, screenshots/builder.png]
  author: { name: Wonton plugin authors }
  homepage: https://rxresu.me
  license: MIT
  tags:
    zh: [简历, 求职, 文档]
    en: [Resume, Job hunting, Documents]
  about:
    zh: |
      在家里服务器上做简历：写好教育、工作经历和技能，从几十个现成模板里挑一个，一边编辑一边预览，导出 PDF、Word 或网页链接。

      家里每个人都用自己的账号，各写各的简历，互不可见。做完想给谁看，就开一个分享链接；不想公开了随时关掉。

      登录用云吞账号，第一次打开会自动建号。编辑器里导出 PDF 在浏览器里完成，不需要联网；接口上的服务器端 PDF
      导出要访问外网取字体，插件默认不出网时这条路会失败。

      AI 相关功能（求职助手、自动填写）默认关闭，简历数据只存在家里。
    en: |
      Make resumes on your home server: write your education, work experience and skills, pick one of dozens of ready-made
      templates, edit with a live preview, and export to PDF, Word or a share link.

      Everyone in the household signs in with their own account and keeps their own resumes. Share any resume by link and
      turn the link off whenever you like.

      You sign in with your Wonton account; the first visit creates it. Exporting a PDF in the editor happens in your
      browser and needs no internet; the API's server-side PDF export fetches fonts from the internet and fails while
      the plugin has no network access (the default).

      AI features (job-search assistant, autofill) are off by default; resume data stays at home.
  release_notes: { zh: 插件包迁入官方插件合仓，内容与上一版相同。, en: "Package moved into the official Wonton plugin monorepo; same content as the previous release." }
  webui:
    service: app
    port: 3000
    # 打开网页直接落在登录页：这里只剩「继续使用云吞」一个按钮，已登录的人会被送进简历列表。
    path: /auth
    sso: oidc
    oidc:
      # 上游固定回调 /api/auth/callback/custom（Better Auth 的 custom provider，docs.rxresu.me/self-hosting/sso）。
      redirect_paths: [/api/auth/callback/custom]
      token_endpoint_auth_method: client_secret_post
  tabs:
    - id: resumes
      title: { zh: 简历, en: Resumes }
      icon: tabs/resumes.svg
      path: /dashboard
  secrets:
    db_password:
      generate: { bytes: 32 }
    auth_secret:
      generate: { bytes: 32 }
  permissions: []
  # 官方文档的最低要求：应用 1 GB，和 PostgreSQL 同机时留 2 GB（docs.rxresu.me/self-hosting/docker）。
  # 镜像支持 amd64 和 arm64（docker buildx imagetools inspect）。
  requirements:
    arch: [amd64, arm64]
    memory: 2G
