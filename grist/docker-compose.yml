# 家庭表格（Grist）：像 Excel 又能当小数据库用，单容器，数据都在 /persist。
#
# 登录用网关代登录：Grist 的代登录头里放的是邮箱（上游文档 forwarded-headers 一节），
# 所以这里用 {email}；GRIST_DEFAULT_EMAIL 用的 WONTON_OWNER_EMAIL 和网关注入的是
# 同一个内部邮箱，主人第一个登录就是安装管理员，家里人登进来各有各的账号。
# Grist 没有可信代理白名单的选项，本插件不出网、不开局域网端口，能连到它的
# 只有核心和本插件自己的容器（见规范“网关代登录”的表格）。
name: grist

services:
  grist:
    # 上游官方镜像 grist-oss：只有自由开源代码（Apache-2.0），社区版，amd64 和 arm64 都有。
    # 主镜像 gristlabs/grist 只有 amd64，且带可切换的商业版（要激活密钥，插件不依赖它）。
    image: gristlabs/grist-oss:1.7.22@sha256:40d2c0ce0c29b2aa1ec1dcf9652ec26a13a8f2b4b44116733bcede428afd27dc
    # 镜像入口脚本以 root 启动、把 /persist 归一到镜像内 grist 用户（uid 1001）再降权运行，
    # 不认 PUID/PGID，所以不写 user。备份时注意数据目录里的文件属主是这个 uid。
    environment:
      APP_HOME_URL: ${WONTON_APP_URL:?核心没有注入插件网页地址}
      # 第一个用它登录的人成为安装管理员；改值会改掉管理员，核心注入的邮箱装好后不变。
      GRIST_DEFAULT_EMAIL: ${WONTON_OWNER_EMAIL:?核心没有注入主人邮箱}
      # 网关代登录：网关认出用户后带上 X-Wonton-User。
      GRIST_FORWARD_AUTH_HEADER: X-Wonton-User
      # 单个家庭站点：沿用内置站点 docs，根路径就是首页（上游自托管文档的 GRIST_SINGLE_ORG 用法）。
      # 不要设成别的名字：上游为自定义站点预建管理员时拿邮箱当显示名，登录后右上角会显示邮箱而不是名字。
      GRIST_SINGLE_ORG: docs
      # 新安装默认先进 /boot 的首次设置向导；插件已把该配的都配好，直接投入服务。
      GRIST_IN_SERVICE: "true"
      # 每个请求都认代登录头、不依赖 Grist 自己的会话：登录态始终和网关一致，不会出现会话和请求头
      # 各认一个账号的情况（上游 forwarded-headers 文档的 K8s 变体在用同一开关）。
      GRIST_IGNORE_SESSION: "1"
      # 不申请高权限，公式沙箱退回不隔离模式：公式以容器用户直接运行，
      # 别导入陌生人的表格（见 README）。上游默认值 gvisor 需要 SYS_PTRACE 等能力。
      GRIST_SANDBOX_FLAVOR: unsandboxed
      # 不出网：关遥测和版本检查，避免反复尝试连外网。（值必须加引号：YAML 把裸 off 当布尔。）
      GRIST_TELEMETRY_LEVEL: "off"
      GRIST_ALLOW_AUTOMATIC_VERSION_CHECKING: "false"
      GRIST_SESSION_SECRET: ${WONTON_SECRET_SESSION_SECRET:?核心没有注入会话密钥}
    volumes:
      - ${WONTON_APP_DATA:?核心没有注入插件数据目录}:/persist
    healthcheck:
      # /status 在就绪前回 503（{"error":"starting"}），就绪后回 200（“... is alive.”）。
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8484/status"]
      interval: 30s
      timeout: 5s
      start_period: 120s
      start_interval: 2s

x-wonton:
  spec: "0.11"
  id: com.getgrist.grist
  version: 0.1.2
  kind: app
  title: { zh: "能算的表格（Grist）", en: "Linked Spreadsheets (Grist)", zh-Hant: "能算的表格（Grist）", ja: "連携表計算（Grist）" }
  description:
    zh: 像会自动算的 Excel：家里的资产、报销、清单放进互相联动的表格里，汇总自己算好，还能画成图表
    en: "Like a spreadsheet that recalculates itself: track budgets, inventories and lists in linked tables, with totals and charts for free"
    zh-Hant: 像會自動算的 Excel：家裡的資產、報銷、清單放進互相聯動的表格裡，彙總自己算好，還能畫成圖表
    ja: ひとりでに計算し直す表計算ソフトのようなもの。資産・経費・リストを連動する表にまとめると、合計が自動で計算され、グラフにもできます。
  icon: icon.png
  notices: [NOTICE]
  screenshots: [screenshots/home.png]
  author: { name: geraldpeng6, url: https://github.com/geraldpeng6 }
  homepage: https://www.getgrist.com
  license: Apache-2.0
  tags:
    zh: [效率, 记账]
    en: [Productivity, Finance]
  setup:
    zh: 打开就用云吞账号登录，不用注册；建好一张表格后，家里人都能打开。
    en: Opening the page signs you in with your Wonton account — no sign-up. Once a document exists, the whole family can open it.
    zh-Hant: 開啟就用雲吞帳號登入，不用註冊；建好一張表格後，家裡人都能開啟。
    ja: 開けば Wonton アカウントでサインインでき、登録は不要です。文書を一度作れば、家族みんなが開けます。
  about:
    zh: |
      把家里的东西记进表格：资产、报销、课程表、藏书清单都行。表格之间能互相引用，汇总自动算，还能画成图表。

      每一行、每一列谁看得到、谁能改，都可以按人设规则。

      表格里算数的公式是能写程序的那种（Python 语法），在这台机器上直接运行、外面没有隔离，所以只导入自己和家人做的表格，不要导入网上陌生人的文件。
    en: |
      Put household things into tables: assets, expenses, timetables, book lists. Tables can reference each other, totals recalculate automatically, and everything can become a chart.

      You decide who can see or edit each table, column and row, per person.

      Formulas that calculate are written as code (Python syntax) and run directly on this machine without isolation, so only import documents made by you or your family — not files from strangers.
    zh-Hant: |
      把家裡的東西記進表格：資產、報銷、課表、藏書清單都行。表格之間能互相引用，彙總自動算，還能畫成圖表。

      每一列、每一行誰看得到、誰能改，都可以按人設規則。

      表裡算數的公式是能寫程式的那種（Python 語法），在這台機器上直接執行、外面沒有隔離，所以只匯入自己和家人做的表格，不要匯入網上陌生人的檔案。
    ja: |
      家のものを表に記録します。資産・経費・時間割・蔵書リストなど何でも構いません。表同士は参照でき、合計は自動で計算され、グラフにもできます。

      どの行・列を誰が見られて誰が変更できるかは、人ごとに決められます。

      計算する数式はプログラム（Python 構文）としてこのマシン上で直接実行され、外側の隔離はありません。自分や家族が作った文書だけを取り込み、ネット上の他人のファイルは入れないでください。
  release_notes:
    zh: |
      插件包迁入官方插件合仓，内容与上一版相同。

      商店介绍重写：登录和建表说明移到「安装后要做的事」，数据库、隔离等说法换成日常用语；补繁体中文和日文。
    en: |
      Package moved into the official Wonton plugin monorepo; same content as the previous release.

      Store copy rewritten: sign-in and document setup moved to the pre-install notice, with database/isolation wording in everyday words; Traditional Chinese and Japanese added.
    zh-Hant: "外掛包遷入官方外掛合倉，內容與上一版相同。\n\n商店介紹重寫：登入和建表說明移到「安裝後要做的事」，資料庫、隔離等說法換成日常用語；補繁體中文和日文。"
    ja: "プラグインを公式プラグインリポジトリへ移動しました。内容は前版と同じです。\n\nストア紹介を書き直し、サインインと文書作成の説明を「インストール後の手順」に移し、データベースや隔離などの言い方を日常的な言葉にしました。繁体字中国語と日本語を追加。"
  webui:
    service: grist
    port: 8484
    sso: proxy
    proxy:
      headers:
        # Grist 的代登录只认邮箱（上游 forwarded-headers 文档），没有用户名概念。
        X-Wonton-User: "{email}"
  # 会话密钥由核心生成：重装（保留数据）沿用，删数据重装后旧会话失效，重新登录即可。
  secrets:
    session_secret:
      generate: { bytes: 32 }
  # owner.identity：Grist 在首次启动时按 GRIST_DEFAULT_EMAIL 预建管理员，需要主人的邮箱。
  permissions:
    - owner.identity
  requirements:
    # 上游 grist-oss 镜像有 amd64 和 arm64（docker buildx imagetools inspect）。
    arch: [amd64, arm64]
    # 上游没写最低内存；空载实测约 192M（打开文档后的 Python 数据引擎另计），取 512M。
    memory: 512M
