# Bazarr：给 Sonarr/Radarr 管的剧集和电影自动找字幕，字幕写在视频旁边。
# 一次性服务把云吞注入的 Sonarr/Radarr 连接写进 Bazarr 配置；
# 字幕站（OpenSubtitles.com 等）要出网，走 network.egress。
services:
  connect-arrs:
    # 首次写入和每次重建时对齐 Sonarr/Radarr 连接（见 connect-arrs.py）。
    # 与主服务同一个上游镜像，避免再引入一个工具镜像；镜像里的 python3 带 PyYAML。
    image: linuxserver/bazarr:1.6.2@sha256:832820dec70bce9e912c6eee7a95baf6551e03dbc63325a7208daaa455423752
    user: "${PUID}:${PGID}"
    entrypoint: ["python3", "/seed/connect-arrs.py"]
    environment:
      # PyYAML 打包在 Bazarr 自带的 libs 里（/app/bazarr/bin/libs），不在镜像的 venv。
      PYTHONPATH: /app/bazarr/bin/libs
      WONTON_X_WONTON_SONARR_URL: ${WONTON_X_WONTON_SONARR_URL:-}
      WONTON_X_WONTON_SONARR_KEY: ${WONTON_X_WONTON_SONARR_KEY:-}
      WONTON_X_WONTON_RADARR_URL: ${WONTON_X_WONTON_RADARR_URL:-}
      WONTON_X_WONTON_RADARR_KEY: ${WONTON_X_WONTON_RADARR_KEY:-}
    volumes:
      - ${WONTON_APP_DATA}/config:/config
    configs:
      - source: connect_arrs
        target: /seed/connect-arrs.py
    network_mode: none
    restart: "no"

  bazarr:
    depends_on:
      connect-arrs:
        condition: service_completed_successfully
    # LinuxServer.io 打包的 Bazarr 镜像（上游只发布 zip，不发布官方镜像；LSIO 是安装文档指定的打包方），
    # amd64 和 arm64，按清单列表（index）的摘要固定；镜像以 root 启动再降到 PUID:PGID（LSIO 约定），
    # 数据目录由核心按默认交给 PUID:PGID。
    image: linuxserver/bazarr:1.6.2@sha256:832820dec70bce9e912c6eee7a95baf6551e03dbc63325a7208daaa455423752
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
    volumes:
      - ${WONTON_APP_DATA}/config:/config
      # 与 sonarr/radarr 插件相同的挂载点：Bazarr 看到的路径必须和它们一致，
      # 字幕才落在正确的视频旁边，不用再配 path mappings。
      - ${WONTON_SHARE_MEDIA}:/media
    healthcheck:
      # /api/system/ping 免鉴权（源码标注 unauthenticated endpoint），返回 200 即 API 层已就绪。
      test: ["CMD", "curl", "--noproxy", "*", "--fail", "--silent", "--show-error", "http://127.0.0.1:6767/api/system/ping"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      start_interval: 2s
    stop_grace_period: 30s

configs:
  connect_arrs:
    file: connect-arrs.py

x-wonton:
  spec: "0.12"
  id: media.bazarr.bazarr
  version: 0.1.1
  kind: app
  title: { zh: 字幕助手（Bazarr）, en: Subtitles (Bazarr) }
  description:
    zh: 给下载好的电影和剧集自动配字幕，字幕就放在视频旁边
    en: Automatically finds subtitles for downloaded movies and shows, right next to the video
  icon: icon.png
  notices: [NOTICE]
  screenshots: [screenshots/series.png, screenshots/languages.png]
  author: { name: geraldpeng6, url: https://github.com/geraldpeng6 }
  homepage: https://www.bazarr.media
  # 应用（Bazarr）的许可证；插件包自己的许可证写在仓库的 LICENSE 里。
  license: GPL-3.0-only
  tags:
    zh: [字幕, 视频, 影视]
    en: [Subtitles, Video, Movies]
  setup:
    zh: 第一次打开后，到 设置 → Languages 选要找的字幕语言（比如简体中文），之后新下载的视频就会自动配上字幕。
    en: After opening for the first time, pick your subtitle languages under Settings → Languages (e.g. Simplified Chinese); new downloads then get subtitles automatically.
  about:
    zh: |
      给家里下载好的电影和剧集自动配上字幕：连接 Sonarr 或 Radarr 之后，新片一下载完，Bazarr 就按你选的语言去找字幕，下载后放在视频旁边，Jellyfin 里播放时直接可选。

      第一次打开就是 Bazarr 自己的界面。先到 设置 → Languages 选语言，再到 设置 → Sonarr / Radarr 看连接：装了对应插件时，连接地址由云吞自动填好；API 密钥可以手动填，在对应插件的设置页里能看到。

      字幕来自 Bazarr 内置的字幕站（如 OpenSubtitles.com），所以需要能访问外网；字幕站自己的账号（比如 OpenSubtitles 的 VIP）在 Bazarr 设置里自己填，插件不代管。

      Bazarr 的片库完全来自 Sonarr/Radarr：两个都没装时列表是空的，这是正常的。
    en: |
      Adds subtitles to the movies and shows on your server: once connected to Sonarr or Radarr, Bazarr looks up subtitles in the languages you picked as soon as a download finishes and saves them next to the video, ready to select in Jellyfin.

      The first opening shows Bazarr's own interface. Pick languages under Settings → Languages, then check Settings → Sonarr / Radarr: with the matching plugin installed, Wonton fills in the address; the API key can be entered by hand — it is shown on that plugin's own settings page.

      Subtitles come from the providers built into Bazarr (such as OpenSubtitles.com), so internet access is required; provider accounts of your own (like an OpenSubtitles VIP) are entered in Bazarr's settings, the plugin does not manage them.

      Bazarr's library comes entirely from Sonarr/Radarr: with neither installed the lists stay empty.
  release_notes: { zh: 插件包迁入官方插件合仓，保留 Bazarr 1.6.2、Sonarr/Radarr 连接和字幕写入 media 共享文件夹。, en: "Moved into the official Wonton plugin monorepo; keeps Bazarr 1.6.2, Sonarr/Radarr connections and subtitle writes to the media share." }
  webui:
    service: bazarr
    port: 6767
    sso: none
  # 两个都写 wants 不写 requires：只连其中一侧也有用（只有剧集或只有电影），
  # requires 会在安装时强制同时装上两个提供方；wants 有就用、没有照装，详情页轻提示。
  wants: [x-wonton.sonarr, x-wonton.radarr]
  permissions:
    # 字幕源（OpenSubtitles.com 等）和版本检查都要出网。
    - network.egress
    # 字幕写在视频旁边，需要 media 共享文件夹的写权限（与 sonarr/radarr 相同挂载点 /media）。
    - storage.share.media:write
  requirements:
    arch: [amd64, arm64]
    # 上游没写最低内存；官方镜像空载实测约 180 MiB（1.6.2，单剧集样本），扫描大库、
    # 字幕翻译和转码探测按约三倍余量取整。
    memory: 512M
