# Open Notebook：把资料（网址、文件、视频）丢进笔记本，问它问题、生成摘要和播客。
#
# 上游单容器镜像内含 SurrealDB、API、后台 worker 和网页（镜像的 supervisord.conf）；
# 网页的 /api/* 由 Next.js 反代到容器内的 5055（上游 next.config.ts 的 rewrites），
# 所以只需经网关暴露 8502，5055 不对外。数据库口令是镜像里写死的 root/root
# （上游单容器文档），容器不发布 8000 端口，插件网络外连不到。
services:
  notebook:
    # 上游官方镜像，按清单列表（index）摘要固定；标签写上游版本（Docker Hub 上的版本标签不带 v 前缀）。
    image: lfnovo/open_notebook:1.15.1-single@sha256:0763d151f90ca5ddf5ac12a729b5f9ea472ff9e79dbba600840ed8f4349e9b5c
    environment:
      # 存进数据库的服务商凭据用它在库里加密；丢了它，已存的凭据解不开（上游单容器文档）。
      OPEN_NOTEBOOK_ENCRYPTION_KEY: ${WONTON_SECRET_ENCRYPTION_KEY}
      # 应用自己的登录口令：网页和 REST API 都验它（上游 api/auth.py）。
      OPEN_NOTEBOOK_PASSWORD: ${WONTON_SECRET_APP_PASSWORD}
      # 单容器内嵌 SurrealDB 监听 8000、账号写死 root/root（上游 supervisord.surrealdb.conf），
      # 这几个值照上游单容器文档写，改了反而连不上。
      SURREAL_URL: ws://localhost:8000/rpc
      SURREAL_USER: root
      SURREAL_PASSWORD: root
      SURREAL_NAMESPACE: open_notebook
      SURREAL_DATABASE: open_notebook
      # 模型走云吞的模型网关（OpenAI 兼容）：设置里「OpenAI Compatible」服务商发现和调用模型时，
      # 数据库里没有凭据就回退读这两个环境变量（上游 open_notebook/ai/key_provider.py）。
      # 没接上网关时是空串：发现不到模型，应用如实显示不可用。
      OPENAI_COMPATIBLE_BASE_URL: ${WONTON_MODEL_BASE_URL}
      OPENAI_COMPATIBLE_API_KEY: ${WONTON_MODEL_API_KEY}
      # 网页只经网关暴露 8502，浏览器连不到 5055；上游 /config 这时会算出「主机:5055」的 API 地址，
      # 浏览器全部请求失败。上游单容器文档的做法是设 API_URL 指向公开地址（supervisord 会传给网页进程），
      # 浏览器就用同源路径走 Next 的 /api 反代。
      API_URL: ${WONTON_APP_URL}
    volumes:
      # 上传的资料、抽取缓存；/app/data 是上游挂载的应用数据目录。
      - ${WONTON_APP_DATA}/data:/app/data
      # 内嵌 SurrealDB 的数据库文件；不挂出来每次重建容器数据就没了（上游单容器文档）。
      - ${WONTON_APP_DATA}/database:/mydata
    # /api/config 不需要口令（上游排除名单），里面带真实查询数据库的 dbStatus，
    # 网页 8502 能出登录页才算整份应用起来了。首次请求会顺带查上游新版本，最多再等 10 秒。
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:5055/health && curl -fsS http://127.0.0.1:5055/api/config | grep -q '\"dbStatus\":\"online\"' && curl -fsS -o /dev/null http://127.0.0.1:8502/"]
      interval: 30s
      timeout: 15s
      start_period: 120s
      start_interval: 3s
      retries: 3

x-wonton:
  spec: "0.11"
  id: com.github.lfnovo.opennotebook
  version: 0.1.3
  kind: app
  title: { zh: "AI 资料笔记本（Open Notebook）", en: "AI Notebook (Open Notebook)", zh-Hant: "AI 資料筆記本（Open Notebook）", ja: "AI 資料ノート（Open Notebook）" }
  description:
    zh: 把网址、文件丢进去，AI 读完帮你答题、写摘要，还能把资料做成一档播客。
    en: Add links and files, and the AI reads them to answer questions, write summaries, and turn your material into a podcast.
    zh-Hant: 把網址、檔案丟進去，AI 讀完幫你答題、寫摘要，還能讓資料變成一集播客。
    ja: リンクやファイルを入れると、AI が読んで質問に答え、要約を書き、資料をポッドキャストにまでもできます。
  icon: icon.png
  notices: [NOTICE]
  screenshots: [screenshots/notebooks.png, screenshots/notebook.png, screenshots/models.png]
  author: { name: geraldpeng6, url: https://github.com/geraldpeng6 }
  homepage: https://github.com/lfnovo/open-notebook
  # 上游应用（lfnovo/open-notebook）的许可证；插件包自己的许可证在 LICENSE。
  license: MIT
  tags:
    zh: [AI, 笔记]
    en: [AI, Notes]
  about:
    zh: |
      把网址、文件、视频链接丢进一本本“笔记本”，AI 读完这些资料后帮你：回答提问（只按你给的资料答）、写摘要和笔记，还能把一本笔记本做成一集播客（两个人聊你资料里的内容）。

      可以拿来追更（丢进去一组视频链接，让它总结每一期）、整理课程或论文。所有资料和记录都留在这台机器上。

      问问题和生成播客要用大模型，默认走云吞的模型服务，不用填密钥；模型里没有语音合成时播客做不了，应用会如实报错。
    en: |
      Add links, files and videos to notebooks; the AI reads them and answers questions (grounded in your sources), writes summaries and notes, and can turn a notebook into a podcast episode (two hosts discussing your material).

      Use it to follow channels, or to organize courses and papers. Everything stays on this machine.

      Chat and podcasts need large models and use Wonton's model service by default, no key to fill in; without a speech-synthesis model podcast generation fails with a clear error.
    zh-Hant: |
      把網址、檔案、影片連結丟進一本本「筆記本」，AI 讀完這些資料後幫你：回答提問（只按你給的資料答）、寫摘要和筆記，還能讓一本筆記本變成一集播客（兩個人聊你資料裡的內容）。

      可以拿來追更（丟進去一組影片連結，讓它總結每一期）、整理課程或論文。所有資料和紀錄都留在這台機器上。

      問問題和生成播客要用大模型，預設走雲吞的模型服務，不用填金鑰；模型裡沒有語音合成時播客做不了，應用會如實報錯。
    ja: |
      リンク・ファイル・動画をノートに入れると、AI が読んで質問に答え（渡した資料だけに基づく）、要約とノートを書き、ノートをポッドキャストの 1 話にすることもできます（2 人が資料について話す形式）。

      チャンネルの追いかけや、講座・論文の整理に使えます。資料も記録もこのマシンに残ります。

      質問とポッドキャストには大きなモデルが必要で、既定では Wonton のモデルサービスを使うためキーの入力は不要です。音声合成モデルがないとポッドキャストは作れず、アプリがきちんとエラーを出します。
  setup:
    zh: 应用没有账号，家里谁打开都是同一份笔记；进门前在登录页输入「应用密码」，密码在插件详情页里查看。再在设置的模型页把云吞提供的模型加进来、设为默认（对话和存资料各要一个）。
    en: The app has no accounts — everyone at home shares the notebooks. Enter the app password on the sign-in page (it is in the plugin details). Then add the models Wonton provides on the settings Models page and set defaults, one for chat and one for storing sources.
    zh-Hant: 應用沒有帳號，家裡誰開啟都是同一份筆記；進門前在登入頁輸入「應用密碼」，密碼在外掛詳情頁裡查看。再在設定的模型頁把雲吞提供的模型加進來、設為預設（對話和存資料各要一個）。
    ja: アカウントはなく、家族全員が同じノートを共有します。入る前にサインインページで「アプリのパスワード」を入力します（プラグイン詳細にあります）。次に設定のモデルページで Wonton が提供するモデルを追加し、既定に設定します（会話用と資料保存用に 1 つずつ）。
  release_notes:
    zh: |
      介绍重写：应用密码的提示单独成段放在最前。

      商店介绍重写：应用密码和加模型两步移到「安装后要做的事」，Models 页、嵌入模型等说法换成日常用语；补繁体中文和日文。
    en: |
      Rewritten store copy: the app-password note stands alone up front.

      Store copy rewritten: the app password and model setup moved to the pre-install notice, with Models-page/embedding-model wording in everyday words; Traditional Chinese and Japanese added.
    zh-Hant: "介紹重寫：應用密碼的提示單獨成段放在最前。\n\n商店介紹重寫：應用密碼和加模型兩步移到「安裝後要做的事」，Models 頁、嵌入模型等說法換成日常用語；補繁體中文和日文。"
    ja: "紹介を書き直し、アプリパスワードの注意を最初の段落に分けました。\n\nストア紹介を書き直し、アプリのパスワードとモデル設定を「インストール後の手順」に移し、Models ページや埋め込みモデルなどの言い方を日常的な言葉にしました。繁体字中国語と日本語を追加。"
  webui:
    service: notebook
    port: 8502
    # 应用自带口令登录（单口令、无多用户），网关照常先验云吞登录。
    sso: none
  permissions:
    # 问问题、生成摘要和播客都用大模型，只走模型网关。
    # Models go through the model gateway only.
    - models
    # 添加网址资料要抓取网页和视频字幕，应用还会查上游有没有新版本。
    # Adding web sources crawls pages and video subtitles; the app also checks for new upstream versions.
    - network.egress
  secrets:
    app_password:
      generate: { bytes: 24 }
      show_owner: { label: { zh: 应用密码, en: App password } }
    encryption_key:
      generate: { bytes: 32 }
  # 上游没写最低内存；开发环境实测空载约 570M（docker stats，含 SurrealDB/API/worker/网页），取 1G。镜像支持 amd64 和 arm64（清单列表，buildx imagetools inspect）。
  requirements:
    arch: [amd64, arm64]
    memory: 1G
