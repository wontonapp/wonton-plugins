# vLLM 0.32 的 OpenAI 服务器没有根路由：探针和小程序打开的都是 /，这里跳到接口
# 文档；其余路径（/docs、/v1、/static）原样转发给 vLLM，网关注入的
# Authorization 头随请求一起转发，流式响应不缓冲。
server {
  listen 80;

  location = /healthz {
    access_log off;
    return 200 "ok\n";
  }

  location = / {
    default_type text/html;
    return 200 '<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta http-equiv="refresh" content="0;url=/docs"><title>vLLM</title></head><body><p>正在打开 vLLM 接口文档…</p></body></html>';
  }

  location / {
    proxy_pass http://vllm:8000;
    proxy_http_version 1.1;
    # 首次推理有 CUDA 内核冷启动，长回答生成也要几十秒；nginx 默认 60 秒会掐断
    # 还在生成的请求（实测首问 504）。放宽到 5 分钟。
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_buffering off;
    proxy_request_buffering off;
  }
}
