# vLLM：本地大模型推理，OpenAI 兼容接口。模型放插件数据目录（规范只允许挂
# ${WONTON_APP_DATA} 和共享文件夹，宿主的共用模型目录挂不进来，见 PR“底座的问题”）。
# 模型在首次启动时从 Hugging Face 下载，所以申请 network.egress；下载和加载要几十分钟，
# start_period 相应放宽。
services:
  vllm:
    # 官方镜像，多架构清单列表摘要固定（两台独立镜像源核对一致）；上游双架构都有。
    image: vllm/vllm-openai:v0.33.0@sha256:d825baf9ce4b1b6bfc5ecc7b79880c7e6748c65a72d697ce3d47607aafa84c6e
    command:
      - --model
      - Qwen/Qwen3-8B
      - --max-model-len
      - "8192"
      - --gpu-memory-utilization
      - "0.8"
      # 免掉 CUDA 图捕获：装载时长从不可控（图捕获 1-2 分钟，挤爆核心 300 秒
      # 安装健康门）变成确定；本地推理吞吐略降，README 写明。
      - --enforce-eager
      # /docs 用镜像自带的静态资源，不依赖外网 CDN（小程序 WebView 里也能打开）
      - --enable-offline-docs
    environment:
      # 网关代登录：vLLM 认固定 API key（--api-key 的环境变量写法），核心把密钥
      # 注入已登录用户的请求；vLLM 自己不认识用户。
      VLLM_API_KEY: ${WONTON_SECRET_API_KEY}
      # torch/OMP 默认按宿主核数起全核线程池：上百核主机上装载权重时上百线程
      # 全部 futex 等待（实测 137 线程死锁、CPU 零推进）。限 8 线程，装载走
      # PCIe 并行 8 流本就够，与核数解耦。
      OMP_NUM_THREADS: "8"
      HF_HOME: /data/models/huggingface
      # 直连 huggingface.co 超时的主机（本机实测超时，hf-mirror.com 200）走国内镜像站；
      # 配了核心出口代理的主机也可以改回上游默认。
      HF_ENDPOINT: https://hf-mirror.com
      # hf-mirror 不支持 xet 协议（CAS 走 xethub.hf.co），缓存命中时 xet 客户端仍会
      # 出网校验并挂死（本机实测装载卡 10 分钟）；禁掉后首跑下载与缓存装载都走 HTTP。
      HF_HUB_DISABLE_XET: "1"
    # 模型缓存完整则离线装载、缺失则在线首跑下载，判定逻辑见 entrypoint 脚本
    # （实测缓存命中时 hf-mirror 远端校验仍会发起大文件下载并挂死，装载几小时不结束）
    entrypoint: [/bin/sh, /wonton-entrypoint/entrypoint.sh]
    configs:
      - source: entrypoint
        target: /wonton-entrypoint/entrypoint.sh
    volumes:
      - ${WONTON_APP_DATA}/models:/data/models
      # torch.compile 缓存：容器重建后不重编译（上游文档 Faster Startup 一节）
      - ${WONTON_APP_DATA}/cache:/root/.cache/vllm
    # 单卡不需要 ipc: host（最高级权限），加共享内存给 PyTorch 就够
    shm_size: 1g
    healthcheck:
      # /health 不要求 API key，查的是服务真的能应答，不只是进程活着。
      # urllib 和 curl 一样会读 http_proxy 环境变量（本机配了出口代理时会把
      # 127.0.0.1 的请求送进代理），用空代理表的 opener；urlopen 本身没有
      # opener 参数，要走 opener.open。
      test: ["CMD", "python3", "-c", "import urllib.request as u; u.build_opener(u.ProxyHandler({})).open('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 60s
      timeout: 10s
      start_period: 45m
      start_interval: 15s
  # vLLM 0.32 没有根路由（/ 返回 404），探针和小程序打开的都是 /：
  # 一个反代侧车把 / 跳到 /docs，其余转发 vLLM（规范 ComfyUI 例子的同款形态）。
  web:
    image: nginx:1.31.8-alpine@sha256:fed7e14be83cbd2661a75cdc5b872d936cf155d46c327084d30b8df19ae88d72
    configs:
      - source: nginx
        target: /etc/nginx/conf.d/default.conf
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      start_interval: 1s

configs:
  nginx:
    file: web/default.conf
  entrypoint:
    file: web/entrypoint.sh

x-wonton:
  spec: "0.11"
  id: ai.vllm.vllm
  version: 0.1.2
  kind: model
  title: { zh: "本地 AI 模型（vLLM）", en: "Local AI Models (vLLM)", zh-Hant: "本機 AI 模型（vLLM）", ja: "ローカル AI モデル（vLLM）" }
  description:
    zh: 在家里服务器的 NVIDIA 显卡上高速运行 AI 模型，多人同时用也不卡；默认模型要 24 GB 以上显存，适合显卡好、用的人多的家庭。
    en: Run AI models fast on your home server's NVIDIA graphics card, smooth even with many people at once. The default model needs 24 GB or more of video memory, so it suits homes with a powerful card.
    zh-Hant: 在家裡伺服器的 NVIDIA 顯示卡上高速執行 AI 模型，多人同時用也不卡；預設模型要 24 GB 以上顯示記憶體，適合顯示卡好、用的人多的家庭。
    ja: 家のサーバーの NVIDIA グラフィックスカードで AI モデルを高速に動かし、多人数の同時利用でも滑らかです。既定モデルには 24 GB 以上のビデオメモリが必要で、強力なカードがあり利用者の多い家庭向けです。
  icon: icon.png
  notices: [NOTICE]
  screenshots: [screenshots/api-docs.png, screenshots/models.png]
  author: { name: geraldpeng6, url: https://github.com/geraldpeng6 }
  homepage: https://vllm.ai
  # 上游 vLLM 的许可证；插件包自己的许可证写在仓库的 LICENSE 里。
  license: Apache-2.0
  tags:
    zh: [AI]
    en: [AI]
  setup:
    zh: 第一次启动会下载默认模型（约 16.4 GB，需要 24 GB 以上显存），下载完就能用。打开插件网页可以直接试对话，也能用地址加 /v1 接到别的应用里。
    en: The first start downloads the default model (about 16.4 GB, needs 24 GB+ of video memory), then it's ready. The plugin page lets you try a chat right away, and the address with /v1 connects it to other apps.
    zh-Hant: 第一次啟動會下載預設模型（約 16.4 GB，需要 24 GB 以上顯示記憶體），下載完就能用。開啟外掛網頁可以直接試對話，也能用位址加 /v1 接到別的應用裡。
    ja: 初回起動で既定モデルをダウンロードします（約 16.4 GB、24 GB 以上のビデオメモリが必要）。完了すれば使えます。プラグインページでその場で会話を試せ、アドレスに /v1 を付けて他のアプリにもつなげられます。
  about:
    zh: |
      在自己家里跑 AI 模型，用本机 NVIDIA 显卡，数据不出门。

      插件网页就是接口说明，可以直接试对话。程序里把插件网页地址加 /v1 当作接口地址用；请求带着云吞的登录会话走，密钥由云吞自动加上，不用自己填。

      默认模型下载到插件自己的文件夹，之后不重复下载。打开页面、试对话都要能访问这台服务器；模型本身只在你的显卡上跑。
    en: |
      Serve AI models at home from your own NVIDIA card, with data staying on your machine.

      The plugin page is the API docs, where you can try a chat right away. In code, use the plugin URL with /v1 as the endpoint; requests run on your Wonton session and Wonton adds the key, so there is nothing to configure in the app.

      The default model is downloaded into the plugin's own folder once and not fetched again. Opening the page and trying a chat needs access to this server; the model itself runs only on your card.
    zh-Hant: |
      在自己家裡跑 AI 模型，用本機 NVIDIA 顯示卡，資料不出門。

      外掛網頁就是介面說明，可以直接試對話。程式裡把外掛網頁位址加 /v1 當作介面位址用；請求帶著雲吞的登入工作階段走，密鑰由雲吞自動加上，不用自己填。

      預設模型下載到外掛自己的資料夾，之後不重複下載。開啟頁面、試對話都要能存取這台伺服器；模型本身只在你的顯示卡上跑。
    ja: |
      自宅で AI モデルを動かし、内蔵の NVIDIA カードを使い、データは外に出しません。

      プラグインページが API の説明で、その場で会話を試せます。コードではプラグイン URL に /v1 を付けて接続先にします。リクエストは Wonton のセッションで走り、キーは Wonton が自動で足すため、アプリ側の設定は不要です。

      既定モデルはプラグイン専用フォルダに一度だけダウンロードされ、再取得しません。ページを開いて会話を試すにはこのサーバーへ届く必要があり、モデル自体はカード上だけで動きます。
  release_notes:
    zh: |
      模型缓存改成按要装载的模型核对权重分片，半截下载不再被当成完整模型（避免反复重启）；vLLM 镜像升级到 v0.33.0。插件包迁入官方插件合仓。

      商店介绍重写：模型下载和接口接法移到「安装后要做的事」，OpenAI 兼容接口、provider 等说法换成日常用语，并去掉“见 PR”的指路；补繁体中文和日文。
    en: |
      Model cache completeness is now verified per model against its weight-shard index, so half-finished downloads no longer pass as complete (no more restart loops); vLLM image bumped to v0.33.0. Package moved into the official Wonton plugin monorepo.

      Store copy rewritten: model download and endpoint wiring moved to the pre-install notice, with OpenAI-compatible/provider wording in everyday words and the PR pointer dropped; Traditional Chinese and Japanese added.
    zh-Hant: "模型快取改成按要裝載的模型核對權重分片，半截下載不再被當成完整模型（避免反覆重啟）；vLLM 映象升級到 v0.33.0。外掛包遷入官方外掛合倉。\n\n商店介紹重寫：模型下載和介面接法移到「安裝後要做的事」，OpenAI 相容介面、provider 等說法換成日常用語，並去掉「見 PR」的指路；補繁體中文和日文。"
    ja: "モデルキャッシュは、読み込むモデルのウェイトシャードを照合する方式に変えました。途中までのダウンロードを完全なモデルとみなさず（再起動の繰り返しを防ぐ）、vLLM イメージを v0.33.0 に上げました。プラグインは公式プラグインリポジトリへ移しました。\n\nストア紹介を書き直し、モデルのダウンロードと接続方法を「インストール後の手順」に移し、OpenAI 互換 API や provider などの言い方を日常的な言葉にして PR への案内も外しました。繁体字中国語と日本語を追加。"
  webui:
    service: web
    port: 80
    sso: proxy
    proxy:
      headers:
        Authorization: "Bearer {secret:api_key}"
  permissions:
    - devices.gpu
    - network.egress
  secrets:
    api_key:
      generate: { bytes: 32 }
  gpu:
    services: [vllm]
  requirements:
    arch: [amd64, arm64]
    # 上游没写最低内存，按加载 8B 权重的余量取 8G
    memory: 8G
    gpu:
      need: required
      vendors: [nvidia]
      # 权重 16.4 GB 加运行开销；24 GB 卡按 90% 判够
      memory: 24G
