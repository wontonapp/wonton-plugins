# 画图（draw.io）：浏览器里画流程图、架构图、思维导图的编辑器。
# 图存在用户浏览器的 localStorage 和导出的文件里，服务器不存任何数据，因此不挂任何卷。
# 上游部署说明：https://github.com/jgraph/docker-drawio#environment-variables
services:
  drawio:
    # 上游官方镜像（Tomcat，多架构清单列表摘要；docker buildx imagetools inspect jgraph/drawio:32.6.10）。
    image: jgraph/drawio:32.6.10@sha256:b2dfa027e7878a4a1124f38d8fc6d257526f8d77fccf6c423189fc27ae931737
    environment:
      # 编辑器用它拼"复制链接"等功能的地址；以网关注入的公开地址为准。
      DRAWIO_SERVER_URL: ${WONTON_APP_URL}/
      # 界面语言默认中文；用户在编辑器"其他 → 语言"里改的会存进浏览器、优先生效。
      # 上游自托管部署不跟随浏览器语言，不设就是英文（见上游 README 的 DRAWIO_LANG）。
      DRAWIO_LANG: zh
      # 收紧浏览器的内容安全策略（上游默认放行 Google/微软/GitHub 等一堆外部域名）：
      # 脚本、接口、框架只允许本页自身，联网全关；img/media/font 的 * 只为图里嵌入的外部图片、
      # 音视频和自定义字体（用户自己贴的网址），浏览器打开页面本身不发任何对外请求。
      # 引号写成 \' 是上游入口脚本的要求：它把值原样插进单引号 JS 字符串，不转义会生成非法 JS。
      DRAWIO_CSP_HEADER: |-
        default-src \'self\'; script-src \'self\' \'unsafe-inline\'; connect-src \'self\'; img-src * data: blob:; media-src * data: blob:; font-src * data:; style-src \'self\' \'unsafe-inline\'; frame-src \'self\'; child-src \'self\'; object-src \'none\'; base-uri \'self\'; form-action \'self\'
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      start_interval: 1s

x-wonton:
  spec: "0.17"
  id: com.jgraph.drawio
  version: 0.1.2
  kind: app
  title: { en: "draw.io" }
  subtitle: { zh: "画图", en: "Diagrams", zh-Hant: "畫圖", ja: "図の作成" }
  description:
    zh: 像一块随开随用的白板，画流程图、架构图、思维导图和平面布置图，浏览器打开就能画。比手绘风的 Excalidraw 更规整，适合要交出去的正式图。
    en: "A whiteboard that is always ready: draw flowcharts, architecture diagrams, mind maps and floor plans right in your browser. Tidier than the hand-drawn style of Excalidraw — a fit for diagrams you present."
    zh-Hant: 像一塊隨開隨用的白板，畫流程圖、架構圖、思維導圖和平面布置圖，瀏覽器開啟就能畫。比手繪風的 Excalidraw 更規整，適合要交出去的正式圖。
    ja: いつでも使える白板のようなものです。フローチャート、構成図、マインドマップ、間取り図をブラウザですぐ描けます。手描き風の Excalidraw より整っており、人に見せる正式な図に向きます。
  icon: icon.svg
  notices: [NOTICE]
  screenshots: [screenshots/editor.png, screenshots/flow.png]
  author: { name: geraldpeng6, url: https://github.com/geraldpeng6 }
  homepage: https://www.drawio.com
  # 应用（draw.io）的许可证（Apache-2.0）；插件包自己的许可证写在仓库的 LICENSE 里。
  license: Apache-2.0
  tags:
    zh: [效率, 工具, 图表]
    en: [Productivity, Tools, Diagrams]
  setup:
    zh: 打开就画，不用注册。图存在你打开网页的那台设备上：换一台设备看不到，清除浏览器数据也会丢；要留着或发给别人，用「文件」菜单导出成图片或 .drawio 文件，换设备时把文件带过去打开。
    en: "Open and draw — no account. Diagrams stay in the browser of the device you opened the page on: other devices cannot see them, and clearing browser data loses them. To keep or share one, export it as an image or .drawio file from the File menu and bring the file to the other device."
    zh-Hant: 開啟就畫，不用註冊。圖存在你開啟網頁的那台裝置上：換一台裝置看不到，清除瀏覽器資料也會丟；要留著或發給別人，用「檔案」選單匯出成圖片或 .drawio 檔案，換裝置時把檔案帶過去開啟。
    ja: 開けばすぐ描け、アカウントは不要です。図はページを開いた端末のブラウザに残ります。別の端末では見えず、ブラウザデータを消すと失われます。残したり渡したりするには「ファイル」メニューから画像か .drawio ファイルに書き出し、別の端末へ持っていって開きます。
  about:
    zh: |
      在浏览器里画流程图、软件架构图、思维导图、组织结构图和平面布置图，形状拖进去、连线拉出来，像画在白板上一样。

      家人各画各的，互不相通；不用账号，也不经过服务器保存。
    en: |
      Draw flowcharts, software architecture diagrams, mind maps, org charts and floor plans in your browser: drag shapes in, pull connectors out, like drawing on a whiteboard.

      Everyone draws on their own, separately; no account, and nothing is saved on the server.
    zh-Hant: |
      在瀏覽器裡畫流程圖、軟體架構圖、思維導圖、組織結構圖和平面布置圖，形狀拖進去、連線拉出來，像畫在白板上。

      家人各畫各的，互不相通；不用帳號，也不經過伺服器保存。
    ja: |
      ブラウザでフローチャート、ソフト構成図、マインドマップ、組織図、間取り図を描けます。図形をドラッグして入れ、線を引き、白板に描くように使えます。

      家族はそれぞれ別々に描き、つながりはありません。アカウントも不要で、サーバーにも保存しません。
  release_notes:
    zh: |
      插件包迁入官方插件合仓，内容与上一版相同。

      商店介绍重写：图的存放位置和导出移到「安装后要做的事」，.drawio 等说法按日常用法说明；补繁体中文和日文。
    en: |
      Package moved into the official Wonton plugin monorepo; same content as the previous release.

      Store copy rewritten: where diagrams live and how to export moved to the pre-install notice, with the .drawio file explained plainly; Traditional Chinese and Japanese added.
    zh-Hant: "外掛包遷入官方外掛合倉，內容與上一版相同。\n\n商店介紹重寫：圖的存放位置和匯出移到「安裝後要做的事」，.drawio 等說法按日常用法說明；補繁體中文和日文。"
    ja: "プラグインを公式プラグインリポジトリへ移動しました。内容は前版と同じです。\n\nストア紹介を書き直し、図の保存場所と書き出しを「インストール後の手順」に移し、.drawio ファイルも平易に説明しました。繁体字中国語と日本語を追加。"
  webui:
    service: drawio
    port: 8080
    # offline=1 是上游的开关：隐藏已停用的云端存储入口、禁用插件加载；plugins=0 同样禁插件。
    path: /?offline=1&plugins=0
    # 应用没有账号体系，所有图存在用户浏览器里；网页只在本机网关登录后面可达。
    sso: none
  permissions: []
  # 上游镜像支持 amd64 和 arm64（清单列表两个架构都在）；空闲实测约 215 MiB（容器统计），取 256M。
  requirements:
    arch: [amd64, arm64]
    memory: 256M
