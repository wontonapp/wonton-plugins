# Ghostfolio：股票、基金和加密货币的持仓与收益跟踪。
# 上游官方镜像（AGPL-3.0），三件套照上游 docker/docker-compose.yml（应用 + Postgres + Redis）。
# 登录全走云吞的身份提供方（上游 OIDC）。
name: ghostfolio
services:
  ghostfolio:
    image: ghostfolio/ghostfolio:3.99.0@sha256:6aeba7b9df7a18bc4f39810444b1f18af012a7fe323cec20640b7c28661fc47c
    init: true
    stop_grace_period: 1m
    environment:
      TZ: ${TZ}
      # 浏览器的公开地址由核心注入：OIDC 的默认回调和登录后的跳转都按它拼
      # （auth.module.ts、auth.controller.ts）。缺了 OIDC 直接打不开。
      ROOT_URL: ${WONTON_APP_URL}
      # 登录只认核心的身份提供方：issuer 是核心在插件网络里的地址，端点从发现文档自动取，
      # 连不上时应用启动直接失败（auth.module.ts 在初始化时拉发现文档），不装作正常。
      ENABLE_FEATURE_AUTH_OIDC: "true"
      OIDC_ISSUER: ${WONTON_OIDC_ISSUER}
      OIDC_CLIENT_ID: ${WONTON_OIDC_CLIENT_ID}
      OIDC_CLIENT_SECRET: ${WONTON_OIDC_CLIENT_SECRET}
      DATABASE_URL: postgresql://ghostfolio:${WONTON_SECRET_POSTGRES_PASSWORD}@postgres:5432/ghostfolio?connect_timeout=300
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${WONTON_SECRET_REDIS_PASSWORD}
      # 密钥由核心生成注入；缺了应用启动失败（configuration.service.ts 必填项）。
      ACCESS_TOKEN_SALT: ${WONTON_SECRET_ACCESS_TOKEN_SALT}
      JWT_SECRET_KEY: ${WONTON_SECRET_JWT_SECRET_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # 端点查 Postgres 和 Redis，都可用才返回 200（health.controller.ts）；镜像自带 curl。
      test: ["CMD", "curl", "-f", "http://127.0.0.1:3333/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 120s
      start_interval: 2s

  postgres:
    image: postgres:18.0-alpine3.22@sha256:48c8ad3a7284b82be4482a52076d47d879fd6fb084a1cbfccbd551f9331b0e40
    environment:
      POSTGRES_DB: ghostfolio
      POSTGRES_USER: ghostfolio
      POSTGRES_PASSWORD: ${WONTON_SECRET_POSTGRES_PASSWORD}
    volumes:
      # 全部业务数据（用户、持仓、汇率缓存）都在 Postgres；删数据 = 删这个目录。
      - ${WONTON_APP_DATA}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d \"$$POSTGRES_DB\" -U $$POSTGRES_USER"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
      start_interval: 2s

  redis:
    image: redis:8.4-alpine@sha256:71885d8cc6e42f2bc0aa2eb853bfc4be200b5108a46ac50e117ae1df0531fb80
    # 上游 compose 同款：redis 镜像的用户。
    user: "999:1000"
    environment:
      REDIS_PASSWORD: ${WONTON_SECRET_REDIS_PASSWORD}
    command:
      - /bin/sh
      - -c
      - exec redis-server --requirepass "$$REDIS_PASSWORD"
    # 纯缓存（上游不挂卷，重启即失），不占数据目录。
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --pass \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
      start_interval: 2s

x-wonton:
  spec: "0.11"
  id: io.ghostfolio.ghostfolio
  version: 0.1.1
  kind: app
  title: { zh: 投资记账（Ghostfolio）, en: Ghostfolio }
  description:
    zh: 像证券 App 的收益页，把股票、基金和加密货币的买卖记进来，随时看总资产和涨跌盈亏
    en: A portfolio tracker for stocks, funds and crypto, with total value and gains at a glance
  icon: icon.png
  notices: [NOTICE]
  screenshots: [screenshots/home.png, screenshots/holdings.png]
  author: { name: geraldpeng6, url: https://github.com/geraldpeng6 }
  homepage: https://ghostfol.io
  license: AGPL-3.0-only
  tags:
    zh: [记账, 投资]
    en: [Finance, Investing]
  about:
    zh: |
      记下股票、基金和加密货币的买卖，Ghostfolio 帮你盯着：总资产、每天的涨跌、各持仓的盈亏和占比，一眼看清。

      登录用云吞的账号，打开就是自己的持仓，不用再注册。行情价自动更新（要访问外网），也支持手动记账。
    en: |
      Record your stocks, funds and crypto, and Ghostfolio keeps watch: total assets, daily moves, and the gains, losses and weightings of every holding at a glance.

      Sign-in uses your Wonton account; the app opens straight into your portfolio. Market prices update on their own (needs internet access); manual entries are supported too.
  release_notes: { zh: 插件包迁入官方插件合仓，内容与上一版相同。, en: "Package moved into the official Wonton plugin monorepo; same content as the previous release." }
  webui:
    service: ghostfolio
    port: 3333
    # 打开直跳 OIDC 登录，不落在应用的登录页。
    path: /api/auth/oidc
    sso: oidc
    oidc:
      redirect_paths: [/api/auth/oidc/callback]
      # 上游的 OIDC 客户端在令牌端点用 client_secret_post 出示密钥（passport-openidconnect 固定行为，
      # 上游没有配置项），核心登记的客户端要按同样的方式收密钥。
      token_endpoint_auth_method: client_secret_post
  secrets:
    access_token_salt:
      generate: { bytes: 32 }
    jwt_secret_key:
      generate: { bytes: 32 }
    postgres_password:
      generate: { bytes: 32 }
    redis_password:
      generate: { bytes: 32 }
  permissions:
    # 行情价（Yahoo Finance、CoinGecko）从容器里访问外网；插件内部互访核心已放进 NO_PROXY。
    - network.egress
  # 三个镜像都有 amd64 和 arm64（docker buildx imagetools inspect 核对）。
  # 上游没写最低内存：本机实测整栈约 450M（应用 419M、Postgres 21M、Redis 5M，浏览过页面后取值），取 512M。
  requirements:
    arch: [amd64, arm64]
    memory: 512M
