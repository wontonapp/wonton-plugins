<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Subscription · Proxy</title>
<style>
:root{color-scheme:light dark;font:16px system-ui;background:Canvas;color:CanvasText}*{box-sizing:border-box}body{margin:0;padding:24px 20px}main{max-width:460px;margin:auto}nav{margin-bottom:32px}a{color:LinkText}h1{font-size:26px;margin:0 0 24px}label{display:block;margin-bottom:10px}input,button{font:inherit;border:1px solid GrayText;border-radius:8px;padding:12px;width:100%}input{background:Field;color:FieldText}button{margin-top:16px;cursor:pointer;background:ButtonFace;color:ButtonText}p{line-height:1.5}#status{min-height:48px;overflow-wrap:anywhere}#status[role=alert]{color:light-dark(#b42318,#ffb4ab)}
</style>
<main>
<nav><a href="/" id="back">← Dashboard</a></nav>
<h1 id="heading">Subscription</h1>
<form id="form">
<label for="url" id="url-label">Subscription URL</label>
<input id="url" name="url" type="password" inputmode="url" autocomplete="off" spellcheck="false" required aria-describedby="privacy">
<p id="privacy">The saved URL is never displayed. Leave this field empty to keep it.</p>
<button id="save">Save and apply</button>
</form>
<p id="status" role="status" aria-live="polite"></p>
</main>
<script>
const zh=navigator.language.toLowerCase().startsWith('zh');
const words=zh?{back:'← 面板',heading:'订阅',label:'订阅链接',privacy:'保存后不回显订阅链接。留空则不更改。',save:'保存并应用',empty:'还没有节点',configured:n=>`已保存订阅 · ${n} 个节点`,saving:'正在应用…',saved:n=>`已应用 · ${n} 个节点`,failed:'请求失败，无法确认是否已应用',errors:{'Proxy controller unavailable':'代理管理接口不可用','Subscription has no nodes':'订阅里没有节点','Enter an HTTP or HTTPS subscription URL':'请输入 HTTP 或 HTTPS 订阅链接','Same-origin request required':'请求必须来自插件页面','Subscription update already running':'另一个订阅更新正在进行','Proxy rejected the subscription format; URL saved':'代理内核拒绝了订阅格式；链接已保存，未应用新节点','Subscription transport unavailable; URL saved':'无法连接订阅服务器；链接已保存，未应用新节点','Subscription exceeds 4 MiB; URL saved':'订阅超过 4 MiB；链接已保存，未应用新节点','Proxy controller unavailable; URL saved, update not confirmed':'代理管理接口不可用；链接已保存，未确认应用结果'}}:{back:'← Dashboard',heading:'Subscription',label:'Subscription URL',privacy:'The saved URL is never displayed. Leave this field empty to keep it.',save:'Save and apply',empty:'No nodes yet',configured:n=>`Subscription saved · ${n} nodes`,saving:'Applying…',saved:n=>`Applied · ${n} nodes`,failed:'Request failed; the update is unconfirmed',errors:{}};
document.documentElement.lang=zh?'zh-CN':'en';document.title=zh?'订阅 · 代理':'Subscription · Proxy';
for(const [id,value] of [['back',words.back],['heading',words.heading],['url-label',words.label],['privacy',words.privacy],['save',words.save]])document.getElementById(id).textContent=value;
const status=document.getElementById('status'),save=document.getElementById('save'),input=document.getElementById('url');
const show=(message,error=false)=>{status.textContent=message;status.setAttribute('role',error?'alert':'status')};
fetch('/subscription/status').then(async r=>{const data=await r.json();if(!r.ok)throw Error(words.errors[data.error]||data.error);show(data.nodes?words.configured(data.nodes):words.empty)}).catch(e=>show(e.message,true));
document.getElementById('form').addEventListener('submit',async e=>{e.preventDefault();const body=new URLSearchParams({url:input.value});input.value='';save.disabled=true;show(words.saving);try{const r=await fetch('/subscription/save',{method:'POST',body});const data=await r.json();if(!r.ok)throw Error(words.errors[data.error]||data.error);show(words.saved(data.nodes))}catch(e){show(e.message||words.failed,true)}finally{save.disabled=false}});
</script>
</html>
