# Navidrome 音乐库：用户的音乐放在共享文件夹 music 里，网页经核心网关登录（Remote-User 请求头代登录），
# 第三方 Subsonic 客户端连局域网端口，详情页的开关打开后显示地址和账号。上游 GPL-3.0-only，镜像按清单列表（index）的摘要固定。
services:
  navidrome:
    image: deluan/navidrome:0.64.2@sha256:38dc2727bfcfd5ede290f8ada114fc90368146f265ae4701ddddbcbe2a44ee52
    # 镜像不依赖 root：以用户身份运行，数据目录由核心按 user 交给 PUID:PGID，宿主上的文件归用户。
    # 音乐目录只读（storage.share.music:read）；持久数据和缓存在 /data，临时文件在 /tmp，根文件系统无需可写。
    user: "${PUID}:${PGID}"
    read_only: true
    tmpfs:
      - /tmp
    environment:
      # ND_ 变量名必须全大写（Navidrome 用 ND_<大写键> 查环境变量），小写不生效。
      ND_MUSICFOLDER: /music
      ND_DATAFOLDER: /data
      # 加密保存的密码用它，不用 Navidrome 内置的默认密钥（升级、迁移后保持同一把）。
      ND_PASSWORDENCRYPTIONKEY: ${WONTON_SECRET_PASSWORD_ENCRYPTION_KEY}
      # 不申请 network.egress，外部服务（Deezer、Last.fm、ListenBrainz、insights、外部歌单封面）取不到，
      # 显式关掉：否则它们会一直在内部网络上重试、写错误日志。这是 0.64 的总开关，会一并清空 Agents。
      ND_ENABLEEXTERNALSERVICES: "false"
      # 分享链接指向插件子域名，收件人没有云吞会话、会被跳到核心登录页，所以关掉分享。
      ND_ENABLESHARING: "false"
      # 网关代登录：只信任核心的地址。Navidrome 的白名单只认 CIDR，要带 /32。
      ND_REVERSEPROXYUSERHEADER: Remote-User
      ND_REVERSEPROXYWHITELIST: ${WONTON_CORE_ADDRESS}/32
      # 空库时用内置 admin 建号；provision 随后把它换成用户自己的账号。
      ND_DEVAUTOCREATEADMINPASSWORD: ${WONTON_SECRET_CLIENT_PASSWORD}
    volumes:
      - ${WONTON_APP_DATA}/data:/data
      - ${WONTON_SHARE_MUSIC}:/music:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:4533/ping"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      start_interval: 1s

  # 一次性服务：等主服务健康后建用户账号、删掉内置 admin；/data/.owner-ready 在就跳过。
  # 用同一个镜像，脚本只用镜像里有的 wget。Navidrome 0.64.2 实测：没有这个开关时账号要等第一次打开网页
  # 由代登录头建出来，第三方 Subsonic 客户端在打开网页之前用不了。
  provision:
    image: deluan/navidrome:0.64.2@sha256:38dc2727bfcfd5ede290f8ada114fc90368146f265ae4701ddddbcbe2a44ee52
    user: "${PUID}:${PGID}"
    entrypoint: ["/bin/sh", "/app/provision.sh"]
    environment:
      WONTON_OWNER_NAME: ${WONTON_OWNER_NAME:?核心没有注入用户名}
      WONTON_SECRET_CLIENT_PASSWORD: ${WONTON_SECRET_CLIENT_PASSWORD}
    volumes:
      - ${WONTON_APP_DATA}/data:/data
    configs:
      - source: provision
        target: /app/provision.sh
    depends_on:
      navidrome:
        condition: service_healthy
    restart: "no"

configs:
  provision:
    file: provision.sh

x-wonton:
  spec: "0.17"
  id: org.navidrome.navidrome
  version: 0.1.3
  kind: app
  title: { en: "Navidrome" }
  subtitle: { zh: "家庭音乐库", en: "Home Music Library", zh-Hant: "家庭音樂庫", ja: "家庭音楽ライブラリ" }
  description:
    zh: 像自家的音乐 App：共享文件夹里的歌按歌手、专辑整理好，网页里随时听；在家还能用手机上的音乐播放器连上来听。轻快省资源，适合习惯用手机 App 听歌的人。
    en: "Like your own music app: the songs in your shared folder sorted by artist and album, ready to play in the browser — and at home, many phone music apps can connect too. Light and quick; good if you like listening through a phone app."
    zh-Hant: 像自家的音樂 App：共享資料夾裡的歌按歌手、專輯整理好，網頁裡隨時聽；在家還能用手機上的音樂播放器連上來聽。輕快省資源，適合習慣用手機 App 聽歌的人。
    ja: 自分専用の音楽アプリのようなものです。共有フォルダの曲をアーティスト・アルバム別に整え、ブラウザですぐ再生できます。家ではスマホの音楽アプリからもつなげます。軽くて省資源で、スマホアプリで聴く習慣のある人向けです。
  icon: icon.png
  notices: [NOTICE]
  screenshots: [screenshots/home.png, screenshots/album.png, screenshots/player.png]
  author: { name: geraldpeng6 }
  homepage: https://www.navidrome.org
  license: GPL-3.0-only
  tags:
    zh: [音乐]
    en: [Music]
  setup:
    zh: 打开就用，不用注册。要用手机上的音乐播放器：在插件详情里打开「在局域网开放」，把显示的地址、账号和密码填进去。
    en: Open and use it — no sign-up. To use a phone music player, turn on the LAN switch in the plugin details and enter the address, account and password shown there.
    zh-Hant: 開啟就用，不用註冊。要用手機上的音樂播放器：在外掛詳情裡開啟「在區域網路開放」，把顯示的位址、帳號和密碼填進去。
    ja: 開けば使え、登録は不要です。スマホの音楽アプリを使うには、プラグイン詳細で LAN スイッチをオンにし、表示されるアドレス・アカウント・パスワードを入力します。
  about:
    zh: |
      把共享文件夹里的音乐整理成自己的音乐库：按歌手、专辑和流派浏览、播放，建歌单。

      音乐文件只读，不会被改动。
    en: |
      Turn the music in your shared folder into your own library: browse and play by artist, album and genre, and build playlists.

      Music files are read-only and never modified.
    zh-Hant: |
      把共享資料夾裡的音樂整理成自己的音樂庫：按歌手、專輯和曲風瀏覽、播放，建歌單。

      音樂檔案唯讀，不會被改動。
    ja: |
      共有フォルダの音楽を自分のライブラリに変えます。アーティスト・アルバム・ジャンル別に閲覧・再生し、プレイリストも作れます。

      音楽ファイルは読み取り専用で変化しません。
  release_notes:
    zh: |
      插件包迁入官方插件合仓，并更新名称和说明。

      商店介绍重写：手机播放器的连接步骤移到「安装后要做的事」；补繁体中文和日文。
    en: |
      Moved into the official Wonton plugin monorepo with updated name and description.

      Store copy rewritten: the phone-player steps moved to the pre-install notice; Traditional Chinese and Japanese added.
    zh-Hant: "外掛包遷入官方外掛合倉，並更新名稱和說明。\n\n商店介紹重寫：手機播放器的連線步驟移到「安裝後要做的事」；補繁體中文和日文。"
    ja: "プラグインを公式プラグインリポジトリへ移動し、名前と説明を更新しました。\n\nストア紹介を書き直し、スマホプレーヤーの接続手順を「インストール後の手順」に移しました。繁体字中国語と日本語を追加。"
  webui:
    service: navidrome
    port: 4533
    sso: proxy
    proxy:
      headers:
        Remote-User: "{user}"
  # 第三方 Subsonic 客户端连这个端口，详情页的开关打开后显示地址和账号。
  lan:
    ports:
      - { service: navidrome, port: 4533 }
    client:
      address: "http://{host}:4533"
      username: "{user}"
      password: "{secret:client_password}"
  secrets:
    password_encryption_key:
      generate: { bytes: 32 }
    client_password:
      generate: { bytes: 32 }
  permissions:
    - storage.share.music:read
    - network.lan
    # 知道用户名：账号按注入的用户名建。
    - owner.identity
  # 上游没写最低内存；本机空闲实测约 62M，取 128M。镜像支持 amd64 和 arm64（docker manifest inspect）。
  requirements:
    arch: [amd64, arm64]
    memory: 128M
