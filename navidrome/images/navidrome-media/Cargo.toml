[package]
name = "wonton-navidrome-media"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
publish = false

[lib]
name = "wonton_navidrome_media"
path = "src/lib.rs"

[[bin]]
name = "wonton-navidrome-media"
path = "src/main.rs"

# 依赖的许可证列在 navidrome/README.md 的“媒体源适配器的依赖”一节。
[dependencies]
axum = "0.8"
percent-encoding = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subtle = "2"
tokio = { version = "1", features = ["fs", "io-std", "io-util", "macros", "net", "rt-multi-thread", "signal"] }

[dependencies.reqwest]
version = "0.12"
default-features = false
features = ["json", "stream"]

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[profile.release]
strip = true
panic = "abort"
